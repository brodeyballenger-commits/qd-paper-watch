nanostructure dots have residual built-in elastic strains, which are of the order of similar to 50% of the values in corresponding pseudomorphic heterostructures. This result suggests a possible mechanism for explaining the huge enhancement of the optical efficiency in our luminescence measurements.","abstract_hash":"3c388f93633ca742d1395024db7e9b3ffd3873d7a92db8e91b32e71db4d338bd","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"在 Si/SiGe 量子点体系中把残留弹性应变与两个数量级以上的发光增强联系起来，给出了明确的物理机制解释。","innovation_zh":"作者用干法刻蚀从 Si/Si1-xGex（x=0.1~0.3）应变层超晶格和应变对称化的 Si-9/Ge-6 超晶格中制备了直径 50~60 nm 的量子点，发现量子点发光强度提升超过两个数量级、发光淬灭温度也提高，同时所有纳米结构中都残留约相当于对应赝形异质结构 50% 的内建弹性应变。作者据此提出残留弹性应变可能是光学效率大幅提升的机制。","method_zh":"干法刻蚀制备 Si/Si1-xGex 与 Si-9/Ge-6 超晶格量子点，结合 Raman 散射、光致发光和电致发光谱进行表征。","keywords_zh":["Si/SiGe 量子点","干法刻蚀","弹性应变","光致发光","拉曼散射"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:33.074Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.82444/warw.33546493","doi":"10.82444/warw.33546493","doi_url":"https://doi.org/10.82444/warw.33546493","title":"PHOTOLUMINESCENCE AND PHOTOREFLECTANCE STUDY OF SI/SI0.91GE0.09 AND SI-9/GE-6 QUANTUM DOTS","title_zh":"Si/Si0.91Ge0.09 与 Si-9/Ge-6 量子点的光致发光和光反射研究","title_key":"photoluminescenceandphotoreflectancestudyofsisi091ge009andsi9ge6quantumdots","authors":["No author provided"],"venue":"University of Warwick","issn_l":null,"source_type":"repository","is_preprint":true,"alt_doi":null,"pub_date":"2026-09-10","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-10","oa_status":"green","pdf_url":null,"cited_by_count":0,"abstract":"Nanometer-scale quantum dots based on a series of Si/Si0.91Ge0.09 strained layer superlattices and a Si-9/Ge-6 strain-symmetrized superlattice were fabricated using electron beam lithography and reactive ion etching. They were investigated by photoluminescence and photoreflectance. It was found for the first time that the quantum efficiency of optical emission from the quantum well layers increased by over two orders of magnitude when the quantum dot sizes were reduced to less than or equal to 100 nm.","abstract_hash":"a136d4395806ccefdd5edd53eb94a5211b7003ea003a6335f5e198fd0b7f7469","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"首次报道量子点尺寸降至 100 nm 以下时 Si/SiGe 量子阱发光效率提升两个数量级以上，属于明确的新现象与新结构效应。","innovation_zh":"作者用电子束光刻和反应离子刻蚀，把 Si/Si0.91Ge0.09 应变层超晶格和 Si-9/Ge-6 应变对称超晶格做成纳米量子点，并用光致发光和光反射两种手段表征。最核心的发现是：当量子点尺寸缩小到 100 nm 及以下时，量子阱层光发射的量子效率提升了两个数量级以上，作者称这是首次观察到该现象。","method_zh":"以电子束光刻结合反应离子刻蚀对 Si/SiGe 应变层超晶格及 Si-9/Ge-6 应变对称超晶格进行图形化，制备纳米量子点，再通过光致发光与光反射光谱对比不同尺寸下的光学性质。","keywords_zh":["Si/SiGe 量子点","应变层超晶格","光致发光","光反射","量子效率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:32.870Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s44310-026-00148-y","doi":"10.1038/s44310-026-00148-y","doi_url":"https://doi.org/10.1038/s44310-026-00148-y","title":"Chiral quantum optics with scalable quantum dot dimers","title_zh":"可扩展量子点二聚体的手性量子光学","title_key":"chiralquantumopticswithscalablequantumdotdimers","authors":["L. Hallacy","D. Hallett","A. Fenzl","et al."],"venue":"npj Nanophotonics","issn_l":"2948-216X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-09","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-09","oa_status":"gold","pdf_url":"https://www.nature.com/articles/s44310-026-00148-y.pdf","cited_by_count":1,"abstract":"Abstract We present a scalable method for electrically tuning multiple spatially separated quantum dots (QDs) embedded in photonic crystal waveguides. Ion implantation into the top p-doped layer of a p-i-n diode creates high-resistivity tracks, providing electrical separation between adjacent regions. This method preserves the guided-mode profile of the waveguide, minimising backscatter and loss, enabling the observation of highly directional emission from two individually addressable QDs coupled to a glide-plane photonic crystal waveguide. We demonstrate control of the detuning between the QDs, enabling measurements of different indistinguishable spin-state combinations of two highly directional QDs coupled to the same mode. Second-order photon correlation measurements provide a sensitive probe of the chirality-dependent photon statistics, which are in good agreement with a waveguide-QED master equation model. Our results mark an important step towards scalable, multi-emitter architectures for chiral quantum networks.","abstract_hash":"b0ff3219765bb9470822f0615f328458da2fb2acb7306c5b7207a7dc960d683f","abstract_source":"openalex","abstract_missing":false,"directions":["display","quantuminfo","materials"],"novelty_score":4,"novelty_reason":"用离子注入高阻轨道实现波导内多量子点的可扩展电学隔离与独立调谐，并首次在该平台上观测双发射极的手性依赖光子统计，属于明确的新结构/新策略。","innovation_zh":"作者提出了一种可扩展的电调谐方法，能在光子晶体波导中独立控制多个空间分离的量子点：通过向 p-i-n 二极管顶部 p 掺杂层做离子注入形成高阻轨道，实现相邻区域的电学隔离，同时不破坏波导导模分布、抑制背散射和损耗。基于此，他们在滑移平面光子晶体波导上实现了两个可独立寻址量子点的高方向性发射，并调控两点间的失谐，测量了同一模式耦合下不同不可区分自旋态组合。二阶光子关联测量给出了手性依赖的光子统计，与波导-QED主方程模型吻合。","method_zh":"在 p-i-n 二极管顶部 p 层离子注入形成高阻轨道，对波导中多个量子点做电学隔离与独立调谐；器件为滑移平面光子晶体波导，通过二阶关联测量表征手性光子统计并与波导-QED主方程模型对比。","keywords_zh":["量子点二聚体","手性量子光学","光子晶体波导","离子注入隔离","波导QED"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:33.723Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsami.6c15533","doi":"10.1021/acsami.6c15533","doi_url":"https://doi.org/10.1021/acsami.6c15533","title":"Precursor Reactivity-Controlled Synthesis of ZnSeTeS/ZnSe/ZnS Alloy Quantum Dots with High-Color-Purity and Photolithographic Patterning","title_zh":"前驱体反应活性调控合成高色纯度 ZnSeTeS/ZnSe/ZnS 合金量子点及其光刻图案化","title_key":"precursorreactivitycontrolledsynthesisofznsetesznseznsalloyquantumdotswithhighcolorpurityandphotolithographicpatterning","authors":["Yuda Weng","Yuxian Su","Dongdong Kang","et al."],"venue":"ACS Applied Materials & Interfaces","issn_l":"1944-8244","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-09","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-09","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Environmentally friendly ZnSeTe QDs are attractive candidates for next-generation display and lighting due to their excellent luminescence and composition tunability. However, the substantial reactivity disparity between Se and Te precursors often leads to inhomogeneous Te distribution within ZnSeTe QDs, limiting the color purity and luminescence stability. To overcome these challenges, we developed ZnSeTeS/ZnSe/ZnS gradient alloy QDs to alleviate lattice mismatch and reduce defects, improving the stability and color purity of QDs. The optimized green-emitting QDs exhibit a narrow size distribution (∼5.6 nm), a full width at half maximum (FWHM) of 33 nm, and a photoluminescence (PL) peak at 532 nm, closely approaching the green primary defined by the BT.2020 standard. By adjusting the Te and S incorporation ratios, the PL peaks of the QDs are widely tuned from 420 to 670 nm. Furthermore, through the combination of thiol-ligand exchange and UV lithography, high-precision patterning of the ZnSeTeS/ZnSe/ZnS QDs was achieved with a single pixel size of 20 µm × 20 µm × 2.5 µm, demonstrating broad application prospects in next-generation microdisplay applications such as AR/VR.","abstract_hash":"55e5187a386a976980c1edf53ed25fc524f4199ed1623aeb8d958ff313484954","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"以梯度合金壳层加前驱体活性调控解决 Te 分布不均问题，色纯度接近 BT.2020 并实现微米级光刻图案化，属明确的新结构策略且有性能提升。","innovation_zh":"针对 ZnSeTe 量子点中 Se 与 Te 前驱体反应活性差异大、导致 Te 分布不均、色纯度和发光稳定性受限的问题，作者用 ZnSeTeS/ZnSe/ZnS 梯度合金结构来缓解晶格失配、减少缺陷。优化后的绿光量子点尺寸约 5.6 nm，FWHM 33 nm，PL 峰位 532 nm，接近 BT.2020 绿光原色；通过调节 Te/S 比例，PL 峰可在 420–670 nm 范围内调谐。此外结合硫醇配体交换与紫外光刻，实现了 20 µm × 20 µm × 2.5 µm 单像素的高精度图案化。","method_zh":"采用前驱体反应活性调控合成 ZnSeTeS/ZnSe/ZnS 梯度合金量子点，并通过硫醇配体交换配合 UV 光刻完成图案化。","keywords_zh":["ZnSeTeS 量子点","梯度合金","高色纯度","光刻图案化","无镉量子点"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:33.517Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1364/optica.609872","doi":"10.1364/optica.609872","doi_url":"https://doi.org/10.1364/optica.609872","title":"Single-photon dynamics of a telecom-band quantum dot emitter integrated with a double solid immersion lens","title_zh":"集成双固体浸没透镜的电信波段量子点单光子源的动力学研究","title_key":"singlephotondynamicsofatelecombandquantumdotemitterintegratedwithadoublesolidimmersionlens","authors":["Daehyun Ahn","Ivan A. Burenkov","Lijun Ma","et al."],"venue":"Optica","issn_l":"2334-2536","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-08","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Investigating single-photon dynamics is crucial for characterization of single-photon emitters. Here, we demonstrate a telecom-band quantum dot single-photon emitter integrated with a lithographically aligned double solid immersion lens structure, achieving a collection efficiency of 18(3)% at the first lens. Using two-time correlation measurements, we observed re-excitation-induced multiphoton emission arising from a long-lived, carrier-induced capture process under non-resonant excitation. Under quasi-resonant excitation, this effect was strongly suppressed, reducing the multiphoton emission probability within a 3 ns window from 0.052(1) to 0.0163(4). We further performed second-order quantum spectroscopy based on Fourier analysis of the Hong–Ou–Mandel interference, enabling direct extraction of the exciton fine-structure splitting. This work provides a direct characterization of re-excitation dynamics and coherence properties in a telecom-band single-photon emitter.","abstract_hash":"56bd003a74bcbf2a22d3dcd4b0a7e7103f025f42301f96b202ef47b37425d6e1","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display","materials"],"novelty_score":4,"novelty_reason":"将双固体浸没透镜集成于电信波段量子点单光子源，并首次在该体系中通过HOM干涉傅里叶分析直接提取激子精细结构分裂，同时定量表征了再激发动力学。","innovation_zh":"在电信波段量子点单光子源上集成了光刻对准的双固体浸没透镜结构，第一透镜处收集效率达到18(3)%。通过双时间关联测量，发现非共振激发下存在长寿命载流子俘获引起的再激发多光子发射，而准共振激发可将3 ns窗口内的多光子发射概率从0.052(1)降至0.0163(4)。进一步利用Hong-Ou-Mandel干涉的傅里叶分析进行二阶量子光谱学，直接提取了激子精细结构分裂。","method_zh":"采用光刻对准的双固体浸没透镜结构提升收集效率，通过双时间关联测量和基于HOM干涉傅里叶分析的二阶量子光谱学表征单光子动力学与相干性。","keywords_zh":["量子点单光子源","电信波段","固体浸没透镜","多光子发射","Hong-Ou-Mandel干涉"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:35.481Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jchemed.6c00577","doi":"10.1021/acs.jchemed.6c00577","doi_url":"https://doi.org/10.1021/acs.jchemed.6c00577","title":"Facile Synthesis and Surface Functionalization of CuInS2/ZnS (Core/Shell) Quantum Dots to Sensitize Green-to-Blue Photon Upconversion","title_zh":"CuInS2/ZnS（核/壳）量子点的简便合成与表面功能化用于敏化绿光到蓝光的光子上转换","title_key":"facilesynthesisandsurfacefunctionalizationofcuins2znscoreshellquantumdotstosensitizegreentobluephotonupconversion","authors":["Francisco Yarur Villanueva","Mark W. B. Wilson","John R. De Backere"],"venue":"Journal of Chemical Education","issn_l":"0021-9584","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-08","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Quantum dots (QDs), semiconductor nanocrystals typically a few nanometers (nm) in size, can exhibit intriguing photophysical properties that are visibly striking and engaging for undergraduate students. Here we present a laboratory experiment where undergraduate students synthesize CuInS2 QDs that they then shell with ZnS, yielding brightly emissive, Cd/Pb-free, and air-stable CuInS2/ZnS core/shell QDs. Students employ an adapted synthetic methodology that is straightforward, reliable, and neither requires air-free techniques nor temperatures >115 °C. Then, students use their QDs and two commercially available molecular fluorophores to assemble a three-component system (i.e., QD sensitizer, 9-carboxylanthracene (9-ACA) “triplet-transmitter” ligands, and emissive diphenylanthracene (DPA) molecules that can perform triplet fusion) that is capable of the fascinating phenomenon of photon upconversion (UC). Specifically, students’ solutions transform the incident green light (λ = 532 nm) from a laser into shorter-wavelength (higher-energy) blue emission (λmax ∼ 430 nm). The blue light from UC can be observed qualitatively with the naked eye (through a short-pass optical filter) and/or quantitatively using photoluminescence (PL) spectroscopy. Pedagogical analyses of student work and anonymous feedback are consistent with strong attainment of the intended learning outcomes, and suggest that the activity, which introduces contemporary nanochemistry, is interesting and engaging for students.","abstract_hash":"9568a2240c281595ee3614142c2a4ba2c51c3d58575f63d7e7e5d405c1544a75","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":2,"novelty_reason":"属于把已有量子点合成与三重态-三重态湮灭上转换思路转化为教学实验的应用性工作，方法上无新机制或新结构。","innovation_zh":"这篇论文面向本科教学，设计了一个可在常规实验室条件下完成的实验：学生合成 CuInS2 量子点并用 ZnS 包壳，得到无 Cd/Pb、空气稳定的高发光核壳量子点，合成过程无需无氧操作、温度不超过 115 °C。随后用这些量子点作为敏化剂，配合 9-羧基蒽（9-ACA）作为三重态传递配体、二苯基蒽（DPA）作为发光体，构建三组分体系，把 532 nm 绿光上转换为约 430 nm 的蓝光。创新点主要在于把量子点合成、表面功能化和光子上转换这一套纳米化学内容整合成可靠、易操作的教学实验，而非提出新的物理机制或器件。","method_zh":"采用简化的非无氧、低温（≤115 °C）合成路线制备 CuInS2 核并包覆 ZnS 壳；再以 9-ACA 对量子点表面功能化，与 DPA 组成三重态-三重态湮灭上转换体系，通过肉眼（加短通滤光片）和 PL 光谱表征蓝光发射。","keywords_zh":["CuInS2/ZnS 量子点","光子上转换","核壳结构","表面功能化","三重态-三重态湮灭"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:36.149Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1103/3v5w-1k38","doi":"10.1103/3v5w-1k38","doi_url":"https://doi.org/10.1103/3v5w-1k38","title":"Photon number coherence of a quantum dot-cavity system excited using the swing-up of quantum emitter population scheme","title_zh":"采用量子发射体布居摆升（swing-up of quantum emitter population, SUPP）方案激发的量子点-腔系统的光子数相干性","title_key":"photonnumbercoherenceofaquantumdotcavitysystemexcitedusingtheswingupofquantumemitterpopulationscheme","authors":["Anonymous"],"venue":"Physical review. B./Physical review. B","issn_l":"2469-9950","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-08","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display","quantuminfo"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["量子点","微腔","光子数相干性","SUPP 激发方案","单光子源"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:34.903Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/anie.3827650","doi":"10.1002/anie.3827650","doi_url":"https://doi.org/10.1002/anie.3827650","title":"Exploiting Ultrafast Auger Recombination in Colloidal ZnSe Quantum Dots for Photoemission and Hydrated Electron Generation","title_zh":"利用胶体 ZnSe 量子点的超快俄歇复合实现光电子发射与水合电子生成","title_key":"exploitingultrafastaugerrecombinationincolloidalznsequantumdotsforphotoemissionandhydratedelectrongeneration","authors":["Meng Yao","Xuyang Lin","Jingyi Zhu","et al."],"venue":"Angewandte Chemie International Edition","issn_l":"1433-7851","source_type":"journal","is_preprint":false,"alt_doi":"10.1002/ange.3827650","pub_date":"2026-09-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-08","oa_status":"bronze","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/anie.3827650","cited_by_count":0,"abstract":"ABSTRACT Colloidal ZnSe quantum dots (QDs) have recently emerged as a promising toxic‐element‐free semiconductor platform for a variety of applications. A particularly exciting opportunity is associated with the highly potent reduction power of the photogenerated electrons in ZnSe QDs, owing to their large bandgap and high‐energy conduction‐band electrons. These properties enabled efficient hydrated electron generation in Mn 2+ ‐doped ZnSe QDs through spin‐exchange Auger recombination mechanism. Here, we report for the first time that hydrated electrons can be also generated in undoped plain ZnSe QDs, originating from their exceptionally rapid multiexciton Auger recombination. We study size‐dependent Auger recombination in monodisperse ZnSe QDs using transient absorption spectroscopy and identify biexciton lifetimes (τ XX ) shorter than those of comparable‐size CdSe QDs by almost 10‐fold. Importantly, we find the volume‐scaling law of τ XX that holds in hexane phase breaks down in aqueous phase for the small‐size regime, highlighting the crucial role of the dielectric confinement effect in Auger processes. Transient absorption spectra also reveal size‐dependent thresholds for photoemission of free electrons, with smaller QDs requiring fewer excitons due to their faster Auger recombination. In water, photoemission generates hydrated electrons with quantum yield exceeding 3%.","abstract_hash":"8840d1cbe112f9e78128679367837c7e6af8bff5abd454070197ce26e0d27f02","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","detection"],"novelty_score":4,"novelty_reason":"首次在未掺杂 ZnSe 量子点中实现水合电子生成，并揭示水相小尺寸区间俄歇体积标度律失效这一新现象，但整体仍属对已有俄歇机制的拓展与验证。","innovation_zh":"此前水合电子的生成只在 Mn²⁺ 掺杂的 ZnSe 量子点中通过自旋交换俄歇复合实现，本文首次在未掺杂的纯 ZnSe 量子点中也观测到水合电子生成，机制来自其极快的多激子俄歇复合。作者用瞬态吸收谱系统测量了尺寸依赖的俄歇复合，发现双激子寿命 τ_XX 比同尺寸 CdSe 量子点短近 10 倍，并发现六己烷相中成立的 τ_XX 体积标度律在水相小尺寸区间失效，说明介电限域效应对俄歇过程有重要作用。瞬态吸收谱还给出自由电子光发射的尺寸依赖阈值，小尺寸量子点因俄歇复合更快而需要更少的激子；在水中光发射产生的水合电子量子产率超过 3%。","method_zh":"以单分散胶体 ZnSe 量子点为对象，用瞬态吸收光谱测量尺寸依赖的双激子俄歇寿命与自由电子光发射阈值，并对比六己烷相与水相中的行为。","keywords_zh":["ZnSe 量子点","俄歇复合","水合电子","瞬态吸收光谱","介电限域效应"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:36.675Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s13391-026-00667-y","doi":"10.1007/s13391-026-00667-y","doi_url":"https://doi.org/10.1007/s13391-026-00667-y","title":"Nanostructured ZnMgO Charge Generation Layers for Enhanced Tandem Quantum-Dot Light-Emitting Diodes","title_zh":"用于增强串联量子点发光二极管的纳米结构 ZnMgO 电荷生成层","title_key":"nanostructuredznmgochargegenerationlayersforenhancedtandemquantumdotlightemittingdiodes","authors":["Sunghyun Cho","Jaekook Ha","Heesun Yang","et al."],"venue":"Electronic Materials Letters","issn_l":"1738-8090","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-05","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-05","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["量子点发光二极管","串联器件","电荷生成层","ZnMgO","纳米结构"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:36.511Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.matdes.2026.116983","doi":"10.1016/j.matdes.2026.116983","doi_url":"https://doi.org/10.1016/j.matdes.2026.116983","title":"Enhanced photoluminescence and stability of water-soluble ZnSe:Cu quantum dots enabled by Al3+ co-doping and multilayer ZnS shell engineering","title_zh":"Al3+ 共掺杂与多层 ZnS 壳层工程实现增强的水溶性 ZnSe:Cu 量子点光致发光与稳定性","title_key":"enhancedphotoluminescenceandstabilityofwatersolubleznsecuquantumdotsenabledbyal3codopingandmultilayerznsshellengineering","authors":["Xiaojun Huang","Duo Chen","Chaojin Xuan","et al."],"venue":"Materials & Design","issn_l":"0264-1275","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-05","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-05","oa_status":"gold","pdf_url":"https://www.sciencedirect.com/science/article/pii/S0264127526015595/pdf","cited_by_count":0,"abstract":"Water-soluble Cu-doped ZnSe quantum dots are promising low-toxicity emitters, yet their applications are limited by defect-mediated nonradiative recombination, Cu-induced charge imbalance and lattice distortion, and poor long-term stability. Here, we develop a synergistic strategy combining substitutional Al 3 ⁺ co-doping with stepwise growth of a multilayer ZnS shell through sequential precursor injections. Al 3 ⁺ incorporation compensates the charge imbalance associated with Cu⁺ doping, while the multilayer ZnS shell enables progressive surface passivation and enhances carrier confinement via a graded interface. The optimized ZnSe:Cu,Al/ZnS/ZnS/ZnS quantum dots exhibit a 258% increase in photoluminescence (PL) intensity, a 10.52% enhancement in photoluminescence quantum yield (PLQY), and a 98% extension of the average lifetime (τ avg ) compared with ZnSe:Cu QDs. Notably, ZnSe:Cu,Al/ZnS/ZnS/ZnS QD powders retain 92% of their initial PL intensity after 300 days of storage under ambient conditions, demonstrating excellent long-term stability. This work provides a defect-engineering strategy for the rational design of highly luminescent and stable water-soluble ZnSe-based quantum dots.","abstract_hash":"bb1ff154e7c0ff415300a08ad83572aa7fb69352bbbe9fcde8546e6d6aadeeb8","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"提出 Al3+ 共掺杂补偿电荷失衡与多层 ZnS 壳梯度钝化相结合的新策略，并在 PL 强度、PLQY、寿命和储存稳定性上给出明确提升数据。","innovation_zh":"针对水溶性 Cu 掺杂 ZnSe 量子点中缺陷诱导的非辐射复合、Cu+ 掺杂引起的电荷失衡与晶格畸变以及长期稳定性差的问题，作者提出 Al3+ 替位共掺杂与分步注入生长多层 ZnS 壳层的协同策略：Al3+ 补偿 Cu+ 带来的电荷失衡，多层 ZnS 壳通过梯度界面逐步钝化表面并增强载流子限域。优化后的 ZnSe:Cu,Al/ZnS/ZnS/ZnS 量子点相比 ZnSe:Cu 量子点，PL 强度提升 258%，PLQY 提升 10.52%，平均寿命延长 98%；其粉末在环境条件下储存 300 天后仍保持 92% 的初始 PL 强度。","method_zh":"采用 Al3+ 替位共掺杂结合顺序前驱体注入逐步生长 ZnS/ZnS/ZnS 多层壳层，形成梯度界面以钝化表面并限域载流子。","keywords_zh":["ZnSe:Cu 量子点","Al3+ 共掺杂","多层 ZnS 壳层","缺陷工程","水溶性发光材料"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:38.069Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/1555-6611/ae9ea2","doi":"10.1088/1555-6611/ae9ea2","doi_url":"https://doi.org/10.1088/1555-6611/ae9ea2","title":"Spectral tuning of intra-band optical absorption in GaAs spherical quantum dots confined by a screened Kratzer potential","title_zh":"屏蔽 Kratzer 势束缚的 GaAs 球形量子点中带内光吸收的光谱调控","title_key":"spectraltuningofintrabandopticalabsorptioningaassphericalquantumdotsconfinedbyascreenedkratzerpotential","authors":["Lê Thị Ngọc Tú","Trinh T P Thao","Huynh V. Phuc"],"venue":"Laser Physics","issn_l":"1054-660X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-04","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-04","oa_status":"bronze","pdf_url":"https://iopscience.iop.org/article/10.1088/1555-6611/ae9ea2/pdf","cited_by_count":0,"abstract":"Abstract We theoretically investigate the intra-band optical absorption in GaAs spherical quantum dots (QDs) confined by a screened Kratzer potential. The energy levels and wave functions are obtained analytically within the adopted approximation using the Nikiforov–Uvarov method, and the optical absorption coefficient is evaluated from Fermi’s golden rule. The results show that increasing the characteristic confinement length r 0 produces a redshift and reduces the absorption intensity. In contrast, increasing the potential depth V 0 leads to a systematic blueshift with a non-monotonic variation of the peak intensity. Increasing temperature mainly suppresses the absorption intensity through the Fermi–Dirac occupation factors, while the resonance energy remains nearly unchanged. These results demonstrate that screened Kratzer confinement provides an effective mechanism for tuning the intra-band optical response of GaAs QDs.","abstract_hash":"d61d61c8c6c1eb548198ff4215d2ade5ef2f93118107548c40c3d45831cab34d","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","detection"],"novelty_score":3,"novelty_reason":"把屏蔽 Kratzer 势这一新势模型用于 GaAs 量子点带内吸收的解析计算，属于在新体系上验证已有思路的渐进式理论工作，无实验验证。","innovation_zh":"这篇工作把屏蔽 Kratzer 势引入 GaAs 球形量子点的带内光吸收计算，用 Nikiforov–Uvarov 方法解析求解能级和波函数，再由 Fermi 黄金规则算吸收系数。系统考察了三个可调参数对吸收谱的影响：增大特征束缚长度 r0 导致红移并降低吸收强度；增大势深 V0 造成系统性蓝移，但峰值强度呈非单调变化；升温主要通过 Fermi–Dirac 占据因子压低吸收强度，而共振能量几乎不变。整体上属于用新势模型对已有带内吸收问题的理论扩展，结论是屏蔽 Kratzer 势可作为调控 GaAs 量子点带内光学响应的手段。","method_zh":"在有效质量近似下采用屏蔽 Kratzer 势描述量子点束缚，用 Nikiforov–Uvarov 方法解析求解能级与波函数，再基于 Fermi 黄金规则计算带内光吸收系数。","keywords_zh":["GaAs 量子点","屏蔽 Kratzer 势","带内光吸收","Nikiforov–Uvarov 方法","Fermi 黄金规则"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:38.697Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1103/xx5b-rlgx","doi":"10.1103/xx5b-rlgx","doi_url":"https://doi.org/10.1103/xx5b-rlgx","title":"Electrically Tunable Orbital Coupling and Quantum Light Emission from O-Band Quantum Dot Molecules","title_zh":"O 波段量子点分子的电可调轨道耦合与量子光发射","title_key":"electricallytunableorbitalcouplingandquantumlightemissionfromobandquantumdotmolecules","authors":["Pavel Avdienko","Lukas Hanschke","Quirin Buchinger","et al."],"venue":"PRX Quantum","issn_l":"2691-3399","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-03","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"We present the observation of electrically tunable quantum coupling of orbital states in individual InAs/InGaAs quantum dot molecules emitting in the telecom O-band ( ∼ 1.3 μ m ). By tuning the static electric field along the growth axis of the quantum dot (QD)-molecule, we observe pronounced anticrossings between excitonic transitions and determine the dependence of the interdot electron tunnel coupling on the interdot separation. As the electric field applied along the growth axis of the QD-molecules increases, positively charged exciton complexes sequentially emerge in the time-integrated emission spectra due to electrons escaping from the system while holes remain trapped. Moreover, for strong pumping, biexciton emission from the O-band molecules is identified. We demonstrate single-photon emission from the InAs/InGaAs QD-molecule emitting around 1.3 μ m with a g ( 2 ) ( 0 ) = 0.017 ± 0.002 and explore the impact of tuning orbital coupling on the second-order correlation function.","abstract_hash":"a1e3add1aab5f6b47b686d13d2fdae6f222833593f517e78669531cf0252a2bc","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display"],"novelty_score":4,"novelty_reason":"把量子点分子的电可调轨道耦合与 O 波段单光子发射结合起来，并给出低至 0.017 的 g(2)(0)，属于新体系上的明确新策略与性能验证。","innovation_zh":"在发射波长约 1.3 μm（telecom O 波段）的单个 InAs/InGaAs 量子点分子上实现了轨道态的电学可调量子耦合：通过沿生长方向加静电场，观察到激子跃迁之间明显的反交叉，并定出电子隧穿耦合随点间距的变化关系。随电场增大，电子逃逸而空穴仍被束缚，时间积分谱中依次出现带正电的激子复合物；强泵浦下还识别出双激子发射。最终在 1.3 μm 附近实现单光子发射，g(2)(0)=0.017±0.002，并考察了轨道耦合调谐对二阶关联函数的影响。","method_zh":"对单个 InAs/InGaAs 量子点分子沿生长轴施加静电场，通过激子跃迁的反交叉谱学提取点间电子隧穿耦合，并结合时间积分发射谱与二阶关联函数测量。","keywords_zh":["量子点分子","轨道耦合","O 波段","单光子发射","反交叉"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:39.310Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsami.6c13325","doi":"10.1021/acsami.6c13325","doi_url":"https://doi.org/10.1021/acsami.6c13325","title":"HgSe/PbS Core-Shell Colloidal Quantum Dots Synthesized by a Simple Two-Step Method for Room-Temperature Long-Wave Infrared Photodetection","title_zh":"两步法合成 HgSe/PbS 核壳胶体量子点用于室温长波红外光电探测","title_key":"hgsepbscoreshellcolloidalquantumdotssynthesizedbyasimpletwostepmethodforroomtemperaturelongwaveinfraredphotodetection","authors":["Mingdong Hong","Shengyi Yang","Guanzhen Zou","et al."],"venue":"ACS Applied Materials & Interfaces","issn_l":"1944-8244","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-03","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Mercury chalcogenides (HgX) colloidal quantum dots (CQDs), particularly mercury selenide (HgSe) CQDs, have emerged as a promising candidate for long-wave infrared (LWIR, 8-14 μm) photodetectors due to their exceptional bandgap tunability by solution processing. Nevertheless, the intrinsic limitations of bare HgSe CQDs-high surface defect density and oxidation susceptibility-severely compromise their optoelectronic performance. In this paper, a simple two-step method to grow high-quality HgSe/PbS core-shell CQDs in the LWIR region by synergistically optimizing the thickness of the PbS shell for surface passivation and the oxidation resistance of the HgSe cores is presented. Further, its applications in LWIR detection are explored using a simple metal-semiconductor-metal (MSM) based photodetector Au/(HgSe/PbS)/Au. As a result, a high responsivity of 42 mA/W with a high specific detectivity of 2.41 × 109 Jones under a 25 mW/cm2, 10 μm illumination is obtained from the LWIR photodetector Au/[HgSe(13 nm)/PbS(5 nm)](1 μm)/Au at room-temperature. Therefore, such a simple two-step method of core-shell engineering approach establishes a versatile platform for developing next-generation LWIR optoelectronics.","abstract_hash":"d63bef6290b0faad8fb55ef99dc7017a515957654b8cfb9b2d6a3e70627fcc69","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"用核壳工程同时解决 HgSe 量子点的表面缺陷与氧化问题，并在室温长波红外探测上给出明确性能指标，属于有新结构策略且性能可观的工作。","innovation_zh":"针对裸 HgSe 胶体量子点表面缺陷密度高、易氧化导致光电性能受限的问题，作者用简单的两步法生长 HgSe/PbS 核壳量子点，通过协同优化 PbS 壳层厚度同时实现表面钝化和对 HgSe 核的抗氧化保护。基于 Au/[HgSe(13 nm)/PbS(5 nm)](1 μm)/Au 的 MSM 结构探测器，在室温、10 μm、25 mW/cm² 光照下获得 42 mA/W 响应度和 2.41 × 10⁹ Jones 比探测率。","method_zh":"两步法合成 HgSe/PbS 核壳胶体量子点，调控 PbS 壳厚（最优 5 nm，HgSe 核 13 nm），并做成 Au/(HgSe/PbS)/Au 金属-半导体-金属光电探测器。","keywords_zh":["HgSe/PbS 核壳量子点","长波红外探测","胶体量子点","表面钝化","MSM 光电探测器"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:39.274Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s11082-026-09104-8","doi":"10.1007/s11082-026-09104-8","doi_url":"https://doi.org/10.1007/s11082-026-09104-8","title":"Band Alignment and Charge-Transport Tradeoffs in Ag2S QD Solar Cells: Quantum Confinement vs. Recombination Across Sizes and Thicknesses","title_zh":"Ag2S 量子点太阳能电池中的能带对齐与电荷传输权衡：不同尺寸与厚度下量子限域与复合的竞争","title_key":"bandalignmentandchargetransporttradeoffsinag2sqdsolarcellsquantumconfinementvsrecombinationacrosssizesandthicknesses","authors":["Masood Mehrabian","Maryam Taleb-Abbasi","Pourya Norouzzadeh","et al."],"venue":"Optical and Quantum Electronics","issn_l":"0306-8919","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-02","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-02","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"无摘要信息，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确定具体方法与器件结构。","keywords_zh":["Ag2S 量子点","太阳能电池","能带对齐","电荷传输","量子限域"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:39.351Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/1361-6528/aea169","doi":"10.1088/1361-6528/aea169","doi_url":"https://doi.org/10.1088/1361-6528/aea169","title":"Tailoring electron transport dynamics via dual-modulation for balanced charge injection in InP QLEDs","title_zh":"通过双调控裁剪电子传输动力学以实现 InP QLED 中平衡的电荷注入","title_key":"tailoringelectrontransportdynamicsviadualmodulationforbalancedchargeinjectionininpqleds","authors":["Ki Won Jeong","Collins Kiguye","Jin Hong Park","et al."],"venue":"Nanotechnology","issn_l":"0957-4484","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-02","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-02","oa_status":"hybrid","pdf_url":"https://iopscience.iop.org/article/10.1088/1361-6528/aea169/pdf","cited_by_count":0,"abstract":"Interfacial defects and charge-transport imbalance at oxide electron transport layer (ETL)/quantum-dot interfaces remain key limitations in InP-based quantum-dot light-emitting diodes. Here, we present a dual-modulation strategy that combines ethanolamine (EA) ligand treatment with Mg-content control in ZnO-based ETLs to regulate their surface and electron-transport properties. EA attachment to ZnO nanoparticles was confirmed by Fourier transform infrared and XPS analyses. The treatment reduced oxygen-vacancy-related surface states, improved film uniformity, and lowered the surface work function, thereby facilitating electron injection. Within the same inverted device architecture, EA treatment increased the peak external quantum efficiency (EQE) from 4.08% for pristine-ZnO to 6.10% for EA-ZnO, corresponding to an improvement of approximately 50%. However, EA treatment also enhanced effective electron transport, which can intensify electron-dominant charge imbalance. Mg alloying was therefore introduced as an additional composition-dependent parameter to moderate electron transport while retaining the beneficial surface effects of EA modification. Adjusting the Mg content in EA-ZnMgO further increased the peak EQE to 9.23%, representing an additional improvement of approximately 51% relative to EA-ZnO. These results establish EA treatment and Mg-content adjustment as complementary and tunable approaches for adapting ZnO-based ETLs to the charge-injection requirements of different QD and hole-transport systems.","abstract_hash":"270838e83803d286b5d165bbcbf6975778699b4927b6c807e536e381c65cb828","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"提出 EA 表面修饰与 Mg 组分调控互补的双调控策略，在同一器件结构中实现 EQE 从 4.08% 到 9.23% 的显著提升，属明确的新策略加性能提升。","innovation_zh":"针对 InP QLED 中 ZnO 基电子传输层与量子点界面缺陷和电荷注入不平衡的问题，作者提出乙醇胺（EA）配体处理加 Mg 含量调控的双调控策略。EA 处理降低了氧空位相关表面态、改善了薄膜均匀性并降低表面功函数，使峰值 EQE 从原始 ZnO 的 4.08% 提升到 6.10%（约 50%）；但 EA 同时增强了电子传输、加剧电子主导的失衡，于是再通过 Mg 合金化调节电子传输，将峰值 EQE 进一步提升到 9.23%（相对 EA-ZnO 再提升约 51%）。","method_zh":"在反式器件结构中，用乙醇胺对 ZnO 纳米颗粒进行配体处理（FTIR 和 XPS 确认 EA 附着），并在 EA-ZnMgO 中调节 Mg 含量，以分别调控 ETL 表面性质和电子传输能力。","keywords_zh":["InP 量子点发光二极管","ZnO 电子传输层","乙醇胺配体处理","Mg 合金化","电荷注入平衡"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:41.473Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.mssp.2026.111123","doi":"10.1016/j.mssp.2026.111123","doi_url":"https://doi.org/10.1016/j.mssp.2026.111123","title":"Preparation of CdTe thin film detectors for X-ray imaging by close space sublimation","title_zh":"用近空间升华法制备用于 X 射线成像的 CdTe 薄膜探测器","title_key":"preparationofcdtethinfilmdetectorsforxrayimagingbyclosespacesublimation","authors":["Mingjuan Wang","Shuang Yang","Rui Wu","et al."],"venue":"Materials Science in Semiconductor Processing","issn_l":"1369-8001","source_type":"journal", ps://doi.org/10.3390/app16178719","title":"Ligand Engineering Enables Phase Selection and Improved Crystallinity in Metastable Orthorhombic AgInSe2 Nanocrystals","title_zh":"配体工程实现亚稳正交相 AgInSe2 纳米晶的相选择与结晶性提升","title_key":"ligandengineeringenablesphaseselectionandimprovedcrystallinityinmetastableorthorhombicaginse2nanocrystals","authors":["Yujia Hao","Xianxu Wang","Shuang Liu","et al."],"venue":"Applied Sciences","issn_l":"2076-3417","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-02","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-02","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"AgInSe2 (AISe) nanocrystals, with their outstanding optoelectronic properties and environmentally friendly, Cd/Pb-free composition, show strong potential for applications in near-infrared luminescence and photovoltaic devices. Herein, metastable orthorhombic AISe nanocrystals were synthesized using a simplified, efficient, and environmentally friendly strategy. The results demonstrate that ligands play a decisive role in crystal-phase selection by regulating Ag+/In3+ cation exchange, while their molecular structures influence stabilization of the metastable phase. Specifically, oleylamine, characterized by its relatively soft Lewis-basic nature and long chain length, favors the formation of metastable orthorhombic AISe. In addition, introducing 1-octadecene improves the crystallinity of the products without altering the crystal phase. This work provides a practical and promising strategy for preparing high-quality metastable orthorhombic AISe nanocrystals and offers useful guidance for the controlled synthesis of other metastable materials, supporting their further integration into optoelectronic devices.","abstract_hash":"df2f22055c43f3922b04274bfe4596afe74c93ac9332c5ddebada45bdaa18ed5","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":3,"novelty_reason":"在已有亚稳相合成思路基础上，明确把配体软硬和链长与相选择关联起来，属机制层面的渐进式推进，但缺少器件级性能数据。","innovation_zh":"在无镉无铅的 AgInSe2（AISe）纳米晶体系中，作者用配体来调控 Ag+/In3+ 阳离子交换，从而决定产物落在哪一相，并稳定亚稳的正交相。具体发现是：油胺（Lewis 碱性较软、链较长）有利于生成亚稳正交相 AISe，而引入 1-十八烯能在不改变晶相的前提下提高结晶性。相比常见的后处理或温度调控路线，这里把相选择归因于配体的电子性质和分子结构，为亚稳相纳米晶的可控合成提供了一个较简化的策略。","method_zh":"采用简化的溶液法合成 AISe 纳米晶，通过改变配体（油胺）与 1-十八烯的搭配来调控阳离子交换和相稳定性，并用表征确认晶相与结晶性。","keywords_zh":["AgInSe2","亚稳正交相","配体工程","阳离子交换","纳米晶合成"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:42.274Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.infrared.2026.106889","doi":"10.1016/j.infrared.2026.106889","doi_url":"https://doi.org/10.1016/j.infrared.2026.106889","title":"Self-driven PbSe thin-film mid-infrared detector for methane detection","title_zh":"用于甲烷检测的自驱动 PbSe 薄膜中红外探测器","title_key":"selfdrivenpbsethinfilmmidinfrareddetectorformethanedetection","authors":["Xinjie Wang","Wei Yuchao","Zexu Wang","et al."],"venue":"Infrared Physics & Technology","issn_l":"1350-4495","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-02","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-02","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确定具体方法与器件结构。","keywords_zh":["PbSe","中红外探测器","自驱动","甲烷检测","薄膜"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:41.831Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adfm.78081","doi":"10.1002/adfm.78081","doi_url":"https://doi.org/10.1002/adfm.78081","title":"Near‐Infrared Light‐Emitting Diodes With 15.8% External Quantum Efficiency via Electron‐Phonon Coupling Regulation in Eco‐Friendly CuInSSe/ZnS Quantum Dots","title_zh":"通过调控环保型 CuInSSe/ZnS 量子点中的电子-声子耦合实现 15.8% 外量子效率的近红外发光二极管","title_key":"nearinfraredlightemittingdiodeswith158externalquantumefficiencyviaelectronphononcouplingregulationinecofriendlycuinsseznsquantumdots","authors":["Zongzhe Li","Jingjing Xu","Zhiheng Cheng","et al."],"venue":"Advanced Functional Materials","issn_l":"1616-301X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-02","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-02","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Despite their eco‐friendly profile, the luminescence efficiency of I–III–VI group quantum dots (QDs) for near‐infrared (NIR) applications is fundamentally limited by defects and strong electron‐phonon coupling (EPC). Here, we report a solvent engineering strategy that simultaneously regulates the composition and defect states in CuInSSe QDs by tuning the DDT/ODE ratio. This approach effectively mitigates EPC, reducing the Huang–Rhys factor from 6.2 to 1.2 and boosting the photoluminescence quantum yield (PLQY) to 56.4%. Subsequent ZnS shell coating further elevates the PLQY to 93.9%. Temperature‐dependent spectroscopy and theoretical calculations suggest that defect suppression plays a significant role in weakening EPC. Based on these QDs, we fabricated near‐infrared quantum dot light‐emitting diodes (NIR‐QLEDs) exhibiting an average external quantum efficiency (EQE) of 15.8±1.3% (20 devices) and a maximum EQE of 18.5% at 910 nm, which is one of the highest values reported for CuInSSe‐based NIR‐QLEDs to date, along with a peak radiance of 7.8 W sr −1 m −2 . We further demonstrate their potential in non‐invasive bio‐imaging. This work provides a viable path to high‐performance eco‐friendly optoelectronics by manipulating fundamental electron‐phonon interactions.","abstract_hash":"39693ccdee043e5baa8fe681cdcebd942bb5d95f8b9f81b90ca0a49ef48e93fa","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"用溶剂工程调控电子-声子耦合这一新策略显著提升环保量子点近红外 QLED 效率，EQE 达同类体系最高水平之一，但机制仍属缺陷抑制的已有框架。","innovation_zh":"针对 I-III-VI 族量子点因缺陷和强电子-声子耦合（EPC）导致近红外发光效率受限的问题，作者用溶剂工程策略（调节 DDT/ODE 比例）同时调控 CuInSSe 量子点的组分与缺陷态，把 Huang-Rhys 因子从 6.2 降到 1.2，PLQY 提升到 56.4%，再包 ZnS 壳后进一步升到 93.9%。基于该量子点制备的 910 nm 近红外 QLED 平均 EQE 达 15.8±1.3%（20 个器件），最高 EQE 18.5%，峰值辐射亮度 7.8 W sr⁻¹ m⁻²，是 CuInSSe 基近红外 QLED 中报道的最高值之一。","method_zh":"通过调节 DDT/ODE 比例的溶剂工程调控 CuInSSe 量子点的组分和缺陷态以削弱电子-声子耦合，再包覆 ZnS 壳层，并结合变温光谱与理论计算分析缺陷抑制对 EPC 的削弱作用。","keywords_zh":["近红外 QLED","CuInSSe 量子点","电子-声子耦合","外量子效率","溶剂工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:43.586Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/smll.75572","doi":"10.1002/smll.75572","doi_url":"https://doi.org/10.1002/smll.75572","title":"Achieving 10% Efficiency in Quantum Dot‐Sensitized Solar Cells via Vacancy‐Engineered Carbon Nitride in CuS/C Heterostructures","title_zh":"通过空位工程碳氮化物构建 CuS/C 异质结实现量子点敏化太阳能电池 10% 效率","title_key":"achieving10efficiencyinquantumdotsensitizedsolarcellsviavacancyengineeredcarbonnitrideincuscheterostructures","authors":["Shamsa Kizhepat","Ruei‐Chen Liao","Wubshet Mekonnen Girma","et al."],"venue":"Small","issn_l":"1613-6810","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-02","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-02","oa_status":"bronze","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/smll.75572","cited_by_count":0,"abstract":"ABSTRACT The development of high‐efficiency counter electrodes (CEs) is a pivotal challenge for advancing the performance of quantum dot‐sensitized solar cells (QDSSCs). This study reports the rational synthesis of a CuS/C‐DCN ox heterostructure, featuring copper sulfide nanoparticles (CuS) anchored onto a nitrogen‐vacancy‐rich, mildly oxidized defective carbon nitride matrix (DCN ox ). The controlled introduction of nitrogen vacancies into the graphitic carbon nitride (g‐C 3 N 4 ) lattice creates mid‐gap donor states that enhance n‐type conductivity and provide coordinatively unsaturated sites for accelerated polysulfide reduction. The exceptional photovoltaic performance is primarily attributed to these engineered nitrogen vacancies, which modulate the electronic environment, thereby facilitating superior charge dynamics. Mechanistically, the integration of these materials establishes a Mott‐Schottky (M‐S) p‐n junction, driven by the specific alignment of their Fermi levels. This architecture generates a robust built‐in electric field (BIEF) at the interface, which significantly promotes spatial charge separation and reduces charge‐transfer resistance between the CE and the electrolyte. Consequently, the optimized CuS/C‐DCN ox CE achieves a champion power conversion efficiency (PCE) of 10.09%, supported by a high J SC of 27.5 mA cm −2 , a V OC of 696 mV, and FF of 52.7%. These results demonstrate that nitrogen vacancy engineering is a powerful strategy for regulating interfacial electronic states.","abstract_hash":"c2ebcd5c155f811c73b92fed44b8c34153a0e340eb316aea25f3485deca97261","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"用氮空位工程调控碳氮化物界面电子态并与 CuS 构建 M-S 结，属明确的新策略且把 QDSSC 对电极效率推到 10.09%。","innovation_zh":"针对 QDSSC 对电极（CE）效率受限的问题，作者把 CuS 纳米颗粒锚定在富氮空位、轻度氧化的缺陷型氮化碳（DCN ox）基体上，构建 CuS/C-DCN ox 异质结。核心创新在于用氮空位在 g-C3N4 晶格中引入带隙内施主态，提升 n 型导电性并提供配位不饱和位点，加速多硫化物还原；同时 CuS 与 DCN ox 的费米能级匹配形成 Mott-Schottky p-n 结，在界面产生内建电场促进电荷分离、降低对电极/电解液间的电荷转移电阻。优化后的对电极取得 10.09% 的冠军 PCE，J SC 27.5 mA cm−2、V OC 696 mV、FF 52.7%。","method_zh":"以富氮空位且轻度氧化的缺陷型 g-C3N4（DCN ox）为载体锚定 CuS 纳米颗粒，形成 CuS/C-DCN ox 异质结对电极，利用氮空位调控界面电子态并构建 Mott-Schottky p-n 结。","keywords_zh":["量子点敏化太阳能电池","对电极","氮空位工程","碳氮化物","Mott-Schottky 结"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:44.486Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1063/5.0345760","doi":"10.1063/5.0345760","doi_url":"https://doi.org/10.1063/5.0345760","title":"Excitation-dependent photoluminescence and photoreflectance in InGaAs/GaAs quantum dot bilayers: Comparison of undoped and n-doped configurations","title_zh":"InGaAs/GaAs 量子点双层的激发依赖光致发光与光调制反射：未掺杂与 n 型掺杂构型的对比","title_key":"excitationdependentphotoluminescenceandphotoreflectanceiningaasgaasquantumdotbilayerscomparisonofundopedandndopedconfigurations","authors":["Arianna Cretı̀","L. Seravalli","Giovanni Montagna","et al."],"venue":"Journal of Applied Physics","issn_l":"0021-8979","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"hybrid","pdf_url":"https://pubs.aip.org/aip/jap/article-pdf/doi/10.1063/5.0345760/21125033/094301_1_5.0345760.pdf","cited_by_count":0,"abstract":"Temperature- and excitation-dependent photoluminescence (PL) and photoreflectance (PR) spectroscopy were employed to investigate carrier dynamics and internal electric-field effects in undoped and nominally n-doped InGaAs/GaAs quantum dot (QD) bilayer structures composed of uncapped surface and buried QDs. By using UV, green, and red excitation/modulation wavelengths, surface-sensitive, intermediate-depth, and bulk-mediated carrier-generation regimes were selectively probed within the same heterostructure. Systematic differences between the undoped and doped configurations were observed across all excitation conditions. The doped structure exhibited enhanced PL intensity, reduced sensitivity to state-filling effects, and a progressively significant contribution from electric-field–related modulation mechanisms. Under deep excitation conditions, QD-related PR features and Franz–Keldysh oscillations persisted up to room temperature exclusively in the doped sample, indicating a more stable internal electric-field configuration under thermally activated carrier redistribution. The combined PL and PR analysis indicates that moderate n-type doping at the single-electron-per-dot level primarily modifies the balance between population-driven and field-driven optical processes, rather than introducing additional non-radiative recombination pathways. These findings highlight the role of low-level doping in controlling carrier redistribution and internal electric fields in QD heterostructures, parameters that are critical for the performance of temperature- and excitation-dependent optoelectronic devices.","abstract_hash":"b4aa4e4ccc3e55670f1a4e66630b5c5f4b573e5c78e205b1e828079e44ecbde4","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","detection"],"novelty_score":3,"novelty_reason":"用多波长 PL/PR 在同一量子点双层上区分表面与埋层、对比掺杂效应的做法较系统，但整体属于对已有光谱手段在新体系上的验证与渐进式理解，未提出新机制或刷新器件指标。","innovation_zh":"这篇工作在同一 InGaAs/GaAs 量子点双层结构（包含未覆盖的表面量子点和埋层量子点）上，用 UV、绿光、红光三种激发/调制波长分别探测表面敏感、中等深度和体区载流子产生过程，系统对比了未掺杂与名义 n 掺杂样品的差异。掺杂样品表现出更强的 PL 强度、对态填充效应更不敏感，以及更明显的电场相关调制贡献；在深激发下，只有掺杂样品中量子点相关的 PR 特征和 Franz–Keldysh 振荡能一直保持到室温。作者据此认为，单电子每点的中等 n 型掺杂主要改变的是布居驱动与电场驱动光学过程之间的平衡，而不是引入额外的非辐射复合通道。","method_zh":"采用温度依赖和激发依赖的光致发光（PL）与光调制反射（PR）光谱，通过 UV、绿光、红光三种激发/调制波长在同一异质结构中分别实现表面、中间深度和体区载流子产生，对比未掺杂与名义 n 掺杂的 InGaAs/GaAs 量子点双层样品。","keywords_zh":["InGaAs/GaAs 量子点","光致发光","光调制反射","n 型掺杂","Franz–Keldysh 振荡"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:49.996Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsami.6c10302","doi":"10.1021/acsami.6c10302","doi_url":"https://doi.org/10.1021/acsami.6c10302","title":"Solvent-Driven Surface-State Reconstruction of ZnMgO for Stable Blue QLEDs","title_zh":"溶剂驱动的 ZnMgO 表面态重构用于稳定蓝光 QLED","title_key":"solventdrivensurfacestatereconstructionofznmgoforstableblueqleds","authors":["Jing Zhou","Xuejiao Zhou","Noor Zaman","et al."],"venue":"ACS Applied Materials & Interfaces","issn_l":"1944-8244","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Blue QLEDs face a critical challenge in balancing high luminous efficiency with operational stability, primarily due to uncontrolled electron injection and interfacial trap-assisted recombination. Here, we present a facile aqueous ZnCl2 post-treatment strategy to engineer ZnMgO (ZMO) electron transport layers (ETLs). This approach leverages a synergistic mechanism of hydrolysis-induced recrystallization and chloride-mediated surface passivation to transform defective nanocrystal films into high-quality transport layers. The treated ETLs exhibit a reconstructed crystalline morphology with reduced grain boundary density and passivated oxygen vacancies. Consequently, without any pre-aging treatment, the optimized blue QLEDs exhibited a threefold increase in both external quantum efficiency (EQE, 5.47%) and operational lifetime (T50, 5.2 × 103 h), along with a twofold enhancement in luminance (2.4x104 cd/m2), compared to the control devices. This work demonstrates a facile method to manipulate the surface and bulk properties of metal oxide ETLs, effectively mitigating efficiency roll-off and providing a strategy for commercial high-brightness display technologies.","abstract_hash":"f85d15a8173347d82f49fd5f42874fe25d5f32e9520606db92eb61045e91651f","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"提出一种简便的水溶液后处理策略同时调控金属氧化物 ETL 的表面与体相性质，并在无预老化条件下实现 EQE、寿命和亮度的成倍提升。","innovation_zh":"针对蓝光 QLED 中电子注入不可控和界面陷阱辅助复合导致效率与稳定性难以兼顾的问题，作者用 ZnCl2 水溶液对 ZnMgO 电子传输层做后处理，通过水解诱导再结晶与氯离子表面钝化的协同作用，把缺陷纳米晶薄膜转变成高质量传输层。处理后 ETL 晶界密度降低、氧空位被钝化，无需预老化处理，优化器件的 EQE 提升至 5.47%（三倍）、T50 寿命达 5.2×10^3 h（三倍）、亮度达 2.4×10^4 cd/m2（两倍）。","method_zh":"对 ZnMgO 电子传输层进行 ZnCl2 水溶液后处理，利用水解诱导再结晶和氯离子钝化重构表面态，再构建蓝光 QLED 器件。","keywords_zh":["蓝光 QLED","ZnMgO","电子传输层","表面钝化","氧空位"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:44.793Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adom.71752","doi":"10.1002/adom.71752","doi_url":"https://doi.org/10.1002/adom.71752","title":"ZnS Nanocrystal‐Mediated Spacing and Band Engineering for Efficient and Stable Blue ZnSeTe QLEDs","title_zh":"ZnS 纳米晶介导的间距与能带工程实现高效稳定的蓝光 ZnSeTe QLED","title_key":"znsnanocrystalmediatedspacingandbandengineeringforefficientandstableblueznseteqleds","authors":["Jixing Chen","Qiuyan Li","Jinhui Jiang","et al."],"venue":"Advanced Optical Materials","issn_l":"2195-1071","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT ZnSeTe quantum dot light‐emitting diodes (QLEDs) are promising candidates for environmentally friendly display applications. However, their electroluminescence performance and practical implementation are still hindered by nonradiative recombination originating from exciton trapping at defect states among quantum dots (QDs) in the emissive layer (EML). Herein, wide‐bandgap ZnS nanocrystals are incorporated into the ZnSeTe EML to suppress nonradiative recombination and modulate carrier transport, thereby improving the performance of blue ZnSeTe QLEDs. The results reveal that the introduction of ZnS nanocrystals effectively suppresses Förster resonance energy transfer among QDs within the EML, leading to an extension of the exciton lifetime in the film from 9.2 to 12.7 ns. Meanwhile, the built‐in electric field established at the interface between ZnS nanocrystals and ZnSeTe QDs induces upward band bending in the EML, which lowers the hole injection barrier and facilitates more balanced carrier transport. As a result, the resulting blue QLEDs deliver a luminance of 10229.4 cd m −2 at 6 V, a maximum external quantum efficiency of 21.2% at 2317.4 cd m −2 , and a T 50 lifetime of 220.2 h at an100.0 cd m −2 , compared with 49.9 h for the control device. This work offers an effective strategy for developing high‐performance blue environmentally friendly QLEDs.","abstract_hash":"20f8adf59f13add20a1f3b76e03b1650f4ad65f12cd118f761bbd1f474d45807","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用 ZnS 纳米晶同时实现间距调控与能带工程，蓝光 QLED 效率达 21.2% 且寿命提升约 4.4 倍，策略明确且性能提升显著。","innovation_zh":"针对蓝光 ZnSeTe QLED 中量子点缺陷态俘获激子导致非辐射复合的问题，作者把宽禁带 ZnS 纳米晶掺进发光层，一方面抑制量子点间的 Förster 共振能量转移（激子寿命从 9.2 ns 延长到 12.7 ns），另一方面利用 ZnS/ZnSeTe 界面内建电场使发光层能带上弯、降低空穴注入势垒、改善载流子平衡。器件在 6 V 下亮度 10229.4 cd m⁻²，最大外量子效率 21.2%（对应亮度 2317.4 cd m⁻²），100 cd m⁻² 初始亮度下 T50 寿命 220.2 h，对照组仅 49.9 h。","method_zh":"在 ZnSeTe 发光层中引入宽禁带 ZnS 纳米晶，通过调控量子点间距和界面能带（内建电场诱导能带上弯）来抑制非辐射复合与能量转移，并优化载流子输运。","keywords_zh":["ZnSeTe 量子点","蓝光 QLED","ZnS 纳米晶","能带工程","非辐射复合"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:46.422Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1093/nsr/nwag541","doi":"10.1093/nsr/nwag541","doi_url":"https://doi.org/10.1093/nsr/nwag541","title":"Directly synthesized p-type PbS quantum-dot inks enable uniform SWIR imaging","title_zh":"直接合成的 p 型 PbS 量子点墨水实现均匀短波红外成像","title_key":"directlysynthesizedptypepbsquantumdotinksenableuniformswirimaging","authors":["Yilong Zhou","Zhixian Zhang","Jiang Tang"],"venue":"National Science Review","issn_l":"2053-714X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"无摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["PbS 量子点","p 型墨水","短波红外","成像"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:45.752Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/cnma.70370","doi":"10.1002/cnma.70370","doi_url":"https://doi.org/10.1002/cnma.70370","title":"Effect of Ionic Surfactants for Tetrapod‐Shaped CdSe Quantum Dots","title_zh":"离子型表面活性剂对四足状 CdSe 量子点的作用","title_key":"effectofionicsurfactantsfortetrapodshapedcdsequantumdots","authors":["Sucheta Banerjee"],"venue":"ChemNanoMat","issn_l":"2199-692X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"We explore the effect of ionic surfactants on the photoluminescence (PL) of single emissive CdSe nano‐tetrapods. In the presence of the cationic surfactant cetyltrimethylammonium bromide (CTAB), effective quenching of PL is observed for tetrapods. X‐ray photoelectron spectroscopy (XPS) reveals the adsorption of negatively charged Br − ions onto the nanocrystal surface, which leads to efficient PL quenching. In particular, the longer‐lived trap‐state emission is suppressed due to the accumulation of surfactant counterions at the tetrapod surface. In contrast, sodium dodecyl sulfate (SDS), an anionic surfactant, shows negligible interaction with the negatively charged Se 2− ‐terminated surface, resulting in sustained PL intensity. These results demonstrate that the immediate surface environment and counterion adsorption play a critical role in modulating the photoluminescence properties of CdSe nano‐tetrapods.","abstract_hash":"39bf2a41142562b0cc5ff50a02f40b071707b664aff7a503eb4d9bceed150ccc","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"在四足状 CdSe 这一特定形貌上验证了反离子吸附调控发光的已有认识，属于渐进式机理补充而非新机制。","innovation_zh":"这篇工作系统比较了阳离子表面活性剂 CTAB 和阴离子表面活性剂 SDS 对单个发光 CdSe 纳米四足体荧光的影响。CTAB 会显著猝灭荧光，XPS 显示带负电的 Br⁻ 吸附到纳米晶表面是猝灭来源，尤其是长寿命的陷阱态发光被抑制；而 SDS 与带负电的 Se²⁻ 终止表面几乎不作用，荧光强度基本保持。作者据此指出表面近邻环境和反离子吸附是调控 CdSe 四足体发光的关键因素。","method_zh":"在单颗粒水平测量 CdSe 纳米四足体的荧光，结合 XPS 表征表面元素与吸附物种，对比 CTAB 与 SDS 两种离子型表面活性剂处理后的表面化学与发光行为。","keywords_zh":["CdSe 四足体","离子型表面活性剂","荧光猝灭","反离子吸附","表面态发光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:47.455Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.26565/2312-4334-2026-3-53","doi":"10.26565/2312-4334-2026-3-53","doi_url":"https://doi.org/10.26565/2312-4334-2026-3-53","title":"Changes in the Optical Properties of Semiconductor Quantum Dots under an External Electric Field","title_zh":"外电场下半导体量子点光学性质的变化","title_key":"changesintheopticalpropertiesofsemiconductorquantumdotsunderanexternalelectricfield","authors":["Kamoliddin Koraboev","Usman K. Sapaev","Gayrat X. Bakirov","et al."],"venue":"DOAJ (DOAJ: Directory of Open Access Journals)","issn_l":null,"source_type":"repository","is_preprint":true,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"The influence of quantum confinement on the energy spectra of spherical semiconductor quantum dots (QDs) made of CdSe, GaP, and GaAs is investigated using the particle-in-a-spherical-box model. We derive discrete energy levels for electrons and holes, demonstrating that the level spacing increases quadratically as the dot radius decreases (∝1/R2). Analytical expressions for the linear and third-order nonlinear interlevel optical absorption coefficients are obtained via the density-matrix formalism, incorporating intraband relaxation and Stark shifts induced by an external static electric field. Numerical results for GaAs QDs reveal that an applied field of F = 100 kV/cm causes significant spectral broadening and a peak reduction of up to $50\\%$ at high optical intensities. Our findings demonstrate that both dot size and external fields provide efficient tuning knobs for QD optical responses, with implications for tunable lasers and electro-optic modulators.","abstract_hash":"e36ec52871d93c5926c06e3496bf41332853367122d1b2d96f144c6627aaf47e","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","detection"],"novelty_score":3,"novelty_reason":"在已有球形势阱与密度矩阵框架下，对三种材料量子点做外场调控光学吸收的解析与数值对比，属于在新体系上验证并扩展已有思路。","innovation_zh":"用球形势阱模型系统比较了 CdSe、GaP、GaAs 三种球形量子点的量子限域能谱，并给出电子与空穴的离散能级，指出能级间距随半径减小按 1/R² 增大。通过密度矩阵方法推导了带内弛豫和静电场 Stark 位移下的线性与三阶非线性子带间光吸收系数解析式。数值结果显示 GaAs 量子点在 F = 100 kV/cm 外场下出现明显谱线展宽，高光强下吸收峰最多下降 50%，说明尺寸和外场都是调控量子点光学响应的有效手段。","method_zh":"采用粒子在球形势阱中的模型计算 CdSe、GaP、GaAs 量子点的电子/空穴能级，并用密度矩阵形式引入带内弛豫和外加静电场引起的 Stark 位移，求解线性与三阶非线性子带间光吸收系数。","keywords_zh":["半导体量子点","外电场调控","Stark 位移","非线性光吸收","量子限域"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:48.598Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.26565/2312-4334-2026-3-22","doi":"10.26565/2312-4334-2026-3-22","doi_url":"https://doi.org/10.26565/2312-4334-2026-3-22","title":"A High-Sensitivity, Zero-Bias Silicon Photodiode for Detection of Eco-Friendly AgInS2 та CuInS2 Quantum Dot Emission","title_zh":"用于探测环保型AgInS2与CuInS2量子点发光的高灵敏度零偏硅光电二极管","title_key":"ahighsensitivityzerobiassiliconphotodiodefordetectionofecofriendlyagins2cuins2quantumdotemission","authors":["Mykola Stepanovych Kukurudziak","Vasylyna V. Kopach","Serhii A. Voitovych","et al."],"venue":"DOAJ (DOAJ: Directory of Open Access Journals)","issn_l":null,"source_type":"repository","is_preprint":true,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Silicon p-n photodiodes optimized for detecting a broad spectrum of photoluminescent radiation from AgInS₂ and CuInS₂ quantum dots have been developed and fabricated. By adjusting fabrication parameters and carefully selecting the substrate material, the sensor’s spectral sensitivity peak (0.34 A/W) aligns with the nanocrystal emission range (550–700 nm). To maximize resolution, we operated the detector in zero-bias mode. This minimized dark current to approximately 6 pA, reduced thermal noise, and enabled high detection sensitivity. It has been experimentally established that, with a load resistance of 10 kΩ, the cutoff frequency of the photodiode is 1 MHz and is entirely limited by the RC time constant of the circuit. This frequency response is sufficient not only for steady-state radiometry of colloids and films with a radiation power of 0.29–0.35 mW, but also for precise study of the microsecond kinetics of quantum dot luminescence decay without risking photodegradation.","abstract_hash":"f6ec50f56631fd42668d38763231d4b6473ab8f52f251996aada45505e6bb698","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display"],"novelty_score":3,"novelty_reason":"针对特定环保量子点发射波段定制硅光电二极管并优化零偏性能，属于器件参数匹配与优化的渐进式工作，未见新物理机制或新结构。","innovation_zh":"针对AgInS2和CuInS2这类环保型量子点的550–700 nm发光波段，定制了硅p-n光电二极管，通过调整工艺参数和衬底材料把光谱响应峰值（0.34 A/W）对准量子点发射范围。采用零偏工作模式把暗电流压到约6 pA，降低热噪声以获得高探测灵敏度。在10 kΩ负载下截止频率为1 MHz，受RC时间常数限制，既能做稳态辐射度测量（0.29–0.35 mW），也能测微秒级发光衰减动力学而不引起光降解。","method_zh":"制备硅p-n光电二极管，通过调节 fabrication 参数与衬底选型匹配量子点发射谱，并在零偏模式下配合10 kΩ负载进行光电探测。","keywords_zh":["硅光电二极管","零偏模式","AgInS2量子点","CuInS2量子点","光电探测"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:49.264Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/eng2.71030","doi":"10.1002/eng2.71030","doi_url":"https://doi.org/10.1002/eng2.71030","title":"Indium Phosphide Quantum Dots for Light‐Emitting Devices: Fundamentals, Recent Advances, and Technology Roadmaps","title_zh":"用于发光器件的磷化铟量子点：基础、近期进展与技术路线图","title_key":"indiumphosphidequantumdotsforlightemittingdevicesfundamentalsrecentadvancesandtechnologyroadmaps","authors":["Mohamed Abu Shuheil","Magdi E. A. Zaki","Maharshikumar B. Shukla","et al."],"venue":"Engineering Reports","issn_l":"2577-8196","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"gold","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/eng2.71030","cited_by_count":0,"abstract":"ABSTRACT Indium phosphide (InP) quantum dots (QDs) have emerged as the leading cadmium‐free emitters for next‐generation light‐emitting devices, offering broad spectral tunability, environmental compatibility, and strong potential for integration into advanced display technologies. Recent advances in core/shell engineering have enabled significant improvements in optical performance, including PLQY reaching 76%–93%, FWHM reduced to 36–37 nm, and Stokes shifts exceeding 100 nm in engineered heterostructures. These enhancements have directly contributed to improved color purity, reduced self‐absorption, and enhanced radiative efficiency in device architectures. This review consolidates the fundamental photophysical principles governing InP‐based emission, including electronic structure, defect chemistry, surface passivation mechanisms, and exciton dynamics. Despite these advances, the field continues to face persistent bottlenecks such as charge injection asymmetry, interfacial nonradiative recombination, long‐term instability under electrical stress, and scalability limitations of complex multi‐shell systems. Addressing these challenges requires an integrated technology roadmap that unifies materials design, charge transport optimization, photonic engineering, and manufacturable processing strategies. This review offers a structured perspective on recent advances in InP‐based QD LEDs and their potential pathways toward improved device performance and scalability.","abstract_hash":"1f84a5916cc053e93449b09c6a7ee4eb0e5fa3f56d3333fb50c847bc79b1bba7","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":2,"novelty_reason":"属综述整合，未提出新机制或新器件，但给出了较系统的性能数据汇总与技术路线图。","innovation_zh":"这是一篇关于 InP 量子点发光器件的综述，系统梳理了核/壳工程在光学性能上的进展：PLQY 达到 76%–93%，FWHM 收窄到 36–37 nm，工程化异质结构中 Stokes 位移超过 100 nm，这些改进直接带来色纯度提升、自吸收降低和辐射效率提高。文章同时归纳了 InP 发光的光物理基础（电子结构、缺陷化学、表面钝化、激子动力学），并明确指出电荷注入不对称、界面非辐射复合、电应力下长期不稳定以及多壳层体系的可规模化难题，最后提出把材料设计、电荷传输优化、光子工程与可制造工艺统一起来的技术路线图。作为综述，其贡献在于整合而非提出新机制。","method_zh":"综述性工作，围绕 InP 基量子点的核/壳异质结构工程展开，从电子结构、缺陷化学、表面钝化和激子动力学几个层面组织文献，并对 QLED 器件架构与工艺可扩展性做路线图式讨论。","keywords_zh":["InP 量子点","无镉发光","核壳结构","QLED","技术路线图"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:50.377Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s10854-026-18476-2","doi":"10.1007/s10854-026-18476-2","doi_url":"https://doi.org/10.1007/s10854-026-18476-2","title":"Near-infrared photodetector based on environmentally friendly inverted type I CIS/CTSe core–shell quantum dots","title_zh":"基于环境友好型倒置I型CIS/CTSe核壳量子点的近红外光电探测器","title_key":"nearinfraredphotodetectorbasedonenvironmentallyfriendlyinvertedtypeicisctsecoreshellquantumdots","authors":["Jin Wang","Hui Zhang","Haobo Wang","et al."],"venue":"Journal of Materials Science Materials in Electronics","issn_l":"0957-4522","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_rea onversion efficiencies over 18%, such as quantum dot-sensitized solar cell geometry, colloidal quantum dot solar cell geometry and perovskite quantum dot solar cell geometry. We also discuss the ever-recurring issues of the operational stability, scalability in production and financial viability of QD PVs. Finally, we lay out a plan for future studies that should bring quantum dot solar cells closer to their theoretical maximum efficiency without compromising their wide area and cost competitiveness. Furthermore, this study explores the effects of integrating with 5G and future 6G wireless networks through smart monitoring, energy-autonomous IoT nodes, and simultaneous wireless data and power transfer to speed up the implementation and practical use of quantum dot photovoltaics.","abstract_hash":"9677722881c039211a388b623efa85bdf93b2596b78897d2fb3530ede2f05181","abstract_source":"openalex","abstract_missing":false,"directions":["detection","quantuminfo","materials"],"novelty_score":2,"novelty_reason":"综述文章，汇总已有进展并展望与通信网络结合，未提出新的物理机制或器件结构。","innovation_zh":"这是一篇综述，系统梳理了量子点光伏在突破 Shockley-Queisser 极限方面的进展，涵盖铅硫族化物和环保型量子点体系，以及下移、下转换、上转换等光谱工程策略。文中指出量子点敏化、胶体量子点和钙钛矿量子点三类架构已实现超过 18% 的功率转换效率，并讨论了运行稳定性、可扩展性和经济可行性等长期问题。此外还展望了量子点光伏与 5G/6G 网络结合，用于智能监测、能量自持 IoT 节点和无线数据与功率同传。","method_zh":"综述性工作，汇总了量子点光伏的器件架构（量子点敏化、胶体量子点、钙钛矿量子点太阳能电池）和光谱工程方法（downshifting、down-conversion、upconversion），并分析了稳定性、规模化与成本问题。","keywords_zh":["量子点太阳能电池","Shockley-Queisser极限","光谱工程","功率转换效率","6G物联网"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:51.934Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/1674-4926/26020012","doi":"10.1088/1674-4926/26020012","doi_url":"https://doi.org/10.1088/1674-4926/26020012","title":"Infrared photodetectors based on Ⅲ−Ⅴ colloidal quantum dots","title_zh":"基于Ⅲ−Ⅴ族胶体量子点的红外光电探测器","title_key":"infraredphotodetectorsbasedoniiivcolloidalquantumdots","authors":["Yang Liu","Zeke
