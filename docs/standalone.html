pectroscopy. XRD showed a zinc-blende CdZnS alloy structure with no detectable secondary crystalline phase, while the first excitonic absorption yielded an optical band gap of 3.172 eV. The PL spectrum exhibits a narrow band-edge emission at 403 nm together with an intense broad visible emission centered at 554 nm. Unlike conventional PL, SL spectroscopy resolves the broad emission into three spectroscopically distinct bands centered at approximately 445, 488 and 503 nm, providing additional spectroscopic constraints for identifying the corresponding radiative transitions. Based on the complementary structural and spectroscopic evidence obtained in this work together with previously reported first-principles defect calculations and Cu-related luminescence mechanisms in ZnS-based materials, a semi-quantitative, evidence-integrated energy-level model is proposed to consistently interpret the observed emissions in terms of Cu-related acceptor states and intrinsic donor/acceptor defect states within the CdZnS alloy lattice. The present approach demonstrates that integrating SL with conventional structural and optical characterization provides a more reliable approach for identifying the dominant radiative recombination pathways in Cu-doped semiconductor QDs than assignment based solely on emission wavelengths.","abstract_hash":"d051a4b74bd2ee4869d0c94d13e337bc35b38c59e3dcdd0a15bfc8e1f2016815","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":3,"novelty_reason":"把同步发光光谱引入 Cu 掺杂量子点的发光中心指认，属于方法层面的新尝试，但结论仍依赖与已有第一性原理缺陷计算的对照，且为半定量模型，未给出器件级性能指标。","innovation_zh":"Cu 掺杂三元 CdZnS 量子点的可见发光是多个辐射跃迁叠加的宽峰，靠普通 PL 谱的峰位来指认发光中心只能依赖间接证据。作者用同步发光（SL）光谱把 554 nm 的宽发射拆成约 445、488、503 nm 三个可分辨的谱带，再结合 XRD、吸收谱和 PL 给出额外的谱学约束，并据此提出一个半定量的、证据整合的能级模型，把发光归因于 Cu 相关受主态与合金晶格中的本征施主/受主缺陷态。","method_zh":"胶体法合成 Cu 掺杂 Cd0.3Zn0.7S 量子点，用 XRD、UV-Vis 吸收、PL 与同步发光光谱联合表征；XRD 显示闪锌矿 CdZnS 合金结构、无第二晶相，第一激子吸收给出光学带隙 3.172 eV，PL 中 403 nm 为窄带边发射、554 nm 为强宽可见发射。","keywords_zh":["Cu 掺杂量子点","CdZnS 合金","同步发光光谱","发光中心","缺陷能级"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:50:00.641Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1002/lpor.72020","doi":"10.1002/lpor.72020","doi_url":"https://doi.org/10.1002/lpor.72020","title":"Interfacial Dipole Engineering of NiO x Enables High‐Efficiency Deep‐Blue Quantum Dot Light‐Emitting Diodes","title_zh":"NiOx 界面偶极工程实现高效深蓝量子点发光二极管","title_key":"interfacialdipoleengineeringofnioxenableshighefficiencydeepbluequantumdotlightemittingdiodes","authors":["Xinyu Zhang","Chao Wang","Na Liang","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-09","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-09","oa_status":"bronze","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/lpor.72020","cited_by_count":0,"abstract":"ABSTRACT Carrier imbalance arising from insufficient hole injection remains a major obstacle to achieving high‐efficiency blue quantum‐dot light‐emitting diodes (QLEDs). Here, we introduce fluorinated self‐assembled monolayers (SAMs) onto NiO x hole‐injection layers to regulate the interfacial electronic structure and hole injection. Molecular modification induces pronounced interfacial dipoles and shifts the valence‐band maximum (VBM) of NiO x toward deeper energy levels, thereby improving energy‐level alignment. Among the investigated modifiers, pentafluorobenzyl phosphonic acid (F 5 BnPA) produces the strongest interfacial modulation, yielding a VBM of −5.65 eV and a reduced hole‐injection barrier. Consequently, the optimized deep‐blue QLEDs deliver a maximum luminance of 31163 cd m −2 and a peak external quantum efficiency of 19.68%, with Commission Internationale de l'Éclairage (CIE) coordinates of (0.15, 0.03) and excellent spectral stability. These results represent one of the highest efficiencies reported for blue QLEDs employing metal‐oxide hole‐injection layers and highlight the critical role of molecular dipole engineering in tailoring oxide/organic interfaces for high‐performance deep‐blue QLEDs.","abstract_hash":"26040ab55646f3d9cb2bd1782dc71a856982e32dd2b0f64dc4dcee97ff99a655","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用含氟 SAM 界面偶极调控 NiOx 能级并给出明确的深蓝 QLED 效率提升（EQE 19.68%），属有新策略且性能显著的工作，但机制仍是界面偶极工程的延伸。","innovation_zh":"针对蓝光 QLED 空穴注入不足导致的载流子失衡问题，作者在 NiOx 空穴注入层上引入含氟自组装单分子层（SAM）来调控界面电子结构与空穴注入。其中五氟苄基膦酸（F5BnPA）的界面调制最强，把 NiOx 的价带顶推到 −5.65 eV，降低了空穴注入势垒。优化后的深蓝 QLED 最大亮度 31163 cd m−2、峰值外量子效率 19.68%，CIE 坐标 (0.15, 0.03)，光谱稳定性良好，作者称这是采用金属氧化物空穴注入层的蓝光 QLED 中效率最高的结果之一。","method_zh":"在 NiOx 空穴注入层表面修饰含氟膦酸类自组装单分子层，通过分子偶极改变 NiOx 价带顶位置、优化与量子点层的能级对齐，并对比了不同修饰分子的调制效果。","keywords_zh":["量子点发光二极管","深蓝发光","NiOx 空穴注入层","自组装单分子层","界面偶极工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:50:00.415Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acsnano.6c10075","doi":"10.1021/acsnano.6c10075","doi_url":"https://doi.org/10.1021/acsnano.6c10075","title":"Selective Biexciton Generation under Energy-Time Entangled Quantum Light in Quantum Dots","title_zh":"量子点中能量-时间纠缠量子光下的选择性双激子产生","title_key":"selectivebiexcitongenerationunderenergytimeentangledquantumlightinquantumdots","authors":["Kaiyue Peng","Chieh Tsao","Hendrik Utzat","et al."],"venue":"ACS Nano","issn_l":"1936-0851","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-08","oa_status":"green","pdf_url":"https://arxiv.org/pdf/2605.26466","cited_by_count":0,"abstract":"Abstract Quantum light provides opportunities for controlling multiphoton absorption beyond the classical limits. Here, we investigate biexciton generation in nanocrystal quantum dots driven by energy-time-entangled photon pairs generated via spontaneous parametric downconversion. We show that frequency–time correlations between pairs of photons increase the population of biexcitons over excitons, thereby lending specificity to the excitation of many-body states. By employing a three-level model, we demonstrate that biexciton generation depends nontrivially on the photon entanglement time and pump bandwidth. We find that maximizing efficiency requires an optimally shaped entangled photon field rather than simply scaling parameters for a monotonic improvement. Extending to a realistic CdSe/CdS core–shell quantum dot containing many excitonic states coupled to the quantum field, we demonstrate that increasing the biphoton arrival-time entanglement (closer arrival time) enhances constructive pathway interference and expands accessible excitation channels while preserving better energy-conservation in excitation than classical light when generating biexcitons. Furthermore, tuning the time-correlation properties enables selective excitation of closely spaced biexciton states. These results establish entangled photons as tools for selective excitation and control of higher-order excited states in quantum-confined systems.","abstract_hash":"527ba9a83842c52e14ffc998184bf27b0af4c241e0eb61df5034b35d2b681b52","abstract_source":"openalex","abstract_missing":false,"directions":["display","quantuminfo","materials"],"novelty_score":4,"novelty_reason":"把纠缠光子对作为调控量子点高阶激发态（双激子）选择性的工具，并给出时间关联调控的具体机制，属于新策略而非单纯性能优化。","innovation_zh":"用自发参量下转换产生的能量-时间纠缠光子对驱动纳米晶量子点，发现光子对之间的频率-时间关联能让双激子布居相对激子增强，从而对多体态的激发产生选择性。在真实 CdSe/CdS 核壳量子点（含多个与光场耦合的激子态）中，缩短双光子到达时间（增强纠缠）可加强路径干涉、扩展可激发的通道，同时比经典光更好地保持激发过程的能量守恒；调节时间关联还能选择性激发能量接近的双激子态。","method_zh":"以自发参量下转换产生的能量-时间纠缠光子对作为激发源，先用三能级模型分析双激子产生对纠缠时间和泵浦带宽的依赖，再扩展到含多激子态的真实 CdSe/CdS 核壳量子点体系。","keywords_zh":["纠缠光子对","双激子","量子点","选择性激发","自发参量下转换"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:50:00.621Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1016/j.micrna.2026.208946","doi":"10.1016/j.micrna.2026.208946","doi_url":"https://doi.org/10.1016/j.micrna.2026.208946","title":"Defect-regulated carrier dynamics in BaZrS3-AgBiS2 dual-absorber nanostructured quantum dot solar cells for advanced lead-free photovoltaics","title_zh":"缺陷调控载流子动力学的 BaZrS3-AgBiS2 双吸收层纳米结构量子点太阳能电池：面向先进无铅光伏","title_key":"defectregulatedcarrierdynamicsinbazrs3agbis2dualabsorbernanostructuredquantumdotsolarcellsforadvancedleadfreephotovoltaics","authors":["G. Venkateswarlu","Umakanta Nanda"],"venue":"Micro and Nanostructures","issn_l":"2773-0123","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-08","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["BaZrS3","AgBiS2","量子点太阳能电池","无铅光伏","双吸收层"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:50:01.458Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acs.chemmater.6c01903","doi":"10.1021/acs.chemmater.6c01903","doi_url":"https://doi.org/10.1021/acs.chemmater.6c01903","title":"Facet Selectivity Enables Near-Unity External Quantum Yields in Shell-free Silicon Quantum Dots","title_zh":"晶面选择性使无壳硅量子点实现接近100%的外量子产率","title_key":"facetselectivityenablesnearunityexternalquantumyieldsinshellfreesiliconquantumdots","authors":["Yuito Oba","Honoka Ueda","Ken‐ichi Saitow"],"venue":"Chemistry of Materials","issn_l":"0897-4756","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-08","oa_status":"hybrid","pdf_url":"https://pubs.acs.org/cmatex/article-pdf/doi/10.1021/acs.chemmater.6c01903/68792494/acs.chemmater.6c01903.pdf","cited_by_count":0,"abstract":"Abstract Core–shell quantum dots (QDs) such as epitaxially passivated CdSe, InP, and lead-halide perovskite QDs, which are often used in solar cells and as photocatalysts, are highly luminescence-efficient and tunable. However, concerns surrounding sustainability, toxicity, and material availability have spurred interest in heavy-metal-free QDs derived from Earth-abundant elements. Ensuring that shell-free colloidal QDs emit efficiently and stably─a long-standing goal that is expected to simplify syntheses and broaden technological applicability─remains particularly challenging for silicon, an indirect-bandgap semiconductor traditionally regarded as emitting light inefficiently. Herein, we synthesized shell-free silicon QDs (SiQDs) with controlled crystal sizes (1.8–2.5 nm) via a hydrogen-silsesquioxane-polymer route and created a quantitative structure–property framework. The photoluminescence quantum yields (PLQYs) of fresh SiQDs were found to be determined by quantum confinement, exciton tunneling, crystallinity, and tensile strain, with volcano-type size dependences observed. Beyond this intrinsic behavior, long-term aging was found to distinctly enhance efficiency, with PLQYs of up to 99% sustained over extended periods of time (200–450 d) in solution under ambient conditions. This enhancement is attributable to the slow, facet-selective oxidation of Si–Si back bonds on Si(111) facets. These findings identify facet-selective back-bond chemistry in the subsurface region as a critical design feature for highly efficient, shell-free SiQDs and provide a general framework for sustainable, heavy-metal-free photonic nanomaterials.","abstract_hash":"72f7a79f62000a63baa84cbf039532901c09f8b8f858902e7521082adee210cc","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":5,"novelty_reason":"首次在无壳硅量子点中实现接近100%的PLQY并揭示晶面选择性背键氧化这一新机制，刷新了硅量子点发光效率的认知。","innovation_zh":"在无壳硅量子点（SiQDs）上实现了高达99%的光致发光量子产率（PLQY），并在环境条件下溶液中保持200–450天。这一提升并非来自传统的壳层钝化，而是源于Si(111)晶面上Si–Si背键的缓慢、晶面选择性氧化。作者还建立了定量构效关系框架，指出新鲜SiQDs的PLQY由量子限域、激子隧穿、结晶度和拉伸应变共同决定，并观察到火山型尺寸依赖关系。","method_zh":"通过氢倍半硅氧烷聚合物路线合成无壳SiQDs，控制晶体尺寸在1.8–2.5 nm，并系统追踪老化过程中的PLQY变化与表面化学。","keywords_zh":["硅量子点","无壳结构","晶面选择性氧化","光致发光量子产率","构效关系"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:36.279Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1002/anie.5306487","doi":"10.1002/anie.5306487","doi_url":"https://doi.org/10.1002/anie.5306487","title":"Defect Engineering via Aggregation: Unlocking Hour‐Long Afterglow and UV Thermoluminescence in Self‐Embedded Carbon Nitride Quantum Dots","title_zh":"通过聚集实现缺陷工程：在自嵌入氮化碳量子点中解锁小时级余辉与紫外热释光","title_key":"defectengineeringviaaggregationunlockinghourlongafterglowanduvthermoluminescenceinselfembeddedcarbonnitridequantumdots","authors":["Hao Cui","Ni Huang","Kai Jiang","et al."],"venue":"Angewandte Chemie International Edition","issn_l":"1433-7851","source_type":"journal","is_preprint":false,"alt_doi":"10.1002/ange.5306487","pub_date":"2026-10-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-08","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Carbon nitride quantum dots (CNQDs) exhibiting aggregation-induced visible long persistent luminescence (LPL), ultraviolet (UV) high-temperature afterglow (HTA), and thermoluminescence (TL) are reported for the first time. The CNQDs are synthesized via a facile solvent-free thermolysis of biuret and display a blue LPL lasting over 1.5 h under ambient conditions. Upon heating to 150°C, intense UV HTA and TL emissions are generated. Mechanistic studies reveal that aggregation-associated π-π stacking stabilizes triplet excitons, while aggregation-stabilized defect-related paramagnetic centers promote carrier capture and long-term energy storage, with deeper traps serving as reservoirs for thermally activated release. Reverse intersystem crossing further transfers de-trapped carriers from triplet to singlet excited states, resulting in a pronounced blue-shift of the HTA and TL emissions into the UV region. Owing to the stability of the aggregates and their protective effect on excited states and trapped charges, the luminescence remains robust in aqueous dispersions, while the invisible UV TL signals remain clearly detectable after more than 15 days under ambient conditions. Leveraging these characteristics, we demonstrate applications in highly concealed information storage and high-contrast bioimaging. This work establishes an aggregation-induced defect-engineering strategy for energy-storage luminescent materials and opens a new pathway toward self-embedded LPL/TL systems.","abstract_hash":"24d79707ada7d8f37db4ea28d45f412dd276b937b00f01f85ca179bfd76437d0","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","detection"],"novelty_score":5,"novelty_reason":"首次在 CNQDs 体系中同时实现聚集诱导 LPL、紫外 HTA 与 TL，并提出聚集诱导缺陷工程这一新机制。","innovation_zh":"首次在氮化碳量子点（CNQDs）中同时实现聚集诱导的可见长余辉（LPL）、紫外高温余辉（HTA）和热释光（TL）。用无溶剂热解缩二脲一步合成，室温下蓝色 LPL 可持续 1.5 小时以上，加热到 150°C 时产生强紫外 HTA 和 TL。机理上把聚集与缺陷工程挂钩：π-π 堆叠稳定三线态激子，聚集稳定的缺陷顺磁中心负责俘获载流子与长期储能，深陷阱作为热激活释放的储库，反向系间窜越再把去俘获载流子从三线态转到单线态，使 HTA/TL 发射显著蓝移到紫外区。","method_zh":"以缩二脲为前驱体、无溶剂热解合成自嵌入 CNQDs；通过聚集调控 π-π 堆叠与缺陷相关顺磁中心，结合变温余辉与热释光测量解析陷阱深度与载流子释放路径。","keywords_zh":["氮化碳量子点","聚集诱导发光","长余辉","热释光","缺陷工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:36.731Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1063/5.0295810","doi":"10.1063/5.0295810","doi_url":"https://doi.org/10.1063/5.0295810","title":"Review on telecom quantum dots: Challenges and perspectives","title_zh":"电信波段量子点综述：挑战与展望","title_key":"reviewontelecomquantumdotschallengesandperspectives","authors":["C. Buchholz","Nicolas Claro-Rodríguez","Dennis Deutsch","et al."],"venue":"Applied Physics Reviews","issn_l":"1931-9401","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-07","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-07","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Single and entangled photons are an essential resource for quantum communication, enabling the transmission of quantum information. For this technology to work on long-distance networks, quantum light sources are needed that produce photonic quantum states, such as single photons, ideally on demand and with a wavelength in the telecommunication wavelength bands. Solid-state semiconductor quantum dots emitting in these wavelength ranges are promising candidates for reliable single-photon sources. This review will give an overview of the current developments, challenges, and milestones reached in this field. We will provide an overview of different growth methods and discuss current state-of-the-art metrics such as single-photon emission, single-photon purity, and indistinguishability. Vital for the device development is a high source brightness, to ensure the transmission speed, necessary for real-world communication. Promising solutions to this are different kinds of micro-cavities, which deploy the Purcell effect for increased brightness and collection efficiency. In this review, first an overview of the growth methods for C-band quantum dots is given (II), followed by applications (III), and an overview of the solutions to current challenges in this field (IV).","abstract_hash":"e4b4d8721a907d4711a06f8552c4c451cac59b92173f9addce52fc29c1914acb","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","materials"],"novelty_score":2,"novelty_reason":"属于领域综述，整合已有进展与挑战，不包含新的实验或器件创新。","innovation_zh":"这是一篇综述而非原创研究，系统梳理了电信波段（C 波段）半导体量子点作为单光子源和纠缠光子源的进展、挑战与里程碑。内容覆盖不同外延生长方法、当前单光子发射性能指标（单光子纯度、不可区分性）以及器件开发中关键的源亮度问题，并指出微腔利用 Purcell 效应提升亮度和收集效率是主要解决路径。文章按生长方法、应用、挑战对策三部分组织，本身不提出新机制或新器件。","method_zh":"综述性文章，按 C 波段量子点生长方法、应用、当前挑战的解决方案三个板块组织，讨论微腔结构与 Purcell 效应在提升光源亮度和收集效率上的作用。","keywords_zh":["电信波段量子点","单光子源","纠缠光子","Purcell 效应","微腔"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:36.192Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acs.jpcc.6c04042","doi":"10.1021/acs.jpcc.6c04042","doi_url":"https://doi.org/10.1021/acs.jpcc.6c04042","title":"Spectroscopic Signatures of Charged States in CdSe Nanoplatelets: Direct Observation of Oscillator Strength and Spin Center Identification","title_zh":"CdSe 纳米片带电态的光谱特征：直接观测振子强度与自旋中心识别","title_key":"spectroscopicsignaturesofchargedstatesincdsenanoplateletsdirectobservationofoscillatorstrengthandspincenteridentification","authors":["Benjamin T. Diroll"],"venue":"The Journal of Physical Chemistry C","issn_l":"1932-7447","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-07","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-07","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract The low-temperature photoluminescence of CdSe nanoplatelets exhibits a characteristic two-peak structure that has been widely attributed to negative trion emission. Despite this consensus, direct spectroscopic evidence for the trion oscillator strength and chemical identification of the resident charge have remained elusive. Here, a combination of differential absorption spectroscopy, photoluminescence excitation spectroscopy, and electron paramagnetic resonance was used to provide evidence for a trion state in 4 monolayer CdSe nanoplatelets. Under illumination at cryogenic temperatures, we observe the growth of a new absorption feature red-shifted by ∼30 meV from the heavy-hole exciton, consistent with trion formation. The magnitude of this photoinduced absorption correlates quantitatively with the fractional increase in red-shifted emission. PLE measurements at 80 K reveal that the red emission feature possesses a distinct excitation spectrum with measurable oscillator strength below the exciton energy. Photo-EPR measurements generate a spin signal attributed to an electron localized on selenium atoms (i.e., VCd–). These findings establish a direct connection between the spectroscopic signatures of trions and specific point defects in CdSe nanoplatelets. The data also suggest a reconciliation with the known sensitivity of the red emission to sample preparation and aggregation state through homo-FRET-mediated energy transfer and dielectric enhancement effects in aggregated systems.","abstract_hash":"975232e2088d5db0bc8201f62c32404be0f5956e5693e6a2fc6e99531b95707a","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"把 trion 的光谱特征（振子强度、红移吸收）与 EPR 指认的具体点缺陷 VCd– 直接挂钩，属于明确的机制层面新证据，而非单纯性能优化。","innovation_zh":"CdSe 纳米片低温 PL 的双峰结构长期被归为负三离子（trion）发光，但一直缺少 trion 振子强度的直接光谱证据，驻留电荷的化学身份也不清楚。作者用差分吸收谱、PLE 和 EPR 联用，在 4 单层 CdSe 纳米片中观测到重空穴激子红移约 30 meV 的新吸收峰，其光致吸收强度与红移发射的增量在定量上对应；80 K 的 PLE 显示红移发射具有独立激发谱，在激子能量以下仍有可测的振子强度；photo-EPR 给出的自旋信号被指认为局域在 Se 上的电子（VCd–）。这样就把 trion 的光谱特征与具体点缺陷直接对应起来，并用 homo-FRET 能量转移和聚集体系的介电增强来解释红移发射对样品制备与聚集状态的敏感性。","method_zh":"在 4 单层 CdSe 纳米片上结合差分吸收谱、光致发光激发谱（PLE，80 K）与 photo-EPR 进行低温光谱与自旋表征，并将光致吸收幅度与红移发射增量做定量关联。","keywords_zh":["CdSe 纳米片","三离子（trion）","差分吸收谱","photo-EPR","点缺陷"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:37.235Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acsomega.6c09360","doi":"10.1021/acsomega.6c09360","doi_url":"https://doi.org/10.1021/acsomega.6c09360","title":"Photoluminescence Properties of Mn2+-Doped CdS/ZnS Core/Shell Nanocrystals with Different Core Sizes and Shell Thicknesses","title_zh":"不同核尺寸与壳层厚度的Mn2+掺杂CdS/ZnS核/壳纳米晶的光致发光性质","title_key":"photoluminescencepropertiesofmn2dopedcdsznscoreshellnanocrystalswithdifferentcoresizesandshellthicknesses","authors":["Atsushi Yamashita"],"venue":"ACS Omega","issn_l":"2470-1343","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-07","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-07","oa_status":"gold","pdf_url":"https://pubs.acs.org/acsodf/article-pdf/doi/10.1021/acsomega.6c09360/68779353/acsomega.6c09360.pdf","cited_by_count":0,"abstract":"Abstract The spectral line width of doped semiconductor nanocrystals (NCs) is a critical parameter governing their optical performance, yet isolating the contributions of static structural disorder and dynamic electron–phonon interactions remains a fundamental challenge. In this study, we systematically synthesized CdS:Mn/ZnS core/shell NCs with precisely controlled core-to-shell ratios to elucidate the mechanisms governing the Mn2+ photoluminescence (PL) spectral width. Using a time-gated photon-counting technique, we successfully isolated the long-lived Mn2+ PL and analyzed its temperature and shell-thickness dependencies. Low-temperature (15 K) measurements revealed that the static inhomogeneous broadening, dictated by the local coordination environment of the Mn2+ ions at the core/shell interface, is intrinsically independent of the core/shell ratio. In contrast, at room temperature, significant spectral broadening was observed in NCs with thinner shells. This phenomenon is attributed to the strong coupling between the highly localized Mn 3d electrons and broadly distributed surface phonon modes. Crucially, we demonstrate that a robust inorganic ZnS shell acts not only as a surface passivant but also as a physical shield that effectively decouples the Mn2+ ions from these surface phonons, thereby suppressing the line broadening. These findings provide a comprehensive physical chemistry perspective on the interplay between dopant localization and surface phonon coupling, offering critical design principles for achieving a high spectral purity in doped nanomaterials.","abstract_hash":"fb86228728f17628db082c3e36d3d0d40831879c750148fe6a76e6c28fa5592f","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"在已知的掺杂纳米晶体系中，用时间门控手段把静态非均匀展宽与表面声子耦合展宽区分开，属于对既有思路的机制性验证与细化，而非全新机制或器件。","innovation_zh":"这篇工作系统合成了核/壳比精确可控的CdS:Mn/ZnS纳米晶，用时间门控光子计数把长寿命的Mn2+发光从其他信号中分离出来，从而单独考察其谱线宽度的来源。核心发现是：低温（15 K）下由Mn2+在核/壳界面局域配位环境决定的静态非均匀展宽与核/壳比无关；而室温下薄壳样品出现明显展宽，归因于高度局域的Mn 3d电子与分布广泛的表面声子模式之间的强耦合。由此说明ZnS壳不只是表面钝化层，还起到物理屏蔽作用，把Mn2+与表面声子解耦，从而抑制谱线展宽。","method_zh":"合成核/壳比精确可控的CdS:Mn/ZnS核/壳纳米晶，采用时间门控光子计数技术分离长寿命Mn2+发光，并测量其随温度和壳层厚度的变化。","keywords_zh":["Mn2+掺杂","核/壳纳米晶","光致发光线宽","电子-声子耦合","表面钝化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:39.075Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.3390/photochem6040039","doi":"10.3390/photochem6040039","doi_url":"https://doi.org/10.3390/photochem6040039","title":"Direct Aqueous Synthesis of Band-Edge-Emitting Cadmium-Free ZnTe Quantum Dots","title_zh":"无镉 ZnTe 量子点的直接水相合成与带边发光","title_key":"directaqueoussynthesisofbandedgeemittingcadmiumfreezntequantumdots","authors":["Kazuto Fukuda","Yoshie Takahashi","DaeGwi Kim"],"venue":"Photochem","issn_l":"2673-7256","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-07","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-07","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"In this study, we investigated the direct aqueous synthesis of water-soluble ZnTe quantum dots (QDs). To suppress oxidation of the Te precursor, dissolved oxygen was removed from the precursor solution by nitrogen bubbling in a glove box. The hydrothermally synthesized ZnTe QDs exhibited band-edge photoluminescence (PL) with a maximum PL quantum yield of 9.3%. Furthermore, the PL energy was tunable through control of the heating temperature and reaction time. The optimized ZnTe QDs exhibited good crystallinity and a narrow size distribution. These results demonstrate an effective approach for the direct aqueous synthesis of cadmium-free ZnTe QDs and provide useful insights for the development of environmentally friendly luminescent materials.","abstract_hash":"3a32c6ccd0bf125bab83398c4351882e357c6600475d2aa738f210fa0e6fbf30","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"在无镉 ZnTe 水相直接合成这一较少被做通的体系上给出可行路线并实现带边发光，但整体属已有思路在新体系上的验证与优化，量子产率仍偏低。","innovation_zh":"在水相中直接合成水溶性 ZnTe 量子点，并通过在手套箱内用氮气鼓泡去除前驱液中的溶解氧来抑制 Te 前驱体的氧化。所得到的 ZnTe 量子点实现带边发光，最高 PL 量子产率为 9.3%，且发光能量可通过加热温度和反应时间调控；优化后的样品结晶性良好、尺寸分布较窄。","method_zh":"水热法直接在水相中合成 ZnTe 量子点，合成前在手套箱内对前驱体溶液进行氮气鼓泡除氧以抑制 Te 前驱体氧化，并通过调节加热温度与反应时间调控发光能量。","keywords_zh":["ZnTe 量子点","水相合成","无镉","带边发光","量子产率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:38.468Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acsami.6c05348","doi":"10.1021/acsami.6c05348","doi_url":"https://doi.org/10.1021/acsami.6c05348","title":"Colloidally Stable P-Type Quantum Dot Ink with an Atomic Layer Deposition Interlayer for High-Detectivity Photodetectors","title_zh":"胶体稳定的 p 型量子点墨水结合原子层沉积中间层用于高探测率光电探测器","title_key":"colloidallystableptypequantumdotinkwithanatomiclayerdepositioninterlayerforhighdetectivityphotodetectors","authors":["Hong Gu Kang","Daekwon Shin","Seohee Park","et al."],"venue":"ACS Applied Materials & Interfaces","issn_l":"1944-8244","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-06","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Solution-processed quantum dot (QD) photodetectors commonly rely on solid-state ligand exchange (SSLE) for the fabrication of conductive films; however, severe volume shrinkage, which induces stress throughout the QD film and generates structural defects and trap states, causes a high dark current and limited detectivity. Herein, we report a solution-processable conductive p-type PbS QD ink fabricated via solution-phase ligand exchange using 3-mercapto-1-propanol (MPOH), effectively overcoming the intrinsic limitations of SSLE. Introducing MPOH ligands results in a colloidally stable p-type QD ink that can be well-dispersed in polar solvents, enabling the formation of dense and smooth hole transport layers (HTLs) via a single coating step. QD films fabricated using the p-type ink exhibit substantially reduced surface roughness and trap density, resulting in a pronounced suppression of the dark current density in the photodetectors. Moreover, the damage-free integration of the p-type ink onto halide-passivated n-type PbS active layers is achieved by introducing an ultrathin MgO interlayer deposited using atomic layer deposition, which prevents solvent-induced interfacial degradation without compromising infrared transmission. Subsequently, a device architecture is developed by effectively increasing the HTL thickness using a p-type PbS ink, resulting in a significantly reduced dark current density and nearly 10-fold enhancement in the detectivity.","abstract_hash":"684e49e8da8d668a3b4daad09d675405199a2c78a4738907dbb9c65e85d44d54","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"用溶液相配体交换替代 SSLE 得到可涂覆的 p 型量子点墨水，并以 ALD MgO 中间层解决界面兼容问题，使探测率提升近 10 倍，属明确的新策略加显著性能提升。","innovation_zh":"针对溶液法量子点光电探测器普遍依赖固态配体交换（SSLE）导致薄膜体积收缩、应力与缺陷增多、暗电流高的问题，作者用 3-巯基-1-丙醇（MPOH）做溶液相配体交换，制得可分散于极性溶剂、胶体稳定的 p 型 PbS 量子点墨水，一步旋涂即可得到致密光滑的空穴传输层。为把这种 p 型墨水无损地集成到卤素钝化的 n 型 PbS 活性层上，引入原子层沉积的超薄 MgO 中间层，在不牺牲红外透过的前提下防止溶剂引起的界面损伤。通过 p 型墨水加厚空穴传输层后，暗电流密度显著降低，探测率提升近 10 倍。","method_zh":"以 MPOH 为配体进行溶液相配体交换制备 p 型 PbS 量子点墨水，单步涂覆成空穴传输层；用 ALD 沉积超薄 MgO 作为 p 型层与卤素钝化 n 型 PbS 活性层之间的界面保护层，并靠加厚 HTL 优化器件。","keywords_zh":["PbS 量子点","p 型墨水","溶液相配体交换","原子层沉积","光电探测器"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:40.061Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1007/s44469-026-00025-6","doi":"10.1007/s44469-026-00025-6","doi_url":"https://doi.org/10.1007/s44469-026-00025-6","title":"Alkyl-functionalized ZnS nanoparticles for optical management in quantum dot color conversion layers with inkjet printing compatibility","title_zh":"烷基功能化 ZnS 纳米颗粒用于量子点色转换层的光学管理，并兼容喷墨打印","title_key":"alkylfunctionalizedznsnanoparticlesforopticalmanagementinquantumdotcolorconversionlayerswithinkjetprintingcompatibility","authors":["Yoon-Jeong Choi","Ji Eun Kim","Mir Jeong","et al."],"venue":"Journal of Information Display","issn_l":"1598-0316","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-06","oa_status":"gold","pdf_url":"https://link.springer.com/content/pdf/10.1007/s44469-026-00025-6.pdf","cited_by_count":0,"abstract":"Abstract Achieving high color conversion efficiency by optimizing the optical properties of quantum dots (QDs) color conversion layers (CCLs) remains a challenge for next-generation display fabrication. CCLs, which convert blue light into red or green emission via photoluminescence, are key components in QD-based displays. However, their optical efficiency and inkjet printability remain limited due to poor compatibility between QDs and conventional light-scattering materials such as titanium oxide (TiO 2 ). In this study, alkyl-functionalized ZnS nanoparticles were synthesized and incorporated into a QD ink formulation to enhance conversion efficiency and reduce blue leakage. The functionalized ZnS exhibited improved dispersibility in polymeric resins, ensuring uniform mixing. To enable precise inkjet-printed patterning, ink viscosity was optimized using a viscosity modifier, and substrate wettability was controlled via CF 4 plasma treatment to confine ink droplets within defined areas. The results confirm that ZnS-enhanced QD CCLs improve color conversion efficiency (up to 78.1%) and reduce blue leakage below 1%, leading to superior optical performance. This study highlights the synergistic role of light-scattering nanoparticles and inkjet printability in enabling scalable, high-resolution inkjet-printed QD-CCLs, offering a promising approach for next-generation display technologies.","abstract_hash":"76326716cc8a9d8ce00d3b135319c234fb4f302127395e0f28ec0b77613606e7","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用烷基功能化 ZnS 替代 TiO2 作为散射/光学管理材料，同时兼顾分散性与喷墨打印兼容性，并给出 78.1% 转换效率和 \u003c1% 蓝光漏光的具体指标。","innovation_zh":"针对量子点色转换层（CCL）中 QD 与 TiO2 等传统散射材料相容性差、导致光效和喷墨打印性受限的问题，作者合成了烷基功能化 ZnS 纳米颗粒并直接加入 QD 墨水配方，用 ZnS 替代传统散射材料来增强转换效率并抑制蓝光漏光。功能化 ZnS 在聚合物树脂中分散性更好，可均匀混合；配合黏度调节剂和 CF4 等离子体处理控制基板润湿性，实现墨滴在限定区域内精确定位。最终 ZnS 增强的 QD-CCL 转换效率最高达 78.1%，蓝光漏光降至 1% 以下。","method_zh":"合成烷基功能化 ZnS 纳米颗粒并掺入 QD 墨水，用黏度调节剂优化墨水黏度、CF4 等离子体处理调控基板润湿性，通过喷墨打印实现图案化 QD 色转换层。","keywords_zh":["量子点色转换层","ZnS 纳米颗粒","喷墨打印","蓝光漏光","表面功能化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:40.165Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.5281/zenodo.23183491","doi":"10.5281/zenodo.23183491","doi_url":"https://doi.org/10.5281/zenodo.23183491","title":"A practical guide for wide-field imaging of quantum dot blinking - Data + Code","title_zh":"量子点闪烁宽场成像实用指南——数据与代码","title_key":"apracticalguideforwidefieldimagingofquantumdotblinkingdatacode","authors":["Ella Mann-Andrews","Manal Ghanem","Daniel-Alexandru Diaconu","et al."],"venue":"Zenodo (CERN European Organization for Nuclear Research)","issn_l":null,"source_type":"repository","is_preprint":true,"alt_doi":null,"pub_date":"2026-10-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-06","oa_status":"green","pdf_url":null,"cited_by_count":0,"abstract":"This dataset contains representative raw fluorescence microscopy videos and analysis code supporting the results presented in the associated manuscript on single-quantum-dot (QD) blinking using commercially available Cd-free InP/ZnS QDs. The videos were acquired using the wide-field fluorescence microscopy setup and sample preparation procedures described in the main text. Seven RAW fluorescence recordings are provided, each containing 1000 frames acquired with a 50ms exposure, corresponding to 50s of recording. The images are 1024x1024 pixels. The RAW recordings are provided to enable independent inspection, analysis and reproduction of the single-QD blinking measurements presented in the manuscript. Two representative MP4 versions are also included for convenient visual inspection without requiring RAW image-processing software. The dataset additionally contains a Jupyter notebook implementing the image-processing and analysis workflow used to identify individual emitters, extract fluorescence trajectories and examine their blinking behaviour. The notebook is provided as an optional resource for users wishing to reproduce or adapt the analysis for the supplied videos or their own fluorescence microscopy data. Instructions and relevant parameters are included within the notebook. The relationship between the individual video files and the figures and analyses presented in the manuscript is indicated in the accompanying file documentation. In particular, video 102327 provides the data used to generate the traces presented in Figure S1 and Figure 9, while video 120714 provides the data used for the cluster traces in S2.","abstract_hash":"6de7f3465686b74eec9e1b532c65290ae4545859ac84c3f928ea52dc0f2f86b1","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":2,"novelty_reason":"属于数据与代码公开的可复现性工作，未提出新机制、新结构或刷新性能指标。","innovation_zh":"这是一份配套数据集与代码发布，而非新器件或新机制的研究论文。作者用商用无镉 InP/ZnS 量子点做单量子点闪烁的宽场荧光显微成像，公开了 7 段原始荧光视频（每段 1000 帧、50 ms 曝光、对应 50 s、1024×1024 像素）以及 2 段便于直接观看的 MP4 版本，并附一个 Jupyter notebook 实现单发射体识别、荧光轨迹提取和闪烁行为分析的完整流程。其价值在于让单量子点闪烁测量可被独立检查、复现和迁移到用户自己的数据上，属于方法/数据可复现性层面的贡献，摘要中没有给出任何新的物理结论或性能指标。","method_zh":"宽场荧光显微镜采集商用无镉 InP/ZnS 量子点的单粒子荧光视频，配套 Jupyter notebook 完成图像处理、单发射体识别、荧光轨迹提取与闪烁分析，notebook 内含操作说明与参数。","keywords_zh":["量子点闪烁","单量子点成像","InP/ZnS","宽场荧光显微","数据与代码公开"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:41.263Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1016/j.ijleo.2026.172923","doi":"10.1016/j.ijleo.2026.172923","doi_url":"https://doi.org/10.1016/j.ijleo.2026.172923","title":"Temperature-dependent admittance spectroscopy and electroluminescence analysis of a 1.3 µm InAs/GaAs quantum-dot laser heterostructure","title_zh":"1.3 µm InAs/GaAs 量子点激光器异质结的温度依赖导纳谱与电致发光分析","title_key":"temperaturedependentadmittancespectroscopyandelectroluminescenceanalysisofa13minasgaasquantumdotlaserheterostructure","authors":["Neslihan Ayarcı Kuruoğlu","Orhan Özdemi̇r","Kutsal Bozkurt"],"venue":"Optik","issn_l":"0030-4026","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-06","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["InAs/GaAs 量子点","量子点激光器","导纳谱","电致发光","1.3 µm"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:40.581Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acs.chemmater.6c02191","doi":"10.1021/acs.chemmater.6c02191","doi_url":"https://doi.org/10.1021/acs.chemmater.6c02191","title":"High-Quality Semiconductor Nanocrystals through Eutectic Processing","title_zh":"通过共晶加工制备高质量半导体纳米晶","title_key":"highqualitysemiconductornanocrystalsthrougheutecticprocessing","authors":["Divesh Nazar","Bhanuka Thennakoon","Siddhartha Kalpa Samadhi Thennakoon","et al."],"venue":"Chemistry of Materials","issn_l":"0897-4756","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-06","oa_status":"hybrid","pdf_url":"https://pubs.acs.org/cmatex/article-pdf/doi/10.1021/acs.chemmater.6c02191/68753282/acs.chemmater.6c02191.pdf","cited_by_count":0,"abstract":"Abstract The use of eutectic reactions in colloidal semiconductor nanocrystal (NC) synthesis has recently opened a route to materials with exceptional structural and optical quality. Unlike conventional hot-injection and ripening methods, eutectic-like NC-halide mixtures can promote thermodynamically driven shape evolution through transient, halide-induced recrystallization of semiconductor nanoparticles. This mechanism has proven remarkably versatile, producing a broad range of metal chalcogenide NCs, including alloys and core/shell heterostructures with reduced defect densities and improved photostability. Despite these advances, the chemical pathways governing eutectic-like reconstruction in NCs remain poorly understood, leaving the field in an early stage of development. This Perspective examines the evolving picture of NC growth through halide-induced reconstruction, highlights representative examples of shape and line width control, and discusses the emerging theoretical insights into the underlying mechanisms. We further review evolving applications of eutectic processing in NC light-emitting devices, optical gain media, photovoltaics, and scintillators. Finally, we discuss future opportunities for the field, including broader adoption of eutectic conditions as a general synthetic strategy for colloidal nanomaterials, its extension to challenging compositions such as III–V semiconductors, and eutectic processing of NC films to create epitaxially connected nanoparticle assemblies.","abstract_hash":"1e45e90a0e00afdfb96518b14e7564adb6ea1110aa4c374c6077ffb31f7749d0","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":3,"novelty_reason":"属于对已有共晶合成路线的综述与展望，本身不报道新实验数据或新纪录，但对该新兴机制的归纳和未来方向梳理有参考价值。","innovation_zh":"这是一篇 Perspective，系统梳理了共晶反应在胶体半导体纳米晶合成中的新路线：与传统热注入和熟化法不同，共晶式的纳米晶-卤化物混合物通过瞬态、卤化物诱导的再结晶实现热力学驱动的形貌演化，可制备多种金属硫族化合物纳米晶（含合金与核壳异质结构），缺陷密度更低、光稳定性更好。文章指出该重构过程的化学路径仍不清楚，并总结了形貌与线宽控制的代表性例子、理论认识以及在发光器件、光增益介质、光伏和闪烁体中的应用，最后提出将该策略推广到 III–V 半导体以及用共晶加工制备外延连接纳米颗粒薄膜等方向。","method_zh":"核心是共晶式纳米晶-卤化物混合体系中的卤化物诱导再结晶，通过瞬态重构实现热力学驱动的形貌与尺寸演化，替代传统热注入与熟化路线。","keywords_zh":["共晶加工","半导体纳米晶","卤化物诱导再结晶","核壳异质结构","胶体合成"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:42.744Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acs.nanolett.6c03669","doi":"10.1021/acs.nanolett.6c03669","doi_url":"https://doi.org/10.1021/acs.nanolett.6c03669","title":"Dynamic Sulfur Reservoir Programs Cation-Exchange Kinetics in PbS Quantum Dots for Short-Wave Infrared Imaging Chips","title_zh":"动态硫储库调控 PbS 量子点阳离子交换动力学用于短波红外成像芯片","title_key":"dynamicsulfurreservoirprogramscationexchangekineticsinpbsquantumdotsforshortwaveinfraredimagingchips","authors":["Bo‐Yi Deng","Chengjie Deng","Yuxuan Liu","et al."],"venue":"Nano Letters","issn_l":"1530-6984","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-05","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-05","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Cation-exchange synthesis produces monodisperse PbS quantum dots (QDs), yet its central limitation─precursor preparation and dropwise injection─is usually treated as a practical issue. Here, we recast it as sulfur chemical-potential programming; that is, ethyl ziram (EZ) serves as a dynamic sulfur reservoir (DSR) whose thermolysis continuously evolves sulfur activity during growth. This reservoir couples ZnS QD seeds with reservoir-fed growth, shifting the reaction from externally injected templates to an internally regulated kinetic regime, where QD size is set by the balance between seed density and EZ-derived sulfur replenishment. The DSR route yields short-wave infrared PbS QDs tunable from 1200 to 2200 nm, with narrow size distributions, high reproducibility, and reduced synthetic burden. Photodetectors show 64.7% external quantum efficiency and 5.8 × 1012 Jones detectivity, and 640 × 512 CMOS-integrated imaging chips exhibit a 0.04% bad-pixel rate and 3.78% photoresponse nonuniformity, validating DSR as a strategy for high-quality QD synthesis.","abstract_hash":"42429ac579abba3a2cf35a4f5ad099e17f980f4cfccb0f7d0a09f4b19590b419","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"提出动态硫储库这一新策略来调控阳离子交换动力学，并给出可调波段、器件效率和成像芯片均匀性的具体数据，属于明确的新方法加显著性能验证。","innovation_zh":"把阳离子交换合成中前驱体准备和逐滴注入这个老问题重新理解为「硫化学势编程」：用二乙基二硫代氨基甲酸锌（EZ）作为动态硫储库，其热分解在生长过程中持续释放硫，把反应从外部注入模板转变为内部调控的动力学区间，量子点尺寸由种子密度与 EZ 供硫的平衡决定。该方法得到 1200–2200 nm 可调、尺寸分布窄、重复性好的 PbS 量子点，并降低了合成负担；探测器外量子效率 64.7%、探测率 5.8 × 10^12 Jones，640 × 512 CMOS 集成成像芯片坏点率 0.04%、光响应非均匀性 3.78%。","method_zh":"以 EZ 作为动态硫储库，与 ZnS 量子点种子耦合，通过其热解释放硫实现「储库供料生长」，在生长过程中内部调控硫活度而非外部逐滴注入前驱体。","keywords_zh":["PbS 量子点","阳离子交换","动态硫储库","短波红外","成像芯片"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:43.455Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.37394/232017.2026.17.3","doi":"10.37394/232017.2026.17.3","doi_url":"https://doi.org/10.37394/232017.2026.17.3","title":"Porous Silicon-Integrated Germanium Quantum Dots for Advanced Radiation Detector Applications","title_zh":"多孔硅集成锗量子点用于先进辐射探测器应用","title_key":"poroussiliconintegratedgermaniumquantumdotsforadvancedradiationdetectorapplications","authors":["Natheer A. Algadri","Ahmad M. AL-Diabat","Naser Mahmoud Ahmed"],"venue":"WSEAS TRANSACTIONS ON ELECTRONICS","issn_l":"1109-9445","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-05","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-05","oa_status":"hybrid","pdf_url":"https://wseas.com/journals/electronics/2026/a065117-002(2026).pdf","cited_by_count":0,"abstract":"The porous silicon and the porous silicon doped with germanium (Ge) powder were prepared electrochemically, inspired by the mentioned parameters. The proportion of Hydrogen fluoride (HF) to ethanol was 4:1. Field emission scanning electron microscopy (FESEM) and energy dispersive X-ray spectroscopy (EDX) were used to characterize the sample structure, and it was observed that Ge is present in the sample. We studied the sample current-voltage (I-V) characteristics to observe at which bias voltage on the source the measured current is increasing. Furthermore, fully utilizing the readout capabilities, pulses of X-rays were successfully measured and compared in the investigation of different parameters of X-ray illumination on the sample detector. The porous silicon (PS) and Ge -PS parameters that yield the best results are (90V, 100mA, 1s) and (100V, 10mA, 0.5s).","abstract_hash":"7c21a40cd506a191c02e2ce18eb4613f9c98855314399a7c49eb2078e95904d4","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":2,"novelty_reason":"属于已有材料体系（多孔硅+锗）的工艺参数优化与X射线响应验证，未提出新机制或给出关键器件性能指标。","innovation_zh":"作者用电化学方法在多孔硅中掺入锗粉，制备了Ge-多孔硅复合结构，并把它用作X射线探测器。FESEM和EDX确认了Ge的存在，I-V测试确定了电流随源偏压上升的工作区间，并成功测到了X射线脉冲信号。摘要只给出了最佳制备参数（多孔硅为90V、100mA、1s；Ge-多孔硅为100V、10mA、0.5s），没有报告探测率、灵敏度等器件指标，也没有说明锗是否真正以量子点形式存在，因此创新性主要体现在材料复合与工艺参数筛选层面。","method_zh":"以HF与乙醇体积比4:1的电解液电化学刻蚀制备多孔硅，并在其中掺入锗粉形成Ge-多孔硅；用FESEM和EDX表征结构与元素组成，通过I-V特性确定偏压工作点，再在X射线照射下测量脉冲响应并比较不同照射参数。","keywords_zh":["多孔硅","锗量子点","X射线探测器","电化学刻蚀","I-V特性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:43.371Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.4038/jsc.v16i2.76","doi":"10.4038/jsc.v16i2.76","doi_url":"https://doi.org/10.4038/jsc.v16i2.76","title":"Photoluminescene and electrochemical behavior of lithium-doped quantum dots under thermal-laser-chemical stimuli","title_zh":"锂掺杂量子点在热-激光-化学刺激下的光致发光与电化学行为","title_key":"photoluminesceneandelectrochemicalbehavioroflithiumdopedquantumdotsunderthermallaserchemicalstimuli","authors":["A. Panthi","P. Devkota","M. Pandey","et al."],"venue":"Journal of Science","issn_l":"1391-586X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-05","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-05","oa_status":"diamond","pdf_url":"https://jsc.sljol.info/articles/76/files/6ac342cdb000a.pdf","cited_by_count":0,"abstract":"Carbon quantum dots (CQDs) have attracted considerable attention due to their unique optical properties, including high photoluminescence, biocompatibility, and low toxicity, making them suitable for bioimaging, sensors, and optoelectronic devices. However, the influence of lithium doping and external stimuli, such as temperature, laser irradiation, and chemical additives, on their PL and electrochemical performance remains underexplored. This study aimed to synthesize lithium-doped CQDs (Li-CQDs) using citric acid and lithium chloride, characterize their optical behavior under varying conditions, and evaluate their potential in low-cost energy storage applications. Li-CQDs were synthesized at 100–120 °C for 2–3 hours, diluted, and characterized using UV irradiation and a Theremino spectrometer. PL intensity was measured under different temperatures (30, 45, 60 °C), laser exposure durations (0, 30, 60 s), and sugar concentrations (0.5, 1.0, 1.5 mL). Results showed that temperature increase reduced PL intensity from ~25,000 a.u. at 30 °C to \u003c20,000 a.u. at 60 °C, while laser exposure caused a gradual decrease from ~12,000 a.u. to ~10,500 a.u. Sugar concentration exhibited dual effects, with 0.5 mL enhancing PL (~42,000–50,000 a.u.) and higher amounts (1.0–1.5 mL) causing quenching (~10,000–30,000 a.u.). Electrochemical testing of a DIY Li-ion cell revealed stable charging behavior (~1–5 min from 1–5 V) and nonlinear discharge (~1–25 min), with the highest duty cycle (~5:1) achieved using PEM and carbon paper separators. These findings indicate that Li-CQDs exhibit tunable PL and improve electrolyte performance, highlighting their potential for optoelectronic devices and cost-effective energy storage systems.","abstract_hash":"3eac4d8a56e0eed42bb08749eaa84c1f56e57cb33d2fe45eae1177f269e7b6fd","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":2,"novelty_reason":"主要是对锂掺杂碳量子点做多条件PL表征和DIY电池验证，属于常规优化与表征，未提出新机制或刷新性能纪录。","innovation_zh":"这篇工作用柠檬酸和氯化锂在100–120 °C、2–3小时内合成锂掺杂碳量子点（Li-CQDs），系统考察了温度、激光照射时长和糖浓度三种外场刺激对光致发光的影响：升温使PL从30 °C的约25,000 a.u.降到60 °C的不足20,000 a.u.，激光照射使其从约12,000 a.u.缓降到约10,500 a.u.，糖浓度则表现出双重效应——0.5 mL时PL增强到约42,000–50,000 a.u.，1.0–1.5 mL时反而猝灭到约10,000–30,000 a.u.。此外还用自制锂离子电池评估了电化学表现，充电在1–5 V下约1–5分钟完成，放电呈非线性（约1–25分钟），以PEM和碳纸作隔膜时获得最高约5:1的占空比。整体上属于对锂掺杂碳量子点多刺激响应行为的探索性表征，并顺带验证了其在低成本储能中的可行性，但机理层面的解释和器件性能指标都还比较初步。","method_zh":"以柠檬酸为碳源、氯化锂为锂源，在100–120 °C加热2–3小时合成Li-CQDs，稀释后用紫外照射和Theremino光谱仪测PL，并组装自制锂离子电池做充放电测试。","keywords_zh":["碳量子点","锂掺杂","光致发光","外场刺激响应","储能"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:44.424Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1016/j.optmat.2026.118561","doi":"10.1016/j.optmat.2026.118561","doi_url":"https://doi.org/10.1016/j.optmat.2026.118561","title":"Linear and nonlinear optical properties of GSH-stabilized Ag2S QDs and the effects of amino acids on their fluorescence","title_zh":"GSH 稳定的 Ag2S 量子点的线性与非线性光学性质及氨基酸对其荧光的影响","title_key":"linearandnonlinearopticalpropertiesofgshstabilizedag2sqdsandtheeffectsofaminoacidsontheirfluorescence","authors":["Jakub Tracz","Agnieszka Siomra","Magdalena Rydz","et al."],"venue":"Optical Materials","issn_l":"0925-3467","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-03","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"We demonstrate that a simple post-synthetic amino acid addition can effectively enhance and tune the emission properties of Ag 2 S/GSH quantum dots (QDs) solely through surface chemistry modification. The addition of thiol-containing amino acids (AAs) at low millimolar concentrations leads to pronounced fluorescence enhancement accompanied by narrowing of the emission band, indicating efficient surface passivation and suppression of non-radiative recombination pathways, the fluorescent quantum yield (QY) increased from 2.17% to 4.82%. In contrast, higher amino acid concentrations gradually reduce the emission intensity due to surface oversaturation and formation or modification of additional trap states within the bandgap, which affects both emission wavelength and decay dynamics. These results demonstrate that the type, concentration, and chirality of thiol-containing AAs added to the Ag 2 S QDs solution constitute an effective strategy for controlling surface defect passivation and tuning the emission properties of Ag 2 S QDs. To complement the linear optical characterization, the third-order nonlinear optical properties were investigated using the femtosecond Z-scan technique across a broad spectral range (650-1600 nm). The results demonstrated high two-photon absorption cross-section (σ 2 ) value σ 2 = 1779 ± 591 GM (Goeppert-Mayer units) at λ EXC. = 700 nm, highlighting the excellent nonlinear optical performance of the colloidal Ag 2 S/GSH QDs.","abstract_hash":"570c7987acc3f7a9d47f5861375160cbd3417e3f82baefe0568069fd4b61695d","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"用氨基酸后处理调控 Ag2S 量子点表面钝化与发光属于已有思路在新体系上的验证，QY 提升幅度有限，但宽谱段双光子吸收截面的报道有一定参考价值。","innovation_zh":"这篇工作用最简单的后合成手段——向 Ag2S/GSH 量子点溶液中加入含巯基氨基酸——来调控发光。低毫摩尔浓度下荧光显著增强、发射带变窄，量子产率从 2.17% 提升到 4.82%，说明表面钝化抑制了非辐射复合；浓度再高则因表面过饱和和额外陷阱态导致发光减弱，并改变发射波长与衰减动力学。作者还指出氨基酸的种类、浓度和手性都能用来控制表面缺陷钝化，并用飞秒 Z-scan 在 650–1600 nm 宽谱段测到 700 nm 激发下 1779 ± 591 GM 的双光子吸收截面。","method_zh":"在 Ag2S/GSH 胶体量子点中后合成添加含巯基氨基酸做表面化学修饰，用稳态/时间分辨荧光表征线性光学性质，用飞秒 Z-scan 测三阶非线性光学响应。","keywords_zh":["Ag2S 量子点","氨基酸表面钝化","荧光量子产率","双光子吸收","Z-scan"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:45.734Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acs.jpclett.6c02118","doi":"10.1021/acs.jpclett.6c02118","doi_url":"https://doi.org/10.1021/acs.jpclett.6c02118","title":"Quantum Dot One-Dimensional Arrays Using Templates: Recent Progress and Future Perspectives","title_zh":"基于模板的量子点一维阵列：近期进展与未来展望","title_key":"quantumdotonedimensionalarraysusingtemplatesrecentprogressandfutureperspectives","authors":["Mitsuaki Yamauchi","Sadahiro Masuo"],"venue":"The Journal of Physical Chemistry Letters","issn_l":"1948-7185","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-03","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Semiconductor quantum dots (QDs) represent a premier class of inorganic nanomaterials featuring tunable optical properties, including size- and composition-dependent light absorption and photoluminescence (PL). Recent research has focused on their highly ordered 2D and 3D assemblies, termed superlattices, which exhibit collective photophysical phenomena such as long-range exciton diffusion and superfluorescence. However, constructing lower-dimensional architectures, such as 1D arrays capable of directional energy transport, remains a formidable challenge. This difficulty arises because conventional QDs lack the intrinsic shape anisotropy required for anisotropic self-assembly. This Perspective highlights recent progress in fabricating 1D arrays from spherical and cubic QDs, with particular emphasis on rational scaffolding and templating strategies that enable precise structural control. Finally, we provide perspectives on the future design of nanoscale and mesoscale superstructures integrating organic and inorganic nanomaterials.","abstract_hash":"a0b3ce72d5318a906a4807b9a3a1a6d068a48809b3b7d7d532da139dcebbeced","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":2,"novelty_reason":"属于综述/展望类文章，本身不提出新机制或新器件，只是归纳模板组装一维量子点阵列的进展。","innovation_zh":"这是一篇 Perspective，不是原创研究。它聚焦的问题是：球形和立方量子点本身缺乏形状各向异性，难以像棒状颗粒那样自发取向组装，因此构建能定向传输能量的一维阵列一直是难点。文章梳理了利用支架和模板策略把球形、立方量子点组装成一维阵列的近期进展，强调这些模板路线能实现精确的结构控制，并展望了有机-无机杂化纳米/介观超结构的未来设计。","method_zh":"核心手段是模板化/支架化组装（scaffolding and templating），用外部模板约束各向同性量子点的排布，从而获得一维有序阵列，而非依赖量子点自身的形状各向异性。","keywords_zh":["量子点一维阵列","模板组装","超晶格","定向能量传输","各向异性组装"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:46.056Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1103/lfkt-wbb7","doi":"10.1103/lfkt-wbb7","doi_url":"https://doi.org/10.1103/lfkt-wbb7","title":"Driven square lattice of quantum dots in a magnetic field coupled to a cylindrical far infrared photon cavity","title_zh":"磁场中驱动方形量子点晶格与柱状远红外光子腔的耦合","title_key":"drivensquarelatticeofquantumdotsinamagneticfieldcoupledtoacylindricalfarinfraredphotoncavity","authors":["Anonymous"],"venue":"Physical review. B./Physical review. B","issn_l":"2469-9950","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-02","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-02","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","quantuminfo","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["量子点晶格","磁场","远红外光子腔","腔量子电动力学","驱动体系"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:44.675Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/jacs.6c13849","doi":"10.1021/jacs.6c13849","doi_url":"https://doi.org/10.1021/jacs.6c13849","title":"Nonthermalized Multiple Localized States Enable Efficient and Stable White-Light-Emitting Quantum Dots","title_zh":"非热化多重局域态实现高效稳定的白光量子点","title_key":"nonthermalizedmultiplelocalizedstatesenableefficientandstablewhitelightemittingquantumdots","authors":["Jiakuan Zhang","Peipei Jin","Boyi Xu","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Broadband emission from single quantum dot (QD) inherently relies on localized states that are conventionally regarded as nonradiative trap manifolds and suffer from low synthetic reproducibility. Here we show that photogenerated holes in a AgInxGa1–xS2/ZnS core/shell QD can be controllably partitioned into two parallel, kinetically isolated, and nonthermalized localized states, each of which then radiatively recombines with the delocalized electron with distinct formation and recombination kinetics. The high-energy and low-energy photoluminescence (PL) peaks are related to a small-polaron-like state in the core and a manifold of trap states near the core–shell boundary, respectively. The nonequilibrated dual-state architecture yields composition-tunable and ultrabroad emission with a PL full width at half maximum (fwhm) of 120–130 nm, near-unity quantum yield (QY), negligible Urbach tail, and robust operation under thermal and optical stress. Integrated with a blue GaN chip, a single type of QD produces efficient and stable warm-white light with a wall-plug efficiency as ∼150 lm W–1 and an electron-to-photon QY > 50%. Our results indicate localized states should be revisited as a valid paradigm for optoelectronic QD materials.","abstract_hash":"e360d43e31745cde378d1be9c67fd127d41501a1bbfc2eb1c5ff1c493ab30c8e","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":5,"novelty_reason":"提出并验证了非热化多重局域态作为量子点发光的新范式，刷新了单量子点白光发射的效率与稳定性指标。","innovation_zh":"作者在 AgInxGa1–xS2/ZnS 核壳量子点中，把光生空穴可控地分配到两个平行、动力学隔离且非热化的局域态上，分别与离域电子辐射复合，从而给出两个具有不同形成与复合动力学的发光峰。高能峰来自核内的小极化子态，低能峰来自核壳界面附近的陷阱态集合。这种非平衡双态结构带来了组分可调的超宽发射，PL 半高宽 120–130 nm、量子产率接近 100%、Urbach 尾可忽略，并在热和光应力下保持稳定；与蓝光 GaN 芯片集成后，单一量子点即可实现约 150 lm W–1 的墙插效率和大于 50% 的电子-光子量子产率。","method_zh":"采用 AgInxGa1–xS2/ZnS 核壳量子点，通过控制光生空穴在两个动力学隔离的局域态（核内小极化子态与核壳界面陷阱态）之间的分配，实现非热化双态辐射复合。","keywords_zh":["量子点","局域态","白光发射","非热化","核壳结构"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:47.186Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/jacs.6c15357","doi":"10.1021/jacs.6c15357","doi_url":"https://doi.org/10.1021/jacs.6c15357","title":"Charge-Transfer States Enhance Triplet Yield in Silicon Quantum Dot-Pyrene Hybrid Nanostructure","title_zh":"电荷转移态提升硅量子点-芘杂化纳米结构中的三重态产率","title_key":"chargetransferstatesenhancetripletyieldinsiliconquantumdotpyrenehybridnanostructure","authors":["Maryam Baraazandeh","Mandefro Y. Teferi","Alex Berzansky","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Photon upconversion based on triplet–triplet annihilation can utilize incoherent sub-bandgap photons for energy conversion and photocatalysis. Though quantum dots (QDs), with their tunable bandgaps, make attractive triplet photosensitizers, energy transfer must compete with other exciton-depleting pathways that stem from various trap states. Here, we show that strong electronic coupling can be introduced through conjugated bridges between Si QDs and surface-bound pyrene acceptors by creating a transient hole-transfer intermediate from Si to attached pyrenes, which enhances triplet energy transfer. The hybrid achieved an upconversion quantum yield of 10.8% (with a theoretical maximum of 50%) with DPA as the emitter, which is the highest reported for Si QD-based upconversion. By using a combination of cyclic voltammetry, time-resolved electron paramagnetic resonance, and transient absorption spectroscopies, we show that the alkyne and vinyl bridges hybridize QD and molecular states, facilitating hole-then-electron transfer that competes effectively with exciton quenching. Specifically, the alkyne-linked Si QD: AP hybrid exhibits hole transfer with a time constant of 1.7 ns and an efficiency of 27%, highlighting linker conjugation as an effective strategy for overcoming unfavorable kinetics and energetics.","abstract_hash":"2e0506cb727c41b5dc661af933a066d896c7bdb62349daac20146070f74d867b","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","detection"],"novelty_score":4,"novelty_reason":"用共轭连接基调控量子点-分子电子耦合、以空穴转移中间体提升三重态产率，并在硅量子点上转换体系刷新了量子产率纪录。","innovation_zh":"在硅量子点与表面芘受体之间引入炔基和乙烯基共轭桥，通过形成瞬态空穴转移中间体来增强三重态能量转移，从而提升三重态-三重态湮灭上转换效率。以DPA为发光体时上转换量子产率达到10.8%（理论上限50%），是硅量子点体系已报道的最高值。其中炔基连接的Si QD:AP杂化物空穴转移时间常数为1.7 ns、效率27%，说明连接基共轭是克服不利动力学与能级匹配问题的有效策略。","method_zh":"通过共轭桥（炔基、乙烯基）将芘受体共价连接到硅量子点表面，构建杂化纳米结构；结合循环伏安、时间分辨电子顺磁共振和瞬态吸收光谱表征电荷转移与三重态能量转移过程。","keywords_zh":["硅量子点","三重态-三重态湮灭上转换","空穴转移","共轭桥","电荷转移态"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:47.455Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1016/j.jallcom.2026.191578","doi":"10.1016/j.jallcom.2026.191578","doi_url":"https://doi.org/10.1016/j.jallcom.2026.191578","title":"Sequential surface engineering of colloidal silver telluride quantum dots for enhanced near-infrared photodetection","title_zh":"用于增强近红外光电探测的胶体碲化银量子点序贯表面工程","title_key":"sequentialsurfaceengineeringofcolloidalsilvertelluridequantumdotsforenhancednearinfraredphotodetection","authors":["Parmod Kumar","Santanu Pradhan"],"venue":"Journal of Alloys and Compounds","issn_l":"0925-8388","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确定具体方法与器件结构。","keywords_zh":["碲化银量子点","近红外光电探测","表面工程","胶体量子点"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:46.969Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1016/j.xcrp.2026.103569","doi":"10.1016/j.xcrp.2026.103569","doi_url":"https://doi.org/10.1016/j.xcrp.2026.103569","title":"Emergence of colloidal nanocrystal near-infrared light-emitting diodes","title_zh":"胶体纳米晶近红外发光二极管的兴起","title_key":"emergenceofcolloidalnanocrystalnearinfraredlightemittingdiodes","authors":["阮玉静","Yi Min Dai","Haiyang Li","et al."],"venue":"Cell Reports Physical Science","issn_l":"2666-3864","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-01","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Summary: Near-infrared light-emitting diodes (NIR-LEDs) have drawn great attention because of their broad applicability, including bioimaging, optical signal transmission, sensing, and night vision. Unlike traditional III–V semiconductors, colloidal nanocrystals (NCs) are now viewed as strong contenders for advanced NIR-LEDs by virtue of their solution processability, widely tunable emission spectra, and outstanding photophysical properties. This review surveys recent advances in NIR-LEDs from three representative colloidal nanocrystal systems: quantum dots, perovskite NCs, and colloidal quantum wells. It begins by introducing the device mechanisms of NIR-LEDs. Subsequently, the performance enhancement strategies are discussed from two perspectives: emissive layer optimization and device engineering. Emissive layer improvements focus on heterostructure design, composition control, and doping strategies. At the device level, advances in carrier-transport-layer engineering and interfacial modification are reviewed. Finally, the key challenges facing the field are outlined, and future research avenues are presented for rational design and practical application of high-performance NC-based NIR-LEDs.","abstract_hash":"9abd523d458ccfe692ec3eb611a6655ede6e244a5e7e2443b5988353c0da8087","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":2,"novelty_reason":"属于领域综述，整合已有进展并梳理策略，没有提出新机制或新器件。","innovation_zh":"这是一篇综述，不是原创研究，所以没有单一的新器件或新纪录。它的价值在于把近红外胶体纳米晶 LED 的三个代表性体系——量子点、钙钛矿纳米晶和胶体量子阱——放在一起梳理，并给出两条性能提升主线：发光层优化（异质结构设计、组分调控、掺杂策略）和器件工程（载流子传输层工程、界面修饰）。最后总结了该领域的关键挑战和未来方向。","method_zh":"综述性文章，先介绍 NIR-LED 的器件机理，再从发光层和器件两个层面归纳性能提升策略，覆盖量子点、钙钛矿纳米晶、胶体量子阱三类体系。","keywords_zh":["近红外LED","胶体纳米晶","量子点","钙钛矿纳米晶","胶体量子阱"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:48.339Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1016/j.cej.2026.182899","doi":"10.1016/j.cej.2026.182899","doi_url":"https://doi.org/10.1016/j.cej.2026.182899","title":"In situ molecular derivatization enables full-color afterglow carbon nitride quantum dots extending into the near-infrared","title_zh":"原位分子衍生化实现全色余辉氮化碳量子点并延伸至近红外","title_key":"insitumolecularderivatizationenablesfullcolorafterglowcarbonnitridequantumdotsextendingintothenearinfrared","authors":["Yuxiang Jiao","Xin Chen","Huaiqian Wang","et al."],"venue":"Chemical Engineering Journal","issn_l":"1385-8947","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","display","materials"],"novelty_score":1,"novelty_reason":"数据库未收录摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断关键方法或器件结构。","keywords_zh":["氮化碳量子点","余辉","原位分子衍生化","全色发光","近红外"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:48.390Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1016/j.mtcomm.2026.116331","doi":"10.1016/j.mtcomm.2026.116331","doi_url":"https://doi.org/10.1016/j.mtcomm.2026.116331","title":"Silver-Based Quantum Dots for Near-Infrared Tumor Imaging and Targeted Delivery","title_zh":"银基量子点用于近红外肿瘤成像与靶向递送","title_key":"silverbasedquantumdotsfornearinfraredtumorimagingandtargeteddelivery","authors":["Wesam R. Kadhum","Rosull Saadoon Abbood","Pareshkumar N. Patel","et al."],"venue":"Materials Today Communications","issn_l":"2352-4928","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-01","oa_status":"hybrid","pdf_url":"https://www.sciencedirect.com/science/article/pii/S2352492826017204/pdf","cited_by_count":0,"abstract":"Silver-based quantum dots (QDs) are emerging as NIR-active nanoplatforms with potential relevance to tumor imaging and targeted delivery, yet their biomedical value depends on more than long-wavelength emission. Unlike existing reviews centered mainly on infrared photodetectors, synthesis chemistry, green preparation, or general bioimaging, this review focuses on the mechanistic connection between silver-based QD architecture and tumor-oriented optical–delivery performance. The discussion distinguishes metallic Ag nanodots from silver chalcogenide systems, particularly silver chalcogenide QDs and examines how core composition, quantum confinement, defect states, ligand shells, passivation chemistry, and colloidal stability govern optical identity and biological compatibility. A design framework is then developed for NIR tumor imaging and targeted delivery, emphasizing spectral reliability, tumor transport barriers, ligand-guided recognition, cargo association, and image-guided release. Evidence from biomedical silver QD platforms is critically analyzed to clarify where the field is strongest and where it remains fragmented. Current data support NIR imaging, surface-mediated biological targeting, and delivery-oriented functionality as partially connected capabilities; however, fully integrated platforms combining tumor-selective accumulation, controlled release, therapeutic response, and long-term safety remain insufficiently established. Future progress requires system-level validation rather than isolated optimization of brightness, targeting, or cargo loading.","abstract_hash":"b5bdf74aec1c7f8023ea1e004c79023b1c1e14cd3eed1f5aa63d905d27e2d880","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":2,"novelty_reason":"属于综述，提出了一个结构—性能关联的设计框架并指出领域碎片化问题，但无新实验数据或新器件，创新性主要体现在视角整合而非结果。","innovation_zh":"这是一篇综述，不是原创实验工作。它的新意在于把讨论焦点从以往综述常谈的红外光电探测、合成化学、绿色制备或泛泛的生物成像，转到「银基量子点结构—肿瘤光学/递送性能」之间的机制联系上。文章区分了金属 Ag 纳米点与银硫族化合物量子点，梳理核组成、量子限域、缺陷态、配体壳层、钝化化学和胶体稳定性如何共同决定光学特征与生物相容性，并据此提出一个面向 NIR 肿瘤成像与靶向递送的设计框架（光谱可靠性、肿瘤输运屏障、配体识别、载货结合、影像引导释放）。作者同时指出，目前数据只支持 NIR 成像、表面介导靶向和递送功能是「部分连通」的能力，真正把肿瘤选择性富集、可控释放、治疗响应和长期安全性整合到一起的平台尚未建立。","method_zh":"综述性工作，无新实验。核心方法是按银基量子点的结构层次（核组成、限域、缺陷态、配体/钝化、胶体稳定性）分类讨论，并对照肿瘤递送中的实际屏障（光谱可靠性、肿瘤输运、配体识别、载货与释放）建立设计框架，对已有生物医学银量子点平台证据做批判性分析。","keywords_zh":["银基量子点","近红外成像","靶向递送","银硫族化合物","配体钝化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:50.767Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1016/j.cej.2026.182979","doi":"10.1016/j.cej.2026.182979","doi_url":"https://doi.org/10.1016/j.cej.2026.182979","title":"Strain-promoted double-click cross-linking enables robust charge transport networks for high-performance quantum dot light-emitting diodes","title_zh":"应变促进的双点击交联构建稳固电荷传输网络，实现高性能量子点发光二极管","title_key":"strainpromoteddoubleclickcrosslinkingenablesrobustchargetransportnetworksforhighperformancequantumdotlightemittingdiodes","authors":["Youngjun Hwang","Jaehyeon Kim","Christian Abeilekpor","et al."],"venue":"Chemical Engineering Journal","issn_l":"1385-8947","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-10-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-10-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"无摘要信息，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["量子点发光二极管","交联","电荷传输","应变促进","QLED"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:48.818Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acs.jpclett.6c02515","doi":"10.1021/acs.jpclett.6c02515","doi_url":"https://doi.org/10.1021/acs.jpclett.6c02515","title":"Decoupling Electron and Hole Injection Dynamics in Colloidal Nanocrystals via Potentiostatic Polarization Spectroelectrochemistry","title_zh":"用电位恒定极化光谱电化学解耦胶体纳米晶中的电子与空穴注入动力学","title_key":"decouplingelectronandholeinjectiondynamicsincolloidalnanocrystalsviapotentiostaticpolarizationspectroelectrochemistry","authors":["Junkai Wang","Huichao Zhang","Bo Huang","et al."],"venue":"The Journal of Physical Chemistry Letters","issn_l":"1948-7185","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-30","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-30","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract The outstanding optoelectronic potential of colloidal nanocrystals has driven intensive study of their charge carrier behavior. However, conventional spectroelectrochemistry (SEC) may yield results that deviate from practical device operation because it typically relies on gradual potential scans. Here, we investigate mixed-phase and pure wurtzite CdSe/CdS core/shell nanocrystals using potentiostatic polarization SEC. Mixed-phase nanocrystals exhibit spectral recovery under both biases, originating from self-elimination of excess electrons (negative bias) and photo-assisted elimination of trap states, whose rapid charging/discharging induces local electric field fluctuations that cause asymmetric spectral broadening (positive bias). In contrast, pure wurtzite nanocrystals allow additional hole injection, causing a reversible spectral blueshift. Under negative bias, they exhibit slow photoluminescence quenching and redshift from gradual electron injection. These differences stem from the lack of conduction band intermediate levels and a valence band barrier due to zinc blende stacking faults, suggesting microstructural engineering may enable balanced carrier injection.","abstract_hash":"cb285687424ec66e87a9e3a5781ada0648e23b9750aeeeb528a48e4ff5612fb0","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"方法学上用电位恒定 SEC 替代扫描式 SEC 并据此区分电子/空穴注入通道，属于对已有体系的渐进式改进与机理澄清，未报道新器件或性能纪录。","innovation_zh":"作者用恒电位极化光谱电化学（potentiostatic polarization SEC）替代传统的线性扫描 SEC，来研究 CdSe/CdS 核壳纳米晶的载流子注入行为，理由是传统扫描方式得到的结果可能偏离实际器件工作条件。在混合相（含锌闪锌矿层错）纳米晶中，正负偏压都能观察到光谱恢复：负偏压来自多余电子的自消除，正偏压来自光辅助的陷阱态消除，其快速充放电引起局域电场涨落并导致不对称谱线展宽；而在纯纤锌矿纳米晶中则出现额外的空穴注入，表现为可逆的谱蓝移，负偏压下则是缓慢的荧光淬灭与红移（逐步电子注入）。作者把这种差异归因于层错导致的导带中间能级缺失和价带势垒，提出微结构工程可能用于实现电子与空穴的平衡注入。","method_zh":"采用恒电位极化（而非电位扫描）的光谱电化学方法，对比混合相与纯纤锌矿 CdSe/CdS 核壳纳米晶在不同偏压下的吸收/荧光光谱响应。","keywords_zh":["光谱电化学","CdSe/CdS 核壳纳米晶","载流子注入","层错","纤锌矿"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:51.685Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1007/s11814-026-00820-1","doi":"10.1007/s11814-026-00820-1","doi_url":"https://doi.org/10.1007/s11814-026-00820-1","title":"Facet-Specific Ligand Engineering in PbS Quantum Dots for Infrared Optoelectronics","title_zh":"面向红外光电子学的 PbS 量子点晶面特异性配体工程","title_key":"facetspecificligandengineeringinpbsquantumdotsforinfraredoptoelectronics","authors":["Sungmin Ka","Hyung Ryul You","Jongmin Choi"],"venue":"Korean Journal of Chemical Engineering","issn_l":"0256-1115","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-30","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-30","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"仅有标题，无摘要信息，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["PbS 量子点","配体工程","晶面调控","红外光电子","表面化学"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:49.805Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.35517/jsh-aaup.v1.02.09","doi":"10.35517/jsh-aaup.v1.02.09","doi_url":"https://doi.org/10.35517/jsh-aaup.v1.02.09","title":"Mutual synchronization between quantum-dot passively mode-locked laser frequency combs: Theoretical approach","title_zh":"量子点被动锁模激光器频率梳之间的相互同步：理论方法","title_key":"mutualsynchronizationbetweenquantumdotpassivelymodelockedlaserfrequencycombstheoreticalapproach","authors":["Muayad Abusaa"],"venue":"AAUP Journal of STEM and Health Sciences","issn_l":"3135-0593","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-30","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-30","oa_status":"hybrid","pdf_url":"https://jsh-aaup.aaup.edu/index.php/jsh-aaup/article/download/103/52","cited_by_count":0,"abstract":"A comprehensive theoretical framework is established for describing repetition-rate synchronization and partial optical coherence in two bidirectionally coupled quantum-dot passively mode-locked lasers (QD-PMLLs). Each laser is modeled as a two-section monolithic device composed of a forward-biased gain section and a reverse-biased saturable absorber. The coupled delay-rate equations incorporate the slowly varying complex optical fields, modal gain dynamics, absorber loss, photon decay, linewidth-enhancement factors, delayed optical coupling, coupling phase, and spontaneous-emission noise. In the weak mutual-injection limit, the full model is systematically reduced to an effective timing-phase description, yielding the locking relation , and hence the locking condition . Representative simulations establish that two initially detuned 10 GHz pulse trains are pulled into a single shared repetition frequency, with the locked frequency showing pronounced and controllable delay-dependent tunability. The synchronized state exhibits a marked reduction in root-mean-square timing jitter, whereas finite mutual optical coherence appears only when the optical carrier mismatch simultaneously lies within the coherent injection-locking bandwidth. Agreement with recent synchronization experiments on InAs/InGaAs QD-PMLL combs demonstrates that the model not only reproduces the central experimental trends but also clarifies the underlying hierarchy: repetition-rate locking is robust and readily achieved, delay tuning provides an effective control parameter, timing noise is strongly suppressed in the locked regime, and optical phase coherence is an additional conditional constraint rather than an automatic consequence of rate synchronization.","abstract_hash":"aa50637abbc09d449ed5affa708d949dd49eaf172c84a54f7b74c6b261494bd4","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"首次为双向耦合 QD-PMLL 建立统一理论框架，厘清了重复频率锁定与光学相干之间的层级关系，并与 InAs/InGaAs 器件实验趋势吻合。","innovation_zh":"针对两个双向耦合的量子点被动锁模激光器（QD-PMLL），建立了一套完整的理论框架来描述重复频率同步和部分光学相干性。作者从包含慢变复光场、模式增益、吸收体损耗、光子衰减、线宽增强因子、延迟光耦合、耦合相位和自发辐射噪声的耦合延迟速率方程出发，在弱互注入极限下将模型约简为有效的定时相位描述，给出了锁定关系与锁定条件。模拟显示两个初始失谐的 10 GHz 脉冲序列可被牵引到单一共享重复频率，锁定频率具有明显的延迟依赖可调性，同步态下均方根定时抖动显著降低，而有限互光学相干仅在光载波失配同时落在相干注入锁定带宽内时才出现。","method_zh":"将每个激光器建模为正向偏置增益区加反向偏置可饱和吸收区的两段式单片器件，建立含延迟光耦合与自发辐射噪声的耦合延迟速率方程，并在弱互注入极限下约简为定时相位模型。","keywords_zh":["量子点被动锁模激光器","频率梳同步","重复频率锁定","定时抖动","注入锁定"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:55.897Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acsaelm.6c01215","doi":"10.1021/acsaelm.6c01215","doi_url":"https://doi.org/10.1021/acsaelm.6c01215","title":"Enhanced AgBiS2 Colloidal Quantum Dot Infrared Photodetector by Modifying
