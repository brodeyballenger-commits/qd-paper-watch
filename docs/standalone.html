-8850","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["AgInS2 量子点","MOF-5","白光 LED","荧光性能","热稳定性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:51.391Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adma.74849","doi":"10.1002/adma.74849","doi_url":"https://doi.org/10.1002/adma.74849","title":"Unconventional Biexciton Dynamics in Superradiant Perovskite Quantum Dots Driven by Many‐Body Correlations","title_zh":"多体关联驱动的超辐射钙钛矿量子点中非常规双激子动力学","title_key":"unconventionalbiexcitondynamicsinsuperradiantperovskitequantumdotsdrivenbymanybodycorrelations","authors":["Chenglian Zhu","J. L. Movilla","Petra Hoffmann","et al."],"venue":"Advanced Materials","issn_l":"0935-9648","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-31","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-31","oa_status":"hybrid","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/adma.74849","cited_by_count":0,"abstract":"ABSTRACT Excitons and biexcitons emission traits, for example, quantum yield, lifetime, and coherence, govern device performance metrics including brightness, optical gain thresholds, and the efficiency of single‐ and entangled‐photon generation. Biexcitons are conventionally understood to radiatively decay more rapidly than excitons. This view stems largely from studies in strongly confined quantum dots (QDs), where inter‐exciton correlations are often neglected. In contrast, weakly confined systems such as large CsPbBr 3 QDs exhibit significant Coulomb correlations, necessitating a revised framework for biexciton radiative dynamics, one that has remained incomplete due to limited experimental insights. Here, we combine single‐particle photoluminescence (PL) spectroscopy with effective‐mass variational quantum Monte Carlo (VQMC) simulations to directly probe the biexciton geometry, exciton–phonon interactions, and radiative decay in CsPbBr 3 QDs across a range of sizes and temperatures. We reveal that the biexciton‐to‐exciton radiative decay lifetime ratio is strongly modulated by inter‐exciton correlations, with a striking inversion of the expected decay lifetime hierarchy in the weak‐confinement regime. Specifically, at cryogenic temperatures, biexcitons exhibit anomalously longer radiative lifetime (148 ± 30 ps) than excitons (106 ± 16 ps), challenging conventional models. These findings uncover a correlation‐driven regime of multiexciton physics and suggest new routes for tailoring light–matter interactions for classical and quantum photonic applications.","abstract_hash":"24eacf88551011de3b834a79e29c9d1c4a68c51fed68f3c9a7cbcbcfe1c1326b","abstract_source":"openalex","abstract_missing":false,"directions":["display","quantuminfo","materials"],"novelty_score":5,"novelty_reason":"在弱限域钙钛矿量子点中实验观测到双激子/激子辐射寿命层级的反转，并给出多体关联驱动的解释，属于对既有双激子衰减图像的实质性修正。","innovation_zh":"在弱限域的大尺寸 CsPbBr3 量子点中，双激子与激子的辐射寿命层级被反转：低温下双激子寿命反而更长（148 ± 30 ps），而激子为 106 ± 16 ps，这与强限域体系中「双激子衰减更快」的传统认识相反。作者把这一反常归因于激子间库仑关联的显著调制，指出以往忽略 inter-exciton correlation 的框架在弱限域下不再适用，并给出了一个关联主导的多激子物理图像。","method_zh":"结合单颗粒光致发光（PL）光谱与有效质量变分量子蒙特卡洛（VQMC）模拟，在不同尺寸和温度下直接探测 CsPbBr3 量子点的双激子几何构型、激子–声子相互作用与辐射衰减。","keywords_zh":["双激子","CsPbBr3 量子点","多体关联","辐射寿命","弱限域"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:53.109Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adfm.78068","doi":"10.1002/adfm.78068","doi_url":"https://doi.org/10.1002/adfm.78068","title":"Colloidal Quantum Dots‐Based Bioinspired Reconfigurable Photoelectrochemical Device for Broadband Underwater Imaging and Photosynaptic Memory","title_zh":"基于胶体量子点的仿生可重构光电化学器件用于宽带水下成像与光突触记忆","title_key":"colloidalquantumdotsbasedbioinspiredreconfigurablephotoelectrochemicaldeviceforbroadbandunderwaterimagingandphotosynapticmemory","authors":["Liuliu Wang","Yisen Yao","Xin Li","et al."],"venue":"Advanced Functional Materials","issn_l":"1616-301X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-31","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-31","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Underwater artificial visual systems that couple visual perception with memory capabilities are of great significance for intelligent marine environmental monitoring, autonomous underwater robotics, and deep‐sea resource exploration, thereby requiring intelligent optoelectronic devices with broadband spectral adaptability and multifunctional photodetection (PD)/photosynaptic (PS) functionalities. Here, inspired by the spectral adaptation and homing memory of Pacific salmon, we report a reconfigurable photoelectrochemical (PEC) device based on near‐infrared (NIR) CuInSeS/ZnSe (CISeS/ZnSe) quantum dots (QDs), in which the Ag incorporation enables spectral adaptation through redshifted absorption while weakening non‐adiabatic coupling (NAC) of QDs to suppress non‐radiative recombination. As a result, the fabricated QDs‐based PEC devices deliver a maximum responsivity of 1.47 A W −1 and a specific detectivity of 6.47 × 10 11 Jones in PD mode, exhibiting broadband photoresponse up to 980 nm and enabling multi‐wavelength underwater optical imaging (UOI). In PS mode, the device further demonstrates biomimetic paired‐pulse facilitation (PPF), short‐term plasticity (STP) to long‐term plasticity (LTP) transition, and learning‐forgetting‐relearning behaviors. By unifying broadband underwater perception and neuromorphic memory within a single device, this work provides a promising bioinspired strategy for next‐generation underwater artificial visual systems and intelligent optoelectronic technologies.","abstract_hash":"fccd39690876a9f2050d4d016d2773224083045b8ec2767131273d47e724a5a8","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials","display"],"novelty_score":4,"novelty_reason":"在单一 PEC 器件中统一宽带水下成像与光突触记忆功能，并用 Ag 掺杂同时实现光谱红移和抑制非绝热耦合，属于明确的新结构/新策略且给出具体性能指标。","innovation_zh":"把宽带水下光电探测和光突触记忆集成到同一个光电化学（PEC）器件里，灵感来自太平洋鲑鱼的光谱适应与归巢记忆。材料上用 NIR CuInSeS/ZnSe 量子点，通过掺 Ag 让吸收红移实现光谱适配，同时削弱量子点的非绝热耦合（NAC）以抑制非辐射复合。器件在 PD 模式下响应度最高 1.47 A/W、比探测率 6.47×10^11 Jones，光响应延伸到 980 nm，可做多波长水下光学成像；在 PS 模式下实现了成对脉冲易化（PPF）、STP 到 LTP 的转变以及学习-遗忘-再学习行为。","method_zh":"以 NIR CuInSeS/ZnSe 胶体量子点为光活性层构建可重构光电化学器件，通过 Ag 掺杂调控吸收光谱并抑制非辐射复合，使同一器件可在光电探测（PD）与光突触（PS）两种模式间切换。","keywords_zh":["胶体量子点","光电化学器件","水下成像","光突触","Ag 掺杂"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:54.178Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.jpcs.2026.114102","doi":"10.1016/j.jpcs.2026.114102","doi_url":"https://doi.org/10.1016/j.jpcs.2026.114102","title":"Decoupling energy level saturation from trap passivation in PbI2-treated PbS quantum dot solar cells","title_zh":"PbI2 处理 PbS 量子点太阳能电池中能级饱和与陷阱钝化的解耦","title_key":"decouplingenergylevelsaturationfromtrappassivationinpbi2treatedpbsquantumdotsolarcells","authors":["Jinseok Youn","Jaehyeok Yang","Dongguen Shin","et al."],"venue":"Journal of Physics and Chemistry of Solids","issn_l":"0022-3697","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-31","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-31","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"无摘要，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确定具体方法与器件结构。","keywords_zh":["PbS 量子点","太阳能电池","PbI2 处理","陷阱钝化","能级饱和"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:53.243Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/ma19173719","doi":"10.3390/ma19173719","doi_url":"https://doi.org/10.3390/ma19173719","title":"Single-Pixel Shortwave Infrared Imaging Based on PbS Quantum Dots","title_zh":"基于 PbS 量子点的单像素短波红外成像","title_key":"singlepixelshortwaveinfraredimagingbasedonpbsquantumdots","authors":["Jingbo Li","Guopeng Li","Jiawei Wei","et al."],"venue":"Materials","issn_l":"1996-1944","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-31","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-31","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Shortwave infrared (SWIR) imaging technology, with its excellent penetration and anti-interference capabilities, is widely applied in military, medical, and industrial fields. However, traditional detectors (e.g., InGaAs) are expensive, have complex readout circuits, and exhibit insufficient low-light performance, limiting their large-scale promotion. This paper proposes and implements a single-pixel SWIR imaging system based on PbS quantum dot (QD) detectors. A single-pixel imaging system is constructed using PbS QD detectors with a formal device structure (ITO/ZnO/PbS/PbS-EDT/Au); through simulation studies, the effect of the PbS absorption layer thickness on device performance is investigated, and it is determined that a thickness of 450 nm yields optimal device performance. Based on the simulation results, a P-I-N structure PbS photovoltaic-type detector with high external quantum efficiency (EQE) and low dark current is fabricated, achieving a EQE of 62% at the 1300 nm wavelength, a dark current density of 8.54 × 10−4 mA·cm−2 at −0.1 V bias voltage, and a −3 dB bandwidth of 324 kHz; a low-noise signal conditioning circuit is designed to optimize the −3 dB bandwidth to 337 kHz while maintaining low noise density, enabling the linear conversion of nA~μA level weak photocurrent from the detector to 0~3 V standardized voltage signals, meeting the requirements of single-pixel imaging (SPI) systems. Hadamard orthogonal encoding technology is employed to achieve spatial light modulation and signal encoding; after the PbS QD detector collects and integrates the projection signal, the image with 128 × 128 resolution is reconstructed through the inverse Hadamard orthogonal decoding algorithm. This work provides a novel solution for QD-based SWIR imaging, overcoming the cost and manufacturing limitations of traditional array systems and laying the foundation for the spectral expansion and practical application of SPI technology. Quantitative imaging characterization and low-light imaging tests are supplemented to verify the comprehensive performance of the system.","abstract_hash":"6ffc50c40b8e66a411a71310e0df0d50d1fddd100683680101cece59f9bae281","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display"],"novelty_score":4,"novelty_reason":"把 PbS 量子点探测器与 Hadamard 编码单像素成像结合，给出了明确的器件结构、仿真优化厚度和具体性能指标，属于新结构/新策略并带来可验证性能提升，但单像素成像与 PbS 探测器本身均为已有技术。","innovation_zh":"针对 InGaAs 等传统 SWIR 探测器成本高、读出电路复杂、弱光性能不足的问题，作者用 PbS 量子点探测器搭了一套单像素成像（SPI）系统，绕开了阵列式焦平面工艺。器件采用 ITO/ZnO/PbS/PbS-EDT/Au 的 P-I-N 光伏结构，先通过仿真确定 PbS 吸收层最优厚度为 450 nm，实测在 1300 nm 处 EQE 达 62%，−0.1 V 下暗电流密度 8.54×10⁻⁴ mA·cm⁻²，−3 dB 带宽 324 kHz；配上低噪声信号调理电路后带宽优化到 337 kHz，可把 nA~μA 级弱光电流线性转成 0~3 V 标准电压。成像端用 Hadamard 正交编码做空间光调制与信号编码，经逆 Hadamard 解码重建出 128×128 分辨率图像，并补充了定量成像表征和弱光成像测试。","method_zh":"以 PbS 量子点 P-I-N 光伏型探测器为单像素敏感单元，配合低噪声跨阻/信号调理电路，结合 Hadamard 正交编码的空间光调制与逆 Hadamard 解码算法完成图像重建。","keywords_zh":["PbS 量子点","短波红外","单像素成像","Hadamard 编码","光电探测器"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:55.328Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsnano.6c11137","doi":"10.1021/acsnano.6c11137","doi_url":"https://doi.org/10.1021/acsnano.6c11137","title":"On-Demand Charged States in Quantum Dot–ZnO Nanoparticle Assemblies toward Sub-Excitonic Optical Gain","title_zh":"量子点–ZnO 纳米颗粒组装体中的按需带电态：通向亚激子光学增益","title_key":"ondemandchargedstatesinquantumdotznonanoparticleassembliestowardsubexcitonicopticalgain","authors":["Hyeonjun Lee","Amira Gharbi","Benjamin Shu","et al."],"venue":"ACS Nano","issn_l":"1936-0851","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-31","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-31","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Achieving optical gain in colloidal quantum dots (QDs) requires band-edge state filling beyond optical transparency, typically requiring multiexciton populations that are nevertheless rapidly depleted by Auger recombination. Electron charging offers a route to reduce this threshold by prefilling the lowest electron states of QDs; however, conventional photochemical charging approaches are not readily applicable to solid-state gain media because they rely on solution-phase redox chemistry. Here, we demonstrate that ZnO–QD mixed nanoparticle assemblies enable tunable electron charging and reduce the optical gain threshold. We study these assemblies in solutions and in the solid state, demonstrating a three-order-of-magnitude increase in charging efficiency in ZnO–QD films. This discrepancy originates from proximity-dependent electron transfer between ZnO nanoparticles and QDs, which we capture using a unified charging model that combines particle ratio and spatial proximity. The resulting proximity-controlled charging enables subexcitonic optical gain and amplified spontaneous emission in ZnO–QD assemblies, offering a route toward low-threshold QD gain media.","abstract_hash":"e1c19805cf2646dcad543db2569206791768301e86e0505d84e89637dab89596","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用 ZnO–QD 组装体把光化学充电思路搬到固态，充电效率提升三个数量级并实现亚激子增益，属于明确的新策略加显著性能提升。","innovation_zh":"传统胶体量子点要实现光学增益，需要填充带边态至超过光学透明点，通常依赖多激子，而多激子会被俄歇复合快速耗竭。光化学充电虽能通过预填充最低电子态降低阈值，但依赖溶液相氧化还原化学，难以用于固态增益介质。作者用 ZnO–QD 混合纳米颗粒组装体实现可调电子充电，在 ZnO–QD 薄膜中充电效率相比溶液提升三个数量级，并据此实现亚激子光学增益与放大自发辐射。","method_zh":"将 ZnO 纳米颗粒与量子点共组装成混合薄膜，利用 ZnO 与 QD 之间近邻依赖的电子转移进行充电；用结合颗粒比例与空间近邻的统一充电模型解释溶液与固态之间的效率差异。","keywords_zh":["量子点","ZnO 纳米颗粒","电子充电","光学增益","放大自发辐射"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:55.758Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsenergylett.6c02017","doi":"10.1021/acsenergylett.6c02017","doi_url":"https://doi.org/10.1021/acsenergylett.6c02017","title":"Localization and Multi-Exciton Dynamics in Superionic Canfieldite Ag8SnS6@Zn Nanocrystals","title_zh":"超离子导体 canfieldite Ag8SnS6@Zn 纳米晶中的局域化与多激子动力学","title_key":"localizationandmultiexcitondynamicsinsuperioniccanfielditeag8sns6znnanocrystals","authors":["Yanwei Ji","Francisco Yarur Villanueva","Cara E. Bradsher","et al."],"venue":"ACS Energy Letters","issn_l":"2380-8195","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-31","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-31","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract An exciting new member of the ternary Ag-based nanocrystal (NC) family is found in canfieldite Ag8SnS6@Zn (ATS@Zn) NCs, which offer a prospect for size-tunable optical properties in the red to near-infrared spectrum. Despite their promise, a lot of questions on the nature of their light–matter interactions, and related (multi-) exciton photophysics, remain unexplored. Furthermore, as to how the superionic character found in bulk ATS plays a role in NCs is unclear. Herein, we have systematically investigated the size-dependent single- and multi-exciton dynamics in superionic canfieldite ATS@Zn NCs, across widely different time and energy scales. Our results show that, whereas ATS@Zn NCs are strong light absorbers, a fast sub-picosecond hole localization quickly diminishes the oscillator strengths for radiative recombination. Multi-exciton states can be identified with fast non-radiative recombination pathways in line with Auger recombination. Overall, our results show that ATS@Zn NCs offer an interesting set of light–matter interactions for applications in light harvesting, priming in particular further research into the nature of the localization mechanisms at play.","abstract_hash":"905e891f4ce00b6fa95cc77f0ba461f0311578ec2697fb100bad1d94c07c5dd7","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"首次在超离子 canfieldite 纳米晶体系中系统揭示空穴局域化与多激子俄歇动力学，属于新体系上的新物理认识。","innovation_zh":"系统研究了超离子导体 canfieldite Ag8SnS6@Zn（ATS@Zn）纳米晶的尺寸依赖单激子和多激子动力学，覆盖了宽时间与能量尺度。发现该材料虽是强光吸收体，但亚皮秒量级的空穴局域化会迅速削弱辐射复合的振子强度；多激子态则伴随与俄歇复合一致的快速非辐射复合通道。这是首次将体相 ATS 的超离子特性与纳米晶光物理联系起来的工作，但摘要未给出具体时间常数或量子产率数值。","method_zh":"对尺寸可调的 ATS@Zn 纳米晶进行宽时间/能量尺度的瞬态光谱测量，解析单激子与多激子动力学过程。","keywords_zh":["Ag8SnS6","超离子导体","多激子动力学","空穴局域化","俄歇复合"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:55.750Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.ijleo.2026.172877","doi":"10.1016/j.ijleo.2026.172877","doi_url":"https://doi.org/10.1016/j.ijleo.2026.172877","title":"Optical and carrier-collection limits in lead sulfide colloidal quantum-dot solar cells tuned by tetrabutylammonium iodide layer-by-layer ligand exchange","title_zh":"四丁基碘化铵逐层配体交换调控的硫化铅胶体量子点太阳能电池中的光学与载流子收集限制","title_key":"opticalandcarriercollectionlimitsinleadsulfidecolloidalquantumdotsolarcellstunedbytetrabutylammoniumiodidelaye major challenge for practical applications. In this Perspective, we introduce advanced patterning techniques for ultrahigh-resolution QLEDs, elaborate on the latest advancements in display technology, and summarize the key challenges and prospective research trends.","abstract_hash":"a91e8745b80b7eb6213be38be3ad91640d9a49bb7ae81e8ac621eebc8d9af796","abstract_source":"openalex","abstract_missing":false,"directions":["display"],"novelty_score":2,"novelty_reason":"属观点综述类文章，未提出新结构或新机制，也无具体性能指标，创新性主要体现在对技术路线的梳理与问题提炼。","innovation_zh":"这是一篇 Perspective 而非原创研究，核心是梳理超高分辨率 QLED 的先进图案化技术，讨论显示技术的最新进展，并总结关键挑战与未来研究方向。作者指出的核心矛盾是：实现超高分辨率与保持器件性能之间需要权衡，这是实用化面临的主要难题。文中没有给出具体性能数据或新器件结果。","method_zh":"以综述/观点形式介绍面向超高分辨率 QLED 的图案化技术路线，并围绕分辨率与器件性能的平衡展开讨论。","keywords_zh":["QLED","超高分辨率","图案化技术","AR/VR显示","近眼显示"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:57.572Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsnanoscienceau.6c00100","doi":"10.1021/acsnanoscienceau.6c00100","doi_url":"https://doi.org/10.1021/acsnanoscienceau.6c00100","title":"Transient Electroluminescence Delay and Capacitive Charging of the Hole Transport Layer in Quantum Dot Light-Emitting Diodes","title_zh":"量子点发光二极管中瞬态电致发光延迟与空穴传输层的电容充电","title_key":"transientelectroluminescencedelayandcapacitivechargingoftheholetransportlayerinquantumdotlightemittingdiodes","authors":["Conan Huang","Nuri Oh","Moonsub Shim"],"venue":"ACS Nanoscience Au","issn_l":"2694-2496","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-29","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-29","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Abstract The first critical steps of electroluminescence in quantum dot light-emitting diodes are the charge accumulation and transport processes upon the application of a driving voltage. Transient electroluminescence measurements with systematically varying offset voltages are carried out to separate out the capacitive charging effects from charge transport. Capacitive charging around the organic hole transport layer is shown to be the dominant contribution to the delay time between driving voltage application and the onset of electroluminescence. The minimum voltage required for light emission may be dictated by the capacitance of the hole transport layer when the electron injection barrier is small. Further implications of these findings are discussed.","abstract_hash":"3fad93ce1fde54dfe2ac17c8d5ab5bae0c143eb94e967159b41c1d57781caba6","abstract_source":"openalex","abstract_missing":false,"directions":["display"],"novelty_score":3,"novelty_reason":"对已有瞬态电致发光手段的系统性变参测量，给出了延迟时间主导机制的新解释，但属于机理层面的渐进认识而非新器件或新纪录。","innovation_zh":"这篇工作用系统改变偏置电压的瞬态电致发光测量，把电容充电效应和电荷传输过程分离开来。核心发现是：驱动电压施加到电致发光起始之间的延迟时间，主要来自有机空穴传输层附近的电容充电，而非电荷传输本身；当电子注入势垒较小时，发光所需的最低电压可能由空穴传输层的电容决定。","method_zh":"对 QLED 做瞬态电致发光测量，通过系统性改变 offset voltage 来区分电容充电与电荷传输的贡献。","keywords_zh":["量子点发光二极管","瞬态电致发光","电容充电","空穴传输层","电荷传输"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:57.663Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.matlit.2026.100091","doi":"10.1016/j.matlit.2026.100091","doi_url":"https://doi.org/10.1016/j.matlit.2026.100091","title":"InAs colloidal quantum dots: From controlled synthesis to functional infrared optoelectronics","title_zh":"InAs 胶体量子点：从可控合成到功能性红外光电子器件","title_key":"inascolloidalquantumdotsfromcontrolledsynthesistofunctionalinfraredoptoelectronics","authors":["Zi-Heng Lin","Feng Zhao","Ya-Kun Wang","et al."],"venue":"Matter & Light","issn_l":"3117-5848","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-28","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"无摘要信息，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["InAs 量子点","胶体合成","红外光电子","量子点器件"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:57.066Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.mseb.2026.119814","doi":"10.1016/j.mseb.2026.119814","doi_url":"https://doi.org/10.1016/j.mseb.2026.119814","title":"Nitrogen-doped MXene quantum dots for Cr6+ detection: a fluorescence quenching strategy combining electron transfer and inner filter effect","title_zh":"氮掺杂 MXene 量子点用于 Cr6+ 检测：结合电子转移与内滤效应的荧光猝灭策略","title_key":"nitrogendopedmxenequantumdotsforcr6detectionafluorescencequenchingstrategycombiningelectrontransferandinnerfiltereffect","authors":["Wenjuan Zhang","Zhenghao Song","Xiangyue Yang","et al."],"venue":"Materials Science and Engineering B","issn_l":"0921-5107","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["MXene 量子点","氮掺杂","Cr6+ 检测","荧光猝灭","内滤效应"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:56.983Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/nano16171073","doi":"10.3390/nano16171073","doi_url":"https://doi.org/10.3390/nano16171073","title":"Evaluating the Impact of the Size of PbS Colloidal Quantum Dots on Photodetection Performance","title_zh":"评估 PbS 胶体量子点尺寸对光电探测性能的影响","title_key":"evaluatingtheimpactofthesizeofpbscolloidalquantumdotsonphotodetectionperformance","authors":["Freddy Garcia","Suraj K. Patel","Anthony Monterrosas","et al."],"venue":"Nanomaterials","issn_l":"2079-4991","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-28","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Colloidal quantum dots (CQDs) provide size-tunable optoelectronic properties, enabling broadband photodetection from the visible to the short-wave infrared (SWIR). However, CQD photodetector performance depends on different processes such as optical absorption, charge transport, and photogain mechanisms in CQD solids. Here, we investigate the impact of PbS CQD size on the electrical conductivity and photodetection performance of CQD films and hybrid graphene/CQD photodetectors. Three CQD sizes are studied: d~3.06 nm, d~3.78 nm, and d~5.27 nm, with exciton peaks at λe~935 nm, λe~1080 nm, and λe~1550 nm, respectively. Electrical measurements show that the largest CQDs exhibit higher conductivity. In contrast, photodetection measurements reveal that the largest-sized CQDs (~5.27 nm) produce the lowest photoresponse, both as bare CQDs and as hybrid graphene/CQD photodetectors. Spectral and power-dependent measurements show decreasing responsivity with increasing optical power, consistent with trap-mediated photoconductive gain. These results indicate that the CQD size can have a significant effect on the optoelectronic performance of CQD devices, requiring materials, interfaces, and design optimization to maintain high photodetector performance.","abstract_hash":"042741b9b62085718ca15bc8c9a45a0a0f0eb4a6bc749847c929b8321726384c","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"在已有 PbS CQD 与石墨烯混合探测器体系上系统比较尺寸效应，属于对已有思路的验证与参数梳理，未提出新机制或新结构。","innovation_zh":"系统考察了三种尺寸（3.06、3.78、5.27 nm，激子峰分别位于 935、1080、1550 nm）的 PbS 胶体量子点对电导和光电探测性能的影响，既测了纯 CQD 薄膜也测了石墨烯/CQD 混合探测器。结果发现尺寸最大的量子点电导最高，但光响应反而最低，说明吸收、输运和光增益之间存在权衡；光谱与功率依赖测试显示响应度随光功率增大而下降，符合陷阱介导的光导增益机制。","method_zh":"制备三种不同尺寸的 PbS CQD 薄膜及石墨烯/CQD 混合器件，对比其电导、光响应、光谱响应和功率依赖特性。","keywords_zh":["PbS 胶体量子点","光电探测器","尺寸效应","石墨烯/量子点混合","光导增益"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:59.522Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/smll.75487","doi":"10.1002/smll.75487","doi_url":"https://doi.org/10.1002/smll.75487","title":"Solvent Engineering in PbS Colloidal Quantum Dot Inks: Enabling Colloidal Stability, Ligand Versatility, Large–Area Film Fabrication, and Multilayer Processing","title_zh":"PbS 胶体量子点墨水中的溶剂工程：实现胶体稳定性、配体通用性、大面积成膜与多层加工","title_key":"solventengineeringinpbscolloidalquantumdotinksenablingcolloidalstabilityligandversatilitylargeareafilmfabricationandmultilayerprocessing","authors":["Eon Ji Lee","In Jin Kim","Hyung Ryul You","et al."],"venue":"Small","issn_l":"1613-6810","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"PbS colloidal quantum dots (CQDs) have attracted considerable attention for photovoltaics and infrared (IR) optoelectronics because their bandgap can be tuned across the near-infrared (NIR) and short-wavelength infrared (SWIR) regions. This review highlights solvent engineering as a central strategy for fabricating high-performance PbS CQD inks, rather than treating it simply as a dispersion step. We first discuss the key parameters governing CQD surface chemistry throughout the dispersion and film-formation processes. We then compare the conventional butylamine (BTA)-based system with emerging alternatives, including BTA-based co-solvents and BTA-free weakly polar solvents such as γ-butyrolactone (GBL) and 2,6-difluoropyridine (DFP) used with lead halide ligands. In addition, we summarize solvent platforms developed for other ligand systems, including 3-mercaptopropionic acid (MPA), aromatic ligands dispersible in weakly polar solvents for orthogonal hole-transport layer (HTL), self-assembled monolayer (SAM)-functionalized CQDs, and thiolate-capped CQDs processed in fluorinated alcohols. Overall, this review highlights how solvent engineering governs not only ink stability, but also interfacial compatibility, multilayer integration, large-area coating, and device performance. Finally, we emphasize the key directions that require further development and investigation to establish more sophisticated solvent-engineering strategies.","abstract_hash":"b38439f27b7da8ae25e415a48d28454db4e83028debcb7b253ea56c015ee6a12","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":2,"novelty_reason":"属于综述与体系梳理，提出了「溶剂工程为核心策略」的视角并做了体系化对比，但未报道新机制、新器件或新纪录。","innovation_zh":"这是一篇综述而非原创实验工作，核心主张是把溶剂从「分散介质」提升为 PbS CQD 墨水设计的中心变量。文章系统梳理了分散与成膜全过程中决定 CQD 表面化学的关键参数，并把传统丁胺（BTA）体系与新兴方案做了对比：包括 BTA 基共溶剂，以及配合卤化铅配体的无 BTA 弱极性溶剂（γ-丁内酯 GBL、2,6-二氟吡啶 DFP）。此外还汇总了面向其他配体体系的溶剂平台——3-巯基丙酸（MPA）、可分散于弱极性溶剂以适配正交空穴传输层（HTL）的芳香配体、SAM 功能化 CQD，以及在含氟醇中加工的硫醇盐封端 CQD。其价值在于把墨水稳定性、界面兼容性、多层集成、大面积涂布与器件性能串成一条由溶剂主导的逻辑链，并指出后续需要发展的方向。","method_zh":"综述性工作，按配体/溶剂体系分类比较：BTA 体系 vs BTA 共溶剂 vs 无 BTA 弱极性溶剂（GBL、DFP）+ 卤化铅配体，并延伸至 MPA、芳香配体、SAM 功能化与含氟醇加工硫醇盐封端 CQD 等平台。","keywords_zh":["PbS 胶体量子点","溶剂工程","墨水稳定性","配体交换","大面积涂布"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:00.368Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsphotonics.6c01429","doi":"10.1021/acsphotonics.6c01429","doi_url":"https://doi.org/10.1021/acsphotonics.6c01429","title":"Solution-Processable PbS QDs Photodetector for Near-Infrared Imaging Sensors Improved by Ligand Engineering","title_zh":"配体工程改进的可溶液加工 PbS 量子点光电探测器用于近红外成像传感器","title_key":"solutionprocessablepbsqdsphotodetectorfornearinfraredimagingsensorsimprovedbyligandengineering","authors":["Shan Wei","Dongping Wang","Hyung Woo Choi","et al."],"venue":"ACS Photonics","issn_l":"2330-4022","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-27","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-27","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Near-infrared (NIR) photodetectors based on lead sulfide (PbS) quantum dots (QDs) are attractive for low-cost and large-area optoelectronics, but their performance is often limited by inefficient charge separation, trap-assisted recombination, and dark current. Here, we report an all-solution-processed PbS QD photodetector based on ligand engineering and an inkjet-printed Ag top electrode. Tetrabutylammonium iodide (TBAI) and 1,2-ethanedithiol (EDT) treatments were used to form ligand-modified PbS QD layers with distinct energy-level alignments, enabling a bilayer junction that promotes charge separation and suppresses dark current. The optimized PbS-TBAI/PbS-EDT device exhibited a dark current of 2.71 × 10–8 A cm–2, a responsivity of 0.390 A W–1, and an estimated shot-noise-limited specific detectivity of 4.18 × 1012 Jones under 905 nm illumination at −1 V. The device also showed subsecond photoresponse, preliminary storage stability, and good device-to-device reproducibility. A 5 × 7 array was further fabricated to demonstrate proof-of-concept near-infrared pattern imaging. These results indicate that ligand-engineered PbS QD bilayers are promising for scalable, solution-processed NIR sensing and imaging platforms.","abstract_hash":"fc76b3749c10f5b83d02d7282c8995f6bbd58cb4359e1571e5de11c8c79be153","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"配体工程构建双层结属于已有思路在新体系上的组合优化，性能指标未刷新纪录，但给出了完整的阵列成像验证。","innovation_zh":"针对 PbS 量子点近红外探测器电荷分离差、陷阱辅助复合和暗电流大的问题，作者用 TBAI 和 EDT 两种配体处理分别制备 PbS QD 层，利用二者能级排列差异构建双层结，同时促进电荷分离并压制暗电流。优化后的 PbS-TBAI/PbS-EDT 器件在 905 nm、−1 V 下暗电流 2.71 × 10⁻⁸ A cm⁻²、响应度 0.390 A W⁻¹、散粒噪声限制比探测率 4.18 × 10¹² Jones，并做出 5 × 7 阵列验证了近红外图案成像。","method_zh":"全溶液工艺：TBAI 与 EDT 配体交换形成能级错配的 PbS QD 双层结，顶电极用喷墨打印 Ag。","keywords_zh":["PbS 量子点","近红外光电探测器","配体工程","双层结","喷墨打印"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:00.297Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsnano.6c08134","doi":"10.1021/acsnano.6c08134","doi_url":"https://doi.org/10.1021/acsnano.6c08134","title":"True-Green Lasing in Bulk Nanocrystals through Alloying","title_zh":"通过合金化实现体相纳米晶的真绿光激光","title_key":"truegreenlasinginbulknanocrystalsthroughalloying","authors":["Margarita Samoli","Servet Ataberk Cayan","Yannic U. Staechelin","et al."],"venue":"ACS Nano","issn_l":"1936-0851","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-27","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-27","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Bulk nanocrystals (BNCs) exhibit exceptional optical gain because of strong Auger suppression and band gap renormalization effects, but this advantage comes at the cost of losing the size-dependent spectral tunability that underpins conventional colloidal nanocrystals. As a result, CdS BNCs remain largely limited to the cyan-green spectral region (480–520 nm), restricting access to technologically important wavelengths such as true green (520–550 nm). Here, we show that compositional alloying restores spectral tunability to the BNC regime while preserving its favorable gain characteristics. By incorporating selenium into CdS, we obtain CdS0.87Se0.13 alloyed BNCs that emit in the true-green region while retaining bulk-like suppression of Auger recombination. Transient-absorption spectroscopy reveals strong optical gain with multinanosecond lifetimes, including a red-shifted alloy band-edge gain feature together with a higher-energy CdS-derived contribution due to a CdS shell. Thin films of the alloyed BNCs exhibit amplified spontaneous emission with a threshold of 215 μJ/cm2. When integrated into photonic crystal surface-emitting lasers, the same material supports single-mode, highly collimated lasing across 520–540 nm under both femtosecond and quasi-continuous-wave excitation, with line widths of ∼ 0.7 nm and thresholds as low as 10 kW/cm2. These results establish alloyed BNCs as solution-processable gain media that combine bulk-like gain physics with compositional wavelength tunability, supporting the development of compact visible lasers in spectral regions inaccessible to single-composition BNC materials.","abstract_hash":"4bec2f8d2e1903f005f1f39b5a579445a2f1293c174cb59dddcfb8a405afd2fd","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用合金化策略把体相纳米晶的增益优势扩展到此前无法覆盖的真绿波段，并做出低阈值单模激光器件，属于明确的新材料策略加显著性能验证。","innovation_zh":"体相纳米晶（BNC）因强俄歇抑制和带隙重整化而具有优异的光学增益，但代价是失去了尺寸依赖的光谱可调性，CdS BNC 只能覆盖 480–520 nm 的青绿区。作者把 Se 掺入 CdS 形成 CdS0.87Se0.13 合金 BNC，在保留体相俄歇抑制的同时把发射推到真绿（520–550 nm），并观察到多纳秒寿命的强光学增益（含红移的合金带边增益和来自 CdS 壳的高能贡献）。合金 BNC 薄膜的放大自发辐射阈值为 215 μJ/cm2；集成到光子晶体面发射激光器后，在飞秒和准连续波激发下都实现 520–540 nm 单模高准直激光，线宽约 0.7 nm，阈值低至 10 kW/cm2。","method_zh":"在 CdS 体相纳米晶中引入 Se 做组分合金化（CdS0.87Se0.13），并用瞬态吸收光谱表征增益；进一步将合金 BNC 薄膜集成到光子晶体面发射激光器中测试激光性能。","keywords_zh":["体相纳米晶","合金化","真绿光激光","光学增益","光子晶体面发射激光器"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:00.724Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.nwnano.2026.100232","doi":"10.1016/j.nwnano.2026.100232","doi_url":"https://doi.org/10.1016/j.nwnano.2026.100232","title":"Recent studies on bio-imaging applications of hydrogel, QDs and nanoparticles","title_zh":"水凝胶、量子点与纳米颗粒在生物成像应用中的近期研究进展","title_key":"recentstudiesonbioimagingapplicationsofhydrogelqdsandnanoparticles","authors":["Mohammad Amir Qureshi"],"venue":"Nano Trends","issn_l":"2666-9781","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-26","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-26","oa_status":"gold","pdf_url":"https://www.sciencedirect.com/science/article/pii/S2666978126000565/pdf","cited_by_count":0,"abstract":"Proper monitoring of cell-to-cell and cell-to-matrix interaction or cell behavior inside the animal body or cell morphology, immobilization, labeling, can be visualized through probes labeled hydrogels, quantum dots and nanoparticles as carrier. Recent days doctors face the problems regarding the end result of targeted delivery of the drug which is loaded in the carrier. Keeping in view of recent problems in medical science, this review article discusses different categories of probe labeled cell imaging gels, quantum dots and nanoparticles. The article gives handy information about the role of supramolecular hydrogels, and nanogels in observing activities in very small organisms. Discussion on different quantum dots also included in this article. Their light emitting property have been utilizing in deep tissue imaging. Cell imaging nanoparticles like Silicon NPs, lipid NPs, metal organic framework NPs and polymer-dots have been discussed extensively because of their application through Forster Resonance Energy Transfer to visualize certain protein. This discussion on cell imaging carriers with their applications in monitoring cell activity, detection of unknown biomolecules and enhancement of available fluorescent techniques will give the future course of research plan for researchers to unfold hidden truth of biological reactions and behavior of injected therapeutics inside the human body.","abstract_hash":"3420987ae9ed3a22386d11b935d027fe06ffb3c01f66bb1108d14e7dc3e79c7b","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":1,"novelty_reason":"纯综述，无新实验、新结构或新数据，仅对已有成像载体进行归纳整理。","innovation_zh":"这是一篇综述，不是原创研究，因此没有提出新机制或新器件。它系统梳理了探针标记的水凝胶（超分子水凝胶、纳米凝胶）、量子点以及各类细胞成像纳米颗粒（硅纳米颗粒、脂质纳米颗粒、金属有机框架纳米颗粒、聚合物点）在细胞行为监测、细胞形态与固定/标记成像中的应用，并特别提到量子点凭借发光特性用于深层组织成像、部分纳米颗粒通过 Förster 共振能量转移（FRET）实现特定蛋白的可视化。其价值在于把载体靶向递送药物效果不佳这一临床问题与成像载体工具的选择联系起来，为后续研究提供方向性参考，但摘要未给出任何具体性能数据或对比结论。","method_zh":"综述性文章，按载体类别（水凝胶/纳米凝胶、量子点、纳米颗粒）分别讨论其作为探针标记载体的成像原理与应用场景，未涉及具体实验方法或器件结构。","keywords_zh":["生物成像","量子点","水凝胶","纳米颗粒","荧光探针"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:03.230Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s44469-026-00020-x","doi":"10.1007/s44469-026-00020-x","doi_url":"https://doi.org/10.1007/s44469-026-00020-x","title":"Enhanced stability and direct patterning of quantum dot films via plasma-induced ligand polymerization","title_zh":"通过等离子体诱导配体聚合提升量子点薄膜稳定性并实现直接图案化","title_key":"enhancedstabilityanddirectpatterningofquantumdotfilmsviaplasmainducedligandpolymerization","authors":["Boram Kim","Sehee Park","Heeyeop Chae"],"venue":"Journal of Information Display","issn_l":"1598-0316","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-26","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-26","oa_status":"gold","pdf_url":"https://link.springer.com/content/pdf/10.1007/s44469-026-00020-x.pdf","cited_by_count":0,"abstract":"Cross-linked quantum dot (QD) films fabricated via plasma-induced ligand polymerization (PILP) are proposed as an effective means of enhancing the air and moisture stability of QD films. The PILP process was performed using Ar plasma in an inductively coupled plasma (ICP) reactor. The analysis of bonding structure using Fourier transform infrared (FT-IR) spectroscopy shows that the C = C–H stretching peak of oleic acid (OA) ligands between 3010 and 3000 cm⁻¹ decreased after Ar plasma treatment, indicating C = C bond cleavage. The optical properties of QD films remained unchanged before and after Ar plasma treatment, as confirmed by photoluminescence (PL) measurements at 520 nm and a photoluminescence quantum yield (PLQY) of approximately 20%. Plasma-treated QD films retained PL intensity with reductions of only 8% in air and 20% in moisture after 350 h, compared to reductions of 59% and 80% for pristine QD films. The surface roughness decreased from 0.582 nm to 0.390 nm after Ar plasma treatment, indicating a smoother film surface with a 33% reduction, as confirmed by atomic force microscopy (AFM). The film thickness decreased from 33.6 nm to 30.4 nm after Ar plasma treatment, as confirmed by scanning electron microscopy (SEM). A stripe pattern with a 50 μm linewidth was achieved by controlling the plasma exposure area with a shadow mask, as verified by fluorescence microscopy (FM).","abstract_hash":"5f1cadfe9ef884a8e68a329a6b5286e097d555d63dc47249f539f73647e41826","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"用等离子体诱导配体交联一步同时实现稳定性提升与直接图案化，且有明确的稳定性、粗糙度和线宽数据支撑，属于新策略而非单纯优化。","innovation_zh":"用 Ar 等离子体在电感耦合等离子体（ICP）反应腔中对量子点薄膜做处理，使油酸（OA）配体中的 C=C 键断裂并发生交联，从而把薄膜在空气和湿气中的稳定性大幅拉高：350 h 后等离子体处理膜的 PL 强度仅衰减 8%（空气）和 20%（湿气），而原始膜分别衰减 59% 和 80%。同时处理并未牺牲光学性能（520 nm 发光、PLQY 约 20% 保持不变），表面粗糙度从 0.582 nm 降到 0.390 nm（降 33%），膜厚从 33.6 nm 减到 30.4 nm。此外借助掩模控制等离子体曝光区域，直接得到线宽 50 μm 的条纹图案，把稳定化与图案化合并到同一步工艺里。","method_zh":"在 ICP 反应腔中用 Ar 等离子体处理量子点薄膜，通过等离子体诱导配体聚合（PILP）使 OA 配体交联；用 FT-IR 跟踪 C=C–H 伸缩峰变化确认键断裂，用 PL/PLQY、AFM、SEM、荧光显微镜分别表征光学性能、粗糙度、厚度和图案化效果。","keywords_zh":["量子点薄膜","等离子体诱导配体聚合","配体交联","稳定性","直接图案化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:07.541Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/smll.75452","doi":"10.1002/smll.75452","doi_url":"https://doi.org/10.1002/smll.75452","title":"Solution‐Processed Lead Sulfide Quantum Dots‐Based Self‐Powered Transient Photodetectors for Bidirectional Weak‐Light Communication up to 1550 nm","title_zh":"溶液法制备的硫化铅量子点自供电瞬态光电探测器，用于1550 nm以下的双向弱光通信","title_key":"solutionprocessedleadsulfidequantumdotsbasedselfpoweredtransientphotodetectorsforbidirectionalweaklightcommunicationupto1550nm","authors":["Suryakant Singh","Akshaykumar Dipchand Salunke","Santanu Pradhan","et al."],"venue":"Small","issn_l":"1613-6810","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-26","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-26","oa_status":"bronze","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/smll.75452","cited_by_count":0,"abstract":"ABSTRACT Reliable optical communication across the ultraviolet (UV) to short‐wave infrared (SWIR) spectrum remains challenging due to the complexity of multicomponent photodetectors, high dark current, limited weak‐light sensitivity, and difficulty in achieving bidirectional operation. Here, we report a solution‐processed PbS colloidal quantum dot (PbS‐CQD)‐based MSIM transient photodetector (TPD) for highly sensitive, self‐powered optical communication employing on‐off keying (OOK) and four‐level pulse amplitude modulation (PAM‐4). The engineered PbS‐CQDs exhibit broadband absorption extending from the UV to the 1550 nm telecommunication window. A dual‐transparent electrode architecture (ITO/PEDOT:PSS/PbS‐CQDs/ionic liquid gel/ITO) enables efficient bidirectional photodetection under illumination from both directions. The ionic liquid gel forms an interfacial electric double layer that facilitates efficient charge separation and accumulation without external bias, resulting in negligible dark current and stable operation. The device demonstrates fast transient response times of 3.12 and 8.58 µs, a modulation bandwidth of ∼168.9 kHz, and a high signal‐to‐noise ratio of ∼40 dB, while operating effectively under µW/cm 2 illumination. A proof‐of‐concept ASCII‐based communication system confirms reliable OOK and PAM‐4 data transmission from UV to SWIR wavelengths, highlighting the device's potential for low‐power broadband optical communication and next‐generation telecommunication technologies, distributed photonic sensing, and fiber‐optic systems.","abstract_hash":"20e6aced03441df1d373411e26def5466b9fe867540131ddb220686dc7247e21","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials","display"],"novelty_score":4,"novelty_reason":"双透明电极加离子液体凝胶双电层的自供电双向探测结构较新，并给出了具体的响应时间、带宽和信噪比指标，但整体仍属已有量子点光电探测思路的工程化组合。","innovation_zh":"作者用溶液法制备的PbS胶体量子点做了一只MSIM结构瞬态光电探测器，靠离子液体凝胶在界面形成双电层实现无偏压自供电工作，暗电流极低。器件采用双透明电极（ITO/PEDOT:PSS/PbS-CQDs/离子液体凝胶/ITO），从两个方向照射都能探测，实现双向光通信。性能上给出瞬态响应时间3.12和8.58 µs、调制带宽约168.9 kHz、信噪比约40 dB，并能在µW/cm²量级的弱光下工作，用OOK和PAM-4调制做了ASCII通信演示，波段覆盖UV到1550 nm。","method_zh":"器件为ITO/PEDOT:PSS/PbS-CQDs/离子液体凝胶/ITO的双透明电极MSIM结构，离子液体凝胶形成界面双电层，无需外加偏压即可完成电荷分离与积累。","keywords_zh":["PbS胶体量子点","自供电光电探测器","双向探测","弱光通信","离子液体凝胶"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:03.371Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsnano.6c11819","doi":"10.1021/acsnano.6c11819","doi_url":"https://doi.org/10.1021/acsnano.6c11819","title":"High-Pressure Chemistry toward the Modulation of the Structure and Properties of Nanocrystals","title_zh":"高压化学调控纳米晶结构与性质","title_key":"highpressurechemistrytowardthemodulationofthestructureandpropertiesofnanocrystals","authors":["Jiayi Yang","Guanjun Xiao","Bo Zou"],"venue":"ACS Nano","issn_l":"1936-0851","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-26","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-26","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"High-pressure chemistry, capable of modulating material structures and properties under extreme thermodynamic conditions, has emerged as a powerful tool for advancing nanoresearch. Semiconductor nanocrystals exhibit distinctive size- and shape-dependent physicochemical properties arising from strong quantum confinement effects. However, conventional ambient-pressure strategies for controlling their structure and luminescent behavior face inherent limitations. This review comprehensively surveys advances in high-pressure nanocrystal research spanning 2016 to 2025, with concentrated coverage of breakthrough discoveries published between 2020 and 2025. Our core scope centers on luminescent nanocrystal systems, namely chalcogenides, core-shell quantum dots, and halide perovskites. To deliver a well-rounded overview, we additionally incorporate relevant progress on ligand-capped nanoparticles and magnetic Fe3O4 nanocrystals. The discussion is organized into five interrelated thematic modules: (i) pressure-induced structural phase transitions; (ii) pressure-regulated nanocrystal morphology and assembly; (iii) pressure-driven surface engineering of nanocrystals; (iv) pressure engineering of core-shell nanocrystal interfaces; and (v) pressure-induced emission. We elucidate the regulatory mechanisms of high pressure, including the modulation of structure, enhancement of surface interactions, optimization of interfacial coupling, and formation of self-trapped excitons (STE). Additionally, this review highlights the application of high-pressure techniques in resolving long-standing ambient-pressure controversies in nanocrystal luminescence mechanisms. Finally, the challenges and outlook of high-pressure chemistry toward the modulation of the structures and properties of nanocrystals are summarized. We sincerely hope that this review will provide guidance for the rational design and precise modulation of high-performance nanomaterials, and further promote the cross-development of high-pressure chemistry and nanomaterials science.","abstract_hash":"44d71781a33e410612e45deaa5d1611483d56486ce1ce6e69bf795aff4a8087b","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":2,"novelty_reason":"属于综述整合，未提出新机制或新器件，但把高压调控纳米晶发光的分散工作归纳成体系化框架，对领域有参考价值。","innovation_zh":"这是一篇综述而非原创研究，系统梳理了 2016–2025 年（重点 2020–2025）高压下半导体纳米晶的研究进展，覆盖硫属化合物、核壳量子点、卤化物钙钛矿三类发光体系，并兼及配体包覆纳米颗粒与磁性 Fe3O4 纳米晶。其价值在于把高压作为调控手段的几条主线整合成五个模块：压力诱导结构相变、压力调控形貌与组装、压力驱动表面工程、核壳界面压力工程、压力诱导发光，并归纳出结构调制、表面相互作用增强、界面耦合优化、自陷激子（STE）形成等调控机制。另一个值得注意的点是提出高压技术可用于澄清常压下长期争议的纳米晶发光机理。摘要未给出具体性能数字。","method_zh":"综述性工作，按五个主题模块组织文献，围绕高压对纳米晶结构、形貌、表面、界面和发光的调控机制展开讨论，并总结该方向的挑战与展望。","keywords_zh":["高压化学","纳米晶","量子点","压力诱导发光","自陷激子"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:03.646Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s11433-026-3040-7","doi":"10.1007/s11433-026-3040-7","doi_url":"https://doi.org/10.1007/s11433-026-3040-7","title":"Submonolayer quantum dot light-emitting devices enable efficient sub-bandgap-voltage emission","title_zh":"亚单层量子点发光器件实现高效的亚带隙电压发光","title_key":"submonolayerquantumdotlightemittingdevicesenableefficientsubbandgapvoltageemission","authors":["Weibin Lin","Yiqi You","Haiyan Lin","et al."],"venue":"Science China Physics Mechanics and Astronomy","issn_l":"1869-1927","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-26","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-26","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确定具体方法与器件结构。","keywords_zh":["亚单层量子点","发光器件","亚带隙电压","电致发光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:04.616Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/nano16171057","doi":"10.3390/nano16171057","doi_url":"https://doi.org/10.3390/nano16171057","title":"Synergistic Al3+ Doping and Multilayer ZnS Shell for Enhanced Photoluminescence and Long-Term Stability of Water-Soluble ZnSe Quantum Dots","title_zh":"Al3+ 掺杂与多层 ZnS 壳层协同提升水溶性 ZnSe 量子点的光致发光与长期稳定性","title_key":"synergistical3dopingandmultilayerznsshellforenhancedphotoluminescenceandlongtermstabilityofwatersolubleznsequantumdots","authors":["Xiaoyan Li","Duo Chen","Chaojin Xuan","et al."],"venue":"Nanomaterials","issn_l":"2079-4991","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-25","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-25","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Water-soluble ZnSe quantum dots (QDs) typically suffer from limited photoluminescence (PL) efficiency and poor long-term stability due to intrinsic defects and surface traps. Here, we report a strategy combining Al3+ doping with stepwise multilayer ZnS shell growth. The stepwise precursor injection ensures uniform shell formation, while Al3+ incorporation suppresses defect-related recombination within the ZnSe core. The resulting ZnSe:Al/ZnS/ZnS/ZnS QDs exhibit a PL quantum yield of 23.24% and an average lifetime of 129.28 ns. They retain 91% of their initial PL intensity after 200 days under ambient conditions. Mechanistic analysis indicates that defect regulation and multilayer shell passivation synergistically promote band-edge radiative recombination over defect-assisted pathways. This work provides a strategy for simultaneously regulating defect states and surface stability in water-soluble semiconductor QDs.","abstract_hash":"2bae8822ed1cf5db8613e8b203795c5c8d6686cfe970dc353bead6c4860d9e8b","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"Al3+ 掺杂加多层 ZnS 壳层的组合在水溶性 ZnSe 体系上属于已有思路的扩展与验证，性能有提升但未见新机制或纪录级指标。","innovation_zh":"针对水溶性 ZnSe 量子点因本征缺陷和表面陷阱导致发光效率低、长期稳定性差的问题，作者把 Al3+ 掺杂和逐步生长的多层 ZnS 壳层结合起来：Al3+ 抑制核内缺陷相关复合，多层壳层负责表面钝化。最终 ZnSe:Al/ZnS/ZnS/ZnS 量子点 PL 量子产率达到 23.24%，平均寿命 129.28 ns，在环境条件下放置 200 天后仍保持初始 PL 强度的 91%。机理上归因于缺陷调控与多层壳层钝化的协同作用，使带边辐射复合压过缺陷辅助复合通道。","method_zh":"采用分步前驱体注入生长多层 ZnS 壳层以保证壳层均匀，同时在 ZnSe 核中引入 Al3+ 掺杂；通过 PL 量子产率、寿命和 200 天环境稳定性测试结合机理分析表征缺陷与表面钝化效果。","keywords_zh":["ZnSe 量子点","Al3+ 掺杂","ZnS 多层壳层","光致发光量子产率","水溶性稳定性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:06.288Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/mi17091005","doi":"10.3390/mi17091005","doi_url":"https://doi.org/10.3390/mi17091005","title":"Degradation of the Intermediate Band Caused by Disorder in Quantum-Dot Intermediate-Band Solar Cells","title_zh":"量子点中间带太阳能电池中无序导致的中间带退化","title_key":"degradationoftheintermediatebandcausedbydisorderinquantumdotintermediatebandsolarcells","authors":["L. Cuadra","Jorge Pérez-Aracil","Sancho Salcedo‐Sanz"],"venue":"Micromachines","issn_l":"2072-666X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-25","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-25","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Intermediate band solar cells require in-gap electronic states that remain sufficiently extended to sustain collective electronic coupling and facilitate carrier motion. We investigate how structural disorder affects an intermediate band formed by coupled colloidal quantum dots embedded in a perovskite-like matrix. The system is represented by a single-orbital tight-binding Hamiltonian on a dilated face-centered-cubic lattice containing 4000 quantum dots, with system sizes between 1372 and 5324 in the finite-size analysis. Radius dispersion modifies on-site energies and hopping amplitudes, whereas positional disorder acts mainly through variations in interdot separation. Eigenstate extension is quantified using the normalized participation ratio. To distinguish spectral broadening from the loss of useful extended states, we also evaluate the mean participation of a contiguous threshold-defined spectral core, its relative energy width, and their product as a combined robustness descriptor. For the adopted baseline parameter set, degradation is energy selective: states near the spectral edges lose participation before states near the band center. At equal nominal amplitudes, radius disorder produces a stronger response than positional disorder, although the two amplitudes do not represent equal realized variances. A positional-disorder amplitude of 0.05 retains approximately 86% of the ordered-reference value of the combined descriptor, whereas a radius-disorder amplitude of 0.05 reduces it to about 22%; when both amplitudes are 0.05, about 14% remains. The model displays a comparatively robust regime near σR=0.02, a model-dependent crossover around σR=0.03-0.04, and strong degradation at larger values. Finite-size results are consistent with near-extensive scaling of the effective core participation number over the simulated sizes, but do not establish a thermodynamic mobility edge. These findings identify quantum-dot size uniformity as the more restrictive model control variable for preserving an extended intermediate-band core.","abstract_hash":"d57993d76688fe9420bf94f72fa3bc8749aa8a6793c9686d84274123c6c53367","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"把中间带退化的讨论从谱展宽推进到扩展态丢失，并给出可量化的综合鲁棒性描述符和尺寸无序/位置无序的定量对比，但仍是模型计算而非新器件实现。","innovation_zh":"用紧束缚模型量化了胶体量子点中间带在结构无序下的退化，把「谱展宽」和「有用扩展态丢失」区分开：提出一个由阈值定义的谱核心平均参与率、相对能量宽度及其乘积构成的综合鲁棒性指标。结果显示退化是能量选择性的，谱边缘态先于带中心态失去扩展性；在相同名义幅度下，半径无序（量子点尺寸分散）比位置无序破坏性强得多——位置无序幅度 0.05 时综合指标保留约 86%，半径无序 0.05 时只剩约 22%，两者同时为 0.05 时仅剩约 14%。据此指出量子点尺寸均匀性是保住扩展中间带核心的更关键控制变量。","method_zh":"在膨胀面心立方晶格上构建含 4000 个量子点的单轨道紧束缚哈密顿量，半径分散改变格点能和跃迁幅度，位置无序主要通过点间距变化起作用；用归一化参与率衡量本征态扩展程度，并做 1372–5324 的有限尺寸分析。","keywords_zh":["中间带太阳能电池","量子点无序","紧束缚模型","参与率","尺寸均匀性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:06.906Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsami.6c07817","doi":"10.1021/acsami.6c07817","doi_url":"https://doi.org/10.1021/acsami.6c07817","title":"Efficient Near-Infrared CdSe/CdZnSe/CdZnS Core/Shell/Shell Nanoplatelet Light-Emitting Diodes by Controlling Gradient Alloy Shells","title_zh":"通过调控梯度合金壳层实现高效近红外 CdSe/CdZnSe/CdZnS 核/壳/壳 纳米片发光二极管","title_key":"efficientnearinfraredcdsecdznsecdznscoreshellshellnanoplateletlightemittingdiodesbycontrollinggradientalloyshells","authors":["Yingying Sun","Yicheng Zeng","Qingya Wang","et al."],"venue":"ACS Applied Materials & Interfaces","issn_l":"1944-8244","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-25","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-25","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Colloidal nanoplatelets (NPLs) have attracted significant attention for light-emitting diodes (LEDs) owing to their strong in-plane dipole moments and intrinsically narrow emission linewidth. In this study, we report the synthesis of near-infrared (NIR)-emitting CdSe/CdZnSe/CdZnS core/shell/shell NPLs with uniform size and well-controlled shell composition. The optimized NPLs exhibit a PL emission peak at 715 nm, a narrow full width at half maximum of 21 nm, and a high photoluminescence quantum yield of 54%. The gradient-alloy CdZnSe/CdZnS shell effectively suppresses nonradiative recombination and enhances carrier confinement within the CdSe core. Consequently, solution-processed LEDs incorporating these NPLs achieve a low turn-on voltage of 1.8 V and a maximum luminance of 6415 cd m-2. This work establishes an effective synthetic strategy for gradient-shell CdSe NPLs and provides a promising platform for high-performance NIR optoelectronic devices.","abstract_hash":"77a09dd5109ffb0bffbeba78b886d7bc001afa7afc9f29c6a57ca53a9fcc1485","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":3,"novelty_reason":"梯度合金双壳层是合理的壳层工程策略并给出了完整的发光与器件数据，但整体属于已有核/壳 NPL 思路在新波段上的渐进式优化，未见新机制或纪录级指标。","innovation_zh":"在 CdSe 纳米片（NPL）上生长 CdZnSe/CdZnS 梯度合金双壳层，用壳层组分渐变来抑制非辐射复合、增强对 CdSe 核的载流子限域。优化后的 NPL 发射峰位于 715 nm，半高宽仅 21 nm，PL 量子产率 54%。基于该材料的溶液加工 LED 开启电压 1.8 V，最大亮度 6415 cd m-2，属于近红外 NPL-LED 中较完整的合成—器件验证工作。","method_zh":"胶体法合成尺寸均一、壳层组分可控的 CdSe/CdZnSe/CdZnS 核/壳/壳 NPL，并以溶液加工方式制备近红外 LED 器件。","keywords_zh":["纳米片","核壳结构","近红外发光二极管","梯度合金壳层","CdSe"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:07.195Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/jacs.6c13023","doi":"10.1021/jacs.6c13023","doi_url":"https://doi.org/10.1021/jacs.6c13023","title":"Synthesis of Metal–Quantum Dot Core–Satellite Nanoparticles and Plasmonic Cavity-Induced Recovery of Quantum Yield for High External Quantum Efficiency","title_zh":"金属–量子点核–卫星纳米颗粒的合成及等离激元腔诱导的量子产率恢复用于高外量子效率","title_key":"synthesisofmetalquantumdotcoresatellitenanoparticlesandplasmoniccavityinducedrecoveryofquantumyieldforhighexternalquantumefficiency","authors":["Yoonhee Kim","Soohyun Ji","Mihye Lim","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-25","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-25","oa_status":"hybrid","pdf_url":"https://pubs.acs.org/jacsat/article-pdf/doi/10.1021/jacs.6c13023/67410072/jacs.6c13023.pdf","cited_by_count":0,"abstract":"Quantum dots (QDs) have been extensively studied for their unique optical and electronic properties arising from quantum confinement. In particular, less toxic and environment-friendly InP/ZnSe/ZnS QDs have been successfully commercialized in display devices, but their low absorption characteristic still limits external quantum efficiency (EQE). As multidirectional structural engineering has brought internal quantum yield (QY) close to unity, further improvements in EQE now depend on enhancing light absorption, often achieved via photonic cavities integrated with plasmonic materials. However, optical interactions between plasmonic cavities and InP-based QDs remain largely unexplored to fully exploit the potential, primarily due to their nonunified decay dynamics and the synthetic difficulty of establishing consistent photonic environments across all emitters. Here, we present a silanol-alcohol condensation-based chemistry to precisely and stably form plasmonic cavity-coupled QDs (Ag nanosphere-InP/ZnSe/ZnS QD core-satellite nanoparticles, AgNS-QD CSPs). We demonstrate that plasmonic nanostructures can reorganize internal carrier dynamics by redirecting nonradiative decay pathways into radiative ones, offering a strategy to recover QY reduced by environmental degradation. Such postsynthetic modulation provides a previously inaccessible route to surpass the performance ceiling imposed by structural optimization of QDs, while simultaneously enhancing the absolute absorption with an unexpectedly large photoluminescence. To highlight practical applicability, we fabricate color conversion films incorporating plasmonic cavities and achieve an EQE of 34%, unattainable in color conversion films relying solely on QDs. These findings suggest that plasmonic cavities can significantly improve the efficiency and broaden the applicable scope of QD-based technologies, including display devices and other optoelectronic applications.","abstract_hash":"0e5b6cb97e4b692b6b58fb7b230b9bf7ba8ac507499e84fc132b6273e4fd635f","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用新的缩合化学实现等离激元腔与 InP 基量子点的稳定耦合，并提出通过重定向非辐射通道恢复量子产率、把色转换膜 EQE 推到 34%，属于明确的新结构加显著性能提升。","innovation_zh":"针对 InP/ZnSe/ZnS 量子点吸收弱、限制 EQE 的问题，作者用硅醇–醇缩合化学把 Ag 纳米球与 InP 基量子点组装成核–卫星结构（AgNS-QD CSPs），在量子点表面构建出一致且稳定的等离激元腔环境。关键发现是等离激元结构能把非辐射衰减通道重定向为辐射通道，从而恢复因环境降解而损失的量子产率，同时提升绝对吸收并带来异常强的荧光。基于此制备的色转换膜 EQE 达到 34%，这是仅靠量子点本身无法达到的水平。","method_zh":"以硅醇–醇缩合反应为合成手段，将 Ag 纳米球与 InP/ZnSe/ZnS 量子点稳定组装成核–卫星纳米颗粒，形成等离激元腔耦合的量子点体系，并进一步做成色转换膜。","keywords_zh":["等离激元腔","核–卫星纳米颗粒","InP 量子点","外量子效率","色转换膜"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:09.370Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1149/2162-8777/ae9db8","doi":"10.1149/2162-8777/ae9db8","doi_url":"https://doi.org/10.1149/2162-8777/ae9db8","title":"High-Efficiency Novel Cu 3 InSnS 5 Quantum Dot Photovoltaics: From Quantum Confinement Modeling to Tandem Cell Optimization for Dual Indoor/Outdoor Energy Harvesting","title_zh":"高效新型 Cu3InSnS5 量子点光伏：从量子限域建模到面向室内外双场景能量收集的叠层电池优化","title_key":"highefficiencynovelcu3insns5quantumdotphotovoltaicsfromquantumconfinementmodelingtotandemcelloptimizationfordualindooroutdoorenergyharvesting","authors":["Oussama Taleb Jlidi","Rim Haji","A. Melliti"],"venue":"ECS Journal of Solid State Science and Technology","issn_l":"2162-8769","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-24","oa_status":"hybrid","pdf_url":"https://iopscience.iop.org/article/10.1149/2162-8777/ae9db8/pdf","cited_by_count":0,"abstract":"This study presents a comprehensive numerical optimization of single and tandem photovoltaic cells utilizing novel Cu 3 InSnS 5 colloidal quantum dots (CQDs) as absorbers. These quaternary CQDs have emerged as a compelling class of low-dimensional materials due to their tunable optoelectronic properties and compliance with the Restriction of Hazardous Substances (RoHS) directive. A multi-scale simulation framework is employed, combining the envelope function approximation to predict size-dependent quantum confinement effects, Rigorous Coupled-Wave Analysis (RCWA) for optical modeling, and the Solar Cell Capacitance Simulator (SCAPS-1D) for device-level electrical optimization. By systematically tuning the CQD radius, buffer layer, and absorber thickness, the optimized single-junction cell achieves a power conversion efficiency of 11.53% under standard AM1.5G illumination, significantly surpassing the current experimental benchmark of \u003c0.1%. Furthermore, a tandem architecture is designed to minimize thermalization losses, yielding an impressive efficiency of 31.97% under AM1.5G. Under indoor LED illumination (1250 lx), the single and tandem cells attain efficiencies of 12.13% and 22.21%, respectively. These findings underscore the immense potential of Cu 3 InSnS 5 CQDs for dual indoor/outdoor energy harvesting, particularly for powering low-light Internet of Things (IoT) devices.","abstract_hash":"4730785bc70367b1909480f9ad9ca65be4d238102c451d5ef7f479213de75fcf","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":3,"novelty_reason":"材料体系（Cu3InSnS5 四元 CQD）较新且给出室内外双场景叠层设计，但工作本质是数值模拟优化，无实验验证，属在新体系上验证已有建模范式。","innovation_zh":"这篇工作用纯数值模拟的方式，把新型四元胶体量子点 Cu3InSnS5 用作单结和叠层光伏的吸光层。作者搭了一套多尺度仿真框架，系统扫描量子点半径、缓冲层和吸收层厚度，优化后的单结电池在 AM1.5G 下效率达 11.53%，远高于目前实验上不到 0.1% 的水平；叠层结构为压低热化损失而设计，AM1.5G 下效率达 31.97%。室内 1250 lx LED 光照下，单结和叠层分别做到 12.13% 和 22.21%，指向低功耗 IoT 供电。","method_zh":"结合包络函数近似预测尺寸相关的量子限域效应、RCWA 做光学建模、SCAPS-1D 做器件级电学优化，对 CQD 半径、缓冲层与吸收层厚度进行系统调参，并在此基础上设计叠层电池结构。","keywords_zh":["Cu3InSnS5 量子点","叠层太阳能电池","量子限域","SCAPS-1D","室内光伏"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:09.940Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/lpor.71763","doi":"10.1002/lpor.71763","doi_url":"https://doi.org/10.1002/lpor.71763","title":"Deuterated Molecular Vibration Locking in Self‐Assembled Monolayers Enables Positive Aging‐Free SnO 2 ‐Based QLEDs With Over 30% External Quantum Efficiency","title_zh":"自组装单分子层中的氘代分子振动锁定实现无正向老化、外量子效率超30%的SnO2基QLED","title_key":"deuteratedmolecularvibrationlockinginselfassembledmonolayersenablespositiveagingfreesno2basedqledswithover30externalquantumefficiency","authors":["Mengxin Liu","Desheng Li","Xinan Shi","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT The development of efficient and stable hole injection layers (HILs) remains a critical challenge for high‐performance quantum‐dot light‐emitting diodes (QLEDs), as the conventional PEDOT:PSS suffers from inherent acidity and hygroscopicity. Herein, we demonstrate a novel strategy of molecular vibration engineering by employing deuterated self‐assembled monolayers (SAMs) as an efficient alternative. The designed deuterated molecular backbone (Ph‐4PACzd10), featuring extended conjugated structures, not only delivers an enhanced molecular dipole moment to significantly deepen the work function of ITO, but also effectively suppresses high‐frequency C─H stretching vibrations through isotopic substitution, which promotes highly ordered molecular packing and superior film morphology, thereby minimizing interfacial energetic disorder and non‐radiative recombination losses. As a result, SnO 2 ‐based QLEDs utilizing Ph‐4PACzd10 achieve a record‐breaking external quantum efficiency (EQE) of 30.87%, markedly surpassing that of the conventional PEDOT:PSS‐based device (24.03%). Furthermore, the hydrophobic nature of the deuterated SAMs endows the devices with exceptional shelf and operational stability. Notably, the QLED device demonstrated excellent efficiency roll‐off characteristics, maintaining an EQE exceeding 20% at an ultra‐high luminance of 250 000 cd m −2 , with no positive aging effect observed. This work illustrates that isotopic engineering of molecular vibrations provides a compelling pathway to tailor interfacial energetics and advance the design principles for next‐generation QLEDs.","abstract_hash":"d32269c37a1eeae7bd5e259055d38f00c0042ac0959cccc4d9e970a78dbb0385","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":5,"novelty_reason":"首次将氘代分子振动工程用于QLED空穴注入层，刷新SnO2基QLED的EQE记录并消除正向老化。","innovation_zh":"用氘代自组装单分子层（Ph-4PACzd10）替代传统PEDOT:PSS作为空穴注入层，通过同位素取代抑制C─H高频伸缩振动，同时利用扩展共轭结构增强分子偶极矩以加深ITO功函数，从而降低界面能级无序和非辐射复合。基于SnO2的QLED实现了30.87%的外量子效率记录，显著高于PEDOT:PSS器件的24.03%，并在250000 cd m−2超高亮度下仍保持超过20%的EQE，且未观察到正向老化效应。","method_zh":"设计氘代分子骨架Ph-4PACzd10作为自组装单分子层空穴注入层，利用同位素取代抑制分子振动、改善分子堆积与薄膜形貌，并借助疏水性提升器件存储与工作稳定性。","keywords_zh":["QLED","氘代自组装单分子层","空穴注入层","同位素工程","外量子效率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:09.743Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adom.71700","doi":"10.1002/adom.71700","doi_url":"https://doi.org/10.1002/adom.71700","title":"Core–Shell Ag‐In‐Zn‐Ga‐S@AgGaS 2 Quantum Dots for 465 Nm Pure Blue Emission","title_zh":"核壳结构 Ag-In-Zn-Ga-S@AgGaS2 量子点实现 465 nm 纯蓝光发射","title_key":"coreshellaginzngasaggas2quantumdotsfor465nmpureblueemission","authors":["Weiwei Mao","Siyong Wang","Li Zhang","et al."],"venue":"Advanced Optical Materials","issn_l":"2195-1071","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Low‐toxicity quantum dots (QDs) based on group I‐III‐VI elements have attracted significant interest due to their color‐tunability for wide‐gamut displays. Nevertheless, the width of the blue‐emitting peak remains considerably broader than those of the green and red counterparts, resulting in degraded color purity, restricted gamut coverage, and diminished energy efficiency in blue‐emitting devices. Here, we report spectroscopically pure blue QDs (λ = 465 nm) with an ultranarrow FWHM of 36 nm, achieving excellent color purity for blue‐emitting I‐III‐VI QDs. Employing a two‐step hot‐injection method with precise thickness control, this approach enables epitaxial growth of an atomically thin 0.35 nm thick AgGaS 2 (AGS) shell on Ag‐In‐Zn‐Ga‐S cores. Using in situ HRTEM on systematically synthesized AIZGS@AGS architectures, we directly captured the controlled epitaxial growth of this shell, revealing a clean core–shell interface. The high‐crystallinity AGS shell passivates surface defects, narrowing the PL spectrum from 103 to 36 nm. Moreover, systematic In:Zn ratio tuning further affords AIZGS@AGS QDs that exhibit narrow linewidths and continuous spectral coverage across the blue region (465–509 nm). Our study provides an effective approach for high‐quality I‐III‐VI blue QDs, demonstrating significant potential for advanced display applications.","abstract_hash":"6f3fc4880b6b30a69caad47feac6482cfc745b660cb70a4aba2cf5bb4def9b6b","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"以原子级薄 AgGaS2 壳层钝化实现 I-III-VI 蓝光量子点 FWHM 从 103 nm 收窄至 36 nm，并原位观测外延生长，属明确的新结构策略且性能提升显著。","innovation_zh":"针对 I-III-VI 族蓝光量子点发射峰远宽于绿光、红光（色纯度差、色域受限）的问题，作者用两步热注入法在 Ag-In-Zn-Ga-S（AIZGS）核上外延生长了原子级厚度（0.35 nm）的 AgGaS2（AGS）壳层，把 PL 半高宽从 103 nm 压到 36 nm，在 465 nm 处实现纯蓝发射。借助原位 HRTEM 直接观察到该壳层的可控外延生长，界面干净；AGS 壳层高结晶性起到钝化表面缺陷的作用。此外通过系统调节 In:Zn 比例，可在 465–509 nm 蓝光区连续调谐并保持窄线宽。","method_zh":"两步热注入法，精确控制壳层厚度，在 AIZGS 核上外延生长 0.35 nm 厚的 AgGaS2 壳；用原位 HRTEM 跟踪核壳生长过程，并系统改变 In:Zn 比调控发光波长。","keywords_zh":["I-III-VI 量子点","核壳结构","纯蓝发光","窄半高宽","AgGaS2 壳层"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:10.615Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.jmmm.2026.174510","doi":"10.1016/j.jmmm.2026.174510","doi_url":"https://doi.org/10.1016/j.jmmm.2026.174510","title":"Effects of electric and magnetic fields on a D0 impurity in a gaussian GaAs quantum dot with spin-orbit interactions","title_zh":"电场和磁场对含自旋-轨道相互作用的 Gaussian GaAs 量子点中 D0 杂质的影响","title_key":"effectsofelectricandmagneticfieldsonad0impurityinagaussiangaasquantumdotwithspinorbitinteractions","authors":["Rajdip Banerjee","Pooja Saini","Ujjal Debnath","et al."],"venue":"Journal of Magnetism and Magnetic Materials","issn_l":"0304-8853","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["quantuminfo","materials"],"novelty_score":1,"novelty_reason":"无摘要信息，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["GaAs 量子点","D0 杂质","自旋-轨道相互作用","电场","磁场"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:10.828Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1063/5.0348784","doi":"10.1063/5.0348784","doi_url":"https://doi.org/10.1063/5.0348784","title":"Plug-and-play single photon sources using chip-integrated nanowire quantum dots","title_zh":"即插即用的单光子源：芯片集成纳米线量子点","title_key":"plugandplaysinglephotonsourcesusingchipintegratednanowirequantumdots","authors":["Edith Yeung","Mohd Zeeshan","David B. Northeast","et al."],"venue":"Applied Physics Letters","issn_l":"0003-6951","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-24","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"We present a fixed-alignment platform for delivering single photons directly in fiber using chip-integrated nanowire quantum dots. Emission from III–V nanowire quantum dots is evanescently coupled to silicon-based integrated photonic circuitry. Fiber arrays fixed to the chip are used to efficiently and reliably couple light on- and off-chip allowing for plug-and-play operation of multiple sources on the same chip. We demonstrate plug-and-play in-fiber single photon collection efficiencies of ηeff>1.6% from multiple devices on the same chip with multiphoton emission probabilities as low as g(2)(0)=7.2%. Device performance was robust against multiple cooldown cycles and stable over tens of hours of continuous operation. Such fiber-coupled single photon sources will be a key resource required for distributing quantum information in future quantum networks.","abstract_hash":"61e38daa27eef4caaea5966b382e055b6eb99c41d1940cca40e3e6fd8c9c9fef","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","materials"],"novelty_score":4,"novelty_reason":"用固定对准的光纤阵列加倏逝耦合实现多器件即插即用单光子源，并给出效率与 g(2)(0) 的具体指标及长期稳定性验证，属于明确的新集成策略。","innovation_zh":"把 III–V 纳米线量子点的发光通过倏逝场耦合到硅基集成光子回路，并用固定在芯片上的光纤阵列实现片上/片外光的耦合，从而做到同一芯片上多个光源的即插即用。多个器件实现了 ηeff>1.6% 的光纤内单光子收集效率，多光子发射概率低至 g(2)(0)=7.2%，且性能在多次降温循环后仍稳定，连续工作数十小时不退化。","method_zh":"III–V 纳米线量子点的发射倏逝耦合进硅基集成光子线路，芯片上固定光纤阵列完成高效耦合，构成固定对准的即插即用平台。","keywords_zh":["纳米线量子点","单光子源","硅基光子集成","倏逝耦合","即插即用"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:12.245Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1063/5.0338473","doi":"10.1063/5.0338473","doi_url":"https://doi.org/10.1063/5.0338473","title":"Te-alloyed ZnTeSe quantum-dot interlayer enables high-efficiency all-inorganic InP QLEDs","title_zh":"Te 合金化 ZnTeSe 量子点中间层实现高效全无机 InP QLED","title_key":"tealloyedzntesequantumdotinterlayerenableshighefficiencyallinorganicinpqleds","authors":["Qiuyan Li","Sheng Mei Cao","Yusheng Song","et al."],"venue":"Applied Physics Letters","issn_l":"0003-6951","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"All-inorganic quantum dot (QD) light-emitting diodes (QLEDs) are promising for stable electroluminescent applications; however, their performance is often limited by inefficient hole injection and nonradiative recombination originating from the energy-level mismatch between inorganic metal oxide hole transport layers (HTLs) and QD emissive layers (EMLs). Herein, we demonstrate high-performance all-inorganic indium phosphide (InP) QLEDs by introducing wide-bandgap tellurium-alloyed zinc selenide (ZnTeSe) QDs as an interfacial layer between the HTL and the InP EML. The ZnTeSe QD interlayer enables simultaneous passivation of interfacial defects, suppression of electron leakage, and regulation of hole injection. Owing to its shallow conduction band minimum, ZnTeSe mitigates electron trapping at defect states in NiMgOx and suppresses fluorescence quenching in the InP EML, while Te-induced localized states modulate the valence band structure to facilitate hole transport into the EML. As a result, the external quantum efficiency is increased from 0.14% to 6.7%, and the maximum luminance is enhanced from 155 to 6657 cd m−2. This work underscores the importance of interfacial electronic structure engineering and provides an effective strategy for high-efficiency, cadmium-free all-inorganic QLEDs.","abstract_hash":"12f785d5eddf3ae9e6ff18867a2afc8706ebacc58f652a8c6a841224af251ae6","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用 Te 合金化 ZnTeSe 量子点作界面层同时解决钝化、电子泄漏和空穴注入三个问题，EQE 提升近 50 倍，属明确的新界面策略且性能提升显著。","innovation_zh":"针对全无机 InP QLED 中金属氧化物空穴传输层与量子点发光层能级失配导致的空穴注入差、非辐射复合严重的问题，作者在 HTL 与 InP 发光层之间插入宽带隙 ZnTeSe 量子点作为界面层。该中间层同时实现界面缺陷钝化、电子泄漏抑制和空穴注入调控：ZnTeSe 较浅的导带底减少了 NiMgOx 中缺陷态对电子的俘获并抑制 InP 发光层的荧光猝灭，Te 引入的局域态则调制价带结构、促进空穴输运。结果外量子效率从 0.14% 提升到 6.7%，最大亮度从 155 cd m−2 提升到 6657 cd m−2。","method_zh":"在无机金属氧化物空穴传输层（NiMgOx）与 InP 量子点发光层之间引入宽带隙 Te 合金化 ZnSe（ZnTeSe）量子点界面层，通过界面能带与缺陷态工程调控载流子注入与复合。","keywords_zh":["InP 量子点","全无机 QLED","ZnTeSe 界面层","空穴注入","界面能带工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:12.732Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsphotonics.6c01579","doi":"10.1021/acsphotonics.6c01579","doi_url":"https://doi.org/10.1021/acsphotonics.6c01579","title":"Colloidal Quantum-Dot Heterojunctions for Multimodal VIS–NIR–SWIR Imaging and Computational Spectroscopy","title_zh":"胶体量子点异质结用于多模态 VIS–NIR–SWIR 成像与计算光谱学","title_key":"colloidalquantumdotheterojunctionsformultimodalvisnirswirimagingandcomputationalspectroscopy","authors":["Ya Wang","Faxin Wang","Xi Ran","et al."],"venue":"ACS Photonics","issn_l":"2330-4022","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Spectral-selective photodetection across the visible to short-wave infrared (VIS–SWIR) range is highly desirable for advanced imaging and sensing applications. Here, we report a bias-switchable colloidal quantum-dot (CQD) n–p–n photodetector based on vertically stacked PbS and PbSe CQD heterojunctions with oppositely oriented built-in electric fields. This architecture allows electric-field redistribution under external bias, enabling controllable carrier transport and wavelength-dependent response. A ZnTe interlayer is introduced to suppress dark current and enhance bias-polarity-dependent spectral selectivity. By reversing the bias polarity, the device electrically switches between VIS + near-infrared (NIR) and NIR + SWIR detection modes within a single pixel. The photodetector exhibits low dark current
