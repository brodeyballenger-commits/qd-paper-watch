antum-dot photodetectors","title_zh":"用于均匀短波红外量子点光电探测器的混合聚合物空穴传输层中的各向异性 π–π 堆叠","title_key":"anisotropicstackinginhybridpolymerholetransportlayersforuniformshortwaveinfraredquantumdotphotodetectors","authors":["Youming Chen","Yikai Chen","Fan Fang","et al."],"venue":"Materials Today Nano","issn_l":"2588-8420","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-01","oa_status":"green","pdf_url":null,"cited_by_count":1,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection"],"novelty_score":1,"novelty_reason":"数据库未收录摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断关键方法或器件结构。","keywords_zh":["短波红外","量子点光电探测器","空穴传输层","π–π 堆叠","混合聚合物"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:50.943Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adom.71594","doi":"10.1002/adom.71594","doi_url":"https://doi.org/10.1002/adom.71594","title":"PbS Colloidal Quantum Dots for Optoelectronics: From Fundamentals to Carrier Transport Strategies and Emerging Applications","title_zh":"PbS 胶体量子点光电子学：从基础到载流子输运策略及新兴应用","title_key":"pbscolloidalquantumdotsforoptoelectronicsfromfundamentalstocarriertransportstrategiesandemergingapplications","authors":["Yuedong Qian","Weize Chen","Junjie Shao","et al."],"venue":"Advanced Optical Materials","issn_l":"2195-1071","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-01","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":"ABSTRACT Colloidal quantum dots (CQDs) have been widely adopted in optoelectronics due to their solution‐processability, size‐tunable bandgaps, and excellent optoelectronic properties. Among them, PbS CQDs have emerged as a promising candidate for next‐generation infrared optoelectronics because of their pronounced quantum confinement, broadly tunable optical absorption across most of the short‐wave infrared (SWIR) region, and the potential for multiple exciton generation (MEG). Herein, the recent progress in PbS CQDs for optoelectronics is systematically reviewed. First, the fundamentals of CQDs, including quantum confinement and size‐dependent bandgaps, representative synthesis routes and ligand exchange methods, and thin‐film assembly strategies are summarized. Then, charge carrier management strategies, including surface chemical modification, band alignment design, and interface engineering, are discussed to mitigate carrier transport limitations and improve device performance. Furthermore, recent advances in PbS CQD optoelectronics are presented, covering quantum dot light‐emitting diodes (QLEDs), solar cells, photodetectors, and emerging optoelectronic devices, with emphasis on device architectures, performance optimization, and practical implementations. Finally, a brief conclusion and outlook for future research directions of PbS CQD‐based optoelectronic devices are also provided.","abstract_hash":"3913e835b990ef74e73ffce609545d6f7462ae73780a7d725242745423fd6277","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials","display"],"novelty_score":2,"novelty_reason":"属于对已有进展的系统性综述，没有提出新机制或新器件，创新性主要体现在组织框架和覆盖面而非研究本身。","innovation_zh":"这是一篇综述，不是原创研究，因此没有单一的新器件或新纪录。它的价值在于系统梳理了 PbS 胶体量子点从基础物理（量子限域、尺寸依赖带隙）到合成路线、配体交换、薄膜组装，再到载流子管理策略（表面化学修饰、能带对齐设计、界面工程）的完整链条，并覆盖 QLED、太阳能电池、光电探测器及新兴器件四类应用，重点讨论器件结构与性能优化。对想快速进入 PbS CQD 红外光电子方向的人来说，这是一份把基础、输运策略和应用串起来的路线图。","method_zh":"综述性工作，按「基础—载流子管理—器件应用」三层结构组织：先总结量子限域与尺寸依赖带隙、代表性合成路线与配体交换方法、薄膜组装策略，再讨论表面化学修饰、能带对齐设计和界面工程等载流子输运调控手段，最后分器件类型评述 QLED、太阳能电池、光电探测器和新兴光电器件的架构与性能优化。","keywords_zh":["PbS 胶体量子点","载流子输运","短波红外","配体交换","界面工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:53.595Z","pending_summary":false,"first_seen":"202 ,"oa_status":"bronze","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/ente.70612","cited_by_count":0,"abstract":"Developing a sustainable and cost‐effective counter electrode (CE) material with high catalytic activity is of significant importance for quantum dot‐sensitized solar cells (QDSSCs). In this work, by using the industrial residue material of sulfonated asphalt as the carbon precursor, we prepared a CoFe/CoFe 2 O 4 embedded N, S‐doped carbon hybrid (CoFe/CoFe 2 O 4 @C) and applied to the CE of QDSSC. Structure analyses indicated that CoFe/CoFe 2 O 4 @C has a porous structure with large surface area. Electrochemical investigations revealed that the CoFe/CoFe 2 O 4 @C possesses high catalytic activity for polysulfide reduction. Consequently, CdSe QDSSC based on CoFe/CoFe 2 O 4 @C CE achieved a high power conversion efficiency (PCE) of 6.37%, significantly superior to the commonly used PbS CE (5.4%). This study provides a sustainable strategy for converting the industrial residue material of asphalt into a low‐cost and high‐performance CE material for QDSSC.","abstract_hash":"2b2c69a3ad38a351969019a0e35eeb81ecbf74c4d75fd5d971bdac796673988d","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"属于对电极材料的渐进式改进，用工业残渣作前驱体有一定新意，但整体策略（过渡金属/氧化物嵌入掺杂碳）在 QDSSC 对电极中已有类似报道，效率提升幅度有限。","innovation_zh":"用工业废料磺化沥青作碳前驱体，制备了 CoFe/CoFe2O4 嵌入 N,S 共掺杂碳的杂化物（CoFe/CoFe2O4@C），用作 QDSSC 对电极。该材料具有多孔结构和大比表面积，对多硫化物还原表现出高催化活性；基于该对电极的 CdSe QDSSC 获得 6.37% 的光电转换效率，明显高于常用 PbS 对电极的 5.4%。创新点在于把沥青工业残渣转化为低成本高性能对电极材料，兼顾了废物利用与器件性能。","method_zh":"以磺化沥青为碳前驱体，原位构建 CoFe/CoFe2O4 纳米颗粒嵌入 N,S 共掺杂碳基体的多孔杂化材料，通过结构表征和电化学测试评估其多硫化物还原催化活性，并组装 CdSe QDSSC 测试光伏性能。","keywords_zh":["量子点敏化太阳能电池","对电极","磺化沥青","N,S 共掺杂碳","CoFe/CoFe2O4"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:54.749Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adom.71559","doi":"10.1002/adom.71559","doi_url":"https://doi.org/10.1002/adom.71559","title":"Research Progress on Annealing Strategies for High‐Performance Quantum Dot Light‐Emitting Diodes","title_zh":"高性能量子点发光二极管退火策略研究进展","title_key":"researchprogressonannealingstrategiesforhighperformancequantumdotlightemittingdiodes","authors":["Yuanzhang Yang","Yubu Zhou","Dai Yi","et al."],"venue":"Advanced Optical Materials","issn_l":"2195-1071","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Quantum‐dot light‐emitting diodes (QLEDs) are increasingly recognized as leading candidate for next‐generation display and solid‐state lighting platforms, owing to their adjustable emissions, elevated quantum efficiencies, and compatibility with large‐area fabrication processes. This work reviews the decisive role of annealing temperature in governing the performance of QLED, organized layer by layer across electron transport layers, emissive layers, hole transport/injection layers, and electrodes in both Cd‐based and Cd‐free (e.g., InP‐based) systems. For Cd‐based quantum dots (QDs), intermediate thermal annealing (100°C–150°C) removes residual solvents and ligands, densifies QD films, improves crystallinity, and optimizes carrier balance, enabling high external quantum efficiencies and long device lifetime. In contrast, InP‐based QLED require a more process‐dependent thermal budget: high‐temperature steps may be used during QD synthesis or interlayer treatment, whereas direct annealing of the QD emissive layer must be limited according to shell structure, ligand stability, and QD/oxide interfaces. Appropriately tailored annealing temperatures and atmospheres for electron transport layers and hole injection/transport layers modulate phase evolution, defect chemistry, conductivity, and interfacial energetics, yielding efficient and stable devices. Future optimization is needed to treat annealing as a distributed, layer‐specific design parameter to achieve QLEDs with high efficiency, long operational lifetime, and manufacturability.","abstract_hash":"fc2295e15dd2bd93c24b0fd9deaabf1662a8a947278a238a80c4d1cd95d5db7c","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":2,"novelty_reason":"属于对已有退火工艺的系统性综述与观点整理，未提出新机制或新器件结构，也无具体性能数据刷新。","innovation_zh":"这是一篇综述，系统梳理了退火温度对 QLED 性能的影响，按电子传输层、发光层、空穴传输/注入层和电极逐层展开，并区分 Cd 基与无 Cd（如 InP 基）体系。对 Cd 基量子点，指出 100°C–150°C 的中温退火可去除残余溶剂与配体、致密化 QD 薄膜、改善结晶性并优化载流子平衡，从而实现高外量子效率和长器件寿命；对 InP 基 QLED 则强调热预算更依赖工艺，高温步骤可用于 QD 合成或层间处理，但发光层的直接退火必须受壳层结构、配体稳定性和 QD/氧化物界面限制。其核心观点是把退火从单一工艺步骤提升为分层、分布式的设计参数，而非给出新的器件纪录。","method_zh":"综述形式，按器件各功能层（ETL、发光层、HTL/HIL、电极）分别讨论退火温度与气氛对相演化、缺陷化学、导电性和界面能级的影响，并对比 Cd 基与 InP 基量子点体系的热预算差异。","keywords_zh":["QLED","退火温度","无镉量子点","载流子平衡","界面工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:55.144Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adma.74429","doi":"10.1002/adma.74429","doi_url":"https://doi.org/10.1002/adma.74429","title":"A Bifunctional Colloidal Quantum Dot Diode for Nanosecond Short‐Wave Infrared Detection and Emission (Adv. Mater. 44/2026)","title_zh":"用于纳秒级短波红外探测与发射的双功能胶体量子点二极管","title_key":"abifunctionalcolloidalquantumdotdiodefornanosecondshortwaveinfrareddetectionandemissionadvmater442026","authors":["Yu‐Hao Deng","Dobromił Respekta","Jing Bai","et al."],"venue":"Advanced Materials","issn_l":"0935-9648","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials","display"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["胶体量子点","短波红外","双功能二极管","光电探测","电致发光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:53.901Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.ceramint.2026.08.120","doi":"10.1016/j.ceramint.2026.08.120","doi_url":"https://doi.org/10.1016/j.ceramint.2026.08.120","title":"Impact of Sr content into MgO nanoparticles as a working electrode for enhancing photovoltaic performance of quantum dot-sensitized solar cells","title_zh":"Sr 掺杂量对 MgO 纳米颗粒作为工作电极提升量子点敏化太阳能电池光伏性能的影响","title_key":"impactofsrcontentintomgonanoparticlesasaworkingelectrodeforenhancingphotovoltaicperformanceofquantumdotsensitizedsolarcells","authors":["Doaa A. Nasrallah","Mohamed A. Morsi","M.M. Seada","et al."],"venue":"Ceramics International","issn_l":"0272-8842","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["量子点敏化太阳能电池","MgO 纳米颗粒","Sr 掺杂","工作电极","光伏性能"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:54.713Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adpr.70263","doi":"10.1002/adpr.70263","doi_url":"https://doi.org/10.1002/adpr.70263","title":"Microcavity‐Enhanced High‐Radiance Infrared Lead Sulphide Colloidal Quantum Dot Light‐Emitting Diodes on Silicon","title_zh":"硅基微腔增强的高辐射亮度红外硫化铅胶体量子点发光二极管","title_key":"microcavityenhancedhighradianceinfraredleadsulphidecolloidalquantumdotlightemittingdiodesonsilicon","authors":["Aditya Malla","Mariona Dalmases","Rajesh Bera","et al."],"venue":"Advanced Photonics Research","issn_l":"2699-9293","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-01","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Shortwave infrared (SWIR) light‐emitting diodes (LEDs) are essential for next‐generation applications in machine vision, remote sensing, and communications; however, their performance in conventional bottom‐emission architectures is hampered by optical trapping in substrate modes and limited thermal dissipation on glass. In this work, we report high‐performance top‐emission quantum‐dot light‐emitting diodes (TQLEDs) based on colloidal lead sulphide (PbS) quantum dots that overcome these limitations. Critical to this architecture is the development of a high‐performance transparent conductive electrode optimized for the SWIR region. Integrating these electrodes into a low‐Q microcavity led to the modification of the far‐field radiation pattern, manifested by enhanced forward‐directed light emission and narrowed emission linewidth. Furthermore, the use of high‐thermal‐conductivity silicon as the carrier substrate enabled the devices to sustain significantly higher current densities compared to glass‐based counterparts. The synergy between resonant optical engineering and superior thermal management enabled a record‐high radiance exceeding 100 W sr −1 m −2 . Finally, we demonstrate the practical utility of these high‐flux emitters through the demonstration of active SWIR imaging of a see‐through undoped silicon wafer illuminated solely by active quantum‐dot LEDs (QLEDs). This work establishes top‐emission architectures on silicon as a viable pathway for integrated, high‐power infrared QLEDs.","abstract_hash":"ec80e1b591dfda0f03c97143a95e6b33d2583c1c0328a89675cad486c5f66f8b","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"顶发射+低Q微腔+硅衬底散热是一套明确的新结构组合，并带来 >100 W sr⁻¹ m⁻² 的辐射亮度和实际 SWIR 成像演示，但物理机制本身并非全新。","innovation_zh":"针对传统底发射 SWIR QLED 受衬底模式光困陷和玻璃散热差限制的问题，作者把 PbS 量子点 LED 做成顶发射结构并集成到低 Q 值微腔中，同时用高导热硅替代玻璃作衬底。微腔改变了远场辐射方向图，增强了前向出光并压窄了发射线宽；硅衬底则让器件能承受比玻璃基器件高得多的电流密度。两者结合实现了超过 100 W sr⁻¹ m⁻² 的辐射亮度（作者称为 record-high），并用该 QLED 单独照明实现了对未掺杂硅片的主动 SWIR 透视成像。","method_zh":"开发了针对 SWIR 波段优化的透明导电电极，将其与 PbS 量子点发光层集成进低 Q 微腔顶发射结构，并以高导热硅作为承载衬底。","keywords_zh":["顶发射QLED","PbS量子点","短波红外","微腔","硅基集成"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:56.619Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.mtadv.2026.100968","doi":"10.1016/j.mtadv.2026.100968","doi_url":"https://doi.org/10.1016/j.mtadv.2026.100968","title":"Facile synthesis of large-Stokes-shift giant CdHgSe/CdHgSeS near-infrared quantum dots via chlorine-mediated Ostwald ripening","title_zh":"氯介导的Ostwald熟化法简易合成大Stokes位移的巨型CdHgSe/CdHgSeS近红外量子点","title_key":"facilesynthesisoflargestokesshiftgiantcdhgsecdhgsesnearinfraredquantumdotsviachlorinemediatedostwaldripening","authors":["Gyudong Lee","Sanghwang Park","Jongcheol Seo","et al."],"venue":"Materials Today Advances","issn_l":"2590-0498","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-01","oa_status":"gold","pdf_url":"https://www.sciencedirect.com/science/article/pii/S2590049826002833/pdf","cited_by_count":0,"abstract":"Giant core/shell quantum dots (GQDs) offer advantages for optoelectronics, including suppressed blinking and reduced Auger recombination, yet thick-shell growth often requires laborious successive ion layer adsorption and reaction (SILAR) cycles. Here we demonstrate a chlorine-mediated controlled Ostwald ripening strategy that transforms NIR-emitting CdHgSe/CdS core/shell seed QDs into giant CdHgSe/CdHgSeS core/gradient-shell QDs in a single post-synthetic step. Seed QDs are prepared by growing a thin (∼1.6-monolayer) CdS shell on CdHgSe alloy cores. Injection of CHCl 3 at 240 °C triggers rapid ripening, in which most seeds dissolve while a minor population grows into GQDs. During ripening, the band-edge absorption feature is strongly attenuated and absorption below ∼610 nm increases markedly, whereas NIR emission remains centered near ∼900 nm, yielding a large effective Stokes shift that can mitigate reabsorption in luminescent solar concentrators. HAADF-STEM/EDS and XRD support a compositionally graded shell, while mass spectrometry and numerical simulations are consistent with chlorine-modified surface chemistry and altered monomer solubility/surface tension that accelerate ripening. As a proof of concept, embedding the GQDs in PMMA affords a transparent luminescent solar concentrator prototype with retained NIR emission and favorable spectral overlap with silicon photovoltaics.","abstract_hash":"2242d32269737476cda21ebe1241d659a14e9b90bda277abfbac1db8162968d1","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"用氯介导单步Ostwald熟化替代繁琐SILAR循环来生长巨型核/梯度壳量子点，并实现大Stokes位移与近红外发射保持，策略明确且性能有特色。","innovation_zh":"针对巨型核壳量子点通常需要繁琐的SILAR逐层生长问题，作者用氯介导的受控Ostwald熟化策略，在单次后合成步骤中把CdHgSe/CdS种子量子点（约1.6单层CdS壳）转化为CdHgSe/CdHgSeS巨型核/梯度壳量子点。240 °C注入CHCl₃触发快速熟化，多数种子溶解、少数长成GQD，过程中带边吸收显著减弱、~610 nm以下吸收明显增强，而~900 nm近红外发射位置基本保持，从而获得大有效Stokes位移。作为概念验证，将其嵌入PMMA制得透明发光太阳能聚光器原型，保持近红外发射并与硅光伏光谱匹配。","method_zh":"先在CdHgSe合金核上生长约1.6单层薄CdS壳作为种子，再于240 °C注入CHCl₃引发Ostwald熟化，一步得到组分梯度壳的巨型量子点；用HAADF-STEM/EDS、XRD、质谱和数值模拟表征结构与熟化机制。","keywords_zh":["巨型量子点","Ostwald熟化","近红外发射","大Stokes位移","发光太阳能聚光器"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:57.732Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1360/ssc-2026-0159","doi":"10.1360/ssc-2026-0159","doi_url":"https://doi.org/10.1360/ssc-2026-0159","title":"High PLQY NIR-II Ag2-yAuyX(X= S, Se, Te) Quantum Dots","title_zh":"高 PLQY 的 NIR-II Ag2-yAuyX (X = S, Se, Te) 量子点","title_key":"highplqyniriiag2yauyxxssetequantumdots","authors":["Yejun Zhang","Ziyan Zhang","Feng Ren","et al."],"venue":"Scientia Sinica Chimica","issn_l":"1006-9240","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-01","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-01","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"仅有标题，无摘要信息，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["Ag-Au-X 量子点","NIR-II 发光","高 PLQY","硫属化合物","量子点合成"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:56.304Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adfm.77443","doi":"10.1002/adfm.77443","doi_url":"https://doi.org/10.1002/adfm.77443","title":"Reconstructing Quantum Dot Surfaces via Dual‐Functional Ligand Pairing Enables Efficient Shortwave Infrared Optoelectronics","title_zh":"双功能配体配对重构量子点表面，实现高效短波红外光电器件","title_key":"reconstructingquantumdotsurfacesviadualfunctionalligandpairingenablesefficientshortwaveinfraredoptoelectronics","authors":["Dong-Eon Kim","Minjung Yang","Yunjin Lee","et al."],"venue":"Advanced Functional Materials","issn_l":"1616-301X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-31","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-31","oa_status":"hybrid","pdf_url":null,"cited_by_count":1,"abstract":"ABSTRACT The growing demand for efficient infrared photon harvesting has spotlighted colloidal quantum dots (CQDs) as versatile, solution‐processable absorbers for emerging optoelectronics, including photovoltaics (PVs), thermophotovoltaics (TPVs), and photodetectors (PDs). However, achieving narrow size distribution and complete surface passivation remains particularly challenging for shortwave infrared (SWIR) CQDs, limiting their potential in infrared optoelectronics. Here, we demonstrate a SWIR‐suited ligand‐pairing strategy to precisely tailor CQD surfaces during the synthesis and ligand‐exchange processes. A reactivity‐controlled thiourea‐based precursor results in improved size uniformity and colloidal stability, even for large CQDs. The resultant CQD surfaces are further reconstructed by dual‐functional HBr ligands that effectively remove native amine ligands and passivate (100) facets, simultaneously. As a result, the fabricated SWIR CQD optoelectronics exhibit 94.5% internal quantum efficiency, achieving notable performance across three key SWIR applications (PV, TPV, PD), thereby setting a new benchmark for solution‐processed SWIR optoelectronics.","abstract_hash":"3314b3ae9fcd98d26d118ee526b1f191fe4db5fb21a63af7f87201ee44d8c3d9","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials","display"],"novelty_score":4,"novelty_reason":"配体配对策略同时解决尺寸均匀性与表面钝化两个问题，并在三类短波红外器件上验证，内量子效率 94.5% 属明确性能提升，但摘要未给出与既有纪录的直接对比。","innovation_zh":"针对短波红外胶体量子点尺寸分布宽、表面钝化不完整的问题，作者提出一套配体配对策略，在合成和配体交换两个环节同时调控量子点表面：用反应活性可控的硫脲基前驱体改善大尺寸量子点的尺寸均匀性和胶体稳定性，再用双功能 HBr 配体同时去除原生胺配体并钝化 (100) 晶面。最终器件内量子效率达到 94.5%，在光伏、热光伏和光电探测三类短波红外应用中都给出了性能，作者称其为溶液加工短波红外光电器件的新基准。","method_zh":"合成阶段使用反应活性受控的硫脲基前驱体；配体交换阶段用双功能 HBr 配体去除原生胺并钝化 (100) 面，重构量子点表面。","keywords_zh":["短波红外","胶体量子点","配体交换","表面钝化","内量子效率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:57.742Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adom.71417","doi":"10.1002/adom.71417","doi_url":"https://doi.org/10.1002/adom.71417","title":"High‐Performance Quantum Dot Light‐Emitting Diodes Based on Self‐Assembled Ordered Monolayer Quantum Dots Film at Air‐Liquid Interface","title_zh":"基于气液界面自组装有序单层量子点薄膜的高性能量子点发光二极管","title_key":"highperformancequantumdotlightemittingdiodesbasedonselfassembledorderedmonolayerquantumdotsfilmatairliquidinterface","authors":["Boxi Meng","Yunqi Wang","Yan Fang","et al."],"venue":"Advanced Optical Materials","issn_l":"2195-1071","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-31","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-31","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT A high‐quality quantum dots (QDs) layer is crucial for the commercialization of quantum dot light‐emitting diode (QLED) devices. However, current fabrication techniques cannot simultaneously achieve monolayer coverage, ordered arrangement, and large‐area scalability. Herein, we develop a novel strategy of continuous stepwise self‐assembly for QDs monolayer integrated the air‐liquid interfacial assembly technology with continuous line‐ink‐supply and Langmuir‐Schaefer (LS) technology, which the QDs can be finely to assemble into large area ordered and dense QDs monolayer film at the trailing edge of the flow. The ordered QD monolayers can be repeatedly transferred and stacked to accurately control the thickness of the luminescent layer in QLED devices. Green QLED based on this monolayer film reaches a high EQE of 23.85%. Furthermore, the optimized trilayer device exhibits negligible efficiency roll‐off, retaining an EQE above 18% and a luminous efficacy of 60 lm W −1 at a luminance of 200 000 cd m −2 . This methodology also shows preliminary scalability potential. We achieved a trial fabrication of large‐area QD films of 210 cm 2 and further constructed corresponding QLED devices with an emission area of 1.5 cm × 1.5 cm as an initial exploration.","abstract_hash":"35cc61f507050b8e0ffe1f64db277e56d0327bb310c14cc6511fd7d0fa7a306a","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"提出了兼顾单层覆盖、有序排列与大面积扩展的连续自组装成膜新策略，并据此获得 23.85% EQE 与低滚降的高性能绿光 QLED。","innovation_zh":"针对现有量子点成膜方法难以同时兼顾单层覆盖、有序排列和大面积可扩展的问题，作者提出了一种连续阶梯式自组装策略，把气液界面组装与连续供墨、Langmuir-Schaefer（LS）技术结合起来，使量子点在流动尾部区域组装成大面积有序致密的单层膜。该单层膜可反复转移堆叠以精确控制发光层厚度，基于此的绿光 QLED 外量子效率达到 23.85%，三层器件在 200 000 cd m⁻² 亮度下效率滚降可忽略，EQE 仍高于 18%、发光效能 60 lm W⁻¹，并初步验证了 210 cm² 大面积成膜与 1.5 cm × 1.5 cm 发光面积器件的可行性。","method_zh":"将气液界面组装技术与连续线供墨、Langmuir-Schaefer 转移结合，形成连续阶梯式自组装，在流动尾部边缘得到大面积有序致密量子点单层膜，并通过重复转移堆叠调控发光层厚度。","keywords_zh":["量子点发光二极管","自组装单层膜","气液界面","Langmuir-Schaefer","效率滚降"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:59.337Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/smll.74913","doi":"10.1002/smll.74913","doi_url":"https://doi.org/10.1002/smll.74913","title":"Copper‐Catalyzed Cation Exchange in CdSe/ZnSe Colloidal Nanoplatelets Enables Spectrally Tunable Narrow‐Linewidth Emission","title_zh":"铜催化 CdSe/ZnSe 胶体纳米片中的阳离子交换实现光谱可调窄线宽发光","title_key":"coppercatalyzedcationexchangeincdseznsecolloidalnanoplateletsenablesspectrallytunablenarrowlinewidthemission","authors":["Muhammed Burhan Sanlier","Cagatay Han Aldemir","Alp Yilmaz","et al."],"venue":"Small","issn_l":"1613-6810","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-31","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-31","oa_status":"green","pdf_url":null,"cited_by_count":0,"abstract":"2D colloidal nanoplatelets (NPLs) are highly attractive for light-emitting devices (LEDs) due to their thickness-dependent electronic structure and distinct excitonic properties. However, most heterostructured core/shell NPLs predominantly emit in the red spectral region and extending their emission toward shorter wavelengths while preserving optical properties remains a major challenge. Here, we demonstrate a copper-catalyzed cation exchange strategy in CdSe/ZnSe core/shell NPLs that enables continuous spectral tuning. By introducing trace amounts of copper to promote cation diffusion, the emission wavelength can be tuned from 620 to 484 nm, while achieving emission linewidths as narrow as ∼12 nm, among the lowest reported for CdZnSe-based NPLs. The copper concentration serves as an additional key parameter to control the extent of the cation exchange process and the resulting optical properties. Subsequent ZnS shell deposition significantly enhances the photoluminescence quantum yield, reaching near-unity values for red-emitting NPLs and increasing to ∼70% and ∼20% for green- and blue-emitting NPLs, respectively. Using these spectrally tunable and narrow-emitting NPLs, we further demonstrate color-conversion white LEDs with an external quantum efficiency of 30%. These results establish copper-catalyzed cation exchange as a powerful strategy for engineering spectrally tunable NPLs with narrow emission linewidth, providing a viable pathway toward next-generation display technologies.","abstract_hash":"f16a21491d9379d7e8ebd3f9d5ea5286b05b146e6ca72f096cbd4c82cead7c27","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用铜催化阳离子交换这一新策略在核壳 NPL 中实现宽范围光谱调谐并保持窄线宽，同时给出明确的器件效率，属于有新结构/新策略且性能提升显著的工作。","innovation_zh":"针对核壳结构纳米片（NPL）发光大多局限在红光、难以在保持光学质量的前提下向短波拓展的问题，作者在 CdSe/ZnSe 核壳 NPL 中引入痕量铜催化阳离子扩散，实现 620–484 nm 的连续光谱调谐，同时保持约 12 nm 的窄发射线宽（作者称是 CdZnSe 基 NPL 中最低之列）。铜浓度本身成为调控阳离子交换程度和光学性质的关键参数；后续再包覆 ZnS 壳层把 PLQY 大幅提升，红光接近 100%，绿光约 70%，蓝光约 20%。用这些 NPL 做色转换白光 LED，外量子效率达到 30%。","method_zh":"在 CdSe/ZnSe 核/壳胶体纳米片中加入痕量铜催化阳离子交换以调节组分与发光波长，随后沉积 ZnS 壳层钝化提升量子产率，并以此制备色转换白光 LED。","keywords_zh":["纳米片","阳离子交换","窄线宽发光","白光LED","ZnS壳层"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:59.334Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.mtchem.2026.103895","doi":"10.1016/j.mtchem.2026.103895","doi_url":"https://doi.org/10.1016/j.mtchem.2026.103895","title":"Synergistic bulk doping and interfacial passivation for highly efficient and stable SnO2-Based quantum dot light-emitting diodes","title_zh":"体相掺杂与界面钝化协同实现高效稳定的SnO2基量子点发光二极管","title_key":"synergisticbulkdopingandinterfacialpassivationforhighlyefficientandstablesno2basedquantumdotlightemittingdiodes","authors":["Guofa Li","Renjie Xiang","Huahao Wu","et al."],"venue":"Materials Today Chemistry","issn_l":"2468-5194","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-30","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-30","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Quantum dot light-emitting diodes (QLEDs) often suffer from limited performance due to interfacial defects and imbalanced carrier injection in the electron transport layer (ETL). Here, we present a synergistic strategy that integrates bulk doping and interfacial passivation to enhance device performance. Ni2+-doped SnO2 nanoparticles (NSO) are employed to regulate electron transport and suppress oxygen vacancies within the ETL. As a result, QLEDs based on NSO achieve an external quantum efficiency (EQE) of 16.1%. To further reduce interfacial defects, a ZnCl2 interlayer is introduced between the ETL and the quantum dot emissive layer. This interlayer effectively passivates defects on both SnO2 and quantum dot surfaces. Consequently, the device EQE increases to 24.3%, while the T95 operational lifetime (@1000 cd m-2) reaches 2325.1 h, representing a 2.1-fold improvement. These results demonstrate that combining bulk mobility regulation with interfacial defect passivation is an effective approach for improving SnO2-based QLEDs.","abstract_hash":"165e71d71a65ef174ada6b2ae6ed61a68ccb2329ddd45ee5d8530d0901ffe18c","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"体相掺杂与界面钝化协同策略明确，EQE从16.1%提升到24.3%且寿命提升2.1倍，性能提升显著，但属于已有思路的组合优化而非全新机制。","innovation_zh":"针对SnO2电子传输层界面缺陷多、载流子注入不平衡的问题，作者把Ni2+体相掺杂和ZnCl2界面钝化结合起来：Ni2+掺杂SnO2（NSO）用来调控电子传输并抑制氧空位，器件EQE达到16.1%；再在ETL与量子点发光层之间插入ZnCl2中间层，同时钝化SnO2和量子点表面缺陷，EQE进一步提升到24.3%，T95工作寿命（@1000 cd m-2）达到2325.1 h，比原来提升2.1倍。","method_zh":"以Ni2+掺杂的SnO2纳米颗粒作电子传输层，并在ETL/量子点界面引入ZnCl2中间层进行缺陷钝化，构建体相掺杂+界面钝化协同的QLED结构。","keywords_zh":["量子点发光二极管","SnO2电子传输层","Ni2+掺杂","ZnCl2界面钝化","器件寿命"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:00.066Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.chemmater.6c01124","doi":"10.1021/acs.chemmater.6c01124","doi_url":"https://doi.org/10.1021/acs.chemmater.6c01124","title":"A Standardized Platform for QLED Fabrication and Characterization","title_zh":"一个标准化的QLED制备与表征平台","title_key":"astandardizedplatformforqledfabricationandcharacterization","authors":["Yiman Xu","Grant J. Dixon","Fangyuan Jiang","et al."],"venue":"Chemistry of Materials","issn_l":"0897-4756","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-29","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-29","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"In recent years, quantum dot light-emitting diodes (QLEDs) have achieved record-high performance, driven by rapid advances in active materials and device engineering. However, fabrication remains a significant barrier for new researchers entering the field, and variability in measurement techniques complicates direct comparison of device performance. Here, we establish a standardized and reproducible protocol for QLED fabrication and characterization, designed to lower the technical threshold, improve experimental reliability, and ensure accurate performance assessment. The protocol was independently validated by researchers with different levels of experience. In addition, we provide detailed troubleshooting guidelines and identify key sources of variability in QLED devices. By integrating electron transport material synthesis, optimized thin-film processing, and standardized device characterization procedures, this protocol ensures consistent device performance and promotes broader adoption of QLED technology across the research community.","abstract_hash":"dbd579300cb6eeeed399151295650d428b2e5be8d5cc01bec209424a67c94a0f","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"属于方法学与标准化层面的工作，不涉及新物理机制或性能纪录，但对领域可复现性有实际价值。","innovation_zh":"这篇论文不是报道新的QLED效率纪录，而是针对领域内制备门槛高、测量方法不统一导致器件性能难以横向比较的问题，建立了一套标准化、可复现的QLED制备与表征流程。其新意在于把电子传输材料的合成、优化后的薄膜工艺和标准化器件表征整合进同一套协议，并由不同经验水平的研究者独立验证了可复现性，同时给出了详细的排错指南并指出了QLED器件中变异性的主要来源。","method_zh":"协议整合了电子传输材料的合成、优化的薄膜加工工艺以及标准化的器件表征流程，并通过不同经验背景研究者的独立实验进行验证。","keywords_zh":["QLED","标准化协议","可复现性","器件表征","电子传输材料"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:59.836Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adma.74386","doi":"10.1002/adma.74386","doi_url":"https://doi.org/10.1002/adma.74386","title":"Siloxane Molecular Glue for Ultrarobust Interface Engineering in High‐Performance Colloidal Quantum Dot Infrared Image Sensors","title_zh":"硅氧烷分子胶用于高性能胶体量子点红外图像传感器的超稳固界面工程","title_key":"siloxanemolecularglueforultrarobustinterfaceengineeringinhighperformancecolloidalquantumdotinfraredimagesensors","authors":["Haipeng Su","Jingjing Wang","Chengjie Deng","et al."],"venue":"Advanced Materials","issn_l":"0935-9648","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Interfacial defects and poor mechanical robustness critically limit the performance of colloidal quantum dot (CQD) photodiodes for infrared imaging. Here, we introduce a bifunctional organosilane, (3‐mercaptopropyl) methyldimethoxysilane (MDMS), as an interfacial layer to simultaneously address these challenges in inverted PbS CQD photodiodes. MDMS molecules form robust covalent bridging at the CQDs/electron transport layer (ETL) interface through thiol‐based coordination and hydrolysis‐condensation into a cross‐linked siloxane network. This interface engineering not only reinforces mechanical adhesion (achieving 5B rating in ASTM D3359 tests vs. 0B/1B for C 60 controls) but also provides an ideal nucleation surface for ALD‐grown SnO 2 ETL, suppressing island‐like growth and interfacial defects. The optimized devices deliver a specific detectivity of 2.37×10 12 Jones at 1550 nm under 0 V while maintaining 79% EQE under −0.1 V, with dark current reduced by >50% compared to C 60 ‐based controls. Monolithic integration with a silicon ROIC yields a SWIR imager with outstanding photoresponse non‐uniformity (2.8%) and spatial resolution (26 lp/mm at 50% MTF), demonstrating silicon wafer perspectivity and material discrimination. This work provides an efficient strategy for addressing interfacial issues in CQD optoelectronics.","abstract_hash":"5aad2c894dbcffb337b137c7dbe7af83e871b2e34a1a0814dc6af257085ca4cc","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":4,"novelty_reason":"用双功能硅烷分子胶同时解决界面缺陷与机械附着力两个问题，并给出暗电流、比探测率和成像器均匀性的量化提升，属于明确的新界面策略。","innovation_zh":"针对 PbS 胶体量子点光电二极管中界面缺陷和机械稳定性差的问题，作者引入双功能有机硅烷 MDMS 作为界面层：硫醇端与量子点配位，甲氧基硅烷水解缩合成交联硅氧烷网络，把 CQD/ETL 界面共价桥接起来。这一层既把机械附着力从 C60 对照的 0B/1B 提升到 ASTM D3359 的 5B 级，又为 ALD 生长的 SnO2 ETL 提供理想成核表面，抑制岛状生长和界面缺陷。器件在 1550 nm、0 V 下比探测率达 2.37×10^12 Jones，−0.1 V 下 EQE 保持 79%，暗电流相比 C60 对照降低超过 50%；与硅 ROIC 单片集成后做出 SWIR 成像器，光响应非均匀性 2.8%，50% MTF 下空间分辨率 26 lp/mm。","method_zh":"在倒置 PbS CQD 光电二极管的 CQD/ETL 界面插入 (3-巯基丙基)甲基二甲氧基硅烷（MDMS），通过硫醇配位与水解-缩合形成交联硅氧烷网络，并在其上用 ALD 生长 SnO2 作为电子传输层。","keywords_zh":["胶体量子点","界面工程","有机硅烷","短波红外成像","SnO2 电子传输层"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:11.579Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpcc.6c02911","doi":"10.1021/acs.jpcc.6c02911","doi_url":"https://doi.org/10.1021/acs.jpcc.6c02911","title":"Facet-Selective Multidentate Passivation for Suppressing Defects in PbS Colloidal Quantum Dot Photodiodes","title_zh":"面向 PbS 胶体量子点光电二极管的晶面选择性多齿钝化策略：抑制缺陷","title_key":"facetselectivemultidentatepassivationforsuppressingdefectsinpbscolloidalquantumdotphotodiodes","authors":["Huilei Shi","Yichuan Wang","Chengjie Deng","et al."],"venue":"The Journal of Physical Chemistry C","issn_l":"1932-7447","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Lead sulfide (PbS) colloidal quantum dots (CQDs) are highly promising materials for short-wave infrared (SWIR) optoelectronics, but their performance is frequently limited by facet-dependent surface defects and energetic disorder. Specifically, the (100) facets prevalent in larger quantum dots are highly susceptible to ligand stripping and trap formation, which induce nonradiative recombination and limit device efficiency. In this work, we demonstrate a facet-selective supplementary passivation strategy, utilizing 2,6-bis(aminomethyl)pyridine (DAMP) to specifically target undercoordinated lead-rich sites on PbS (100) surfaces. Acting synergistically with conventional halide treatments, the multidentate DAMP molecules selectively anchor to the exposed (100) facets, significantly suppressing band-edge energetic disorder and defect-assisted leakage pathways. Consequently, our DAMP-passivated PbS CQD photodiodes exhibit a 2.5-fold reduction in dark current density at a reverse bias of −0.5 V and achieve an improved specific detectivity of 1.86 × 1012 Jones. Furthermore, we successfully integrate this surface engineering strategy into a 640 × 512 focal plane array (FPA). This imaging array exhibits high-resolution short-wave infrared (SWIR) capability, enabling precise material identification and subsurface defect detection, as demonstrated by distinguishing similar solvents, revealing internal defects in biological samples, and differentiating visually indistinguishable substances. Ultimately, this facet-aware passivation approach provides a highly effective and scalable pathway for realizing high-sensitivity, next-generation SWIR optoelectronic technologies.","abstract_hash":"64fb5694d4f9d48f6d8cf82318bb82f89cb4099f27d9e7f65adc08ae4858dda3","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"提出晶面选择性的多齿配体补充钝化策略，明确针对 (100) 面缺陷，并给出暗电流降低 2.5 倍、比探测率 1.86 × 10^12 Jones 的具体性能提升及焦平面阵列演示。","innovation_zh":"针对 PbS 量子点中 (100) 晶面易脱配体、易形成陷阱的问题，作者用多齿配体 DAMP（2,6-双(氨甲基)吡啶）选择性地锚定在 PbS (100) 面上欠配位的富铅位点，与常规卤素处理协同作用，抑制带边能级无序和缺陷辅助漏电通道。器件在 −0.5 V 反偏下暗电流密度降低 2.5 倍，比探测率达到 1.86 × 10^12 Jones，并把该钝化策略集成到 640 × 512 焦平面阵列上，实现了短波红外成像，可区分相似溶剂、识别生物样品内部缺陷和肉眼难辨的物质。","method_zh":"在常规卤素钝化基础上引入多齿配体 DAMP 作为补充钝化剂，利用其对 PbS (100) 面富铅欠配位位点的选择性锚定实现晶面选择性钝化，并制备光电二极管与 640 × 512 焦平面阵列进行成像验证。","keywords_zh":["PbS 胶体量子点","晶面选择性钝化","多齿配体","短波红外光电二极管","焦平面阵列"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:02.181Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s41565-026-02237-7","doi":"10.1038/s41565-026-02237-7","doi_url":"https://doi.org/10.1038/s41565-026-02237-7","title":"Integrated blue ZnSe/ZnS quantum dot lasers on a silicon nitride platform","title_zh":"集成在氮化硅平台上的蓝光 ZnSe/ZnS 量子点激光器","title_key":"integratedblueznseznsquantumdotlasersonasiliconnitrideplatform","authors":["Jinhua He","Korneel Molkens","Dries Van Thourhout","et al."],"venue":"Nature Nanotechnology","issn_l":"1748-3387","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-27","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-27","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["ZnSe/ZnS 量子点","蓝光激光器","氮化硅光子平台","集成激光器"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:01.055Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/1402-4896/ae9146","doi":"10.1088/1402-4896/ae9146","doi_url":"https://doi.org/10.1088/1402-4896/ae9146","title":"Suppressing carrier thermal escape in InAs/GaAs sub-monolayer quantum dots by tuning Al 0.3 Ga 0.7 As barrier insertion layer thickness","title_zh":"通过调控 Al0.3Ga0.7As 势垒插入层厚度抑制 InAs/GaAs 亚单层量子点中的载流子热逃逸","title_key":"suppressingcarrierthermalescapeininasgaassubmonolayerquantumdotsbytuningal03ga07asbarrierinsertionlayerthickness","authors":["Jing Zhang","Zihao Zhuo","Shufang Ma","et al."],"venue":"Physica Scripta","issn_l":"0031-8949","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-27","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-27","oa_status":"hybrid","pdf_url":"https://iopscience.iop.org/article/10.1088/1402-4896/ae9146/pdf","cited_by_count":0,"abstract":"Abstract In this work, multi-period InAs/GaAs sub-monolayer quantum dot (SML-QDs) structures embedded with Al 0 . 3 Ga 0 . 7 As barrier insertion layers of 0, 1, 2, and 3 nm were prepared by molecular beam epitaxy under a fixed total barrier thickness. The morphology, strain, and optical properties of the samples were thoroughly evaluated through atomic force microscopy, high-resolution x-ray diffraction (HRXRD), and temperature-dependent photoluminescence (PL) spectroscopy. The experimental results demonstrate that the sample with a 3 nm Al 0 . 3 Ga 0 . 7 As insertion layer exhibits superior optical quality at room temperature (300 K), manifesting both the highest PL emission intensity and the narrowest full width at half maximum (16.3 nm). Moreover, temperature-dependent PL spectroscopy and Arrhenius fitting analysis indicate that this sample retains a certain PL intensity at 250 K, and its carrier activation energy reaches as high as 105 meV. Therefore, incorporating the Al 0 . 3 Ga 0 . 7 As barrier insertion layer can effectively suppress the carrier thermal escape that readily occurs at high temperatures in InAs/GaAs SML-QDs, thereby improving the device emission efficiency.","abstract_hash":"5e8acfac19fa7835f0bd054e432aab4103e45e67684c152f9448700c7b548fb9","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"在已有 SML-QDs 体系中通过势垒插入层厚度调控来抑制热逃逸，属于对已有思路的系统验证与渐进优化，未见新机制或新器件结构。","innovation_zh":"针对 InAs/GaAs 亚单层量子点（SML-QDs）在高温下容易发生载流子热逃逸的问题，作者在固定总势垒厚度的前提下插入不同厚度（0、1、2、3 nm）的 Al0.3Ga0.7As 势垒层，系统比较了其对形貌、应变和光学性质的影响。结果显示 3 nm 插入层样品的室温光学质量最好：PL 发射强度最高、半高全宽最窄（16.3 nm），250 K 下仍保留一定 PL 强度，Arrhenius 拟合得到的载流子激活能高达 105 meV。这说明插入 Al0.3Ga0.7As 势垒层能有效抑制高温载流子热逃逸，从而提升器件发光效率。","method_zh":"用分子束外延在固定总势垒厚度下生长多周期 InAs/GaAs SML-QDs，并插入 0–3 nm 的 Al0.3Ga0.7As 层；通过 AFM、HRXRD 和变温 PL 光谱表征形貌、应变与光学性质，并用 Arrhenius 拟合提取载流子激活能。","keywords_zh":["亚单层量子点","AlGaAs 势垒插入层","载流子热逃逸","变温光致发光","激活能"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:03.179Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.54254/2753-8818/2026.gl35727","doi":"10.54254/2753-8818/2026.gl35727","doi_url":"https://doi.org/10.54254/2753-8818/2026.gl35727","title":"Material Advantages and Device Challenges of Ag₂Se Quantum Dots for Near-Infrared QLED Applications","title_zh":"Ag₂Se 量子点在近红外 QLED 中的材料优势与器件挑战","title_key":"materialadvantagesanddevicechallengesofag2sequantumdotsfornearinfraredqledapplications","authors":["Zheyu Deng"],"venue":"Theoretical and Natural Science","issn_l":"2753-8818","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-27","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-27","oa_status":"hybrid","pdf_url":"https://tns.ewapub.com/article/view/35727.pdf","cited_by_count":0,"abstract":"Near-infrared quantum-dot light-emitting diodes (NIR QLEDs) are being investigated for applications such as optical communication, sensing, imaging, and emerging display technologies. However, many established near-infrared quantum dots, such as CdSe- and PbS-based materials, or other heavy-metal-containing materials. Their toxicity presents an important obstacle to large-scale manufacturing, disposal, and commercial use. Ag₂Se quantum dots offer a possible alternative. They have several attractive features for near-infrared optoelectronic devices, including a narrow bandgap, near-infrared emission, and compatibility with solution-based processing. However, these material advantages have not yet been fully translated into high-performance NIR QLEDs. At present, the development of Ag₂Se-based NIR QLEDs is still at an early stage, mainly because device performance is affected by several issues, such as surface defects, non-radiative recombination, insulating long-chain ligands, imbalanced charge injection, poor film quality, and limited operational stability. This work reviews the principal material advantages of Ag₂Se quantum dots and discusses the major challenges associated with their integration into NIR QLEDs. Potential improvement strategies, including surface passivation, ligand exchange, carrier-transport-layer optimization, interface engineering, and device encapsulation, are also evaluated. Overall, Ag₂Se QDs have considerable promise for lower-toxicity NIR light-emitting devices. However, further progress in synthesis reproducibility, film formation, and operational stability is still needed.","abstract_hash":"ebf35dc9a3718adcd9de6c26745b302789a83ec14832cc9456ee2bcb29ba484b","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":2,"novelty_reason":"属综述性总结，未提出新机制或新器件，仅对已有材料优势与器件挑战做归纳。","innovation_zh":"这是一篇综述而非原创实验工作，核心是把 Ag₂Se 量子点作为无重金属近红外发光材料的优势与器件瓶颈系统梳理了一遍。作者指出 Ag₂Se 具备窄带隙、近红外发射和溶液加工兼容性，可绕开 CdSe、PbS 等含重金属体系的毒性问题，但目前 Ag₂Se 基 NIR QLED 仍处早期阶段，性能受表面缺陷、非辐射复合、绝缘长链配体、电荷注入不平衡、薄膜质量差和工作稳定性有限等问题制约。文章进一步评估了表面钝化、配体交换、载流子传输层优化、界面工程和器件封装等改进策略，并指出合成重现性、成膜和运行稳定性仍需突破。","method_zh":"综述性工作，通过梳理 Ag₂Se 量子点的材料特性与 NIR QLED 器件集成中的问题，归纳并评估若干器件优化策略，未涉及具体实验或器件制备。","keywords_zh":["Ag₂Se 量子点","近红外 QLED","无重金属","表面钝化","器件稳定性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:03.727Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1063/5.0327615","doi":"10.1063/5.0327615","doi_url":"https://doi.org/10.1063/5.0327615","title":"Efficient sub-bandgap excitation in near-infrared luminescence of modulation-doped InAs quantum dot system","title_zh":"调制掺杂 InAs 量子点体系中近红外发光的高效亚带隙激发","title_key":"efficientsubbandgapexcitationinnearinfraredluminescenceofmodulationdopedinasquantumdotsystem","authors":["Ke Yu","Cheng Jiang","Debao Zhang","et al."],"venue":"Applied Physics Letters","issn_l":"0003-6951","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-27","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-27","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"This study investigates highly efficient sub-bandgap excitation and roles of donor–acceptor (D–A) pairs in Si modulation-doped InAs/GaAs quantum dot (QD) systems with low-temperature variable-excitation wavelength photoluminescence (PL) spectroscopy. Such a D–A pair is tentatively assigned to a pair of Si donor and C acceptor with the PL emission at 831.5 nm. It is shown that the resonant excitation of this D–A pair can significantly enhance the near-infrared emission of the InAs QDs, yielding a PL intensity comparable to that under near-band edge excitation. The modulation doping of Si is found to make the D–A pair be in the D+–A− state, which enables efficient sub-bandgap optical excitation. Owing to the proximity (5 nm) between the doped Si donor layers and the QD layers, the D–A pairs strongly couple with both the QDs and GaAs barriers, leading to direct carrier transfer from the excited D–A pairs to QDs and therefore enhanced QD emission. This work reveals the impact of D–A pairs on carrier interactions in the InAs/GaAs QD systems and demonstrates an efficient strategy to engineer carrier interactions by spatial modulation of donor/acceptor dopants in semiconductor quantum structures.","abstract_hash":"3b476449b89f64719d68c9e2cb5d21ff0f892ff54b38e67d8c9735b640e94803","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"把调制掺杂形成的 D-A 对作为亚带隙敏化通道来增强量子点发光，并给出 5 nm 近距耦合的直接载流子转移图像，属于明确的新策略而非单纯优化。","innovation_zh":"在 Si 调制掺杂的 InAs/GaAs 量子点体系中，作者发现了一个发光峰位于 831.5 nm 的施主-受主（D-A）对，暂指认为 Si 施主与 C 受主的配对。对该 D-A 对做共振激发，可以显著增强 InAs 量子点的近红外发光，强度可与近带边激发相当，也就是实现了高效的亚带隙激发。机理上，Si 调制掺杂使 D-A 对处于 D+–A− 状态，加上掺杂 Si 施主层与量子点层仅相距 5 nm，D-A 对同时与量子点和 GaAs 势垒强耦合，被激发的 D-A 对可直接把载流子转移给量子点。","method_zh":"用低温变激发波长光致发光（PL）光谱研究 Si 调制掺杂 InAs/GaAs 量子点体系，通过共振激发 831.5 nm 的 D-A 对来考察其对量子点发光的增强作用。","keywords_zh":["InAs/GaAs 量子点","调制掺杂","施主-受主对","亚带隙激发","载流子转移"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:04.907Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsnano.6c08987","doi":"10.1021/acsnano.6c08987","doi_url":"https://doi.org/10.1021/acsnano.6c08987","title":"Engineering Ultrahigh-Resolution Quantum Dot Light-Emitting Diodes through Stretch-Assisted Transfer Printing","title_zh":"通过拉伸辅助转印印刷制备超高分辨率量子点发光二极管","title_key":"engineeringultrahighresolutionquantumdotlightemittingdiodesthroughstretchassistedtransferprinting","authors":["Sen Tian","J Li","Wei Zhang","et al."],"venue":"ACS Nano","issn_l":"1936-0851","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-25","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-25","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"High-resolution quantum-dot light-emitting diodes (QLEDs) are pivotal for the development of next-generation displays. While transfer printing is effective for fabricating high-resolution QLEDs with small pixels, accurately transferring nanoscale patterns with narrow spacing and gaps remains a challenge, limiting achievable pixel densities. Here, we report a robust stretch-assisted transfer printing strategy for fabricating QLEDs with ultrahigh pixel density. This method overcomes the challenge of transferring nanoscale patterns with narrow spacing and gaps by temporarily expanding feature spacing via applied strain. Efficient QD transfer is achieved, and upon strain release, the spacing contracts to form ultrahigh-resolution nanopatterns. As a result, red, green, and blue QD nanopatterns with an ultrahigh resolution of 33,400 pixels per inch (PPI) and a record-minimum gap of 270 nm are achieved. Thanks to the closely packed QD nanopatterns, leakage current is effectively suppressed, enabling the fabrication of high-performance, ultrahigh-resolution red QLEDs (33,400 PPI) with an average external quantum efficiency (EQE) of approximately 20.3%. Both green and blue QLEDs show no significant efficiency degradation at these nanoscale dimensions. This work provides an additional route for high-performance, ultrahigh-resolution QLEDs.","abstract_hash":"c0a42a8a7f797d1deb47f66c8ebf04747be4dd156bb818ccd87d1c87bfb7012d","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用应变临时扩距的思路解决了窄间距纳米图案转印难题，并给出 33,400 PPI、270 nm 间隙和约 20.3% EQE 的具体指标，属于明确的新策略加显著性能提升。","innovation_zh":"针对转印印刷在制备小像素高分辨率 QLED 时难以精确转移窄间距、窄间隙纳米图案的问题，作者提出拉伸辅助转印策略：先施加应变临时拉开图案间距，完成量子点转移后释放应变使间距收缩，从而形成超高分辨率纳米图案。实现了红、绿、蓝三色 QD 纳米图案 33,400 PPI 的分辨率和 270 nm 的最小间隙纪录；由于图案紧密排列有效抑制了漏电流，红色 QLED（33,400 PPI）平均外量子效率约 20.3%，绿、蓝器件在该纳米尺度下效率无明显下降。","method_zh":"在转印过程中对弹性印章/基底施加应变，使纳米图案特征间距临时扩大以降低转移难度，转移量子点后释放应变让间距收缩，形成高密度紧密排列的 QD 纳米图案并构筑 QLED。","keywords_zh":["量子点发光二极管","转印印刷","超高分辨率","像素密度","外量子效率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:06.016Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsaelm.6c00783","doi":"10.1021/acsaelm.6c00783","doi_url":"https://doi.org/10.1021/acsaelm.6c00783","title":"One-Step Directly Synthesized Dual-Ligand PbS Quantum Dot Inks via Heterocyclic Ligand Coordination for Efficient Hole Transport Layer","title_zh":"通过杂环配体配位一步直接合成双配体 PbS 量子点墨水用于高效空穴传输层","title_key":"onestepdirectlysynthesizeddualligandpbsquantumdotinksviaheterocyclicligandcoordinationforefficientholetransportlayer","authors":["Yu Yin","Leliang Song","Xiaobo Ding","et al."],"venue":"ACS Applied Electronic Materials","issn_l":"2637-6113","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-25","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-25","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Hole transport layers (HTLs) in colloidal quantum dot (QD) solar cells are conventionally prepared through multi-step ligand exchange processes, which often induce surface damage and trap-state defects. To address these limitations, this work presents an inorganic–organic in situ synergistic passivation strategy for the one-step synthesis of a stable dual-ligand p-type PbS QD conductive ink. Employing lead thiocyanate (Pb(SCN)2) as the precursor together with 2-furanmethanethiol (FMT) as the synergistic ligand enables the formation of a dual-ligand co-adsorption network. The resulting PbS QD conductive ink forms a p-type conducting interfacial layer with favorable cascade energy-level alignment and reduces the trap-state density (tDOS) by approximately 38%. Utilizing this directly synthesized p-type PbS QD conductive ink as the HTL, the resulting solar cells achieve a champion power conversion efficiency (PCE) of 13.60%, enabled by prolonged carrier lifetimes and accelerated charge extraction kinetics. This work establishes a practical chemical design strategy for engineering PbS QD interfaces and simplifying HTL fabrication.","abstract_hash":"e4259bdee5803320002a910920c415a548e22a02f007f8e0054fd721588ba838","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"用双配体原位协同钝化一步合成 p 型 PbS 量子点墨水替代多步配体交换，tDOS 降约 38% 且 PCE 达 13.60%，属明确的新策略并带来显著性能提升。","innovation_zh":"针对胶体量子点太阳能电池空穴传输层通常需要多步配体交换、易造成表面损伤和陷阱态的问题，作者提出一种无机-有机原位协同钝化策略，用 Pb(SCN)2 作前驱体、2-呋喃甲硫醇（FMT）作协同配体，一步合成稳定的双配体 p 型 PbS 量子点导电墨水。该墨水形成级联能级排列的 p 型导电界面层，将陷阱态密度（tDOS）降低约 38%，用作 HTL 后器件最高 PCE 达 13.60%，载流子寿命延长、电荷提取加快。","method_zh":"以 Pb(SCN)2 为前驱体、FMT 为协同配体，通过双配体共吸附网络一步合成 p 型 PbS 量子点导电墨水，直接作为空穴传输层构建太阳能电池。","keywords_zh":["PbS 量子点","空穴传输层","双配体钝化","量子点太阳能电池","导电墨水"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:06.365Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsphotonics.6c00397","doi":"10.1021/acsphotonics.6c00397","doi_url":"https://doi.org/10.1021/acsphotonics.6c00397","title":"Nanowire Quantum Dot Emitters Evanescently Coupled On-Chip via Curved and Segmented SiN Waveguides","title_zh":"纳米线量子点发射器通过弯曲分段 SiN 波导实现片上倏逝耦合","title_key":"nanowirequantumdotemittersevanescentlycoupledonchipviacurvedandsegmentedsinwaveguides","authors":["Edith Yeung","Kataryna Sorensen","David B. Northeast","et al."],"venue":"ACS Photonics","issn_l":"2330-4022","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-24","oa_status":"hybrid","pdf_url":null,"cited_by_count":1,"abstract":"Abstract This work implements a hybrid device based on a semiconductor quantum dot embedded within a nanowire to bridge a noncontinuous curved waveguide structure. The geometry takes advantage of evanescent coupling between the photonic structures to recover single photons emitted from both outputs of the device. Auto- and cross-correlation measurements were performed on different output facets of the device. We demonstrate single-photon emission from both ends of the nanowire for both neutral, X and XX, and charged X–, excitonic complexes. We further demonstrate the cascaded XX – X emission by collecting each complex from a different facet. This work lays the foundation for on-chip architectures which utilize multidirectional integration of quantum emitters.","abstract_hash":"2c612cc0be1278d7c6b7ec2b1e63a9ddccdf86eb7e2c9fcd32f1f2e05e94a430","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display","materials"],"novelty_score":4,"novelty_reason":"用弯曲分段波导的倏逝耦合实现单个纳米线量子点双端单光子输出并演示级联 XX–X 发射，属于明确的新器件结构而非单纯优化。","innovation_zh":"把嵌在纳米线里的半导体量子点与不连续的弯曲 SiN 波导通过倏逝耦合拼成混合器件，从器件两个输出端都能收集到单光子。中性激子 X、双激子 XX 和带电激子 X⁻ 的发射都实现了双端单光子输出，并利用两端分别收集 XX 和 X，演示了级联 XX–X 发射。工作为量子发射器的多方向片上集成提供了基础。","method_zh":"采用纳米线内嵌量子点作为发射源，与弯曲且分段的 SiN 波导构成非连续结构，靠光子结构间的倏逝耦合把发射光子导入波导；对器件不同输出端面做自相关与互相关测量。","keywords_zh":["纳米线量子点","倏逝耦合","SiN 波导","单光子发射","级联双激子"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:07.450Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.microc.2026.119188","doi":"10.1016/j.microc.2026.119188","doi_url":"https://doi.org/10.1016/j.microc.2026.119188","title":"Cd-free quantum dots-engineered fluorescent hydrogel for rapid and portable detection of thiram without additional metal ions","title_zh":"无镉量子点工程化荧光水凝胶用于无需额外金属离子的福美双快速便携检测","title_key":"cdfreequantumdotsengineeredfluorescenthydrogelforrapidandportabledetectionofthiramwithoutadditionalmetalions","authors":["Shuoyun Sun","Mengfei Zhang","Ruonan Chen","et al."],"venue":"Microchemical Journal","issn_l":"0026-265X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["无镉量子点","荧光水凝胶","福美双检测","便携传感","农药残留"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:07.336Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.5445/ir/1000195555","doi":"10.5445/ir/1000195555","doi_url":"https://doi.org/10.5445/ir/1000195555","title":"Molecular beam epitaxy of wafer-scale O-band InAs/InGaAs quantum dots on GaAs for quantum photonics","title_zh":"面向量子光子学的晶圆级O波段InAs/InGaAs量子点分子束外延生长（GaAs衬底）","title_key":"molecularbeamepitaxyofwaferscaleobandinasingaasquantumdotsongaasforquantumphotonics","authors":["Pavel Avdienko","Lukas Hanschke","Quirin Buchinger","et al."],"venue":"Repository KITopen (Karlsruhe Institute of Technology)","issn_l":null,"source_type":"repository","is_preprint":true,"alt_doi":null,"pub_date":"2026-07-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-24","oa_status":"green","pdf_url":null,"cited_by_count":0,"abstract":"We report a molecular beam epitaxy strategy to achieve a low density of O-band electrically tunable InAs/InGaAs quantum dots (QDs) on GaAs(001) substrates. Our approach is based on a gradient deposition of InAs in the sub-monolayer regime and subsequent capping with an In$_{0.29}$Ga$_{0.71}$As strain-reducing layer to redshift the emission wavelength. For different growth conditions, we investigate the optical properties of the dots using photoluminescence mapping and correlate them with structural properties determined by scanning transmission electron microscopy. Using a surface roughness modulation technique and synchronizing InAs sub-monolayer deposition cycles with substrate rotation, we control the dot density and position low-density regions (\u003c10$^8$ cm$^{−2}$) on the substrate. Hyperspectral imaging is used to map the spatial and spectral characteristics of many individual dots in the low-density region, confirming that our approach applies to conventional molecular beam epitaxy growth on (001) surfaces. Finally, we tune the QD emission wavelength within the O-band using electric fields and demonstrate single-photon emission with g$^{(2)}$ (0) = 0.020 ± 0.014.","abstract_hash":"f758eb12de4365e628e766f6760fee00ad413a181144073420da7192de011a09","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display","detection","materials"],"novelty_score":4,"novelty_reason":"在常规(001) GaAs上把低密度量子点的密度/位置控制与O波段电调谐、单光子发射验证结合起来，属于有明确新策略且给出器件级验证的工作。","innovation_zh":"在GaAs(001)衬底上用分子束外延实现晶圆级、低密度、O波段可电调谐的InAs/InGaAs量子点。核心做法是亚单层InAs梯度沉积加In0.29Ga0.71As应变减小层红移发光波长，并通过表面粗糙度调制技术、把InAs亚单层沉积周期与衬底旋转同步，从而在衬底上控制点密度并定位出密度低于10^8 cm^-2的低密度区域。用高光谱成像对低密度区大量单点的空间与光谱特性做了统计，证明该方案适用于常规(001)面MBE生长；最后用电场把量子点发光调谐到O波段内，并测到单光子发射，g(2)(0)=0.020±0.014。","method_zh":"MBE亚单层InAs梯度沉积 + In0.29Ga0.71As应变减小层覆盖；表面粗糙度调制并与衬底旋转同步来控制点密度与位置；用PL mapping、STEM和高光谱成像关联光学与结构性质，电场调谐波长并做单光子发射表征。","keywords_zh":["InAs/InGaAs量子点","分子束外延","O波段","单光子发射","低密度量子点"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:56:03.086Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsnano.6c05927","doi":"10.1021/acsnano.6c05927","doi_url":"https://doi.org/10.1021/acsnano.6c05927","title":"Suppressing Energetic Disorder in Directly Synthesized Conductive AgBiS2 Nanocrystal Inks for High-Efficiency and Eco-Friendly Photovoltaics","title_zh":"抑制直接合成导电 AgBiS2 纳米晶墨水中的能量无序，实现高效环保光伏","title_key":"suppressingenergeticdisorderindirectlysynthesizedconductiveagbis2nanocrystalinksforhighefficiencyandecofriendlyphotovoltaics","authors":["Kunyuan Lu","Yang Li","Lin Yuan","et al."],"venue":"ACS Nano","issn_l":"1936-0851","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Silver bismuth sulfide (AgBiS2) nanocrystals (NCs) have emerged as a premier eco-friendly and lead-free alternative for next-generation photovoltaics due to their exceptional light-harvesting capabilities. However, the efficiency of AgBiS2 solar cells is fundamentally constrained by detrimental band-tail states arising from internanocrystal heterogeneity and surface defects introduced during traditional ligand exchange. In this work, we demonstrate a strategy to flatten the energy landscape of AgBiS2 films by achieving macroscopic uniformity and long-range ordered self-assembly. By kinetically decoupling the reaction of Ag and Bi precursors, we produce highly monodisperse, directly conductive NC inks that bypass the need for efficiency-limiting ligand exchange processes. This approach ensures exceptional compositional homogeneity and suppresses nonradiative recombination, resulting in significantly enhanced carrier transport and extended lifetimes. Consequently, our eco-friendly AgBiS21 solar cells achieve a power conversion efficiency of 10.52%, representing one of the highest reported values for this class of nontoxic materials. This work provides a critical paradigm for mitigating energetic disorder in multinary semiconductors, paving the way for low-cost, high-performance, and environmentally benign thin-film photovoltaics.","abstract_hash":"a0f97d7330ddce9f4f809d955d3184df5d3b77a9cc49207a2d92757371dda51a","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"用动力学解耦前驱体反应直接合成导电墨水、跳过配体交换来抑制带尾态，思路明确且效率达 10.52%，但仍是既有材料体系上的策略性改进而非全新机制。","innovation_zh":"针对 AgBiS2 太阳能电池中因纳米晶尺寸/组分不均和传统配体交换引入表面缺陷而形成的带尾态问题，作者通过动力学解耦 Ag 与 Bi 前驱体的反应，直接合成出高单分散、本身即导电的纳米晶墨水，从而绕开了限制效率的配体交换步骤。该策略提升了组分均匀性、抑制非辐射复合，改善了载流子输运并延长了寿命，最终器件效率达到 10.52%，属于该类无铅无毒材料中报道的最高水平之一。","method_zh":"动力学解耦 Ag 和 Bi 前驱体的反应，制备高单分散、直接导电的 AgBiS2 纳米晶墨水，成膜时实现宏观均匀与长程有序自组装，无需配体交换。","keywords_zh":["AgBiS2 纳米晶","带尾态","导电墨水","无铅光伏","配体交换"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:10.093Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsami.6c04525","doi":"10.1021/acsami.6c04525","doi_url":"https://doi.org/10.1021/acsami.6c04525","title":"Controlling Both Anode and Cathode Interfacial Properties of Nanocrystal LEDs by Combining Solution-Processed Semiconducting Polymer Interlayers","title_zh":"通过结合溶液加工的半导体聚合物中间层调控纳米晶 LED 的阳极与阴极界面性质","title_key":"controllingbothanodeandcathodeinterfacialpropertiesofnanocrystalledsbycombiningsolutionprocessedsemiconductingpolymerinterlayers","authors":["Benedetta Maria Squeo","Francesco Carulli","Roberto Sorrentino","et al."],"venue":"ACS Applied Materials & Interfaces","issn_l":"1944-8244","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-23","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-23","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Light-emitting diodes (LEDs) based on colloidal semiconductor nanocrystals represent a promising technology for next-generation electroluminescence displays. While ongoing efforts focus on optimizing nanocrystal properties, device performance also critically depends on the LED architecture, particularly the design of interfacial layers. Efficient charge injection and balanced carrier transport toward recombination layers require careful alignment of energy levels between adjacent layers. In this study, we investigate the cooperative role of different hole-transporting (HT) and electron-injecting (EI) polymers in a multilayered all-solution-processed LED structure incorporating CdSe/CdZnS nanoplatelets as deep-red emitters. Three commercially available HT polymers, differing in hole mobility and energy levels, were combined with custom-designed EI polar polymers featuring varied conjugated backbones and tailored highest occupied molecular orbital/lowest unoccupied molecular orbital (HOMO/LUMO) levels. Particular attention is given to the EI/metal interface, whose properties are tuned via phosphonate-functionalized polymer side chains. Device performance is assessed under inert and ambient conditions (without encapsulation) and correlated to the electronic properties of the interfacial layers. Notably, specific HT/EI polymer pairings substantially influence key parameters of fabricated LEDs, enabling either a reduced turn-on voltage down to 1.7 V or enhanced external quantum efficiency up to 7%, depending on the selected combination.","abstract_hash":"002f8a7a52db74e02afdbd2c44773deaf9a9effa28950f46ad1f48d5d4b2965d","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"在已有纳米晶 LED 界面工程思路上，系统验证了 HT/EI 聚合物配对与膦酸酯侧链调控的协同作用，属于新体系上的策略验证与渐进式优化，性能指标未突破领域纪录。","innovation_zh":"这篇工作针对全溶液加工纳米晶 LED 的界面工程问题，系统研究了空穴传输（HT）聚合物与电子注入（EI）极性聚合物的配对协同效应。器件以 CdSe/CdZnS 纳米片作为深红发光体，通过改变 EI 聚合物的共轭骨架和 HOMO/LUMO 能级，并用膦酸酯官能化侧链调控 EI/金属界面。结果显示，特定的 HT/EI 聚合物组合可以分别把开启电压降到 1.7 V，或把外量子效率提升到 7%，说明界面聚合物配对是决定器件性能的关键变量。","method_zh":"构建全溶液加工多层 LED 结构，选用三种商用 HT 聚合物（空穴迁移率和能级不同）与定制 EI 极性聚合物搭配，重点通过膦酸酯侧链修饰 EI/金属界面，并在惰性气氛和未封装的环境条件下对比器件性能与界面层电子性质。","keywords_zh":["纳米晶 LED","界面层","空穴传输聚合物","电子注入聚合物","纳米片"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:10.112Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s11664-026-12988-7","doi":"10.1007/s11664-026-12988-7","doi_url":"https://doi.org/10.1007/s11664-026-12988-7","title":"Analysis of Doped TiO2 and Quantum Size Effect Influence on the Performance of CdTe Quantum Dot Solar Cells via the SCAPS Framework","title_zh":"通过 SCAPS 框架分析掺杂 TiO2 与量子尺寸效应对 CdTe 量子点太阳能电池性能的影响","title_key":"analysisofdopedtio2andquantumsizeeffectinfluenceontheperformanceofcdtequantumdotsolarcellsviathescapsframework","authors":["Rahamatulla Molla","Shaheen Aktar","Abiral Tamang","et al."],"venue":"Journal of Electronic Materials","issn_l":"0361-5235","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-23","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-23","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"无摘要，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，仅从标题可知工作使用 SCAPS 框架进行器件模拟分析。","keywords_zh":["CdTe 量子点","太阳能电池","TiO2 掺杂","量子尺寸效应","SCAPS 模拟"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:11.476Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsaelm.6c00970","doi":"10.1021/acsaelm.6c00970","doi_url":"https://doi.org/10.1021/acsaelm.6c00970","title":"Passivation Strategy Toward Stable Photodetector of Epitaxially Connected Quantum Dot Superlattices","title_zh":"面向稳定光电探测器的外延连接量子点超晶格钝化策略","title_key":"passivationstrategytowardstablephotodetectorofepitaxiallyconnectedquantumdotsuperlattices","authors":["Dadan Suhendar","Chisa Nishiyama","Yoshiki Omomo","et al."],"venue":"ACS Applied Electronic Materials","issn_l":"2637-6113","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-23","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-23","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Epitaxially connected quantum dot superlattices (Epi-QDSLs) represent a promising platform for high-performance, next-generation photodetectors. Their enhanced electron transport mobility, together with the preservation of quantum confinement, enables efficient charge extraction with high quantum efficiency. This results in high responsivity, detectivity, and faster response time. The ligand-free nature of PbS quantum dots (QDs) in Epi-QDSLs introduces a critical challenge of poor environmental stability, as the conventional surface passivation strategies of ligand exchange are incompatible with ligand-free QDs in the Epi-QDSL system. Here, we examine the air stability of the Epi-QDSL photodetector and investigate the effects of introducing a P(VDF-TrFE) passivation layer on the material properties, device performance, and air stability of Epi-QDSL. The dipole polarization of the dielectric nature of the block copolymer induces an electrostatic n-type doping effect, as confirmed by the field-effect transistor measurement. This doping effect increases electron mobility and facilitates more efficient charge extraction, thereby significantly improving device performance. The hydrophobic nature of P(VDF-TrFE) effectively prevents the progressive infiltration of oxygen and moisture into the PbS QDs, thereby preventing the irreversible degradation suffered by the ligand-free QDs in the Epi-QDSL system.","abstract_hash":"74bb67c05fc1f53859d03ad19e376493428ff78fbe8e180ebffe983fdfc125a1","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"针对无配体 Epi-QDSL 体系提出兼容的聚合物钝化新策略，同时实现掺杂增强与稳定性改善，但摘要未给出具体性能数字。","innovation_zh":"针对外延连接量子点超晶格（Epi-QDSL）中 PbS 量子点无配体、传统配体交换钝化不兼容导致环境稳定性差的问题，作者引入 P(VDF-TrFE) 作为钝化层。该共聚物的偶极极化带来静电 n 型掺杂效应（由场效应晶体管测量证实），提高了电子迁移率并改善电荷提取，从而提升器件性能；同时其疏水性可阻止氧和水分向 PbS 量子点渗透，避免无配体量子点的不可逆降解。","method_zh":"在 Epi-QDSL 光电探测器上覆盖 P(VDF-TrFE) 钝化层，通过场效应晶体管测量表征其偶极极化引起的 n 型掺杂，并对比材料性质、器件性能与空气稳定性。","keywords_zh":["量子点超晶格","光电探测器","P(VDF-TrFE)钝化","空气稳定性","n型掺杂"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:12.414Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.xpro.2026.104712","doi":"10.1016/j.xpro.2026.104712","doi_url":"https://doi.org/10.1016/j.xpro.2026.104712","title":"Protocol for luminescent nanocrystal synthesis via modified ligand-assisted precipitation and X-ray scintillation film fabrication","title_zh":"通过改进的配体辅助沉淀法合成发光纳米晶及X射线闪烁薄膜制备的方案","title_key":"protocolforluminescentnanocrystalsynthesisviamodifiedligandassistedprecipitationandxrayscintillationfilmfabrication","authors":["Azimet Akber Karluk","Javeed Mahmood","Cafer Tayyar Yavuz"],"venue":"STAR Protocols","issn_l":"2666-1667","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-23","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-23","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"The field of all-inorganic metal halide nanocrystals currently faces the challenge of developing efficient approaches for the scalable, facile, and stable synthesis of nanocrystals (NCs). Here, we present a protocol for the acid-mediated modified ligand-assisted reprecipitation (LARP) synthesis of undoped and Sb-doped Rb 3 InCl 6 nanocrystals. We describe the key steps for glassware and labware cleaning, precursor solution preparation, rapid injection-driven nanocrystal formation, purification and redispersion, and scintillator composite film fabrication. We further detail structural, optical, and X-ray imaging characterization procedures, providing a comprehensive workflow from nanocrystal synthesis to scintillator screen evaluation. For complete details on the use and execution of this protocol, please refer to Karluk et al. 1","abstract_hash":"8742e644bd4fa9808d580bdae21618e3a2af2ae6e65127d9fac26507ad22e6d0","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":2,"novelty_reason":"属于已有 LARP 合成路线的方案化、流程化描述，未报道新机制或性能纪录。","innovation_zh":"这是一篇 STAR Protocols 方法学方案，针对全无机金属卤化物纳米晶难以规模化、简便且稳定合成的问题，给出了酸介导的改进配体辅助沉淀（LARP）流程，用于合成未掺杂和 Sb 掺杂的 Rb3InCl6 纳米晶。方案覆盖了从玻璃器皿清洗、前驱液配制、快速注射驱动成核、纯化再分散，到闪烁体复合薄膜制备的完整步骤，并配套结构、光学和 X 射线成像表征流程。其价值主要在于把该体系的可重复操作细节标准化，而非提出新的物理机制或器件纪录。","method_zh":"采用酸介导的改进 LARP 法，通过快速注射驱动前驱体成核生成未掺杂及 Sb 掺杂 Rb3InCl6 纳米晶，经纯化再分散后与基体复合制成闪烁体薄膜，并进行结构与光学表征及 X 射线成像评估。","keywords_zh":["Rb3InCl6纳米晶","配体辅助沉淀","Sb掺杂","X射线闪烁体","合成方案"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:13.973Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1109/tns.2026.3716612","doi":"10.1109/tns.2026.3716612","doi_url":"https://doi.org/10.1109/tns.2026.3716612","title":"Radiation-Induced Persistent Signal in CdTe Detectors Measured During High-Energy X-Ray Total Scattering Experiments","title_zh":"高能X射线全散射实验中测量到的CdTe探测器辐射诱导持续信号","title_key":"radiationinducedpersistentsignalincdtedetectorsmeasuredduringhighenergyxraytotalscatteringexperiments","authors":["F. Orsini","Jochi Tseng","H. Yamada","et al."],"venue":"IEEE Transactions on Nuclear Science","issn_l":"0018-9499","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-23","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-23","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection"],"novelty_score":1,"novelty_reason":"无摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["CdTe探测器","辐射诱导信号","X射线全散射","探测器响应"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:12.680Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s41928-026-01669-2","doi":"10.1038/s41928-026-01669-2","doi_url":"https://doi.org/10.1038/s41928-026-01669-2","title":"High-resolution full-colour displays from cracking-assisted transfer printing of quantum dot light-emitting diodes","title_zh":"利用裂纹辅助转印量子点发光二极管实现高分辨率全彩显示","title_key":"highresolutionfullcolourdisplaysfromcrackingassistedtransferprintingofquantumdotlightemittingdiodes","authors":[],"venue":"Nature Electronics","issn_l":"2520-1131","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-22","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["量子点发光二极管","转印打印","全彩显示","高分辨率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:13.595Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/nano16140895","doi":"10.3390/nano16140895","doi_url":"https://doi.org/10.3390/nano16140895","title":"Representative Chemical Formulas of Cadmium Selenide Quantum Dots Determined with a Combination of Mass Spectrometry and Nuclear Magnetic Resonance","title_zh":"结合质谱与核磁共振确定硒化镉量子点的代表性化学式","title_key":"representativechemicalformulasofcadmiumselenidequantumdotsdeterminedwithacombinationofmassspectrometryandnuclearmagneticresonance","authors":["Nickie Tiwari","Igor Fedin"],"venue":"Nanomaterials","issn_l":"2079-4991","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-22","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Matrix-assisted laser desorption/ionization time-of-flight (MALDI-TOF) mass spectrometry (MS) has the potential to characterize the size and composition of quantum dots (QDs). However, examples of its usage in the literature are limited. In this study, we perform an in-depth characterization of the size and composition of the CdSe QD system using a combination of MALDI MS and nuclear magnetic resonance (NMR). Using these techniques, we determine the size and composition of a series of wurtzite and zincblende CdSe QDs. The composition ranges from 176 to 1202 CdSe units per QD. With this information, we construct a sizing curve for the QDs and compare it with sizing curves from the literature obtained using other techniques such as transmission electron microscopy (TEM) and small-angle X-ray scattering (SAXS). These results will be insightful for the community developing complex multilayer QD compositions for photonic applications.","abstract_hash":"de0c442055d8830f6bef6d357124b95231094314019660b9fe3ef830a893ad99","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"方法组合本身不算全新，但 MALDI MS 用于量子点组成表征的实例稀缺，且给出了跨两种晶型、覆盖 176–1202 单元的尺寸标定曲线，属于在新体系上验证并补充已有思路。","innovation_zh":"用 MALDI-TOF 质谱加 NMR 的组合方法，系统测定了纤锌矿和闪锌矿两种晶型 CdSe 量子点的尺寸与组成，每个量子点含 176 到 1202 个 CdSe 单元。基于这些数据构建了尺寸标定曲线，并与文献中 TEM、SAXS 得到的曲线做了对比。此前 MALDI MS 用于量子点表征的报道很少，这篇算是把该方法的可用性做实了。","method_zh":"以 MALDI-TOF 质谱为主、NMR 为辅，对一系列 CdSe 量子点做尺寸和组成表征，再据此拟合尺寸-组成关系曲线。","keywords_zh":["CdSe 量子点","MALDI-TOF 质谱","核磁共振","尺寸标定曲线","量子点组成"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:15.125Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1103/cwpb-vldr","doi":"10.1103/cwpb-vldr","doi_url":"https://doi.org/10.1103/cwpb-vldr","title":"Random fine structure and polarized luminescence of triplet
