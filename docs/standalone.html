excitons in semiconductor nanocrystals","title_zh":"半导体纳米晶中三重态激子的随机精细结构与偏振发光","title_key":"randomfinestructureandpolarizedluminescenceoftripletexcitonsinsemiconductornanocrystals","authors":["Dmitry S. Smirnov","Eougenious L. Ivchenko"],"venue":"Physical review. B./Physical review. B","issn_l":"2469-9950","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-21","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display","materials"],"novelty_score":1,"novelty_reason":"无摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断关键方法与器件结构。","keywords_zh":["半导体纳米晶","三重态激子","精细结构","偏振发光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:14.556Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/lpor.71626","doi":"10.1002/lpor.71626","doi_url":"https://doi.org/10.1002/lpor.71626","title":"Heterojunction Enabled Room‐Temperature Self‐Powered AgBiS 2 Quantum Dots Photodetectors up to 2.3 µm","title_zh":"异质结实现室温自供电 AgBiS2 量子点光电探测器，响应至 2.3 µm","title_key":"heterojunctionenabledroomtemperatureselfpoweredagbis2quantumdotsphotodetectorsupto23m","authors":["D J Li","Xinyu Liu","Nan Ding","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-21","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT The development of low‐cost, high‐performance, uncooled broadband photodetectors (PDs) is crucial for optical communication and imaging. However, achieving deep‐ultraviolet (DUV) to extended short‐wave infrared (eSWIR) detection in a single device remains challenging. Herein, a novel ultrabroadband Type‐II AgBiS 2 quantum dots (QDs)/In 0.75 Ga 0.25 As heterojunction is used as the photosensitive layer, significantly enhancing charge separation and transport, suppressing interface carrier recombination, and improving stability. Compared with the pristine AgBiS 2 QDs PDs, the self‐powered PDs based on this heterojunction exhibit a response from 0.3 to 2.3 µm, with responsivity of 1.66 A/W and detectivity of 2.64 × 10 12 Jones. They also show remarkable long‐term and operational stability, retaining 94.1% response after 20000 h storage and 96.7% after 10000 ON/OFF cycles. This PD enables broadband imaging without cryogenic cooling, showing great promise for practical applications. This work provides a new strategy for self‐powered ultrabroadband PDs (DUV‐eSWIR), opening up new opportunities for future optoelectronic systems.","abstract_hash":"57805d8055fbfc4602006ef9c7d99c8db8f92e7a6839f6611c6fe4ffc3359d27","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection"],"novelty_score":4,"novelty_reason":"用 AgBiS2 QD 与 InGaAs 构建 Type-II 异质结实现 DUV–eSWIR 超宽带自供电探测，并给出明确的响应度、探测率和长时稳定性数据，属于新结构带来的显著性能提升。","innovation_zh":"把 AgBiS2 量子点与 In0.75Ga0.25As 组成 Type-II 异质结做光敏层，解决了单一器件难以同时覆盖深紫外到扩展短波红外的问题。相比纯 AgBiS2 QD 器件，该异质结自供电探测器响应范围扩展到 0.3–2.3 µm，响应度 1.66 A/W，探测率 2.64×10^12 Jones，且无需低温制冷。稳定性方面，存储 20000 小时后仍保持 94.1% 响应，10000 次开关循环后保持 96.7%。","method_zh":"采用 Type-II AgBiS2 量子点/In0.75Ga0.25As 异质结作为光敏层，利用能带排列增强电荷分离与输运、抑制界面复合，并实现自供电工作。","keywords_zh":["AgBiS2 量子点","异质结光电探测器","自供电","短波红外","超宽带探测"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:16.499Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/lpor.71612","doi":"10.1002/lpor.71612","doi_url":"https://doi.org/10.1002/lpor.71612","title":"Cascade‐EDT Interface in PbS CQD/a‐IGZO Heterojunctions for Ultra‐Fast PbS QD‐Sensitized Phototransistor","title_zh":"PbS CQD/a-IGZO 异质结中的 Cascade-EDT 界面用于超快 PbS 量子点敏化光电晶体管","title_key":"cascadeedtinterfaceinpbscqdaigzoheterojunctionsforultrafastpbsqdsensitizedphototransistor","authors":["Cong Zhang","Shenghui He","Xingtian Yin","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-21","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT High‐sensitivity near‐infrared phototransistors based on PbS quantum dots (QDs) have gained considerable attention for low‐energy optical detection. However, their response speed is often constrained by slow carrier extraction across interfaces that contain dense trap states when integrated with amorphous IGZO. In this work, we construct a Cascade‐EDT Interface (CEI) in which a solid‐state ligand‐treated PbS QDs is positioned beneath a solution‐processed iodide‐capped PbS QD film. This heterojunction interface improves interfacial band alignment and reduces trap‐related carrier loss, as confirmed by photoluminescence and picosecond transient absorption. The refined electronic landscape accelerates carrier transfer into IGZO and reduces the response time from 108 ms to 50 µs while maintaining strong photoconductive gain. The device reaches a detectivity of 2.17 × 10 13 Jones and a responsivity of 75.1 A·W −1 at 1064 nm. The upper QD layer protects the CEI from oxidation, preserving >98% of device initial performance after 720 h in air. The CEI provides an effective route toward fast and stable infrared PbS CQDs/a‐IGZO sensitized Photo‐FETs.","abstract_hash":"93b83eddf8eaf0ae6f3b7e71d8b0c2b82356da8a71416f6b79c0eb8e6ae4cf67","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"用双层配体工程构建级联界面同时解决响应速度与空气稳定性两个问题，响应时间提升三个数量级且给出明确探测率与响应度指标，属明确的新结构策略。","innovation_zh":"针对 PbS 量子点与非晶 IGZO 集成时界面陷阱态导致载流子抽取慢、响应速度受限的问题，作者构建了 Cascade-EDT 界面（CEI）：在溶液法碘化物封端的 PbS QD 薄膜下方放置固态配体处理的 PbS QD 层。该界面改善了能带对齐并减少陷阱相关的载流子损失（由 PL 和皮秒瞬态吸收证实），把响应时间从 108 ms 压到 50 µs，同时保持强光电导增益，在 1064 nm 下探测率达 2.17 × 10^13 Jones、响应度 75.1 A·W⁻¹；上层 QD 还起到抗氧化保护作用，空气中 720 h 后仍保持 >98% 初始性能。","method_zh":"在 a-IGZO 上构建双层 PbS QD 异质结：下层为固态配体处理的 PbS QD，上层为溶液法碘化物封端的 PbS QD 薄膜，形成级联能带排列的 CEI 界面，并用 PL 与皮秒瞬态吸收表征界面载流子动力学。","keywords_zh":["PbS 量子点","a-IGZO","光电晶体管","界面工程","近红外探测"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:17.326Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1364/oe.603545","doi":"10.1364/oe.603545","doi_url":"https://doi.org/10.1364/oe.603545","title":"O-band quantum-dot comb lasers on silicon by wafer bonding via ultra-thin Ge interlayer","title_zh":"通过超薄Ge中间层晶圆键合实现的硅基O波段量子点梳状激光器","title_key":"obandquantumdotcomblasersonsiliconbywaferbondingviaultrathingeinterlayer","authors":["Jing Liu","Xin HE","Bo Yang","et al."],"venue":"Optics Express","issn_l":"1094-4087","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-21","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"To realize high-performance on-chip light sources for silicon photonic integration, we demonstrate an O-band quantum-dot (QD) comb laser on silicon enabled by ultra-thin Ge interlayer wafer bonding. MBE-grown 10-nm-thick Ge film serves as an intermediate layer between silicon substrate and InAs/GaAs QD epitaxial wafer, enabling uniform wafer bonding. The fabricated 100 GHz silicon-based QD comb laser achieves a continuous-wave (CW) output power of 120 mW at room temperature and maintains 18.3 mW even at 110 °C. The optical spectrum exhibits 15 comb lines (∼8 nm) within a 3 dB optical bandwidth, and the overall relative intensity noise (RIN) reaches −161.2 dBc/Hz. Stable comb generation is sustained up to 85 °C. These results establish ultra-thin Ge interlayer-assisted bonding as a practical approach for realizing high-power, low-noise, and thermally stable silicon-based QD comb lasers serving as multi-wavelength sources for on-chip optical I/O applications.","abstract_hash":"f30a52862290acffe785045b55e79c204e1e90266fe754c56eb0e431ab7ca842","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"超薄Ge中间层键合是明确的新策略，并同时给出高功率、低RIN和高温稳定性的完整器件指标。","innovation_zh":"用10 nm超薄Ge薄膜作为Si衬底与InAs/GaAs量子点外延片之间的键合中间层，实现了均匀的晶圆键合，从而在硅上做出O波段量子点梳状激光器。器件在100 GHz梳间距下室温连续波输出120 mW，110 °C时仍有18.3 mW；3 dB带宽内包含15根梳齿（约8 nm），整体RIN为−161.2 dBc/Hz，梳状激射在85 °C下仍能稳定维持。","method_zh":"MBE生长的10 nm Ge薄膜夹在Si衬底与InAs/GaAs量子点外延层之间完成晶圆键合，再制备成100 GHz硅基量子点梳状激光器。","keywords_zh":["量子点激光器","硅基光子集成","晶圆键合","光频梳","O波段"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:17.391Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1109/jstqe.2026.3714869","doi":"10.1109/jstqe.2026.3714869","doi_url":"https://doi.org/10.1109/jstqe.2026.3714869","title":"1.3-μm-Wavelength InP-Based Photonic-Crystal Surface-Emitting Lasers With In-Plane Hetero Photonic Crystal Structure for Watt-Class Single-Mode Operation","title_zh":"面向瓦级单模工作的 1.3 μm 波段 InP 基面内异质光子晶体结构光子晶体面发射激光器","title_key":"13mwavelengthinpbasedphotoniccrystalsurfaceemittinglaserswithinplaneheterophotoniccrystalstructureforwattclasssinglemodeoperation","authors":["Yuhki Itoh","Makoto Ogasawara","Takeshi Aoki","et al."],"venue":"IEEE Journal of Selected Topics in Quantum Electronics","issn_l":"1077-260X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-20","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-20","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"无摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["光子晶体面发射激光器","InP 基","1.3 μm","单模","瓦级输出"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:17.655Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s12541-026-01566-w","doi":"10.1007/s12541-026-01566-w","doi_url":"https://doi.org/10.1007/s12541-026-01566-w","title":"Dual-Interface Stabilization Enables Mechanically Robust and Air-Stable Flexible PbS Quantum Dot Solar Cells","title_zh":"双界面稳定化实现机械鲁棒且空气稳定的柔性 PbS 量子点太阳能电池","title_key":"dualinterfacestabilizationenablesmechanicallyrobustandairstableflexiblepbsquantumdotsolarcells","authors":["Hyung Cheoul Shim"],"venue":"International Journal of Precision Engineering and Manufacturing","issn_l":"1229-8557","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-20","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-20","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["PbS 量子点","柔性太阳能电池","界面稳定化","空气稳定性","机械鲁棒性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:18.731Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsanm.6c02092","doi":"10.1021/acsanm.6c02092","doi_url":"https://doi.org/10.1021/acsanm.6c02092","title":"Monolayer-Precision Colloidal Nanoplatelet Films via Liquid–Air Interface Self-Assembly for Thickness-Engineered Light-Emitting Diodes","title_zh":"液–气界面自组装实现单层精度胶体纳米片薄膜：用于厚度工程化发光二极管","title_key":"monolayerprecisioncolloidalnanoplateletfilmsvialiquidairinterfaceselfassemblyforthicknessengineeredlightemittingdiodes","authors":["Shijia Cheng","Rongxuan Zhu","Yingshu Yang","et al."],"venue":"ACS Applied Nano Materials","issn_l":"2574-0970","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-20","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-20","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Colloidal semiconductor nanoplatelets (NPLs) offer atomically precise quantum confinement and exceptional optical properties, yet translating these advantages into device-quality thin films with deterministic thickness control remains challenging. Here, liquid–air interface self-assembly is employed to fabricate core–shell CdSe/CdZnS NPL films with exclusively face-down orientation, spanning one to four monolayers. Optical gain characterization verifies that the self-assembly process fully preserves the intrinsic photophysical quality of the NPLs. When integrated as emissive layers into light-emitting diode (LED) architectures, the self-assembled films produce stable, spectrally pure red electroluminescence with Commission Internationale de l’Éclairage chromaticity coordinates of (0.72, 0.28), achieving a maximum external quantum efficiency of 12%, a peak luminance of 18,530 cd/m2, and a current efficiency of 4.8 cd/A. These results demonstrate that liquid–air interface self-assembly transforms the active-region thickness from a stochastic processing outcome into a discretely addressable design parameter, adjustable one monolayer at a time with quantitative predictability. This capability provides a practical platform for systematically investigating the influence of active-layer thickness on carrier recombination, charge balance, and exciton management, and opens pathways toward atomically defined optoelectronic device architectures.","abstract_hash":"f0339fa873c9403372b45cc5ad08af58ceca35f6f0d1388932032c88bd684c02","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"以自组装实现单层精度、单一取向的纳米片有源层厚度调控，并给出 EQE 12% 的红色 LED 结果，属于明确的新成膜策略加显著性能。","innovation_zh":"把液–气界面自组装用于核壳 CdSe/CdZnS 纳米片成膜，得到全部 face-down 取向、厚度可从 1 个单层精确调到 4 个单层的薄膜，把有源层厚度从工艺随机结果变成可逐层设定的设计参数。光学增益表征显示自组装没有损伤纳米片本征光物理性质；做成 LED 发光层后得到色坐标 (0.72, 0.28) 的稳定纯红电致发光，最大外量子效率 12%、峰值亮度 18,530 cd/m2、电流效率 4.8 cd/A。","method_zh":"用液–气界面自组装制备核壳 CdSe/CdZnS 纳米片薄膜，控制取向与单层数（1–4 ML），再作为发光层集成到 LED 结构中，并用光学增益表征验证成膜后的光物理质量。","keywords_zh":["纳米片","液–气界面自组装","单层精度","QLED","厚度工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:20.007Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.17586/2220-8054-2026-17-3-339-345","doi":"10.17586/2220-8054-2026-17-3-339-345","doi_url":"https://doi.org/10.17586/2220-8054-2026-17-3-339-345","title":"Effect of spin-orbit interactions on an off-center D0 impurity in an asymmetric quantum dot under a magnetic field","title_zh":"自旋轨道相互作用对磁场下非对称量子点中偏心D0杂质的影响","title_key":"effectofspinorbitinteractionsonanoffcenterd0impurityinanasymmetricquantumdotunderamagneticfield","authors":["Pooja Saini","Soma Mukhopadhyay","I. Yu. Popov","et al."],"venue":"Nanosystems Physics Chemistry Mathematics","issn_l":"2220-8054","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-18","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-18","oa_status":"diamond","pdf_url":"https://nanojournal.ifmo.ru/jour/article/download/1841/1490","cited_by_count":0,"abstract":"We evaluate the ground state energy of an off-centre Coulomb impurity in an asymmetric Gaussian GaAs quantum dot under a constant magnetic field. Using a unitary transformation, we take into account the combined effect of the Rashba and Dresselhaus interactions treating the coupling terms up to quadratic order. We next treat the transformed Hamiltonian using a variational approach with a suitable ansatz. The findings reveal that the ground state energy increases with growing impurity distance from the confinement centre and with increasing potential asymmetry. Finally, we examine how the asymmetry in the Gaussian confinement influences the magnetic moment and susceptibility of the impurity.","abstract_hash":"5810b720e302459dc0196289c0011310c3760195cfa8767d902f8f59690bddfb","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","materials"],"novelty_score":2,"novelty_reason":"在既有量子点杂质模型上引入自旋轨道耦合与非对称性做变分计算，属常规理论优化与参数分析，未见新机制或新器件。","innovation_zh":"这篇工作把Rashba和Dresselhaus自旋轨道耦合（保留到二次项）与偏心施主杂质、非对称高斯限制势、外加磁场放在同一个框架里处理，算的是非对称GaAs高斯量子点中偏心D0杂质的基态能量。结论是基态能量随杂质偏离限制中心距离增大、随势的非对称性增强而升高，并进一步讨论了高斯限制的非对称性对杂质磁矩和磁化率的影响。属于在已有模型上叠加自旋轨道耦合与偏心/非对称效应的理论计算，没有报道新器件或新机制。","method_zh":"先用幺正变换处理Rashba与Dresselhaus自旋轨道耦合的联合效应（耦合项展开到二次），再对变换后的哈密顿量选取合适的试探波函数做变分计算。","keywords_zh":["量子点","自旋轨道耦合","偏心杂质","变分法","磁化率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:20.436Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s41928-026-01670-9","doi":"10.1038/s41928-026-01670-9","doi_url":"https://doi.org/10.1038/s41928-026-01670-9","title":"A cracking-assisted transfer printing technology for high-resolution quantum dot light-emitting diode displays","title_zh":"裂纹辅助转印技术用于高分辨率量子点发光二极管显示","title_key":"acrackingassistedtransferprintingtechnologyforhighresolutionquantumdotlightemittingdiodedisplays","authors":["Jeong‐Wan Jo","Yoonwoo Kim","Sanghyo Lee","et al."],"venue":"Nature Electronics","issn_l":"2520-1131","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-17","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-17","oa_status":"hybrid","pdf_url":"https://www.nature.com/articles/s41928-026-01670-9.pdf","cited_by_count":1,"abstract":"Inorganic colloidal quantum dot light-emitting diodes could be used to build next-generation electroluminescent displays due to their colour properties and electrical stability. However, to create high-resolution and large-area displays, a pixel integration method is required, which can deposit quantum dot arrays on an active-matrix backplane and maintain uniformity and precision, without colour cross-contamination. Here we report a cracking-assisted transfer printing technology that can be used to pattern high-resolution full-colour pixel arrays over large areas. The technology uses a controlled cracking process to fracture interparticle cohesive bonds between quantum dots. This facilitates subsequent pick-up and transfer to a thin-film transistor backplane with high precision. With the technology, we achieve pixels down to a size of 600 nm with electroluminescent emission and uniform pixelization over areas up to 4 inches. We create a cadmium-free full-colour active-matrix display with a resolution of 341 pixels per inch, as well as a blue active-matrix display with a flexible form factor. Furthermore, the cracking-assisted transfer printing can improve electroluminescence performance-with higher maximum luminance and operational lifetime than other quantum dot patterning techniques-through precise nano-interface control and high quantum dot packing density.","abstract_hash":"5a8fa252ec61e775f4ec7aaeedba43ee36a94ca2a52753990554c54bf237e28c","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":5,"novelty_reason":"提出裂纹辅助转印这一新图案化机制，并首次给出 600 nm 像素、341 ppi 无镉全彩及柔性蓝光有源矩阵显示器的具体结果。","innovation_zh":"针对量子点像素集成中精度、均匀性与颜色互污染难以兼顾的问题，提出裂纹辅助转印（cracking-assisted transfer printing）技术：利用可控裂纹过程打断量子点之间的颗粒间内聚键，从而实现高精度拾取与转移到 TFT 背板。实现了最小 600 nm 的像素、最大 4 英寸的均匀像素化，做出 341 ppi 的无镉全彩有源矩阵显示器和柔性蓝光有源矩阵显示器；同时借助精确的纳米界面控制和高量子点堆积密度，其最大亮度和工作寿命优于其他量子点图案化技术。","method_zh":"用受控裂纹过程断裂量子点颗粒间的内聚键，再完成拾取并高精度转印到薄膜晶体管背板上，形成全彩像素阵列。","keywords_zh":["量子点发光二极管","转印印刷","高分辨率显示","有源矩阵","无镉量子点"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:21.589Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s41467-026-75613-5","doi":"10.1038/s41467-026-75613-5","doi_url":"https://doi.org/10.1038/s41467-026-75613-5","title":"High-yield visible-to-ultraviolet upconversion by ZnSe quantum dots with dynamic triplet transfer","title_zh":"ZnSe 量子点通过动态三重态转移实现高产率可见光到紫外上转换","title_key":"highyieldvisibletoultravioletupconversionbyznsequantumdotswithdynamictriplettransfer","authors":["Xin Zhang","Rongxin Zhang","Lei Wang","et al."],"venue":"Nature Communications","issn_l":"2041-1723","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-17","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-17","oa_status":"gold","pdf_url":"https://www.nature.com/articles/s41467-026-75613-5_reference.pdf","cited_by_count":1,"abstract":"Triplet-triplet annihilation upconversion sensitized by quantum dot is often limited by the short exciton lifetime, necessitating tethered triplet transmitter. Here, we report a transmitter-free system of ZnSe quantum dot and 2,5-diphenyloxazole achieving 24% upconversion quantum yield, the highest for quantum dot sensitization upconversion. The upconversion quantum yield peaks at 30 mM 2,5-diphenyloxazole. Transient spectroscopy shows the triplet energy transfer efficiency is over 80% regardless of the 2,5-diphenyloxazole concentration, but the triplet-triplet annihilation efficiency dominates the overall upconversion quantum yield and shows a strong dependence on the 2,5-diphenyloxazole concentration that increases first from 10% to 25%, then decreases. The optimal concentration is achieved when the triplet 2,5-diphenyloxazole collision probability is highest, thus ensuring a maximum triplet-triplet annihilation efficiency. This work demonstrates a design principle of binary quantum dot upconversion system and reveals the critical role of modulating emitter concentration for optimal upconversion quantum yield.","abstract_hash":"e047091ac9c2c832ab8acf0cf78ea3101ebc3c5c120e82f4c6d261613064de3e","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"去掉传递体、用二元体系把量子点敏化上转换产率推到 24% 的新高，并给出以发射体浓度调控 TTA 效率的设计原则。","innovation_zh":"量子点敏化的三重态-三重态湮灭上转换通常受限于激子寿命短，必须给量子点接上三重态传递体（tethered transmitter）。作者改用无传递体的二元体系：ZnSe 量子点直接敏化 2,5-二苯基噁唑（DPO），在 30 mM DPO 时上转换量子产率达到 24%，是量子点敏化上转换的最高值。瞬态光谱显示三重态能量转移效率在 80% 以上且几乎不随 DPO 浓度变化，真正决定整体产率的是三重态-三重态湮灭效率——它随 DPO 浓度先从 10% 升到 25% 再下降，最优浓度对应三重态 DPO 碰撞概率最高。","method_zh":"构建 ZnSe 量子点/DPO 无传递体二元上转换体系，用瞬态光谱分别量化三重态能量转移效率与三重态-三重态湮灭效率，并扫描 DPO 浓度找最优值。","keywords_zh":["量子点上转换","三重态-三重态湮灭","ZnSe 量子点","三重态能量转移","无传递体体系"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:22.588Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adma.74170","doi":"10.1002/adma.74170","doi_url":"https://doi.org/10.1002/adma.74170","title":"Self‐Limiting Ultrathin Heterocycle‐Bridged Interface Enabling Efficient p–i–n PbS Quantum Dot Solar Cells","title_zh":"自限制超薄杂环桥接界面实现高效 p–i–n PbS 量子点太阳能电池","title_key":"selflimitingultrathinheterocyclebridgedinterfaceenablingefficientpinpbsquantumdotsolarcells","authors":["Leliang Song","Yu Yin","Kunyuan Lu","et al."],"venue":"Advanced Materials","issn_l":"0935-9648","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-17","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-17","oa_status":"green","pdf_url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC13508721/pdf/ADMA-38-e74170.pdf","cited_by_count":0,"abstract":"ABSTRACT Hole‐transporting self‐assembled monolayers (SAMs) have driven rapid efficiency gains in solution‐processed p–i–n solar cells over the past few years. By contrast, while efficient electron extraction is equally crucial for device operation, electron‐transporting SAMs remain scarcely explored, thereby constraining further improvements in device performance. Here, we present an electron‐extraction‐modulating self‐limiting ultrathin molecular layer strategy for PbS quantum dot (QD) solar cells. The designed thiophene‐based molecules feature thiol anchors that coordinate with surface Pb 2 + ions to suppress nonradiative recombination, while their electron‐rich aromatic rings engage in π–π interactions with the top C 60 layer to enhance electron extraction. Critically, their high volatility enables the removal of excess molecules during annealing, yielding a compact, ultrathin molecular modification at the interface. This interface engineering delivers a power conversion efficiency of 14.47% in p–i–n PbS QD solar cells‐the highest value reported to date. These results provide a robust and scalable pathway for applying self‐limiting ultrathin molecular layer as a powerful paradigm for interfacial design.","abstract_hash":"a093bba173d79dcdb250c97f62249cf16d75c58ec4ff0f0b26d2c69650f981ea","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":5,"novelty_reason":"首次将自限制超薄分子层策略用于电子提取界面，并在 p–i–n PbS 量子点电池上刷新了 14.47% 的最高效率纪录。","innovation_zh":"针对 p–i–n 量子点太阳能电池中电子传输型自组装单分子层（SAM）研究稀缺、制约效率进一步提升的问题，作者设计了一种基于噻吩的电子提取调控分子，利用其硫醇锚定基与 PbS 量子点表面 Pb²⁺ 配位以抑制非辐射复合，同时富电子芳环与顶部 C₆₀ 层发生 π–π 相互作用增强电子提取。关键在于分子高挥发性使其在退火过程中可被部分去除，从而形成致密、超薄的界面修饰层（自限制）。最终 p–i–n PbS 量子点电池获得 14.47% 的转换效率，为目前报道的最高值。","method_zh":"在 PbS 量子点与 C₆₀ 电子传输层之间引入噻吩基自限制超薄分子层：硫醇锚定配位表面 Pb²⁺，芳环与 C₆₀ 形成 π–π 作用，退火时多余分子挥发留下致密超薄界面修饰。","keywords_zh":["PbS 量子点太阳能电池","自组装单分子层","电子提取","界面工程","自限制超薄层"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:23.072Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s41377-026-02356-9","doi":"10.1038/s41377-026-02356-9","doi_url":"https://doi.org/10.1038/s41377-026-02356-9","title":"A nanocrystal-based PN junction model for quantum dot light-emitting diodes","title_zh":"面向量子点发光二极管的纳米晶基 PN 结模型","title_key":"ananocrystalbasedpnjunctionmodelforquantumdotlightemittingdiodes","authors":["Hui Bao","Seyed Mehdi Sattari‐Esfahlan","Haizheng Zhong"],"venue":"Light Science & Applications","issn_l":"2047-7538","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-17","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-17","oa_status":"gold","pdf_url":"https://www.nature.com/articles/s41377-026-02356-9.pdf","cited_by_count":0,"abstract":"The PN junction of semiconductors plays an important role in designing and developing light-emitting diodes. In contrast, the characteristics of PN junctions in quantum dot light-emitting diodes (QLED) have been less discussed. In this work, we analyzed the current-voltage (I-V) characteristics of QLED using a modified nano-PN junction model, which combines a silicon-based PN junction model and a hopping transport model. Under the assumption of recombination current dominance in high-efficiency QLEDs, the correlations between complete QLED I-V curves and their constituent sub-device characteristics were derived. The voltage distribution and Quasi-Fermi level splitting of functional layers were performed to elucidate the high ideality factors of QLED devices. The nanocrystal-based PN junction model was extended to simulate the experimental I-V curves of efficient QLED devices. In all, this work not only deepens the device understanding into QLED from the view of semiconductor physics, but also builds up a theoretical framework of nanocrystal-based PN junctions.","abstract_hash":"1bf250bee9c7a5e66b97da9021b1d4ff4de59ee79db619692ce3816607f0a039","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"把 PN 结物理框架系统引入 QLED 的 I-V 分析，给出可拟合实验曲线的纳米 PN 结模型并解释高理想因子，属于新的理论分析框架而非单纯性能优化。","innovation_zh":"QLED 的 I-V 特性此前很少用 PN 结框架来讨论。作者把硅基 PN 结模型和跳跃输运（hopping transport）模型结合起来，提出一个修正的纳米 PN 结模型，用来拟合高效 QLED 的完整 I-V 曲线；在高效率器件中复合电流主导的假设下，推导出整条 I-V 曲线与各子器件特性之间的关联。工作还通过计算功能层的电压分配和准费米能级劈裂，解释了 QLED 器件理想因子偏高的原因，并把该模型推广到实际高效 QLED 实验 I-V 曲线的模拟。","method_zh":"将硅 PN 结模型与跳跃输运模型耦合，构建修正的纳米 PN 结模型，对 QLED 完整 I-V 曲线做拟合，并分析各功能层的电压分配与准费米能级劈裂。","keywords_zh":["量子点发光二极管","PN 结模型","I-V 特性","理想因子","跳跃输运"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:23.782Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adma.74108","doi":"10.1002/adma.74108","doi_url":"https://doi.org/10.1002/adma.74108","title":"A Bifunctional Colloidal Quantum Dot Diode for Nanosecond Short‐Wave Infrared Detection and Emission","title_zh":"面向纳秒级短波红外探测与发射的双功能胶体量子点二极管","title_key":"abifunctionalcolloidalquantumdotdiodefornanosecondshortwaveinfrareddetectionandemission","authors":["Yu‐Hao Deng","Dobromił Respekta","Jing Bai","et al."],"venue":"Advanced Materials","issn_l":"0935-9648","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-16","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-16","oa_status":"green","pdf_url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC13449106/pdf/ADMA-38-e74108.pdf","cited_by_count":1,"abstract":"ABSTRACT Short‐wave infrared (SWIR) technologies are vital for optical communication, all‐weather imaging, and advanced spectroscopy. Using a single diode for light detection and emission can reduce device footprints, lower cost and enable fast, bidirectional communication. However, dual detection/emission operation often involves incompatible choices of material and stack design, which result in devices with inferior performance. Here, we introduce a bifunctional PbS QD diode stack that achieves, for the first time, nanosecond‐fast photodetection and emission in a single SWIR device. Using thin active layers with high charge‐carrier mobility and compact geometries, we demonstrate a record 2 ns response in photodiode (QDPD) mode and 11.7 ns rise time/6.5 ns fall time in light‐emitting diode (QDLED) mode. This high‐speed operation is combined with a 49% external quantum efficiency (EQE) and 2.6 × 10 1 2 cm·Hz 0 . 5 ·W − 1 detectivity for QDPD operation, while the QDLED reaches 8.1% EQE. These high‐speed, compact devices unify imaging and detection with a single, CMOS‐compatible platform, and set the stage for integrated SWIR photonics and bidirectional optical interconnects. This work demonstrates the potential of QDs to unify imaging, detection, and communication in a single materials platform.","abstract_hash":"08f5811fdf9357e6ab0496a58ad6c86b3fc95dd3674c0ae311722d6494ea308d","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":5,"novelty_reason":"首次在单一 SWIR 量子点二极管上同时实现纳秒级探测与发光，并给出 2 ns 响应等纪录级指标。","innovation_zh":"用同一套 PbS 量子点二极管叠层首次在单个短波红外器件里同时实现纳秒级光探测和发光。做法是减薄有源层、提高载流子迁移率并采用紧凑几何结构，从而把探测模式响应压到 2 ns（报道为纪录值），发光模式上升 11.7 ns、下降 6.5 ns。性能上没有牺牲效率：光电二极管模式外量子效率 49%、探测率 2.6×10^12 cm·Hz^0.5·W^-1，LED 模式外量子效率 8.1%。","method_zh":"基于 PbS 量子点的双功能二极管叠层，通过薄有源层、高载流子迁移率和紧凑器件几何实现高速探测与电致发光共用同一结构，且与 CMOS 工艺兼容。","keywords_zh":["PbS 量子点","短波红外","双功能二极管","纳秒响应","光电探测与发光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:24.975Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adom.71469","doi":"10.1002/adom.71469","doi_url":"https://doi.org/10.1002/adom.71469","title":"Dual‐Sided Interface Engineering via Aluminum Glycinate for Efficient and Stable P‐I‐N PbS Quantum Dot Solar Cells","title_zh":"双面界面工程：利用甘氨酸铝实现高效稳定的 p-i-n 结构 PbS 量子点太阳能电池","title_key":"dualsidedinterfaceengineeringviaaluminumglycinateforefficientandstablepinpbsquantumdotsolarcells","authors":["Juncheng Zhu","J F Xu","Zheng Han","et al."],"venue":"Advanced Optical Materials","issn_l":"2195-1071","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-16","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-16","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Lead sulfide (PbS) colloidal quantum dots (CQDs) offer exceptional promise for next‐generation low‐cost photovoltaics with tandem architectures, owing to their superior light‐harvesting capabilities in the short‐wave infrared (SWIR) region. However, interfacial mismatches in architectures limit their compatibility with current high‐efficiency, solution‐processed p‐i‐n tandem cells. To overcome these limitations, we introduce an interfacial engineering strategy between hole transport layer (HTL) and PbS CQDs layer by using a multifunctional organometallic linker aluminum glycinate (AG). Spectroscopic analysis reveals a dual interfacial modification mechanism, wherein aluminum centers in AG coordinate with residual phosphonic acids on HTL to minimize chemical disorder, while amino and carboxyl groups synergistically heal undercoordinated Pb surface defects. This strategy establishes a chemically robust transition layer that significantly suppresses non‐radiative recombination. Consequently, the power conversion efficiency (PCE) increases substantially from 12.78% to 14.12%, representing one of the highest reported efficiencies for p‐i‐n PbS CQD solar cells to date. This work offers a straightforward chemical modulation pathway to overcome interfacial carrier losses, advancing PbS CQDs toward practical deployment in next‐generation infrared and tandem photovoltaics.","abstract_hash":"a5705057c0e4239f5310ab2ad65ad0de3942bc14553045a17b4dd0f9570c6a7a","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"提出甘氨酸铝双面界面修饰的新策略并给出明确的效率提升（12.78%→14.12%），但属于界面工程优化而非全新器件机制。","innovation_zh":"针对 p-i-n 结构 PbS 胶体量子点太阳能电池中空穴传输层与量子点层之间的界面失配问题，作者引入多功能有机金属连接剂甘氨酸铝（AG）作为界面修饰层。光谱分析表明 AG 具有双面修饰机制：铝中心与 HTL 上残留的膦酸配位以减少化学无序，氨基和羧基则协同钝化配位不足的 Pb 表面缺陷，从而形成化学稳定的过渡层并显著抑制非辐射复合。器件 PCE 从 12.78% 提升到 14.12%，作者称这是目前 p-i-n PbS 量子点太阳能电池报道的最高效率之一。","method_zh":"在空穴传输层与 PbS 量子点层之间旋涂/引入甘氨酸铝（AG）作为界面连接层，通过铝中心与残留膦酸配位、氨基与羧基钝化 Pb 缺陷的双重作用构建过渡层，并制备 p-i-n 结构器件进行光伏性能测试。","keywords_zh":["PbS 量子点","p-i-n 太阳能电池","界面工程","甘氨酸铝","非辐射复合"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:25.630Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.matlet.2026.141293","doi":"10.1016/j.matlet.2026.141293","doi_url":"https://doi.org/10.1016/j.matlet.2026.141293","title":"Efficient counter electrodes for quantum dot-sensitized solar cells: a mechanism and comparative study of PbSe and PbS on mesoporous antimony-doped tin oxide films","title_zh":"量子点敏化太阳能电池的高效对电极：介孔掺锑氧化锡薄膜上 PbSe 与 PbS 的机理与对比研究","title_key":"efficientcounterelectrodesforquantumdotsensitizedsolarcellsamechanismandcomparativestudyofpbseandpbsonmesoporousantimonydopedtinoxidefilms","authors":["Bin Jin","Hong Liang Lai","Xiao Lu Wang","et al."],"venue":"Materials Letters","issn_l":"0167-577X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-16","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-16","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"数据库未收录摘要，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，建议直接查看原文。","keywords_zh":["量子点敏化太阳能电池","对电极","PbSe","PbS","掺锑氧化锡"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:24.952Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1109/jlt.2026.3714307","doi":"10.1109/jlt.2026.3714307","doi_url":"https://doi.org/10.1109/jlt.2026.3714307","title":"Continuous-Wave InAs/GaAs Quantum Dot Laser Grown on V-Grooved Si(001) With Low Thermal Drift","title_zh":"在V型槽Si(001)衬底上生长的低热漂移连续波InAs/GaAs量子点激光器","title_key":"continuouswaveinasgaasquantumdotlasergrownonvgroovedsi001withlowthermaldrift","authors":["Lifeng Bao","C F Chen","Makhayeni Mtunzi","et al."],"venue":"Journal of Lightwave Technology","issn_l":"0733-8724","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-16","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-16","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["InAs/GaAs量子点","硅基激光器","V型槽Si(001)","连续波","低热漂移"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:26.041Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsaelm.6c00756","doi":"10.1021/acsaelm.6c00756","doi_url":"https://doi.org/10.1021/acsaelm.6c00756","title":"Hardness of Infrared Nanocrystal-Based Photodiode to Irradiations for Space Applications","title_zh":"红外纳米晶光电二极管在空间应用辐照环境下的抗辐照硬度研究","title_key":"hardnessofinfrarednanocrystalbasedphotodiodetoirradiationsforspaceapplications","authors":["Alexandre Neyret","Albin Colle","Dario Mastrippolito","et al."],"venue":"ACS Applied Electronic Materials","issn_l":"2637-6113","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-16","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-16","oa_status":"green","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Infrared (IR) sensing is essential for space applications such as remote sensing and spectroscopy, where sensors must withstand harsh radiation environments. Traditional IR sensors rely on II–VI and III–V semiconductor thin films, but emerging technologies like colloidal nanocrystals (NCs) offer cost-effective and scalable alternatives. However, the current study dedicated to their radiation tolerance remains very limited, thus leaving their potential unclear. This study investigates the radiation hardness of short-wave infrared (SWIR) photodiodes based on HgTe/CdS core–shell NCs, focusing on their resilience to X-ray, high-energy proton, and He+ ion irradiations, key challenges for space missions. The HgTe/CdS NCs, known for their thermal stability and low dark current, were processed into a diode stack and subjected to irradiation. Using X-ray photoemission spectroscopy (XPS) and depth profiling, we correlated optoelectronic degradation with nanoscale chemical and structural modifications, such as anion oxidation and cation redistribution. These findings highlight the potential of colloidal NCs to operate in a harsh radiation environment.","abstract_hash":"3d0eff9d9e69bd15de9e7b21071667b6095da8792015d763c0d03f413dbd66d6","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"把已有 HgTe/CdS 纳米晶光电二极管放到空间辐照场景下做系统耐受性验证，属于新体系上验证已有思路，且摘要未给出定量性能指标。","innovation_zh":"针对胶体纳米晶红外探测器抗辐照数据极度匮乏的问题，系统考察了基于 HgTe/CdS 核壳纳米晶的短波红外光电二极管对 X 射线、高能质子和 He+ 离子辐照的耐受性。工作把光电器件性能退化与纳米尺度的化学/结构变化（阴离子氧化、阳离子再分布）通过 XPS 及深度剖析关联起来，说明胶体纳米晶具备在恶劣辐照环境下工作的潜力。摘要未给出具体退化幅度或剂量阈值等定量指标。","method_zh":"将 HgTe/CdS 核壳纳米晶制成二极管叠层结构，分别进行 X 射线、高能质子和 He+ 离子辐照，并用 XPS 与深度剖析表征辐照前后的化学与结构变化，与光电器件性能退化对应。","keywords_zh":["HgTe/CdS 核壳纳米晶","短波红外光电二极管","抗辐照硬度","XPS 深度剖析","空间应用"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:27.389Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/lpor.71591","doi":"10.1002/lpor.71591","doi_url":"https://doi.org/10.1002/lpor.71591","title":"Balancing Passivation and Charge Carrier Transport in Core/Shell Quantum Dots toward High‐Responsive and Low‐Dark Current Infrared Photodetectors","title_zh":"平衡核/壳量子点的钝化与载流子输运以实现高响应、低暗电流红外光电探测器","title_key":"balancingpassivationandchargecarriertransportincoreshellquantumdotstowardhighresponsiveandlowdarkcurrentinfraredphotodetectors","authors":["Dijie Zhang","Zhiyu Zhao","Zhijiao Huang","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-15","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-15","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":"ABSTRACT Lead selenide (PbSe) quantum dots (QDs) are promising candidates for short‐wave infrared (SWIR) photodetectors; however, their performance is fundamentally limited by surface trap states and environmental instability. Constructing core/shell heterostructures offers a potential solution, yet a critical challenge remains in optimizing the shell to strike a synergistic balance between effective defect passivation and efficient carrier transport. Herein, we report a precise cation‐exchange epitaxial growth strategy to synthesize highly monodisperse PbSe/PbS core/shell QDs with tunable shell thickness. We systematically elucidate the structure‐property relationships, revealing that thicker PbS shells significantly suppress non‐radiative recombination and extend carrier lifetimes. By tailoring the shell thickness to an optimal regime, we achieve a high‐quality QD solid that minimizes trap density while maintaining superior carrier mobility. Consequently, the optimized SWIR photodetector exhibits a high external quantum efficiency (EQE) of 49% at 0 V and a specific detectivity of 2.37 × 10 12 Jones at 1650 nm. Furthermore, this robust architecture enables the extension of spectral response into the extended SWIR region (up to 2.5 µm) and facilitates the demonstration of high‐resolution SWIR imaging. This work provides a generic design principle for engineering high‐performance infrared optoelectronics through precise modulation of heterostructure nanomaterials.","abstract_hash":"2a9494416c036082b80a02b92969c28be8fe326e4e2e0c7155986984f914e938","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"用阳离子交换外延实现壳厚可调的 PbSe/PbS 核壳量子点并明确钝化-输运权衡，器件 EQE 与比探测率指标具体且响应拓展到 2.5 µm，属于有新策略且性能显著提升的工作。","innovation_zh":"针对 PbSe 量子点表面陷阱态和环境稳定性差的问题，作者用阳离子交换外延生长法合成了壳厚可调的 PbSe/PbS 核壳量子点，系统研究了壳厚与结构-性能的关系：厚壳能显著抑制非辐射复合、延长载流子寿命，但壳太厚又会影响输运，因此需要在钝化与载流子迁移率之间找最优区间。优化后的 SWIR 探测器在 0 V 下 EQE 达 49%，1650 nm 处比探测率为 2.37 × 10^12 Jones，并把光谱响应拓展到 2.5 µm，还演示了高分辨率 SWIR 成像。","method_zh":"采用阳离子交换外延生长策略制备单分散、壳厚可调的 PbSe/PbS 核壳量子点，通过调节壳厚优化量子点固体的陷阱密度与载流子迁移率平衡，并构筑 SWIR 光电探测器。","keywords_zh":["PbSe/PbS 核壳量子点","短波红外光电探测器","阳离子交换外延","表面钝化","载流子输运"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:27.829Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1109/led.2026.3713619","doi":"10.1109/led.2026.3713619","doi_url":"https://doi.org/10.1109/led.2026.3713619","title":"Valence-Band Offset Engineering in LWIR InAs/InAsSb nBn Detectors","title_zh":"长波红外 InAs/InAsSb nBn 探测器中的价带偏移工程","title_key":"valencebandoffsetengineeringinlwirinasinassbnbndetectors","authors":["M. Kopytko","Grzegorz Kołodziej","Piotr Baranowski","et al."],"venue":"IEEE Electron Device Letters","issn_l":"0741-3106","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-07-15","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-15","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["InAs/InAsSb","nBn 探测器","长波红外","价带偏移","能带工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:54:26.534Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.5281/zenodo.23180263","doi":"10.5281/zenodo.23180263","doi_url":"https://doi.org/10.5281/zenodo.23180263","title":"BASIC MECHANISMS OF QUANTUM DOT–PHONON INTERACTIONS IN SEMICONDUCTOR NANOSTRUCTURES AND THEIR APPLICATIONS","title_zh":"半导体纳米结构中量子点–声子相互作用的基本机制及其应用","title_key":"basicmechanismsofquantumdotphononinteractionsinsemiconductornanostructuresandtheirapplications","authors":["Dr. Ranjan Prasad"],"venue":"Zenodo (CERN European Organization for Nuclear Research)","issn_l":null,"source_type":"repository","is_preprint":true,"alt_doi":null,"pub_date":"2026-07-15","pub_year":2026,"date_suspect":false,"sort_date":"2026-07-15","oa_status":"green","pdf_url":"https://ierj.in/journal/index.php/ierj/article/download/5774/9545","cited_by_count":0,"abstract":"Quantum dot–phonon interactions play a fundamental role in determining the optical, electronic and dynamical properties of semiconductor nanostructures. This paper examines the fundamental mechanisms governing exciton–phonon coupling, with particular emphasis on interactions involving acoustic phonons in quantum dots. The influence of phonon-induced dephasing, energy relaxation, line width broadening, spectral shifts and phonon sidebands is discussed using theoretical approaches such as the Independent Boson Model, polaron transformations and density-matrix methods. Particular attention is given to deformation-potential coupling and its dependence on temperature, quantum-dot size and material properties. The review further explores emerging applications of quantum dot–phonon interactions in single-photon sources, quantum communication, solid-state quantum information processing, phonon-assisted optical devices and quantum sensing. Understanding and controlling these interactions is essential for improving photon indistinguishability, coherence and device stability. The study highlights current challenges and future opportunities for engineering phonon environments to develop high-performance quantum nanodevices.","abstract_hash":"ed2594a2fc8e4c5f5837c0eb919bbf31a85f49e842276056135385df5807b271","abstract_source":"openalex","abstract_missing":false,"direction <script>
// site/app.js —— 零依赖前端。同时服务两种加载方式：
//   1) GitHub Pages：从 data/papers.json 和 data/meta.json 取数
//   2) standalone.html：数据已内联在 window.__PAPERS__ / window.__META__
(function () {
  'use strict';

  var READ_KEY = 'qd-paper-watch:read';

  var state = {
    papers: [],
    meta: {},
    query: '',
    directions: {},
    minNovelty: 0,
    rangeDays: 0,
    sort: 'date',
    hideRead: false,
    read: loadRead(),
  };

  var el = {};

  function loadRead() {
    try {
      var raw = localStorage.getItem(READ_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveRead() {
    try {
      localStorage.setItem(READ_KEY, JSON.stringify(state.read));
    } catch (e) {
      /* 隐私模式下忽略 */
    }
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function fetchJson(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (res) {
      if (!res.ok) throw new Error(url + ' → HTTP ' + res.status);
      return res.json();
    });
  }

  function fmtDate(value) {
    if (!value) return '';
    var parts = String(value).slice(0, 10).split('-');
    if (parts.length !== 3) return value;
    return parts[0] + '年' + Number(parts[1]) + '月' + Number(parts[2]) + '日';
  }

  function daysAgo(value) {
    if (!value) return Infinity;
    var t = Date.parse(String(value).slice(0, 10) + 'T00:00:00');
    if (isNaN(t)) return Infinity;
    return (Date.now() - t) / 86400000;
  }

  function relativeLabel(value) {
    var d = daysAgo(value);
    if (d < 0) return '待上线';
    if (d < 1) return '今天';
    if (d < 2) return '昨天';
    if (d < 7) return Math.floor(d) + ' 天前';
    return '';
  }

  function directionMeta(id) {
    var list = (state.meta.directions || []).concat(state.meta.extraDirections || []);
    for (var i = 0; i < list.length; i += 1) {
      if (list[i].id === id) return list[i];
    }
    return { id: id, label: id, color: '#94a3b8' };
  }

  // OpenAlex 里不少摘要自带 "Abstract " 前缀，展示时去掉
  function cleanAbstract(text) {
    return String(text || '').replace(/^\s*abstract[\s:.\u2014\u2013-]+/i, '');
  }

  function paperText(paper) {
    return [
      paper.title,
      paper.title_zh,
      paper.abstract,
      paper.innovation_zh,
      paper.method_zh,
      paper.venue,
      (paper.keywords_zh || []).join(' '),
      (paper.authors || []).join(' '),
      paper.doi,
    ]
      .filter(Boolean)
      .join(' \n ')
      .toLowerCase();
  }

  function matches(paper) {
    if (state.query) {
      var terms = state.query.split(/\s+/).filter(Boolean);
      var text = paper.__text || (paper.__text = paperText(paper));
      for (var i = 0; i < terms.length; i += 1) {
        if (text.indexOf(terms[i]) === -1) return false;
      }
    }

    var dirIds = Object.keys(state.directions);
    if (dirIds.length) {
      var paperDirs = paper.directions || [];
      var hit = false;
      for (var j = 0; j < dirIds.length; j += 1) {
        if (paperDirs.indexOf(dirIds[j]) !== -1) {
          hit = true;
          break;
        }
      }
      if (!hit) return false;
    }

    if (state.minNovelty > 0) {
      if (!(Number(paper.novelty_score) >= state.minNovelty)) return false;
    }

    if (state.rangeDays > 0) {
      if (daysAgo(paper.sort_date || paper.pub_date) > state.rangeDays) return false;
    }

    if (state.hideRead && state.read[paper.doi]) return false;

    return true;
  }

  function sortPapers(list) {
    var copy = list.slice();
    copy.sort(function (a, b) {
      if (state.sort === 'novelty') {
        var diff = (b.novelty_score || 0) - (a.novelty_score || 0);
        if (diff !== 0) return diff;
      } else if (state.sort === 'citations') {
        var dc = (b.cited_by_count || 0) - (a.cited_by_count || 0);
        if (dc !== 0) return dc;
      }
      var dd = String(b.sort_date || '').localeCompare(String(a.sort_date || ''));
      if (dd !== 0) return dd;
      return String(b.first_seen || '').localeCompare(String(a.first_seen || ''));
    });
    return copy;
  }

  function noveltyBadge(paper) {
    var score = paper.novelty_score;
    if (!score) {
      return '<span class="badge badge-pending">创新度待评</span>';
    }
    var cls = score >= 5 ? 'badge-n5' : score >= 4 ? 'badge-n4' : score >= 3 ? 'badge-n3' : 'badge-n2';
    var reason = paper.novelty_reason ? ' title="' + escapeHtml(paper.novelty_reason) + '"' : '';
    return '<span class="badge ' + cls + '"' + reason + '>创新度 ' + score + '/5</span>';
  }

  function renderCard(paper) {
    var dirs = (paper.directions || [])
      .map(function (id) {
        var meta = directionMeta(id);
        return (
          '<span class="chip" style="--chip:' +
          escapeHtml(meta.color) +
          '">' +
          escapeHtml(meta.label) +
          '</span>'
        );
      })
      .join('');

    var keywords = (paper.keywords_zh || [])
      .map(function (k) {
        return '<span class="kw">' + escapeHtml(k) + '</span>';
      })
      .join('');

    var rel = relativeLabel(paper.sort_date || paper.pub_date);
    var isNew = daysAgo(paper.first_seen) < 1;
    var read = Boolean(state.read[paper.doi]);

    var summaryHtml;
    if (paper.innovation_zh) {
      summaryHtml =
        '<p class="innovation">' +
        escapeHtml(paper.innovation_zh) +
        '</p>' +
        (paper.method_zh ? '<p class="method"><span class="label">方法</span>' + escapeHtml(paper.method_zh) + '</p>' : '');
    } else if (paper.summary_source === 'failed') {
      summaryHtml = '<p class="pending">中文总结生成失败，下次更新会自动重试。</p>';
    } else {
      summaryHtml = '<p class="pending">中文总结待生成：在 .env 里填入 DEEPSEEK_API_KEY，再运行 npm run update 即可自动补齐（抓取本身不需要 key）。</p>';
    }

    var links = [];
    links.push('<a class="link" href="' + escapeHtml(paper.doi_url || 'https://doi.org/' + paper.doi) + '" target="_blank" rel="noopener">DOI 原文</a>');
    if (paper.pdf_url) {
      links.push('<a class="link" href="' + escapeHtml(paper.pdf_url) + '" target="_blank" rel="noopener">开放获取 PDF</a>');
    }

    var abstractBlock = paper.abstract
      ? '<details class="abstract"><summary>查看英文摘要</summary><p>' + escapeHtml(cleanAbstract(paper.abstract)) + '</p></details>'
      : '<p class="muted small-text">数据库未收录摘要。</p>';

    var extra = [];
    if (paper.alt_doi) extra.push('同一论文的另一条记录：' + escapeHtml(paper.alt_doi));
    if (paper.date_suspect) extra.push('期刊给出的是未来出版日期，已按收录日期排序');

    return (
      '<article class="card' + (read ? ' is-read' : '') + '" data-doi="' + escapeHtml(paper.doi) + '">' +
      '<div class="card-head">' +
      '<h2 class="title-zh">' + escapeHtml(paper.title_zh || paper.title) + '</h2>' +
      '<button type="button" class="read-toggle" data-read="' + escapeHtml(paper.doi) + '" aria-pressed="' + (read ? 'true' : 'false') + '">' +
      (read ? '标为未读' : '标为已读') +
      '</button>' +
      '</div>' +
      (paper.title_zh ? '<p class="title-en">' + escapeHtml(paper.title) + '</p>' : '') +
      '<div class="meta-line">' +
      '<span class="venue">' + escapeHtml(paper.venue || '未知来源') + '</span>' +
      '<span class="dot">·</span><span>' + fmtDate(paper.pub_date) + '</span>' +
      (rel ? '<span class="dot">·</span><span class="rel">' + escapeHtml(rel) + '</span>' : '') +
      (isNew ? '<span class="badge badge-new">新收录</span>' : '') +
      (paper.oa_status === 'gold' || paper.oa_status === 'hybrid' || paper.oa_status === 'green'
        ? '<span class="badge badge-oa">开放获取</span>'
        : '') +
      '</div>' +
      '<div class="meta-line authors">' + escapeHtml((paper.authors || []).join('、')) + '</div>' +
      '<div class="tags">' + dirs + noveltyBadge(paper) + '</div>' +
      summaryHtml +
      (keywords ? '<div class="keywords">' + keywords + '</div>' : '') +
      abstractBlock +
      '<div class="card-foot">' + links.join('') +
      (extra.length ? '<span class="extra">' + extra.join('；') + '</span>' : '') +
      '</div>' +
      '</article>'
    );
  }

  function render() {
    var filtered = state.papers.filter(matches);
    var sorted = sortPapers(filtered);

    el.list.innerHTML = sorted.map(renderCard).join('');
    el.empty.hidden = sorted.length > 0;
    el.hint.textContent = '显示 ' + sorted.length + ' / ' + state.papers.length + ' 篇';

    var unread = state.papers.filter(function (p) {
      return !state.read[p.doi];
    }).length;
    el.hint.textContent += ' · 未读 ' + unread + ' 篇';
  }

  function renderDirectionFilters() {
    var list = state.meta.directions || [];
    el.directionRow.innerHTML = list
      .map(function (d) {
        var count = state.papers.filter(function (p) {
          return (p.directions || []).indexOf(d.id) !== -1;
        }).length;
        return (
          '<button type="button" class="dir" data-dir="' +
          escapeHtml(d.id) +
          '" aria-pressed="false" style="--chip:' +
          escapeHtml(d.color) +
          '">' +
          escapeHtml(d.label) +
          ' <span class="dir-count">' +
          count +
          '</span></button>'
        );
      })
      .join('');
  }

  function renderHeader() {
    var meta = state.meta || {};
    el.statCount.textContent = '共 ' + state.papers.length + ' 篇';
    if (meta.generated_at) {
      var d = new Date(meta.generated_at);
      el.statUpdated.textContent =
        '更新于 ' +
        d.toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }
    if (meta.project) {
      document.title = meta.project;
    }
    var windowDays = meta.window_days;
    el.subtitle.textContent = windowDays
      ? '自动追踪最近 ' + windowDays + ' 天内发表的量子点器件论文，并给出中文创新点总结。'
      : '自动追踪最新发表的量子点器件论文，并给出中文创新点总结。';
  }

  function bind() {
    el.q.addEventListener('input', function (e) {
      state.query = e.target.value.trim().toLowerCase();
      render();
    });

    el.sort.addEventListener('change', function (e) {
      state.sort = e.target.value;
      render();
    });

    el.range.addEventListener('change', function (e) {
      state.rangeDays = Number(e.target.value) || 0;
      render();
    });

    el.hideRead.addEventListener('change', function (e) {
      state.hideRead = e.target.checked;
      render();
    });

    el.onlyHigh.addEventListener('change', function (e) {
      state.minNovelty = e.target.checked ? state.meta.highNoveltyThreshold || 4 : 0;
      render();
    });

    el.reset.addEventListener('click', function () {
      state.query = '';
      state.directions = {};
      state.minNovelty = 0;
      state.rangeDays = 0;
      state.hideRead = false;
      el.q.value = '';
      el.range.value = '0';
      el.hideRead.checked = false;
      el.onlyHigh.checked = false;
      var buttons = el.directionRow.querySelectorAll('.dir');
      for (var i = 0; i < buttons.length; i += 1) buttons[i].setAttribute('aria-pressed', 'false');
      render();
    });

    el.directionRow.addEventListener('click', function (e) {
      var button = e.target.closest('.dir');
      if (!button) return;
      var id = button.getAttribute('data-dir');
      var pressed = button.getAttribute('aria-pressed') === 'true';
      button.setAttribute('aria-pressed', pressed ? 'false' : 'true');
      if (pressed) delete state.directions[id];
      else state.directions[id] = true;
      render();
    });

    el.list.addEventListener('click', function (e) {
      var button = e.target.closest('.read-toggle');
      if (!button) return;
      var doi = button.getAttribute('data-read');
      if (state.read[doi]) delete state.read[doi];
      else state.read[doi] = Date.now();
      saveRead();
      render();
    });
  }

  function fail(err) {
    el.error.hidden = false;
    el.errorDetail.textContent = err && err.message ? err.message : String(err);
    el.subtitle.textContent = '数据加载失败';
  }

  function boot() {
    el.q = document.getElementById('q');
    el.sort = document.getElementById('sort');
    el.range = document.getElementById('range');
    el.hideRead = document.getElementById('hide-read');
    el.onlyHigh = document.getElementById('only-high');
    el.reset = document.getElementById('reset');
    el.hint = document.getElementById('hint');
    el.list = document.getElementById('list');
    el.empty = document.getElementById('empty');
    el.error = document.getElementById('error');
    el.errorDetail = document.getElementById('error-detail');
    el.directionRow = document.getElementById('direction-row');
    el.statCount = document.getElementById('stat-count');
    el.statUpdated = document.getElementById('stat-updated');
    el.subtitle = document.getElementById('subtitle');

    var loading = null;
    if (window.__PAPERS__ && window.__META__) {
      loading = Promise.resolve({ papers: window.__PAPERS__, meta: window.__META__ });
    } else {
      loading = Promise.all([fetchJson('data/papers.json'), fetchJson('data/meta.json')]).then(function (res) {
        return { papers: res[0].papers || [], meta: res[1] };
      });
    }

    loading
      .then(function (data) {
        state.papers = data.papers || [];
        state.meta = data.meta || {};
        renderHeader();
        renderDirectionFilters();
        bind();
        render();
      })
      .catch(fail);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
