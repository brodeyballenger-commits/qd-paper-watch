densities and high detectivities of 4.3 × 1011, 2.6 × 1011, and 1.6 × 1011 Jones at 600, 1000, and 1550 nm, respectively. Integration with a silicon thin-film transistor readout circuit enables multimodal VIS–NIR–SWIR imaging, and multilayer perceptron–assisted learning further enables high-quality spectral reconstruction. These results highlight the potential of this CQD n–p–n architecture for multispectral imaging and compact computational spectrometer applications.","abstract_hash":"e5901ff7eab8cbafb551575c5478197627341b31524687617fa005093acba3fb","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials","display"],"novelty_score":4,"novelty_reason":"用反向内建电场的 CQD n–p–n 堆叠实现单像素偏压可切换双波段探测，并给出具体探测率与成像/光谱重构演示，属明确的新结构策略。","innovation_zh":"作者用 PbS 与 PbSe 胶体量子点垂直堆叠出 n–p–n 异质结，两个内建电场方向相反，靠外加偏压极性改变电场分布，从而在单个像素内实现 VIS+NIR 与 NIR+SWIR 两种探测模式的电学切换。中间插入 ZnTe 层抑制暗电流并增强光谱选择性。器件在 600、1000、1550 nm 的探测率分别为 4.3×10^11、2.6×10^11、1.6×10^11 Jones，并与硅薄膜晶体管读出电路集成实现多模态成像，配合多层感知机完成光谱重构。","method_zh":"垂直堆叠 PbS/PbSe 胶体量子点构成 n–p–n 异质结，内建电场方向相反，中间引入 ZnTe 插层；通过反转偏压极性切换载流子输运路径与响应波段，并集成硅 TFT 读出电路与 MLP 算法做光谱重建。","keywords_zh":["胶体量子点","n–p–n 异质结","短波红外探测","偏压可切换","计算光谱"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:13.657Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsaelm.6c01182","doi":"10.1021/acsaelm.6c01182","doi_url":"https://doi.org/10.1021/acsaelm.6c01182","title":"Optimizing Charge Injection Balance in InP-Based Quantum Dot Light-Emitting Diodes Via Precise Control of Hole Transport Layer Cross-Linking Density","title_zh":"通过精确调控空穴传输层交联密度优化 InP 基量子点发光二极管的电荷注入平衡","title_key":"optimizingchargeinjectionbalanceininpbasedquantumdotlightemittingdiodesviaprecisecontrolofholetransportlayercrosslinkingdensity","authors":["Eun Saem Cho","Jae Yeong Jeong","Seok Hwan Jang","et al."],"venue":"ACS Applied Electronic Materials","issn_l":"2637-6113","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Quantum dot light-emitting diodes (QLEDs) have attracted considerable attention as next-generation light-emitting devices capable of achieving high emission efficiency based on their organic–inorganic hybrid architecture. However, the environmental degradation and performance loss arising from the vulnerability of the organic layers within the device to oxygen and moisture remain a major factor limiting long-term device stability. To address this issue, we introduce VNPB (N4,N4′-di(naphthalen-1-yl)-N4,N4′-bis(4-vinylphenyl)biphenyl-4,4′-diamine), a cross-linkable hole transport layer (HTL) material, into InP-based QLEDs and systematically investigate the effect of the cross-linking density, controlled by the post-annealing temperature, on the electrical and optical properties of the devices. VNPB contains terminal vinyl groups that enable the formation of an intermolecular covalent network during thermal annealing, thereby providing excellent solvent resistance and structural stability that suppress the re-dissolution of the underlying layer during multilayer solution processing. By varying the post-annealing temperature of the VNPB film from 160 to 190 °C, we elucidated the effect of the cross-linking density on the performance of InP-based QLEDs. Rinsing tests confirmed that the cross-linking density increased progressively with annealing temperature, forming a robust network. Device analysis showed that the 170 °C condition achieved a maximum EQE of 5.55% and the optimal operational lifetime (T70 = 45.1 h). In contrast, devices annealed at 180–190 °C exhibited increased surface roughness and local current response. Together with the larger voltage variation observed under constant-current operation, these results suggest increased morphology-induced localized conduction and electrical instability, resulting in non-uniform charge transport and charge imbalance. This study demonstrates that controlling the cross-linking density of the hole transport layer can serve as an important processing strategy for regulating charge injection balance and recombination behavior in solution-processed QLEDs.","abstract_hash":"8f003d0984417f8e43ddbde879d7e0098d806bdbeac4054b59e19f2009b048e4","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"属于在 InP QLED 体系上验证「交联密度调控电荷平衡」这一已有思路的渐进式工艺优化，给出了明确的退火温度窗口和 EQE/寿命数据，但未提出新机制或新器件结构。","innovation_zh":"针对 InP 基 QLED 中有机空穴传输层易受氧/水侵蚀、且多层溶液加工时易被再溶解的问题，作者把可交联的 HTL 材料 VNPB（端基为乙烯基）引入器件，用后退火温度（160–190 °C）作为唯一变量来系统调节交联密度。冲洗测试表明交联密度随退火温度升高而增大；170 °C 时器件拿到最高 EQE 5.55% 和最佳工作寿命 T70 = 45.1 h，而 180–190 °C 反而出现表面粗糙度上升、局部电流响应增强、恒流下电压漂移变大，说明过度交联带来的形貌诱导局域导电会破坏电荷传输均匀性和注入平衡。核心新意在于把「交联密度」当作调控电荷注入平衡的工艺旋钮，并给出了存在最优退火窗口的实验证据。","method_zh":"在 InP 基 QLED 中用可交联空穴传输材料 VNPB 替代常规 HTL，通过热退火使端乙烯基形成分子间共价网络，并以 160–190 °C 的后退火温度梯度控制交联密度，结合冲洗测试、表面形貌与电流响应表征及器件 EQE/寿命测试进行关联分析。","keywords_zh":["InP 量子点发光二极管","空穴传输层交联","电荷注入平衡","退火温度","工作寿命"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:14.198Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpclett.6c02354","doi":"10.1021/acs.jpclett.6c02354","doi_url":"https://doi.org/10.1021/acs.jpclett.6c02354","title":"Core/Shell/Shell Strategy for Stable and Luminescent PbSe Colloidal Nanocrystals Tuned through the Extended Short- to Mid-Wave Infrared","title_zh":"核/壳/壳结构策略实现稳定发光的 PbSe 胶体纳米晶，覆盖扩展短波至中波红外","title_key":"coreshellshellstrategyforstableandluminescentpbsecolloidalnanocrystalstunedthroughtheextendedshorttomidwaveinfrared","authors":["Daniel C. Hayes","Patrick Y. Yee","Madeleine J. Fort","et al."],"venue":"The Journal of Physical Chemistry Letters","issn_l":"1948-7185","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Despite their ideal exciton energies, implementation of colloidal lead selenide (PbSe) nanocrystals into extended short- to mid-wave infrared (eSWIR to MWIR) optoelectronic devices has been limited due to their chemical instability in air and insufficient colloidal stability at sizes large enough (diameter of >13 nm) to reach this spectral range. To address this, we investigate Pb chalcogenide core/shell/shell nanocrystals with a PbSe core, a first shell of PbS, and a second surface-layer shell of PbClx (PbSe/PbS/PbClx core/shell/shell), to produce nanocrystals tunable within the eSWIR to MWIR (λ = ∼2.2-3.1 μm) region with notable increases in the photoluminescence quantum yield (>4×) and both colloidal and air stability compared to core-only PbSe nanocrystals. The PbS/PbClx shell/shell is ∼1-2 nm thick and results in a red shift of the nanocrystal exciton energies. This work improves the viability of solution processed thin-film eSWIR and MWIR PbSe colloidal nanocrystal photodetectors, sensors, and light sources.","abstract_hash":"cfa69d0f7757d9b24a7286666980663bde0816e0f8f21757edb0774ff025904f","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":4,"novelty_reason":"用 PbS/PbClx 双壳层同时解决 PbSe 纳米晶的空气/胶体稳定性与 eSWIR-MWIR 波段发光效率问题，PLQY 提升逾 4 倍，属明确的新结构策略。","innovation_zh":"针对 PbSe 胶体纳米晶在空气中化学不稳定、且尺寸大到能覆盖 eSWIR-MWIR（直径 >13 nm）时胶体稳定性差的问题，作者提出 PbSe/PbS/PbClx 核/壳/壳结构：PbSe 核外先包 PbS 壳，再包一层 PbClx 表面壳。该结构把激子能量调至约 2.2-3.1 μm，光致发光量子产率相比纯核 PbSe 提升超过 4 倍，同时胶体稳定性和空气稳定性都明显改善。PbS/PbClx 壳层总厚约 1-2 nm，并使激子能量红移。","method_zh":"在 PbSe 核上依次生长 PbS 壳和 PbClx 表面壳层，形成核/壳/壳胶体纳米晶，壳层总厚度约 1-2 nm，通过壳层组成与厚度调控激子能量。","keywords_zh":["PbSe 纳米晶","核/壳/壳结构","中波红外","光致发光量子产率","胶体稳定性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:14.831Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/lpor.71804","doi":"10.1002/lpor.71804","doi_url":"https://doi.org/10.1002/lpor.71804","title":"Noise‐Resistant Correlated Biphoton Imaging Based on the Superbunching Emission From Single Colloidal Quantum Dots","title_zh":"基于单胶体量子点超聚束发射的抗噪声关联双光子成像","title_key":"noiseresistantcorrelatedbiphotonimagingbasedonthesuperbunchingemissionfromsinglecolloidalquantumdots","authors":["Yunrui Song","Chengbing Qin","Yuanyuan Li","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-22","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Quantum‐correlated techniques enable high‐contrast and super‐resolution imaging through the feature of correlated photons. The superbunching effect with a second‐order correlation larger than 2, i.e., g (2) (0) > 2, demonstrates the existence of strong correlations between photons, which can enable stray light resistance and achieve high‐contrast imaging. Here, we present a scheme for quantum correlated imaging using single colloidal quantum dots (CQDs) with strong superbunching emission. The optimized CdSe/ZnS CQDs with g (2) (0) up to 69 and 20 under continuous‐wave and pulsed laser excitation have been prepared. We achieved noise‐resistant correlated biphoton imaging (CPI) based on single CQDs with noise intensity 104 times stronger than their photoluminescence. By modulating photoluminescence intensity, the Fourier‐domain CPI was determined with reasonably good contrast, despite noise 75 600 times stronger than biphoton counts. Our proposal may enable laboratory‐based quantum imaging to be applied to real‐world applications with the desired suppression of intense stray light.","abstract_hash":"9ec71d2eb1b35c6a2a8a77db53b60a1d86c8f6b081c1664782e4eeb151d85d4b","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials","quantuminfo"],"novelty_score":4,"novelty_reason":"用单胶体量子点的超聚束发射（g(2)(0) 高达 69）实现抗强噪声关联成像，把量子成像从实验室推向实际强杂散光场景，属明确的新策略并有量化性能指标。","innovation_zh":"把单胶体量子点作为超聚束光源用于量子关联成像：优化后的 CdSe/ZnS 量子点在连续波和脉冲激发下 g(2)(0) 分别达到 69 和 20，远高于 2 的超聚束阈值。基于该单量子点实现了抗噪声关联双光子成像，在噪声强度比其光致发光强 10^4 倍的条件下仍能成像；通过调制发光强度做傅里叶域关联成像时，即使噪声比双光子计数强 75600 倍也能得到对比度尚可的结果。","method_zh":"以优化制备的 CdSe/ZnS 胶体量子点单颗粒为超聚束光子源，测量其二阶关联函数，并在此基础上搭建关联双光子成像（CPI）与傅里叶域 CPI 光路，通过调制量子点发光强度在强噪声背景下提取关联信号。","keywords_zh":["胶体量子点","超聚束","关联双光子成像","抗噪声","二阶关联函数"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:15.742Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/2058-9565/ae9d1c","doi":"10.1088/2058-9565/ae9d1c","doi_url":"https://doi.org/10.1088/2058-9565/ae9d1c","title":"Fewer interfaces, longer coherence: inverting the multi-shell design rule for quantum-information colloidal quantum dots","title_zh":"更少界面、更长相干：颠覆量子信息胶体量子点的多壳层设计规则","title_key":"fewerinterfaceslongercoherenceinvertingthemultishelldesignruleforquantuminformationcolloidalquantumdots","authors":["Fatih Koç"],"venue":"Quantum Science and Technology","issn_l":"2058-9565","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-22","oa_status":"hybrid","pdf_url":"https://iopscience.iop.org/article/10.1088/2058-9565/ae9d1c/pdf","cited_by_count":0,"abstract":"Abstract Cascaded type-II core/shell/shell colloidal quantum dots are widely studied as a route to extended radiative lifetimes, suppressed Auger losses, and tunable near-infrared emission. To test whether the same architecture remains advantageous for coherence-limited quantum-information applications, the cascaded core/shell/shell CdSe/CdTe/ZnTe is compared with the conventional core/shell CdSe/ZnTe at fixed core and total radii. The wave functions of the electron and the hole are obtained from a self-consistent Schrödinger–Poisson solve with experimental band offsets and BenDaniel–Duke matching. They enter as inputs to a five-channel Lindblad master equation that includes radiative recombination, two-particle Shockley–Read–Hall non-radiative recombination, acoustic-phonon pure dephasing, single-particle interface-trap dephasing, and a measurement-induced dephasing channel of dimensionless strength η = γ meas T 2 ( 0 ) . Three independent geometric sweeps—over core radius, CdTe interlayer thickness, and ZnTe outer-shell thickness-show that the core/shell/shell architecture underperforms the core/shell architecture in coherence time by a factor of two to three and in coherence-preservation fidelity by up to Δ F = 0.16 at η = 1 . At the smallest total radius examined, the spatial electron–hole separation Δ r eh is matched between the two architectures to within 2 Å, yet the fidelity gap persists. The gap therefore originates not from the spatial separation that motivated the cascaded design, but from the interface count. For coherence-limited applications in trap-dominated structures with compositionally sharp interfaces, interface minimization therefore takes precedence over band-alignment optimization, inverting the design rule established for optical and photovoltaic performance.","abstract_hash":"f95b5a20b6f01a9529e19913d19aea09b07844f070a82abbbe01da1daa5068dc","abstract_source":"openalex","abstract_missing":false,"directions":["detection","quantuminfo","materials"],"novelty_score":4,"novelty_reason":"用自洽波函数加五通道 Lindblad 模型系统比较两种壳层架构，明确指出界面数量而非波函数分离主导相干性，并给出颠覆既有设计规则的反直觉结论。","innovation_zh":"作者把常用于延长辐射寿命、抑制俄歇损耗的级联 type-II core/shell/shell 结构（CdSe/CdTe/ZnTe）与常规 core/shell（CdSe/ZnTe）在固定核半径和总半径下做对比，检验多壳层是否仍有利于相干性受限的量子信息应用。结果发现 core/shell/shell 的相干时间反而差 2–3 倍，在 η=1 时相干保持保真度最多低 ΔF=0.16，而且这一差距在最小总半径下依然存在——此时两种结构的电子-空穴空间分离 Δr_eh 已匹配到 2 Å 以内。因此差距来源不是级联设计所追求的波函数分离，而是界面数量本身，说明在界面组分陡峭、陷阱主导的结构中，减少界面比优化能带对齐更重要，颠覆了光学和光伏性能所确立的设计规则。","method_zh":"用实验带阶和 BenDaniel–Duke 匹配条件自洽求解 Schrödinger–Poisson 方程得到电子与空穴波函数，再输入包含辐射复合、双粒子 Shockley–Read–Hall 非辐射复合、声学声子纯退相位、单粒子界面陷阱退相位以及测量诱导退相位通道的五通道 Lindblad 主方程，并对核半径、CdTe 中间层厚度和 ZnTe 外壳厚度做三组独立几何扫描。","keywords_zh":["胶体量子点","相干时间","核壳结构","界面陷阱","Lindblad 主方程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:17.108Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.nxnano.2026.100712","doi":"10.1016/j.nxnano.2026.100712","doi_url":"https://doi.org/10.1016/j.nxnano.2026.100712","title":"Recent progress of carbon-quantum-dot-based photodetectors","title_zh":"碳量子点光电探测器的最新进展","title_key":"recentprogressofcarbonquantumdotbasedphotodetectors","authors":["Roopmeet Kaur","Chia‐Yun Chen"],"venue":"Next Nanotechnology","issn_l":"2949-8295","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-22","oa_status":"gold","pdf_url":"https://www.sciencedirect.com/science/article/pii/S2949829526003517/pdf","cited_by_count":0,"abstract":"Photodetectors are essential electronic components of modern systems, allowing applications in wearable electronics, optical communication, environmental monitoring, biomedical diagnostics, and imaging. The scalability, versatility, and cost-effectiveness of conventional photodetector materials, such as silicon, III–V semiconductors, and metal oxides, are generally limited by the need for high-temperature and vacuum-based production techniques. Carbon quantum dots are quasi-zero-dimensional carbon nanomaterials, typically smaller than 10 nm, with tunable electronic and optical properties arising from quantum confinement, defect states, and surface functional groups. Their low toxicity, solution processability, broadband light absorption, and compatibility with flexible substrates make them promising materials for next-generation photodetectors. Recent developments in CQD-based photodetectors are summarised in this overview, with a focus on design strategies that have been published in the last few years. Bandgap engineering, charge transport mechanisms, interface engineering, and optical absorption are among the basic electronic and optoelectronic characteristics of CQDs that are examined from both theoretical and experimental viewpoints. The importance of theoretical modeling in comprehending carrier dynamics and maximizing device performance is emphasized. Key performance investigations, including responsivity, detectivity, response speed, and external quantum efficiency, are discussed with the recent advancements of device designs. Future research directions aiming at achieving self-powered, low-cost, and commercially viable CQD-based photodetectors for next-generation optoelectronic applications are also discussed, along with the issues related to material stability, reproducibility, interface defects, and large-scale manufacturing.","abstract_hash":"e37a1a26b4adbee3a2461987a4f76b2f255b23eadbfe181fd7c4ab80f9faaff1","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":2,"novelty_reason":"属综述性总结，未提出新机制或新器件，创新性主要体现在对近期进展的归纳与问题梳理。","innovation_zh":"这是一篇综述，系统梳理了近几年碳量子点（CQD）光电探测器的设计策略，从理论与实验两方面讨论了带隙工程、电荷传输机制、界面工程和光吸收等基本光电特性，并强调理论建模在理解载流子动力学和优化器件性能中的作用。文章还汇总了响应度、探测率、响应速度和外量子效率等关键指标的最新器件进展，并指出材料稳定性、可重复性、界面缺陷和规模化制造等瓶颈，展望了自供电、低成本、可商用化的方向。作为综述，本身不提出新器件或新机制，创新性主要体现在对近期工作的归纳与问题梳理。","method_zh":"以文献综述形式，围绕 CQD 的带隙工程、电荷传输、界面工程与光吸收展开理论加实验的对比分析，并按响应度、探测率、响应速度、外量子效率等指标评估器件设计。","keywords_zh":["碳量子点","光电探测器","带隙工程","界面工程","综述"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:16.319Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/lpor.71774","doi":"10.1002/lpor.71774","doi_url":"https://doi.org/10.1002/lpor.71774","title":"Ambient‐Stabilized Cadmium‐Free Pure‐Blue Colloidal Quantum Dot Supraparticle Microlasers for Proof‐of‐Concept Low‐Speckle Projection","title_zh":"环境稳定的无镉纯蓝胶体量子点超颗粒微激光器及其低散斑投影概念验证","title_key":"ambientstabilizedcadmiumfreepurebluecolloidalquantumdotsupraparticlemicrolasersforproofofconceptlowspeckleprojection","authors":["Weiguo Chen","Yujie Feng","Weibin Huang","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-22","oa_status":"bronze","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/lpor.71774","cited_by_count":0,"abstract":"ABSTRACT Pure‐blue colloidal quantum dot (CQD) lasers are attractive light sources for projection and other display applications, yet high‐performance devices still rely on cadmium‐based QDs. Cadmium‐free ZnSeTe/ZnS CQDs offer a viable alternative, but developing laser platforms that combine ambient operational stability with low‐speckle imaging remains challenging. Here, we report ambient‐stabilized pure‐blue microlasers based on self‐assembled ZnSeTe/ZnS CQD supraparticles (SPs) conformally encapsulated with an ultrathin Al 2 O 3 shell. The spherical SPs support whispering‐gallery‐mode (WGM)‐dominated lasing with a representative threshold of 33 µJ cm − 2 . Deposited by atomic layer deposition (ALD), the Al 2 O 3 shell suppresses oxygen ingress. As a result, the operational half‐life of the SP microlasers increases by more than two orders of magnitude, while the mean lasing threshold decreases from 36 µJ cm − 2 for the pristine SPs to 26 µJ cm − 2 for the 15 nm Al 2 O 3 ‐coated SPs. The weak mutual coherence among individual SP microlasers further enables strong speckle suppression, yielding a speckle contrast of 0.015, well below the human perception limit. Using this ensemble source, we demonstrate a proof‐of‐concept low‐speckle projection system with blue‐emission chromaticity coordinates close to those of the BT.2020 blue primary.","abstract_hash":"7714d30ac7bd3f0b101051a8ebbff6fc5fe59bdb5aa7c23d3fd28f0f6227b6d2","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"在无镉纯蓝量子点激光平台上同时实现环境稳定性和低散斑投影，Al2O3 包覆带来寿命两个数量级提升与阈值下降，属于明确的新结构策略加显著性能提升。","innovation_zh":"用自组装 ZnSeTe/ZnS 胶体量子点超颗粒（SP）做纯蓝微激光器，再用 ALD 共形包覆超薄 Al2O3 壳层抑制氧渗透，解决了无镉纯蓝量子点激光器环境稳定性差的问题：工作半寿命提升两个数量级以上，平均激光阈值从原始 SP 的 36 µJ cm-2 降到 15 nm Al2O3 包覆后的 26 µJ cm-2。同时利用多个 SP 微激光器之间弱互相干性实现强散斑抑制，散斑对比度低至 0.015，并据此搭建了概念验证的低散斑投影系统，蓝光色坐标接近 BT.2020 蓝基色。","method_zh":"自组装形成球形 ZnSeTe/ZnS 量子点超颗粒，以回音壁模式（WGM）为主实现激光振荡，代表阈值 33 µJ cm-2；再用原子层沉积（ALD）共形包覆 15 nm Al2O3 壳层作为氧阻挡层。","keywords_zh":["无镉量子点","纯蓝微激光器","超颗粒","原子层沉积","低散斑投影"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:17.388Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.optmat.2026.118448","doi":"10.1016/j.optmat.2026.118448","doi_url":"https://doi.org/10.1016/j.optmat.2026.118448","title":"Near-infrared photodetectors based on commercial InAs quantum dots","title_zh":"基于商用 InAs 量子点的近红外光电探测器","title_key":"nearinfraredphotodetectorsbasedoncommercialinasquantumdots","authors":["Saman Shirmohammadi","Mohammad Ali Nasiri","José Marqués-Hueso","et al."],"venue":"Optical Materials","issn_l":"0925-3467","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-22","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":": The demand for low-power, self-powered, and solution-processed near-infrared (NIR) photodetectors, particularly those avoiding metals like Hg and Cd, and operating within the second biological window (NIR-II, 1000–1350 nm), is driving the development of alternatives to conventional epitaxial semiconductors. This work evaluates a solution-processed, self-powered NIR photodetector up to 1300 nm, employing commercially available, native ligand-preserved indium arsenide (InAs) quantum dots (QDs) integrated into a heterojunction architecture (ITO/ZnO/InAs/PTAA/Ag). Optimization of the sol-gel zinc oxide (ZnO) electron transport layer and poly[bis(4-phenyl)(2,4,6-trimethylphenyl)amine] (PTAA) hole transport layer provides a favorable energy cascade for efficient, self-powered charge separation. Under zero external bias, the photodetector exhibits steady state responsivities of 10 -5 and 10 -3 A/W under 980 and 450 nm illumination, respectively. While idealized shot-noise approximations suggest higher theoretical upper bounds, full noise spectral density analysis reveals a low-frequency flicker (1 /f ) noise dominance and low external quantum efficiency (limited to a great extent by the low transmittance of the glass/ITO substrate) that restrict the actual experimentally measured specific detectivity (D*) to a modest range of 1.2×10 7 to 2.6×10 7 Jones between 900 and 1300 nm under 5 Hz modulation. The photodevices demonstrate rapid carrier dynamics with rise and fall times in the range of 1.2 and 1 μs under modulated 450 nm illumination at 62.5 kHz. These findings provide critical insights into the performance limits of non-toxic, native ligand-capped InAs QD photodetectors, highlighting key trade-offs in interface engineering and active layer optimization for future imaging applications.","abstract_hash":"6121dd3c5cf6b28563b48f4ee73185cf6a3d8694421b4100fb480d6215956734","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"在商用原生配体 InAs 量子点体系上验证了自供电 NIR-II 探测的可行性，并给出噪声与界面限制的定量分析，但器件性能本身并不突出，属于新体系上的验证性工作。","innovation_zh":"这篇工作用商用、保留原生配体的 InAs 量子点做溶液加工自供电近红外探测器，器件结构为 ITO/ZnO/InAs/PTAA/Ag，避开了 Hg、Cd 等有毒元素，工作波段覆盖到 1300 nm（NIR-II）。通过优化溶胶-凝胶 ZnO 电子传输层和 PTAA 空穴传输层形成级联能级，实现零偏压下的自供电电荷分离。零偏压下 980 nm 响应度为 10^-5 A/W、450 nm 为 10^-3 A/W；但完整的噪声谱分析显示低频 1/f 噪声主导，加上玻璃/ITO 衬底透过率低限制了外量子效率，实际比探测率只有 1.2×10^7–2.6×10^7 Jones（900–1300 nm，5 Hz 调制）。450 nm、62.5 kHz 调制下上升/下降时间为 1.2 和 1 μs。","method_zh":"溶液法将商用原生配体 InAs 量子点嵌入 ITO/ZnO/InAs/PTAA/Ag 异质结，通过优化溶胶-凝胶 ZnO 和 PTAA 传输层构建级联能带，实现无偏压自供电工作；用噪声谱密度分析评估实际探测率上限。","keywords_zh":["InAs 量子点","近红外光电探测器","自供电","比探测率","1/f 噪声"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:19.115Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsnano.6c06196","doi":"10.1021/acsnano.6c06196","doi_url":"https://doi.org/10.1021/acsnano.6c06196","title":"InF3 Surface Passivation on InAs Quantum Dots Enhances Photoluminescence and Reduces Trap-Induced Dark Current in Shortwave Infrared Photodetectors","title_zh":"InF3 表面钝化 InAs 量子点：提升光致发光并降低短波红外光电探测器中的陷阱诱导暗电流","title_key":"inf3surfacepassivationoninasquantumdotsenhancesphotoluminescenceandreducestrapinduceddarkcurrentinshortwaveinfraredphotodetectors","authors":["Hua Chen","Boris Claus","Wenya Song","et al."],"venue":"ACS Nano","issn_l":"1936-0851","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-21","oa_status":"hybrid","pdf_url":null,"cited_by_count":2,"abstract":"Shortwave infrared (SWIR) photodetectors are crucial for emerging technologies such as autonomous driving, smart agriculture, industrial inspection, and eye-safe LiDAR. Colloidal indium arsenide (InAs) quantum dots (QDs) offer a low-cost, RoHS-compliant alternative to epitaxial III-V semiconductors. But their performance is limited by a high density of surface trap states that induce nonradiative recombination and potentially give rise to a high dark current in photodiodes. Here, we demonstrate that InF3 can effectively passivate these surface traps, significantly improving both optical and electronic properties. In nonpolar solvents, a simple InF3 treatment on oleylamine/chloride-capped In(As,P) and oleate-capped InAs QDs increases the photoluminescence quantum yield to 13% and 4%, respectively─the highest reported for core-only InAs QDs. In polar media, the InF3 treatment remains effective but reduces colloidal stability. To overcome this limitation, a solid-state in situ InF3 treatment of QD films was used. The treatment doubles the carrier lifetime and lowers the dark carrier density, confirmed by ultrafast transient absorption spectroscopy, microwave conductivity, and electrochemically gated transistor measurements. In SWIR photodetectors, this leads to an order-of-magnitude reduction in dark current density and a 3-fold increase in the calculated specific detectivity, assuming it is shot-noise-limited. Temperature-dependent dark current density and thermal admittance spectroscopy measurements reveal that deep trap states dominate the dark current in InAs QDs photodetectors. The InF3 treatment strongly suppresses these traps. These findings establish InF3 passivation as a powerful, promising strategy for mitigating surface-trap-induced dark current and advancing high-performance, RoHS-compliant SWIR photodetectors.","abstract_hash":"410668ba270d925eb6dc7124ed1c453e8d8a8a4afdc47bf33e076f20ad428e31","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials","display"],"novelty_score":4,"novelty_reason":"提出 InF3 这一新的表面钝化策略并给出核-only InAs 量子点最高 PLQY 及暗电流降一个数量级的具体结果，但机理层面仍属陷阱钝化的既有框架。","innovation_zh":"针对胶体 InAs 量子点表面陷阱态密度高、导致非辐射复合和光电二极管暗电流大的问题，作者用 InF3 做表面钝化。在非极性溶剂中，对油胺/氯配体的 In(As,P) 和油酸配体的 InAs 量子点做简单 InF3 处理后，光致发光量子产率分别提升到 13% 和 4%，作者称这是核-only InAs 量子点的最高报道值。极性介质中 InF3 处理虽有效但会降低胶体稳定性，于是改用固态原位 InF3 处理量子点薄膜，使载流子寿命翻倍、暗载流子密度下降；在短波红外探测器中暗电流密度降低一个数量级，按散粒噪声极限计算比探测率提升 3 倍。","method_zh":"溶液相中用 InF3 对油胺/氯或油酸配体包覆的 InAs 基量子点做表面处理；对薄膜则采用固态原位 InF3 处理。通过瞬态吸收光谱、微波电导和电化学栅控晶体管表征载流子寿命与暗载流子密度，并用变温暗电流和热导纳谱确认深陷阱主导暗电流。","keywords_zh":["InAs 量子点","InF3 钝化","短波红外探测器","暗电流","表面陷阱态"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:19.569Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpclett.6c02582","doi":"10.1021/acs.jpclett.6c02582","doi_url":"https://doi.org/10.1021/acs.jpclett.6c02582","title":"Additive-Mediated PbSe Colloidal Quantum Dots for Efficient pc-LEDs","title_zh":"添加剂调控的 PbSe 胶体量子点用于高效 pc-LED","title_key":"additivemediatedpbsecolloidalquantumdotsforefficientpcleds","authors":["Rui Li","Dayong Liu","Danning Sun","et al."],"venue":"The Journal of Physical Chemistry Letters","issn_l":"1948-7185","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-21","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"PbSe colloidal quantum dots (CQDs) have emerged as a popular research subject in optoelectronic devices because of their tunable luminescence in the near-infrared (NIR) region. However, intrinsic defects generated during their synthesis make it challenging to obtain chemically stable and highly efficient PbSe CQDs. In this work, we demonstrate an effective passivation strategy using phenethylammonium chloride (PEACl) additives that form a robust Pb-Cl protective layer on the surface of PbSe CQDs. This approach boosts the photoluminescence quantum yield (PLQY) from 25.7% to 46.1% and enhances the air and thermal stabilities of PbSe CQDs. We have successfully fabricated high-performance phosphorescence conversion light-emitting diode (PC-LED) devices based on defect-passivated quantum dots. These PC-LEDs achieve a peak external quantum efficiency (EQE) of 2.88% at a low drive voltage of 2.08 V, demonstrating excellent photoconversion performance and holding significant application potential in the field of nondestructive optical inspection and food quality sensing.","abstract_hash":"e7b01a0071f856f3d78f5288b7d26881ed8c7985c4ea0c05532b87750d9a6e63","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":3,"novelty_reason":"用常见铵盐添加剂做表面钝化属已有思路在新体系上的验证，PLQY 与 EQE 提升明确但幅度有限。","innovation_zh":"针对 PbSe 胶体量子点合成中本征缺陷导致化学稳定性差、发光效率低的问题，作者用苯乙基氯化铵（PEACl）作为添加剂，在量子点表面形成 Pb-Cl 保护层进行钝化。PLQY 从 25.7% 提升到 46.1%，同时空气稳定性和热稳定性改善。基于钝化后量子点制备的 pc-LED 在 2.08 V 低驱动电压下峰值 EQE 达到 2.88%。","method_zh":"以 PEACl 为添加剂对 PbSe CQD 表面进行钝化，构建 Pb-Cl 保护层，并以此量子点制备近红外荧光转换型 LED（pc-LED）器件。","keywords_zh":["PbSe 量子点","表面钝化","PEACl","近红外 pc-LED","光致发光量子产率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:19.329Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpclett.6c02230","doi":"10.1021/acs.jpclett.6c02230","doi_url":"https://doi.org/10.1021/acs.jpclett.6c02230","title":"Ultra-High-Resolution Quantum Dot Microdisplays Fabricated via Microvia Electrostatic Adsorption Self-Assembly","title_zh":"基于微孔静电吸附自组装的超高分辨率量子点微显示器","title_key":"ultrahighresolutionquantumdotmicrodisplaysfabricatedviamicroviaelectrostaticadsorptionselfassembly","authors":["Chao Zhong","Xin Wang","Haolin Luo","et al."],"venue":"The Journal of Physical Chemistry Letters","issn_l":"1948-7185","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-21","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"The rapid advancement of artificial intelligence drives advances in microdisplays for smart wearables and near-eye applications. This imposes extremely high-performance requirements for small-size pixels, while the miniaturization of conventional LEDs faces bottlenecks, including aggravated sidewall defects and efficiency loss. Quantum dot (QD) light-emitting devices have emerged as promising candidates for next-generation microdisplays. High-precision micro-nano assembly of QD pixels is a key challenge. Traditional techniques, including spin-coating and printing, are poorly compatible with complex functional substrates, limiting their application. Herein, we propose a novel microvia electrostatic adsorption self-assembly (MEAA) strategy. Driven by electrostatic induction, QDs can selectively assemble within nanoscale microvia templates. Monochromatic arrays (42 333 pixels per inch (PPI)) and 2540 PPI full-color arrays were successfully prepared. The rigid and flexible monochromatic devices achieved EQEs of 25.92% and 26.67%, respectively (8467 PPI). The method adapts to any surface without complicated electrodes or external electric fields, providing a new pathway for QD microdisplay fabrication.","abstract_hash":"44a65aca133fef806855597207293f1d0be2f3a809e39ad0e9396bc3106d79b7","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"提出无需电极和外加电场的微孔静电吸附自组装新策略，实现 42333 PPI 单色与 2540 PPI 全彩阵列并保持约 26% 的 EQE，属明确的新方法加显著性能提升。","innovation_zh":"针对量子点像素高精度微纳组装这一难题，提出微孔静电吸附自组装（MEAA）策略：利用静电感应驱动量子点在纳米级微孔模板内选择性组装，无需复杂电极或外加电场，且可适配任意表面。制备出单色 42333 PPI 阵列和 2540 PPI 全彩阵列，刚性与柔性单色器件（8467 PPI）的 EQE 分别达到 25.92% 和 26.67%。","method_zh":"在纳米级微孔模板中通过静电感应诱导量子点选择性吸附自组装，形成像素阵列，并以此构建刚性/柔性单色及全彩 QLED 微显示器件。","keywords_zh":["量子点微显示","静电吸附自组装","超高分辨率","全彩阵列","柔性器件"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:19.780Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpcc.6c04433","doi":"10.1021/acs.jpcc.6c04433","doi_url":"https://doi.org/10.1021/acs.jpcc.6c04433","title":"Low-Toxicity Near-Infrared InP Quantum Dot Sensitized Solar Cells with Power Conversion Efficiency Exceeding 5%","title_zh":"低毒性近红外 InP 量子点敏化太阳能电池，光电转换效率超过 5%","title_key":"lowtoxicitynearinfraredinpquantumdotsensitizedsolarcellswithpowerconversionefficiencyexceeding5","authors":["Congcong Jiang","Qun Zhang","Kaifeng Wu","et al."],"venue":"The Journal of Physical Chemistry C","issn_l":"1932-7447","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-20","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-20","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Colloidal InP quantum dots (QDs) are promising near-infrared (NIR) materials for environmentally benign QD-sensitized solar cells (QDSCs). Yet previous studies on QDSCs have never been able to extend the light harvesting capability of InP QDs to NIR. In this work, InP QDs with an absorption onset reaching ∼750 nm were synthesized using low-reactivity indium(I) salts and phosphine precursors combined with NH4PF6-mediated in situ etching. Ligand exchange with 3-mercaptopropionic acid enabled high-density and uniform loading of these QDs on mesoporous TiO2 photoanodes. Through optimization of photoanode architecture and interfacial engineering, a record power conversion efficiency of 5.20% was achieved for InP-QDSCs. Transient absorption analysis reveals that device performance is primarily constrained by the small energetic driving force for electron injection from NIR InP QDs to TiO2, providing guidance for further development of high-efficiency InP-based QDSCs.","abstract_hash":"8883e6ac4ae3598f7e3cf713e728e26ca97d0cf08bd13249d395f84f765d1490","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"首次把 InP 量子点的吸收拓展到近红外并刷新该类电池效率纪录（5.20%），但整体仍属既有 QDSC 体系上的材料与界面优化。","innovation_zh":"此前 InP 量子点敏化太阳能电池（QDSC）一直无法把光吸收拓展到近红外，这篇工作用低反应活性的 In(I) 盐和膦类前驱体，结合 NH4PF6 介导的原位刻蚀，合成了吸收起始约 750 nm 的 InP 量子点，把 InP QDSC 的光捕获范围推进到近红外。配合 3-巯基丙酸配体交换实现量子点在介孔 TiO2 光阳极上的高密度均匀负载，并通过光阳极结构与界面工程优化，得到 5.20% 的纪录效率。瞬态吸收分析指出器件性能主要受限于近红外 InP 量子点到 TiO2 电子注入的驱动力偏小。","method_zh":"以低活性 In(I) 盐与膦前驱体合成近红外 InP 量子点，用 NH4PF6 原位刻蚀调控尺寸；再用 3-巯基丙酸做配体交换，将量子点负载到介孔 TiO2 光阳极上，并优化光阳极结构与界面。","keywords_zh":["InP 量子点","量子点敏化太阳能电池","近红外吸收","原位刻蚀","界面工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:22.252Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsami.6c10538","doi":"10.1021/acsami.6c10538","doi_url":"https://doi.org/10.1021/acsami.6c10538","title":"Surface-Engineered Poly(ethylene oxide)-Grafted Quantum Dot Inks for Green-Solvent-Processed Electroluminescent Devices","title_zh":"表面工程化聚乙二醇接枝量子点墨水用于绿色溶剂加工的电致发光器件","title_key":"surfaceengineeredpolyethyleneoxidegraftedquantumdotinksforgreensolventprocessedelectroluminescentdevices","authors":["Moon-Chul Ryu","Gyu Jin Shin","Ho Seok Heo","et al."],"venue":"ACS Applied Materials & Interfaces","issn_l":"1944-8244","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-20","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-20","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Quantum dots (QDs) are promising emissive materials for next-generation optoelectronics, but conventional oleic acid (OA) capping necessitates toxic, nonpolar solvents such as toluene and chloroform, hindering environmentally sustainable solvent-based processing. Here, we report a green, solution-processable ligand-exchange strategy in which thiol-terminated poly(ethylene oxide) (PEO-SH) replaces OA on QDs, enabling stable dispersion in ethanol and water. By tuning the molecular weight of PEO, we identify PEO with Mn ≈ 2000 g/mol as an optimal ligand that provides a balanced combination of chain length and surface coverage, resulting in long-term colloidal stability and high photoluminescence quantum yield in polar media. Using these QD-PEO2k inks, we fabricate multilayer quantum dot light-emitting diodes (QLEDs) from ethanol and water/ethanol co-solvents, achieving a maximum external quantum efficiency of 2.12% and a current efficiency of 9.19 cd A-1. These results successfully serve as a proof-of-concept for generating functional electroluminescence from water/alcohol-based QD inks. Ultimately, this work establishes a foundational step toward reducing toxic solvent dependency and advancing sustainable manufacturing in solution-processed optoelectronics.","abstract_hash":"8c252cd8f6f436246e9634858281ffbc1ad69242e6cae3522fb69bbd591f1ec9","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"用 PEO-SH 配体交换实现水/醇加工 QLED 的思路较新，但器件效率（EQE 2.12%）偏低，属于概念验证性质的渐进式工作。","innovation_zh":"针对传统油酸（OA）配体使量子点只能分散在甲苯、氯仿等有毒非极性溶剂中的问题，作者用巯基封端聚乙二醇（PEO-SH）做配体交换取代 OA，使量子点能稳定分散在乙醇和水中。通过调节 PEO 分子量，发现 Mn ≈ 2000 g/mol 时链长与表面覆盖度最平衡，在极性介质中兼具长期胶体稳定性和高光致发光量子产率。用该 QD-PEO2k 墨水以乙醇及水/乙醇共溶剂制备多层 QLED，最高外量子效率 2.12%、电流效率 9.19 cd A-1，属于水/醇基量子点墨水实现电致发光的原理验证。","method_zh":"用巯基封端 PEO 对量子点进行配体交换，替换原有油酸配体，筛选 PEO 分子量后以乙醇或水/乙醇共溶剂旋涂/制备多层 QLED 器件。","keywords_zh":["量子点墨水","配体交换","聚乙二醇","绿色溶剂","QLED"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:22.186Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.optmat.2026.118435","doi":"10.1016/j.optmat.2026.118435","doi_url":"https://doi.org/10.1016/j.optmat.2026.118435","title":"Room-temperature aqueous growth of Ag2Se/ZnSe Core–shell quantum dots for sustainable high-performance photodetectors","title_zh":"室温水相生长 Ag2Se/ZnSe 核壳量子点用于可持续高性能光电探测器","title_key":"roomtemperatureaqueousgrowthofag2seznsecoreshellquantumdotsforsustainablehighperformancephotodetectors","authors":["Yuan-Jin Lin","T.M. Chen","Shao-Yu Liu","et al."],"venue":"Optical Materials","issn_l":"0925-3467","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-19","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-19","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["Ag2Se","ZnSe","核壳量子点","水相合成","光电探测器"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:20.745Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adom.71656","doi":"10.1002/adom.71656","doi_url":"https://doi.org/10.1002/adom.71656","title":"Highly‐Stable InP Quantum Dots With a Mesoporous ZIF‐8 and PMMA Double Layers and its Application in LCD Panels","title_zh":"介孔 ZIF-8 与 PMMA 双层封装的超高稳定性 InP 量子点及其在 LCD 面板中的应用","title_key":"highlystableinpquantumdotswithamesoporouszif8andpmmadoublelayersanditsapplicationinlcdpanels","authors":["Ke Wang","Ziyang Zhao","Aidi Zhang","et al."],"venue":"Advanced Optical Materials","issn_l":"2195-1071","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-19","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-19","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT InP quantum dots (QDs) are promising for next‐generation displays due to their superior color purity, high quantum yield, tunable emission, and non‐toxicity. However, their practical application is limited by instability under heat, oxygen, and intense illumination. To address this critical issue of stability, we proposed a dual‐layer encapsulation strategy. Firstly, InP/ZnSe/ZnS QDs are synthesized via a “one‐pot” approach. Then, mZIF‐8@QDs materials are prepared by embedding QDs into a mesoporous zeolite imidazolate framework (mZIF) formed after pore structure modification and surface modification. Finally, a novel vacuum‐assisted deposition method is employed to uniformly polymerize polymethyl methacrylate (PMMA) on the surface of mZIF‐8@QDs, thereby achieving a secondary coating and obtaining the mZIF‐8@QDs@PMMA composite material. The QDs loading capacity was significantly enhanced by modification of the saturated fatty acid for mesoZIF‐8. The synthesized fluorescent composite material exhibits high quantum yield, long fluorescence lifetime, good photostability and thermostability. Furthermore, this composite material is used as a color conversion layer in liquid crystal displays (LCDs). The experimental results indicate that the composite material has exceptional durability, and retains over 95% of its initial luminance after 1000 h of accelerated aging under continuous high‐temperature and high‐intensity blue light irradiation.","abstract_hash":"545a8e68bab5bd3af485ad8ecc6a15daa566f6ade85e2a4c78cafd5f2b458627","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"mZIF-8 嵌入加真空辅助 PMMA 二次包覆的双层封装策略较新，并在 LCD 加速老化中给出 1000 小时保持 95% 亮度的明确稳定性结果。","innovation_zh":"针对 InP 量子点在热、氧和强光照下不稳定的问题，作者提出双层封装策略：先把 InP/ZnSe/ZnS 量子点嵌入经孔结构改性和表面修饰的介孔 ZIF-8（mZIF-8）中，再用真空辅助沉积法在表面均匀聚合 PMMA 实现二次包覆，得到 mZIF-8@QDs@PMMA 复合材料。饱和脂肪酸修饰 mZIF-8 显著提高了量子点负载量，复合材料兼具高量子产率、长荧光寿命和良好的光/热稳定性。用作 LCD 色彩转换层时，在高温、高强度蓝光连续照射的加速老化条件下 1000 小时后仍保持初始亮度的 95% 以上。","method_zh":"一锅法合成 InP/ZnSe/ZnS 量子点，经介孔化与饱和脂肪酸表面修饰后嵌入 mZIF-8，再用真空辅助沉积使 PMMA 在 mZIF-8@QDs 表面均匀聚合形成二次包覆。","keywords_zh":["InP 量子点","介孔 ZIF-8","PMMA 封装","稳定性","LCD 色彩转换"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:22.197Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/smtd.70987","doi":"10.1002/smtd.70987","doi_url":"https://doi.org/10.1002/smtd.70987","title":"Shadow Mask‐Based RGB Color Patterning in QLED Panels via Selective Quenching by Metals","title_zh":"基于阴影掩模的 QLED 面板 RGB 彩色图案化：通过金属选择性淬灭实现","title_key":"shadowmaskbasedrgbcolorpatterninginqledpanelsviaselectivequenchingbymetals","authors":["B. S. B. Mobarak","Fatemeh Samaeifar","Atefeh Ghorbani","et al."],"venue":"Small Methods","issn_l":"2366-9608","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-19","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-19","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"High-resolution color patterning of Quantum Dot Light-Emitting Devices (QLEDs) remains a challenge, since solution-based methods lack the resolution for subpixel patterning and other strategies often reduce scalability or device performance. In this work, we introduce and present results from a new shadow mask-based RGB color-patterning approach for QLED panels. This approach uses very thin metal layers, only 1-2 nm thick, that can be readily deposited through shadow masks to selectively quench luminescence from areas of a tandem stack containing multiple QD layers, enabling different regions of the stack to emit different colors when bias is applied. Photoluminescence, optical transmittance, and topographic measurements are used to study the effect of depositing ultrathin metal layers on the luminescence properties of QD films. Results from red- and green-emitting QLEDs formed side by side on the same substrate using this approach are presented, demonstrating its feasibility for color patterning. Because the patterning is realized through thermal evaporation of metals using shadow masks, the approach is inherently compatible with established fine metal mask (FMM) RGB patterning processes used in OLED manufacturing, indicating that pixel resolutions similar to those of OLED displays can be readily obtained in QLED displays without necessitating alternative patterning strategies.","abstract_hash":"a5e2497fe3886bb16a3a22db57059d409afd95e5d5342fc644e0deed6657cbb3","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用超薄金属选择性淬灭 tandem 量子点叠层发光来实现 RGB 图案化，思路新且与现有 FMM 工艺兼容，但摘要只给出红、绿并排器件的可行性验证，未给出分辨率或效率的具体数字。","innovation_zh":"针对 QLED 高分辨率彩色图案化难题（溶液法难以做到亚像素精度，其他方案又牺牲可扩展性或器件性能），作者提出一种新的阴影掩模图案化方法：在含多层量子点的 tandem 叠层上，通过阴影掩模沉积仅 1–2 nm 厚的超薄金属层，选择性地淬灭被覆盖区域的发光，从而使同一叠层的不同区域在加偏压时发出不同颜色。作者用光致发光、光学透射率和形貌表征研究了超薄金属层对量子点薄膜发光的影响，并在同一衬底上并排制备出红光和绿光 QLED，验证了该方案的可行性。其关键卖点在于图案化靠热蒸发金属加阴影掩模完成，天然兼容 OLED 产线已有的精细金属掩模（FMM）RGB 图案化工艺，因此无需另辟蹊径就能把 QLED 像素分辨率做到接近 OLED 显示的水平。","method_zh":"在包含多层量子点的 tandem 叠层上，用阴影掩模热蒸发沉积 1–2 nm 超薄金属层，对指定区域发光进行选择性淬灭，实现同一叠层不同区域发不同颜色；并用 PL、透射率和形貌测量表征金属层对 QD 薄膜发光的影响。","keywords_zh":["QLED","彩色图案化","阴影掩模","发光淬灭","精细金属掩模"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:24.298Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s10118-026-3724-4","doi":"10.1007/s10118-026-3724-4","doi_url":"https://doi.org/10.1007/s10118-026-3724-4","title":"Rod-coil Amphiphilic Block Copolymer Assisting Emulsion Confinement Self-assembly of Hydrophobic Quantum Dot into Robust Bio-imaging Nanoprobe","title_zh":"棒-线团两亲性嵌段共聚物辅助乳液限域自组装：将疏水量子点组装为稳定的生物成像纳米探针","title_key":"rodcoilamphiphilicblockcopolymerassistingemulsionconfinementselfassemblyofhydrophobicquantumdotintorobustbioimagingnanoprobe","authors":["Jun-Ni Xie","Xiao-Ling Xu","Huan-Di Qiu","et al."],"venue":"Chinese Journal of Polymer Science","issn_l":"0256-7679","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-19","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-19","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"无摘要，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，仅从标题可知采用棒-线团两亲性嵌段共聚物，通过乳液限域自组装把疏水量子点包覆成纳米探针。","keywords_zh":["量子点","嵌段共聚物","乳液限域自组装","纳米探针","生物成像"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:23.906Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1063/5.0336317","doi":"10.1063/5.0336317","doi_url":"https://doi.org/10.1063/5.0336317","title":"Indistinguishable single photons from a quantum dot in a nanopost cavity","title_zh":"纳米柱腔中量子点发射的不可分辨单光子","title_key":"indistinguishablesinglephotonsfromaquantumdotinananopostcavity","authors":["Maxime Gaignard","Lorenzo De Santis","Mackrine Nahra","et al."],"venue":"APL Quantum","issn_l":"2835-0103","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-18","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-18","oa_status":"diamond","pdf_url":null,"cited_by_count":0,"abstract":"Wavelength-tunable sources of single photons are key devices for scaling up optical quantum technologies. In this context, individual quantum dots (QDs) embedded in broadband photonic nanostructures are particularly appealing. The nanopost cavity, which is built with a segment of photonic wire, offers a rare combination of pronounced Purcell effect, large extraction efficiency, and wide operational bandwidth. So far, however, the on-demand emission of indistinguishable photons, a crucial feature for most envisioned applications, has not been reported with such devices. Here, we implement a quasi-resonant pulsed excitation of a single QD embedded in a nanopost cavity using a phonon-assisted scheme. Intensity correlation measurements then yield an excellent single-photon purity, with g(2)(0) as low as 2.3%. Furthermore, we demonstrate Hong–Ou–Mandel quantum interference between consecutive photons, with a wavepacket overlap reaching 46%. These results mark an important milestone in the development of quantum light sources based on broadband nanopost cavities.","abstract_hash":"cfc24b0fd53066b026028a43a5c12dcd5302668ffb297f82fd5fb4caa9fb463b","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display"],"novelty_score":4,"novelty_reason":"首次在纳米柱腔体系中实现不可分辨单光子发射与 HOM 干涉，属于新器件平台上的明确突破，但 46% 的波包重叠度尚未达到顶尖水平。","innovation_zh":"此前纳米柱腔（nanopost cavity）虽兼具强 Purcell 效应、高提取效率和宽工作带宽，但一直没实现按需发射的不可分辨单光子。作者用声子辅助的准共振脉冲激发方案，在纳米柱腔中的单个量子点实现了 g(2)(0) 低至 2.3% 的单光子纯度，并观测到连续光子之间的 Hong–Ou–Mandel 干涉，波包重叠度达到 46%。这是宽带纳米柱腔量子光源向实用化迈出的关键一步。","method_zh":"将单个量子点嵌入由一段光子线构成的纳米柱腔中，采用声子辅助的准共振脉冲激发，通过强度关联测量和 Hong–Ou–Mandel 干涉实验表征单光子纯度与全同性。","keywords_zh":["量子点","纳米柱腔","单光子源","不可分辨光子","Hong-Ou-Mandel 干涉"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:24.601Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/nano16161009","doi":"10.3390/nano16161009","doi_url":"https://doi.org/10.3390/nano16161009","title":"Enhanced Quantum Dot Light Emission at Telecom Wavelengths on Metallic Mirrors","title_zh":"金属镜面上实现通信波段量子点增强发光","title_key":"enhancedquantumdotlightemissionattelecomwavelengthsonmetallicmirrors","authors":["Ranbir Kaur","Mohanad Alkaales","Mohamed Benyoucef"],"venue":"Nanomaterials","issn_l":"2079-4991","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-17","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-17","oa_status":"gold","pdf_url":null,"cited_by_count":1,"abstract":"We demonstrate the integration of molecular beam epitaxy (MBE)-grown InAs/InP quantum dots (QDs) on gold thin films, achieving a fivefold enhancement of telecom-wavelength emission compared with QDs grown on distributed Bragg reflectors (DBRs). Micro-photoluminescence (µ-PL) spectroscopy reveals a pronounced increase in PL intensity from the Au-integrated structures, highlighting the enhanced optical response enabled by the metallic mirror effect. Reflectivity measurements exhibit a characteristic dip near the QD emission wavelength, indicating increased optical absorption and reduced reflectance, consistent with improved coupling of incident light into the fabricated structure. Power-dependent measurements demonstrate background-free exciton and biexciton emission from single QDs with resolution-limited linewidths. Polarization-dependent measurements further reveal an ultra-small excitonic fine-structure splitting, reaching values as low as ~2 μeV. Finally, statistical analysis of multiple QDs confirms the reproducibility and robustness of the observed optical properties.","abstract_hash":"4815c1443a9b24b2a41e64c9d3f12e2630bedd8b902d51194b9fd4e5a01955ef","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","quantuminfo"],"novelty_score":4,"novelty_reason":"用金属镜面替代 DBR 实现 5 倍发光增强，并在通信波段单量子点上获得约 2 μeV 的精细结构分裂，属于明确的新结构策略且性能提升显著。","innovation_zh":"把 MBE 生长的 InAs/InP 量子点直接集成到金薄膜上，通信波段发光强度比生长在 DBR 上的量子点提高了 5 倍，说明金属镜面效应能有效增强光响应。单量子点测量得到无背景的激子和双激子发射，线宽受分辨率限制，激子精细结构分裂小到约 2 μeV，并在多个量子点上统计验证了重复性。","method_zh":"用 MBE 生长 InAs/InP 量子点并集成到金薄膜上，通过微区光致发光光谱、反射率测量、功率依赖和偏振依赖测量表征其光学性质。","keywords_zh":["InAs/InP 量子点","通信波段","金属镜面","精细结构分裂","单量子点发光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:24.652Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.jsamd.2026.101234","doi":"10.1016/j.jsamd.2026.101234","doi_url":"https://doi.org/10.1016/j.jsamd.2026.101234","title":"Physical modeling and uncertainty quantification of dark current in InAs/GaAs QDIPs with AlGaAs current blocking layers","title_zh":"含 AlGaAs 电流阻挡层的 InAs/GaAs 量子点红外探测器暗电流的物理建模与不确定性量化","title_key":"physicalmodelinganduncertaintyquantificationofdarkcurrentininasgaasqdipswithalgaascurrentblockinglayers","authors":["Hamed Dehdashti Jahromi"],"venue":"Journal of Science Advanced Materials and Devices","issn_l":"2468-2179","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-17","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-17","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"The dark current remains the primary limiting factor in the performance of Quantum Dot Infrared Photodetectors (QDIPs), particularly for operation at elevated temperatures. In this work, we present a comprehensive physical model for the dark current transport in InAs/GaAs QDIPs incorporating an Al 0.3 Ga 0.7 As current blocking layer. The model integrates the emission-capture framework with a rigorous WKB approximation for field-assisted tunneling in spherical quantum dot geometry. We validate the analytical formulation against experimental data at room temperature ( T = 290 K), achieving excellent agreement with a logarithmic root-mean-square error of 0.217. A comparative architectural analysis reveals that the inclusion of the heterointerface blocking layer suppresses the dark current by approximately six orders of magnitude compared to standard designs, providing a quantitative theoretical basis for the device’s room-temperature functionality. Furthermore, we perform a Monte Carlo uncertainty quantification to assess manufacturing tolerances, demonstrating that the device performance is robust against quantum dot size fluctuations but highly sensitive to barrier composition variations. These findings establish design guidelines for optimizing high-temperature infrared sensors, predicting a detectivity enhancement of three orders of magnitude with moderate cooling to 200 K.","abstract_hash":"cb81b0ee465f093489c23ab5b6ce9773a36d407d47eededade8ee915173ecf31","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"属于已有暗电流机制框架在新结构（AlGaAs 阻挡层）上的建模与不确定性量化，模型验证和设计指导有价值，但未见新物理机制或新器件原理。","innovation_zh":"针对 InAs/GaAs QDIP 暗电流这一高温工作的主要限制因素，作者建立了一个把发射-俘获框架与球状量子点几何下基于 WKB 的场助隧穿结合起来的暗电流物理模型，并用 290 K 室温实验数据验证，对数均方根误差为 0.217。模型定量给出 Al0.3Ga0.7As 异质界面阻挡层相比标准结构可将暗电流压低约六个数量级，为器件室温工作提供了理论依据。此外用 Monte Carlo 做制造公差的不确定性量化，发现器件对量子点尺寸涨落不敏感、对势垒组分变化高度敏感，并预测降温到 200 K 可使探测率提升三个数量级。","method_zh":"在球状量子点几何下将发射-俘获模型与 WKB 近似的场助隧穿结合，构建解析暗电流模型，并与室温实验数据对比验证；随后用 Monte Carlo 方法对量子点尺寸与势垒组分等参数做不确定性量化。","keywords_zh":["量子点红外探测器","暗电流","电流阻挡层","WKB 隧穿","不确定性量化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:26.965Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.chemmater.6c00599","doi":"10.1021/acs.chemmater.6c00599","doi_url":"https://doi.org/10.1021/acs.chemmater.6c00599","title":"Unraveling the Effect of Metal Halide Complex on the Surface Chemistry of InP Quantum Dots","title_zh":"揭示金属卤化物配合物对 InP 量子点表面化学的影响","title_key":"unravelingtheeffectofmetalhalidecomplexonthesurfacechemistryofinpquantumdots","authors":["Bokyeong Sohn","Seongbeom Yeon","Hwa Seob Choi","et al."],"venue":"Chemistry of Materials","issn_l":"0897-4756","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-15","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-15","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Metal halide–ligand complexes are widely employed to enhance the photoluminescence (PL) of colloidal quantum dots (QDs). In III–V materials such as indium phosphide (InP) QDs, these complexes are particularly effective at eliminating surface oxidative defects, yet the underlying mechanism and their interactions with metal carboxylates remain unclear. Here, we investigate how zinc oleate (Zn(OA)2), in combination with ZnX2–TOP complexes (ZXT; X = halides), promotes the removal of the surface oxide layer compared to ZXT-only treatment, with the extent of this promotion depending on the halide identity. The results suggest that ZXT can participate in TOP-mediated reactions with surface oxide species, but its effect on defect removal remains limited without Zn(OA)2. The presence of Zn(OA)2 appears to modify the original ZXT coordination state toward a less sterically hindered mixed-ligand Zn coordination environment. This modification facilitates more effective oxide removal and passivation of the oxide-removed surface, thereby suppressing reoxidation and trap formation, which, in turn, enhances the PL quantum yield (PLQY). Among the ZXT, ZnCl2–TOP enables the most efficient oxide removal at lower molar equivalents than ZnBr2–TOP and ZnI2–TOP. This synergistic pathway alleviates strain accumulation during metal chalcogenide shell growth, leading to more uniform shell formation and high-quality InP/ZnSe/ZnS core/shell QDs with a PLQY of 88.2%. This study provides insight into how ligand interactions influence oxidative defect removal and passivation, thereby offering a useful basis for the rational design of surface treatments for InP QDs.","abstract_hash":"0c2bf7a6d227450f981647e73a56617f5c7f985ca1e5f2ab58c5da4c5f6122cd","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"不是简单换配体，而是厘清了 Zn(OA)2 与 ZXT 的协同配位机制并据此优化壳层生长，把 InP 量子点 PLQY 做到 88.2%，机制层面有明确新意。","innovation_zh":"这篇工作系统研究了 ZnX2–TOP（ZXT，X = Cl、Br、I）与油酸锌 Zn(OA)2 协同处理 InP 量子点表面氧化层的机制。核心发现是：单用 ZXT 去除表面氧化缺陷的效果有限，而 Zn(OA)2 的加入会把 ZXT 原本的配位状态改造成位阻更小的混合配体 Zn 配位环境，从而更有效地脱除氧化层并钝化裸露表面，抑制再氧化和陷阱态生成，提升 PLQY。在三种卤化物中，ZnCl2–TOP 在更低的摩尔当量下即可实现最高效的氧化层去除；该协同路径还缓解了金属硫族化合物壳层生长过程中的应变积累，使壳层更均匀，最终得到 PLQY 达 88.2% 的 InP/ZnSe/ZnS 核壳量子点。","method_zh":"以 Zn(OA)2 与 ZnX2–TOP 配合物（X = Cl、Br、I）组合对 InP 量子点进行表面处理，对比单用 ZXT 的效果，考察卤素种类对氧化层去除与钝化的影响，并在此基础上继续生长 ZnSe/ZnS 壳层。","keywords_zh":["InP 量子点","金属卤化物配合物","表面氧化缺陷","配体协同钝化","PLQY"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:27.593Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/nano16161003","doi":"10.3390/nano16161003","doi_url":"https://doi.org/10.3390/nano16161003","title":"A SnO2/ZnO Nanoparticle Bilayer Electron Transport Layer for Regulated Electron Injection in Quantum-Dot Light-Emitting Diodes","title_zh":"用于调控量子点发光二极管电子注入的 SnO2/ZnO 纳米颗粒双层电子传输层","title_key":"asno2znonanoparticlebilayerelectrontransportlayerforregulatedelectroninjectioninquantumdotlightemittingdiodes","authors":["Yuechao Wang","Xiongqiang Ma","Ruirong Wang","et al."],"venue":"Nanomaterials","issn_l":"2079-4991","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-15","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-15","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"ZnO is widely used as an electron transport layer in quantum-dot light-emitting diodes (QLEDs) because of its high electron mobility and suitable energy levels. However, rapid electron transport may cause excessive electron injection, leading to charge accumulation and parasitic recombination. SnO2 provides weaker electron transport, but using it alone limits device performance. Here, a SnO2/ZnO bilayer electron transport layer was introduced to regulate electron injection. Unlike previously reported structures in which SnO2 directly contacts the QDs, the present configuration places SnO2 on ITO and ZnO adjacent to the QD layer. The low-concentration ZnO overlayer reduced the RMS roughness of the SnO2 film from 1.79 to 1.07 nm and facilitated electron injection, while the underlying SnO2 layer moderated the electron supply. The bilayer also suppressed leakage current and showed the lowest capacitance peak, consistent with improved charge balance. The bilayer QLED achieved a maximum current efficiency of 13.40 cd/A and a maximum luminance of 33,210 cd/m2. Its current efficiency was 100% and 32.7% higher than those of the SnO2 and ZnO devices, respectively. These results demonstrate that the bilayer improves charge balance through facilitated electron injection and controlled electron supply.","abstract_hash":"297dd3ccd128209f01b0dde322d3d6aec24101a8bb5aca9a0b451a0f1da78320","abstract_source":"openalex","abstract_missing":false,"directions":["display"],"novelty_score":4,"novelty_reason":"把 SnO2/ZnO 的堆叠顺序反转（SnO2 贴 ITO、ZnO 贴 QD）以同时实现促进注入与限制供给，属于明确的新结构策略并带来显著效率提升。","innovation_zh":"针对 ZnO 电子迁移率高导致电子注入过量、电荷积累和寄生复合的问题，作者把 SnO2/ZnO 双层电子传输层引入 QLED，但与以往 SnO2 直接接触量子点的结构相反，这里把 SnO2 放在 ITO 一侧、ZnO 紧贴量子点层。低浓度 ZnO 覆盖层把 SnO2 薄膜的 RMS 粗糙度从 1.79 nm 降到 1.07 nm 并促进电子注入，底层 SnO2 则限制电子供给，双层还抑制了漏电流并呈现最低的电容峰。器件最大电流效率 13.40 cd/A、最大亮度 33,210 cd/m2，电流效率分别比纯 SnO2 和纯 ZnO 器件高 100% 和 32.7%。","method_zh":"在 ITO 上依次制备 SnO2 与低浓度 ZnO 纳米颗粒层构成双层电子传输层，ZnO 与量子点层相邻，通过粗糙度、漏电流和电容表征结合器件效率对比验证电荷平衡的改善。","keywords_zh":["量子点发光二极管","电子传输层","SnO2/ZnO 双层","电荷平衡","电子注入调控"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:27.200Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/jacs.6c12708","doi":"10.1021/jacs.6c12708","doi_url":"https://doi.org/10.1021/jacs.6c12708","title":"Organic Metal Halogenide Netted Colloidal Quantum Dot Superlattice","title_zh":"有机金属卤化物网状胶体量子点超晶格","title_key":"organicmetalhalogenidenettedcolloidalquantumdotsuperlattice","authors":["Haobo Wu","Yu Chen","Xin Wen","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-14","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-14","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"The bottom-up assembly of colloidal quantum dots (CQDs) into superlattice structures is attractive for leveraging nanocrystal quantum features into films and optoelectronic devices. However, current CQD superlattices often require tedious control of the assembly kinetics, and they suffer from either excessively long interfacial distances, which impede carrier transport, or facet fusion, which brings high defect density. These hinder CQD superlattice applications in optoelectronic devices, where low defect density and large carrier diffusion lengths are essential. Herein, inspired by the growth of a two-dimensional (2D) perovskite layer, a class of aromatic organic cation ligands is adopted to stabilize CQDs and induce close and ordered packing of CQDs into a superlattice netted by an organic metal halogenide (QD@OMH), giving rise to a high carrier diffusion length (>250 nm) for lead sulfide (PbS) CQD film. The superlattice-based infrared photodetectors achieve a responsivity of 0.663 A W-1 at 1560 nm and an order-of-magnitude reduction in noise current density, yielding a detectivity exceeding 1013 Jones. Furthermore, the infrared light-emitting diodes achieve a high radiance (22.4 W sr-1 m-2) and an operational T90 lifetime exceeding 200 h under continuous operation at peak luminance.","abstract_hash":"d96f8b881a0a8cdbccfcf57de8ffde7d6cf1d610d87300f8bffa8a3391909921","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":5,"novelty_reason":"提出以有机金属卤化物网络构建 CQD 超晶格的新结构，同时解决载流子输运与缺陷密度矛盾，并在探测器与 LED 两类器件上给出具体性能指标。","innovation_zh":"针对现有 CQD 超晶格要么界面间距过大阻碍载流子输运、要么晶面融合导致高缺陷密度的问题，作者借鉴二维钙钛矿的生长思路，用芳香族有机阳离子配体稳定量子点，使其紧密有序排列并被有机金属卤化物（OMH）网络包裹，形成 QD@OMH 超晶格。PbS 量子点薄膜的载流子扩散长度超过 250 nm；基于该超晶格的红外探测器在 1560 nm 处响应度达 0.663 A/W，噪声电流密度降低一个数量级，探测率超过 10^13 Jones；红外 LED 辐射亮度达 22.4 W sr^-1 m^-2，峰值亮度连续工作下 T90 寿命超过 200 h。","method_zh":"采用芳香族有机阳离子配体稳定 CQD，诱导量子点紧密有序堆积，并由有机金属卤化物网络连接形成超晶格（QD@OMH），避免传统超晶格的长程界面间距与晶面融合问题。","keywords_zh":["胶体量子点超晶格","有机金属卤化物","PbS 量子点","红外光电探测","红外发光二极管"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:27.405Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.nxmate.2026.103184","doi":"10.1016/j.nxmate.2026.103184","doi_url":"https://doi.org/10.1016/j.nxmate.2026.103184","title":"Advances in core–shell quantum dot solar cells: Materials design, charge dynamics, and photovoltaic performance","title_zh":"核壳量子点太阳能电池进展：材料设计、电荷动力学与光伏性能","title_key":"advancesincoreshellquantumdotsolarcellsmaterialsdesignchargedynamicsandphotovoltaicperformance","authors":["Duryodhan Sahu","Aswi Rani Sahu","Sandipan Mallik"],"venue":"Next Materials","issn_l":"2949-8228","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-14","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-14","oa_status":"gold","pdf_url":"https://www.sciencedirect.com/science/article/pii/S2949822826016011/pdf","cited_by_count":0,"abstract":"Quantum dot sensitized solar cells (QDSSCs) are becoming some of the great possibilities of the next-generation photovoltaics because of the ability to tune their energy gap, high coefficients of absorption, and reasonably low manufacturing price. Nevertheless, the practical usage of this kind of solar cell is limited by surface defects, charge recombination, and low stability. Core-shell quantum dots overcome these issues through surface passivation, charge separation augmentation, and improvement of charge transport characteristics, along with stability. In this review, the latest developments in the field of core-shell QDSSCs are analyzed, including analysis of Type I, Type II, quasi Type II, and inverted Type I heterostructures and synthesis techniques as hot injection, SILAR and others. In this study, a significant breakthrough is reached by establishing a link between the core-shell band alignment types and photovoltaic coefficients such as ( J sc ), open circuit voltage ( V oc ), fill factor ( FF) , and power conversion efficiency (PCE). It quantifies the trade-off between efficiency and toxicity in heavy-metal containing QDs and environmentally friendly QDs. It is found that ZCISe/ZnSe Type I systems give the best certified PCE of 13.84%, while type II systems have excellent Jsc of more than 19 mA/cm², due to spatial separation of charges. Also, the authors identify the reasons for reduction in efficiency which include incomplete collection of carriers and recombination processes taking place between the interfaces. An action plan is developed to achieve the intended efficiency in 2024–2030 when the attention will be paid to using non-toxic QDs, which will not contain any heavy metals. Also, one should employ strategies focusing on shell structure and the interfaces.","abstract_hash":"85e98c57aebf6f4cc97081ff2a3cb61627dae40aca2dc60a03196ff6ef86758d","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"属于综述整合，主要新意在于系统建立能带排列类型与光伏参数的对应关系并量化效率-毒性权衡，而非提出新机制或新器件。","innovation_zh":"这是一篇关于核壳结构量子点敏化太阳能电池（QDSSC）的综述，核心贡献是把核壳能带排列类型（Type I、Type II、准 Type II、反 Type I）与光伏参数（Jsc、Voc、FF、PCE）直接对应起来，并量化了含重金属量子点与无重金属环保量子点在效率和毒性之间的权衡。文中指出 ZCISe/ZnSe 的 Type I 体系认证 PCE 最高达 13.84%，而 Type II 体系因电荷空间分离可获得超过 19 mA/cm² 的 Jsc，同时总结了载流子收集不完整和界面复合导致效率损失的原因，并给出 2024–2030 年面向无重金属量子点的路线图。","method_zh":"综述性工作，梳理了 Type I、Type II、准 Type II 和反 Type I 核壳异质结，以及热注入、SILAR 等合成方法，并将能带排列类型与器件光伏参数进行关联分析。","keywords_zh":["核壳量子点","量子点敏化太阳能电池","能带排列","电荷复合","无重金属量子点"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:29.519Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpcc.6c02506","doi":"10.1021/acs.jpcc.6c02506","doi_url":"https://doi.org/10.1021/acs.jpcc.6c02506","title":"Electron Transfer to Colloidal ZnO Nanocrystals from the Excited State of a Perylene Chromophore Formed by Direct Excitation or Triplet–Triplet Annihilation Upconversion","title_zh":"从直接激发或三重态-三重态湮灭上转换产生的苝发色团激发态向胶体 ZnO 纳米晶的电子转移","title_key":"electrontransfertocolloidalznonanocrystalsfromtheexcitedstateofaperylenechromophoreformedbydirectexcitationortriplettripletannihilationupconversion","authors":["Deepak Badgurjar","Mik Patel","Andrew Healy","et al."],"venue":"The Journal of Physical Chemistry C","issn_l":"1932-7447","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-13","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-13","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Upon binding 4-(perylen-3-yl)benzoic acid 1, to oleate-capped ZnO nanocrystals (NCs), significant broadening of the perylene absorption spectrum and fluorescence quenching were observed. In contrast, no broadening of the absorption spectrum or fluorescence quenching was observed when 1 was bound to oleylamine-capped ZrO2 NCs. Measurement of emission quenching by ZnO NCs as a function of dye concentration quantified binding and established that approximately 150 dyes attached to the surface of 3.7 nm diameter ZnO NCs, which correlated roughly to the number of zinc ions on the NC surface. A combination of steady-state spectroscopy, spectroelectrochemistry, and ultrafast pump-probe spectroscopy established that fluorescence quenching occurred via a fast excited-state electron transfer mechanism with a lifetime of less than 100 fs. The singlet excited state of 1 was also generated in solution and on the surface of ZrO2 NCs via triplet–triplet annihilation upconversion (TTA-UC) using a bodipy sensitizer that was present in solution or bound to the ZrO2 surface. Out of a possible maximum of 0.5, the TTA-UC quantum yields in CH2Cl2 were 0.0037 with and 0.0034 without ZrO2 NCs. Following selective excitation of the bodipy dye, dispersions containing both dyes and ZnO NCs showed no upconverted fluorescence from the perylene, demonstrating the ability of ZnO NCs to harvest two low-energy photons through TTA-UC.","abstract_hash":"976051cce5d337eb100d1ce74f1374da14ea615d8483f32f9f8002dfb8735774","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","detection"],"novelty_score":4,"novelty_reason":"把 TTA 上转换与 ZnO 纳米晶的界面电子转移结合，证明可用两个低能光子驱动电子注入，并给出亚 100 fs 的转移寿命和定量表面结合数，属于明确的新策略。","innovation_zh":"这篇工作把苝衍生物 1 通过羧基锚定到油酸包覆的 ZnO 纳米晶表面，发现吸收谱明显展宽且荧光被猝灭，而同样分子锚到油胺包覆的 ZrO2 纳米晶上则没有这些现象，说明猝灭来自 ZnO 特有的界面电子转移。通过猝灭随染料浓度的变化定量出每个 3.7 nm ZnO 纳米晶表面约结合 150 个染料分子，大致对应表面锌离子数；稳态光谱、光谱电化学和飞秒泵浦-探测一致表明是激发态电子转移，寿命短于 100 fs。作者还借助 bodipy 敏化剂在溶液或 ZrO2 表面做 TTA-UC 产生苝的单重激发态，在 CH2Cl2 中 TTA-UC 量子产率（上限 0.5）为有 ZrO2 时 0.0037、无 ZrO2 时 0.0034；选择性激发 bodipy 后，含两种染料与 ZnO 的分散液观察不到苝的上转换荧光，说明 ZnO 能把 TTA-UC 产生的激发态电子抽走，即用两个低能光子完成电子注入。","method_zh":"将 4-(perylen-3-yl)benzoic acid 1 锚定到油酸包覆 ZnO 与油胺包覆 ZrO2 纳米晶上作对照，结合稳态吸收/荧光、光谱电化学、飞秒泵浦-探测，以及溶液相和 ZrO2 表面敏化的三重态-三重态湮灭上转换实验来追踪电子转移路径。","keywords_zh":["ZnO 纳米晶","界面电子转移","三重态-三重态湮灭上转换","飞秒泵浦-探测","苝发色团"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:30.987Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1103/g8t7-my5q","doi":"10.1103/g8t7-my5q","doi_url":"https://doi.org/10.1103/g8t7-my5q","title":"Entangled photons from quantum-dot–cavity systems under non-Markovian decoherence by pulsed excitation","title_zh":"脉冲激发下量子点-腔系统在非马尔可夫退相干下的纠缠光子","title_key":"entangledphotonsfromquantumdotcavitysystemsundernonmarkoviandecoherencebypulsedexcitation","authors":["Katy Snow","Mauro Paternostro"],"venue":"Physical review. B./Physical review. B","issn_l":"2469-9950","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-12","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-12","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Cascaded emission from the biexciton state of a quantum dot results in polarization entangled photon pairs. Cavity enhancement of the direct two-photon emission channel bypasses the dominant source of decoherence in this system, namely the fine-structure splitting of the exciton levels. Here, we investigate the remaining non-Markovian phonon-induced decoherence using the numerically exact uniTEMPO algorithm. We compute the degree of entanglement of photon pairs generated by pulsed two-photon resonant excitation and find surprisingly good agreement between the numerically exact results and those calculated using the approximate polaron master equation method, permitting an efficient exploration of trends across system parameters.","abstract_hash":"868a6f1c084f878584d8af4b766f06476f42f8b868dee78ef7d4af09a6b58322","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display"],"novelty_score":3,"novelty_reason":"在已有腔增强双光子纠缠方案基础上，用数值精确方法验证了近似方法的适用性，属于对已有物理图像的定量确认而非新机制。","innovation_zh":"研究了双激子级联发射产生偏振纠缠光子对时，腔增强双光子直接发射通道绕过了激子精细结构分裂这一主要退相干源之后，残余的声子诱导非马尔可夫退相干对纠缠度的影响。用数值精确的 uniTEMPO 算法计算脉冲双光子共振激发下光子对的纠缠度，发现与近似的极化子主方程方法结果吻合得出奇地好，从而可以用后者高效地扫描系统参数趋势。","method_zh":"采用数值精确的 uniTEMPO 算法处理非马尔可夫声子退相干，并与极化子主方程近似方法对比，计算脉冲双光子共振激发下腔增强双光子发射产生的纠缠光子对的纠缠度。","keywords_zh":["量子点","纠缠光子对","非马尔可夫退相干","声子","uniTEMPO"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:29.906Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.optmat.2026.118401","doi":"10.1016/j.optmat.2026.118401","doi_url":"https://doi.org/10.1016/j.optmat.2026.118401","title":"InGaAs/InP based SWIR photodiode: Growth and fabrication on InP-on-silicon (InPoSi) wafers","title_zh":"基于 InGaAs/InP 的短波红外光电二极管：在 InP-on-silicon (InPoSi) 晶圆上的生长与制备","title_key":"ingaasinpbasedswirphotodiodegrowthandfabricationoninponsiliconinposiwafers","authors":["Jean‐Luc Reverchon","Eva Izquierdo","Antoine Elias","et al."],"venue":"Optical Materials","issn_l":"0925-3467","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-12","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-12","oa_status":"green","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["InGaAs/InP","短波红外光电二极管","InP-on-silicon","异质外延","晶圆键合"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:28.948Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsomega.5c12773","doi":"10.1021/acsomega.5c12773","doi_url":"https://doi.org/10.1021/acsomega.5c12773","title":"MnSb-Based Quantum Dots: Defect-Mediated Photoluminescence in Multiphase Nanostructures via Green Colloidal Synthesis","title_zh":"MnSb 基量子点：绿色胶体合成多相纳米结构中的缺陷介导光致发光","title_key":"mnsbbasedquantumdotsdefectmediatedphotoluminescenceinmultiphasenanostructuresviagreencolloidalsynthesis","authors":["Rahma Dika Nasution Aulia","Evelyna Ikhza Wafiyah","Juvani Indah Putri","et al."],"venue":"ACS Omega","issn_l":"2470-1343","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-11","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-11","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"MnSb-based quantum dots are an emerging class of lead-free luminescent nanomaterials with potential for sustainable photonic applications. In this work, defect-emissive Mn-Sb/MnOx quantum nanostructures were synthesized via a green ethanol-assisted colloidal reflux method using oleic acid as a surface-passivating ligand under an inert nitrogen atmosphere. The synthesized nanostructures exhibited an average particle size of ∼5.3 nm with good colloidal dispersibility and narrow size distribution. Structural characterization by XRD, TEM, SAED, XRF, Raman spectroscopy, and XPS collectively suggests the formation of Mn-Sb-related nanocrystalline domains embedded within MnOx-rich surface environments, indicating a structurally heterogeneous and defect-rich nanoscale system. Optical measurements showed a pronounced absorption feature near 230 nm and effective optical transition energies of 3.9-4.1 eV. Because the synthesized material is structurally heterogeneous and contains MnOx-rich surface environments, the estimated optical transition energies should be regarded as effective optical transition energies rather than a true semiconductor band gap. Broad green photoluminescence centered at 518-525 nm was observed, with a maximum photoluminescence quantum yield (PLQY) of 62.3%. The emission is attributed to defect-mediated and interface-assisted radiative recombination associated with Mn-Sb-related nanodomains, MnOx-rich surface species, and ligand-passivated defect states. These findings demonstrate that defect engineering in MnSb-based multiphase quantum dots provides an effective strategy for designing efficient lead-free luminescent nanomaterials.","abstract_hash":"03b7f77e67398986499217654f9d5b3dfffe334471518a7e77317f993c1e20ad","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"在无铅 MnSb 多相量子点这个新体系上验证了缺陷介导发光并给出 62.3% 的 PLQY，但机制解释和合成策略属于已有缺陷发光思路的体系拓展，缺少新物理机制或器件级突破。","innovation_zh":"用乙醇辅助的绿色胶体回流法（油酸作表面钝化配体、氮气惰性气氛）做出了 Mn-Sb/MnOx 多相量子点，平均粒径约 5.3 nm，胶体分散性和尺寸分布都不错。结构表征显示是 Mn-Sb 相关纳米晶畴嵌在富 MnOx 的表面环境里，属于结构非均相、缺陷丰富的体系。发光上给出 518–525 nm 的宽绿光发射，最高 PLQY 达 62.3%，作者把发光归因于 Mn-Sb 纳米畴、MnOx 表面物种和配体钝化缺陷态共同参与的缺陷/界面辅助辐射复合。亮点在于无铅 MnSb 体系 + 绿色合成路线 + 高 PLQY 的缺陷发光，但注意文中明确说 3.9–4.1 eV 只是有效光学跃迁能，不是真正的带隙。","method_zh":"乙醇辅助胶体回流合成，油酸作表面钝化配体，氮气气氛下制备 Mn-Sb/MnOx 多相纳米结构；用 XRD、TEM、SAED、XRF、Raman、XPS 做结构与成分表征，配合吸收和 PL（含 PLQY）光谱分析发光来源。","keywords_zh":["MnSb 量子点","无铅发光材料","缺陷发光","绿色胶体合成","光致发光量子产率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:32.003Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1364/oe.607425","doi":"10.1364/oe.607425","doi_url":"https://doi.org/10.1364/oe.607425","title":"Tunable bandgap PbS colloidal quantum dots for infrared detectors with absorption peak up to 2 μm","title_zh":"带隙可调的 PbS 胶体量子点用于吸收峰达 2 μm 的红外探测器","title_key":"tunablebandgappbscolloidalquantumdotsforinfrareddetectorswithabsorptionpeakupto2m","authors":["Xueying Wang","Congya You","Ming Liu","et al."],"venue":"Optics Express","issn_l":"1094-4087","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-11","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-11","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Colloidal quantum dots (CQDs), with their excellent spectral tunability and solution-processability, show great potential in next-generation infrared optoelectronics. This study focuses on an improved stepwise hot-injection method for the precise synthesis of large-sized PbS CQDs. By precisely controlling the nucleation-growth dynamics, we successfully synthesize PbS quantum do
