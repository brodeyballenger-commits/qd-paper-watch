ts with excellent monodispersity, diameters exceeding 10.6 nm, a narrow size distribution (relative standard deviation of approximately 6%), and a distinct excitonic absorption peak at 2.08 μm. The synthesized quantum dots are integrated into photodetectors, achieving a high specific detectivity of 1.56 × 10 11 Jones at 1.6 μm wavelength. This provides a viable pathway for the fabrication of high-performance, solution-processable quantum dot infrared detectors.","abstract_hash":"b591bd8c43abc9ead95dc776219940bc583ce0b732ff6d3f1aa0fc335283fd8c","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"在已有 PbS 量子点合成思路上做分步热注入的工艺改进，把吸收峰推到 2 μm 并给出器件探测率，属于渐进式改进而非新机制。","innovation_zh":"针对大尺寸 PbS 胶体量子点合成中尺寸分布难控制的问题，作者改进了分步热注入法，通过调控成核-生长动力学，合成了直径超过 10.6 nm、相对标准偏差约 6% 的 PbS 量子点，激子吸收峰位于 2.08 μm。将其集成到光电探测器中，在 1.6 μm 处获得 1.56 × 10^11 Jones 的比探测率，说明该合成路线可用于制备溶液加工的高性能红外探测器。","method_zh":"采用改进的分步热注入法合成大尺寸 PbS 胶体量子点，并将其集成到光电探测器中测试红外响应。","keywords_zh":["PbS 胶体量子点","红外探测器","分步热注入","带隙调控","比探测率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:31.734Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.nanolett.6c03035","doi":"10.1021/acs.nanolett.6c03035","doi_url":"https://doi.org/10.1021/acs.nanolett.6c03035","title":"Efficient Green-Emitting Aminophosphine-Derived InP-Based Quantum-Dot LEDs Enabled by Photo-cross-linked Hole Transport Layer Engineering","title_zh":"通过光交联空穴传输层工程实现的高效绿光氨基膦衍生 InP 基量子点 LED","title_key":"efficientgreenemittingaminophosphinederivedinpbasedquantumdotledsenabledbyphotocrosslinkedholetransportlayerengineering","authors":["Shuaibing Wang","Ouyang Lin","Wentao Niu","et al."],"venue":"Nano Letters","issn_l":"1530-6984","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-10","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-10","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Cadmium-free indium phosphide (InP) quantum dot light-emitting diodes (QLEDs) are promising for next-generation displays, but high-quality green-emitting InP quantum dots (QDs) are still commonly synthesized using highly reactive tris(trimethylsilyl)phosphine. Here, we employ tris(dimethylamino)phosphine as a safer phosphorus precursor to prepare InP/ZnSexS1-x/ZnS QDs. Optimizing the intermediate alloy shell yields green QDs with a photoluminescence quantum yield of 96.1% and a full width at half-maximum of 36.5 nm. A photo-cross-linked PF8Cz:BPO6 hole transport layer improves film compactness and hole transport, while an ultrathin polyvinylpyrrolidone interlayer regulates excessive electron injection. The optimized QLEDs achieve a maximum external quantum efficiency of 10.5% and a peak luminance of 16,219 cd m-2. This work demonstrates a practical strategy for improving the electroluminescent utilization of aminophosphine-derived InP QDs through coordinated material and interface engineering.","abstract_hash":"707fae6e0eb1538a591982dd208c864878875465153c48327297783828e72f6c","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用更安全的氨基膦前驱体路线配合光交联 HTL 与界面层协同优化，把绿光无镉 QLED 的 EQE 推到 10.5%，属于明确的新策略加显著性能提升。","innovation_zh":"用三(二甲氨基)膦这种更安全的磷前驱体替代高活性的三(三甲基硅基)膦来合成 InP/ZnSexS1-x/ZnS 量子点，通过优化中间合金壳层把绿光量子点做到 96.1% 的 PLQY 和 36.5 nm 的半高宽。器件端用光交联的 PF8Cz:BPO6 空穴传输层提升薄膜致密性和空穴传输，再加一层超薄 PVP 界面层抑制过量的电子注入，最终 QLED 外量子效率最高 10.5%、峰值亮度 16,219 cd m-2。核心卖点是把氨基膦路线的 InP 量子点通过材料与界面协同工程做到可用的电致发光水平。","method_zh":"以三(二甲氨基)膦为磷前驱体合成 InP/ZnSexS1-x/ZnS 核壳量子点，器件采用光交联 PF8Cz:BPO6 空穴传输层并引入超薄 PVP 电子注入调控层。","keywords_zh":["InP 量子点","无镉 QLED","氨基膦前驱体","光交联空穴传输层","界面工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:32.861Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpclett.6c02093","doi":"10.1021/acs.jpclett.6c02093","doi_url":"https://doi.org/10.1021/acs.jpclett.6c02093","title":"Revealing the Influence of Hole Transport Layer on the Stability of Blue Quantum Dot Light-Emitting Diodes","title_zh":"揭示空穴传输层对蓝光量子点发光二极管稳定性的影响","title_key":"revealingtheinfluenceofholetransportlayeronthestabilityofbluequantumdotlightemittingdiodes","authors":["Likuan Zhou","Jiehao Guan","Kun Zhang","et al."],"venue":"The Journal of Physical Chemistry Letters","issn_l":"1948-7185","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-10","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-10","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"High-performance blue quantum-dot light-emitting diodes (QLEDs) typically employ poly(9,9-dioctylfluorene-co-N-(4-butylphenyl)diphenylamine) (TFB) as the hole transport layer (HTL). However, the insufficient energy barrier between the LUMO of TFB and the conduction band of blue QDs (BQDs) induces severe electron leakage, resulting in parasitic interfacial emission and compromised device stability. Herein, we investigate the structural evolution and optoelectronic degradation of TFB films during QLED aging via a charge functional layer peeling technique. We reveal that oxidation reactions occur both at the TFB/BQDs interface and within the bulk TFB film under operational stress. Driven by leaked electrons, the main and side chains of TFB molecules undergo scission and oxidation, generating abundant carrier traps associated with oxidation products (C2H3O+, C2H3O2+) and molecular fragments (C3H5+, C4H7+, C5H9+). Furthermore, this structural degradation downshifts the conduction band level of the TFB layer by 0.21 eV, thereby exacerbating electron leakage. Concurrently, the diminished hole mobility disrupts the carrier balance and increases exciton density in the emissive layer. This work elucidates the intrinsic HTL degradation mechanism in state-of-the-art QLEDs, providing critical insights for designing highly stable blue QLED devices.","abstract_hash":"01d8564c10d62a03fe7b8297b4b8b545ed49b322879e9309af2061086b00efb2","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用剥离技术直接给出 TFB 在工作应力下的化学降解路径与能级下移 0.21 eV 的定量证据，把蓝光 QLED 稳定性问题归因到 HTL 本征退化，属于机制层面的新认识。","innovation_zh":"针对蓝光 QLED 中 TFB 空穴传输层在工作应力下退化的问题，作者用「电荷功能层剥离技术」把老化后的 TFB 膜单独取出来做结构和光电表征，直接追踪其演变。结果发现氧化同时发生在 TFB/BQDs 界面和 TFB 体相内：泄漏电子驱动 TFB 主链与侧链断裂氧化，生成 C2H3O+、C2H3O2+ 等氧化产物和 C3H5+、C4H7+、C5H9+ 等分子碎片，并引入大量载流子陷阱。更关键的是，这种结构退化使 TFB 的导带能级下移 0.21 eV，进一步加剧电子泄漏，同时空穴迁移率下降、载流子平衡被破坏、发光层激子密度升高。","method_zh":"采用电荷功能层剥离技术，将老化 QLED 中的 TFB 层分离出来，结合结构演化与光电退化表征，关联 TFB 的化学降解与器件稳定性。","keywords_zh":["蓝光QLED","TFB空穴传输层","电子泄漏","器件老化","界面氧化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:33.828Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/1361-6528/ae9773","doi":"10.1088/1361-6528/ae9773","doi_url":"https://doi.org/10.1088/1361-6528/ae9773","title":"Observation of an anomalously broadened donor-induced excitonic emission of CdSe/ZnSe submonolayer quantum dots","title_zh":"CdSe/ZnSe 亚单层量子点中施主诱导的异常展宽激子发光的观测","title_key":"observationofananomalouslybroadeneddonorinducedexcitonicemissionofcdseznsesubmonolayerquantumdots","authors":["José Carlos Basilio-Ortiz","F. Šutara","I. Hernández‐Calderón"],"venue":"Nanotechnology","issn_l":"0957-4484","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-10","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-10","oa_status":"hybrid","pdf_url":"https://iopscience.iop.org/article/10.1088/1361-6528/ae9773/pdf","cited_by_count":0,"abstract":"Abstract Epitaxial CdSe/ZnSe submonolayer quantum dots (SMQDs), formed from CdSe coverages below one monolayer (ML), often exhibit a double-peak excitonic structure in their photoluminescence spectra. The narrower, higher-energy peak corresponds to excitons localized within the SMQDs. The lower-energy peak is broader, which is not typical of donor-bound excitons, and has therefore been attributed in previous studies to morphological features of the quantum dots. The identification of the origin of the low-energy peak is technologically relevant for quantum applications of the SMQDs. To clarify the origin of this excitonic structure, we grew several CdSe SMQDs samples with nominal coverages of 0.5 and 0.25 MLs embedded in both non-intentionally doped and Cl-doped ZnSe barriers. The heterostructures were systematically characterized by photoluminescence spectroscopy. A direct comparison of the excitonic properties of the CdSe SMQDs samples grown within ZnSe barriers with varying n -type impurity doping clearly demonstrates that the relative intensity and line shape of the lower-energy peak depend strongly on donor concentration. These findings overturn the previous morphological interpretation and conclusively demonstrate that the lower-energy component originates from donor impurities. It corresponds to localized excitons bound to single or multiple neutral donors and/or to negative trions formed at low temperature. The intensity in both cases depends on donor doping level.","abstract_hash":"a0342ff00b1eba1bc3d1998ed19bf72b36e7d2920056d2cf96c599e30c4abdfc","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","quantuminfo"],"novelty_score":4,"novelty_reason":"用受控掺杂对比实验直接推翻长期沿用的形貌归因，给出了低能宽峰的杂质来源新解释，属于对既有物理图像的实质性修正。","innovation_zh":"此前 CdSe/ZnSe 亚单层量子点（SMQD）PL 谱中低能宽峰一直被归因于量子点的形貌特征，本文通过对比不同 Cl 掺杂浓度的 ZnSe 势垒中生长的 0.5 ML 和 0.25 ML CdSe SMQD 样品，证明该低能峰其实来自施主杂质：其相对强度和线型强烈依赖施主浓度。这一结果推翻了此前的形貌学解释，把低能峰指认为束缚于单个或多个中性施主的局域激子以及低温下的负三子（negative trion）。","method_zh":"在非故意掺杂和 Cl 掺杂的 ZnSe 势垒中生长名义覆盖度 0.5 ML 与 0.25 ML 的 CdSe SMQD 外延样品，用光致发光谱系统表征并对比不同 n 型掺杂水平下的激子行为。","keywords_zh":["亚单层量子点","CdSe/ZnSe","施主束缚激子","负三子","光致发光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:37.827Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpclett.6c01698","doi":"10.1021/acs.jpclett.6c01698","doi_url":"https://doi.org/10.1021/acs.jpclett.6c01698","title":"Control of Photoinduced Ligand Detachment from Quantum Dot Surfaces Using Nanocrystal Architecture","title_zh":"利用纳米晶结构调控量子点表面的光致配体脱附","title_key":"controlofphotoinducedliganddetachmentfromquantumdotsurfacesusingnanocrystalarchitecture","authors":["McKenna N. Grega","Jacob A. Cho","R E Brown","et al."],"venue":"The Journal of Physical Chemistry Letters","issn_l":"1948-7185","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-10","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-10","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"We investigated the influence that nanocrystal architecture has on the extent to which colloidal quantum dots undergo photoinduced ligand detachment. We took advantage of the ability of electrons to delocalize throughout both the core and shell of CdSe/CdS core/shell nanostructures to modulate the surface electron density of a series of colloidal quantum dots. Then, we used infrared transient absorption spectroscopy to monitor the ligand photodetachment process on the surfaces of quantum dots with varying shell thicknesses. CdSe core-only and CdSe/CdS quantum dots with thin CdS shells exhibit little photoinduced ligand detachment in the solid film environment. In contrast, CdSe/CdS core/shell nanostructures with thicker CdS shells that localize surface electron density in their excited states undergo extensive ligand photodetachment even in solid films. Our findings suggest that core/shell architectures with tuned shell thicknesses could enhance the extent of photoinduced ligand detachment and could increase the photocatalytic activity of colloidal quantum dots.","abstract_hash":"f874a1a2f90de3f79fd49ada9a9add6040f3436dd3ea566ac09cd82939ee198a","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"把核壳壳厚与表面电子密度、固态薄膜中的配体光脱附程度建立起明确的构效关系，属于有新意的结构调控策略，但摘要未给出定量性能指标。","innovation_zh":"这篇工作把 CdSe/CdS 核壳量子点的壳层厚度当作调控表面电子密度的旋钮，用红外瞬态吸收光谱追踪光致配体脱附。结果发现只有纯 CdSe 核和薄壳样品在固态薄膜中几乎不发生配体脱附，而厚 CdS 壳能把激发态电子密度局域在表面，使固态薄膜中也出现大量配体光脱附。作者据此提出通过调节核壳结构壳厚来增强光致配体脱附、进而提升胶体量子点光催化活性的思路。","method_zh":"以电子可在 CdSe 核与 CdS 壳中离域的核壳结构为模型体系，改变 CdS 壳厚来调制表面电子密度，并用红外瞬态吸收光谱监测固态薄膜中的配体光脱附过程。","keywords_zh":["量子点","核壳结构","光致配体脱附","瞬态吸收光谱","表面电子密度"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:34.564Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.mseb.2026.119764","doi":"10.1016/j.mseb.2026.119764","doi_url":"https://doi.org/10.1016/j.mseb.2026.119764","title":"Activated carbon-CuS quantum dot hybrids: a novel pathway toward enhanced solar energy harvesting","title_zh":"活性炭-CuS 量子点杂化物：增强太阳能收集的新路径","title_key":"activatedcarboncusquantumdothybridsanovelpathwaytowardenhancedsolarenergyharvesting","authors":["G. Vinoth","V. Mohanavel","B. Janarthanan","et al."],"venue":"Materials Science and Engineering B","issn_l":"0921-5107","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-09","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-09","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Maximizing the optimal and maximum utilization of solar light is the primary aim and focus of photovoltaics. While UV and visible light-active photocatalysts have been thoroughly examined, the utilization of the near-infrared (NIR) wavelength of solar radiation remains mostly unexplored. The facile hydrothermal approach is used to produce high-quality carbon doped CuS/AC quantum dots. These exhibit exceptional physicochemical and optical characteristics, including broad spectrum absorption, efficient charge carrier extraction, rapid charge carrier transport, and tunable emission. The CuS/AC quantum dots are included in the quantum dot sensitized solar cells (QDSSCs) architecture to enhance performance. The impact of synthesized CuS/AC as a sensitizer, co-sensitizer, and co-photoactive layers were examined within the QDSSCs framework. A photo conversion efficiency of 1.8132% and a photocurrent density of 3.2650 mA/cm 2 are attained during one sun irradiation when CuS/Activated Carbon (AC) (75% of activated carbon) is employed as a co-photoactive layer. This study emphasizes the promise of CQDs for the sustainable fabrication of nanomaterials and energy conversion applications, providing a scalable and eco-friendly option for CQD synthesis.","abstract_hash":"779e82768f07dc4a1b74373ef49269a0bb48928b6ec9c38d53d6d7a4bc0d90f8","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"把碳掺杂 CuS/AC 量子点用于 QDSSCs 并比较三种集成角色，属于已有思路在新体系上的验证，效率数值本身不高。","innovation_zh":"作者用水热法合成了碳掺杂的 CuS/活性炭（AC）量子点，并将其引入量子点敏化太阳能电池（QDSSCs），分别测试了它作为敏化剂、共敏化剂和共光活性层的效果。当 CuS/AC（活性炭占 75%）作为共光活性层时，在一个太阳光照下获得 1.8132% 的光电转换效率和 3.2650 mA/cm² 的光电流密度。工作重点在于把近红外波段的吸收利用起来，并强调该碳量子点路线可规模化、环境友好。","method_zh":"采用简便水热法制备碳掺杂 CuS/AC 量子点，再将其以敏化剂、共敏化剂和共光活性层三种角色集成到 QDSSCs 结构中对比性能。","keywords_zh":["CuS 量子点","活性炭","量子点敏化太阳能电池","近红外吸收","水热法"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:35.418Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/flm2.70119","doi":"10.1002/flm2.70119","doi_url":"https://doi.org/10.1002/flm2.70119","title":"PbS colloidal quantum dots imagers: From single devices to arrays, flexible platforms, and CMOS‐integrated systems","title_zh":"PbS 胶体量子点成像器：从单元器件到阵列、柔性平台与 CMOS 集成系统","title_key":"pbscolloidalquantumdotsimagersfromsingledevicestoarraysflexibleplatformsandcmosintegratedsystems","authors":["Xin Hong","Songdi Zhang","Runtian Han","et al."],"venue":"FlexMat.","issn_l":"2836-9092","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-08","oa_status":"diamond","pdf_url":null,"cited_by_count":1,"abstract":"Abstract Imagers operating in the visible to near‐infrared (NIR) range play an important role in applications such as industrial sorting, security surveillance, and autonomous driving. However, conventional imaging technologies based on silicon and III–V semiconductors suffer from several limits, including restricted spectral range, high fabrication cost, and complicated integration processes, which limit their large‐scale use. Lead sulfide (PbS) colloidal quantum dots (CQDs) have been explored as an alternative material system, because their bandgap can be tuned by size, they can be processed from solution at low cost, and they are compatible with monolithic integration approaches that avoid flip‐chip bonding. This review summarizes recent progress in PbS CQD imagers, with a focus on device‐level optimization methods, including band structure design, defect passivation, and interface control, and this review discusses recent work on the monolithic integration of PbS CQDs with flexible substrates, silicon platforms, and CMOS readout integrated circuits, which provides an effective way to reduce the cost and system complexity of traditional infrared imagers. Finally, this review presents recent developments in CQD synthesis and briefly considers their relevance to optical bioimaging, neuromorphic and synaptic devices, and artificial intelligence‐based recognition.","abstract_hash":"4bd0eefdec8cbba005ebbb07ebce02ec9371df9231fab672aa59ebb93976dece","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials","display"],"novelty_score":2,"novelty_reason":"属于领域综述，整合已有器件优化与集成路线，未提出新机制或新器件，创新性主要体现在归纳视角。","innovation_zh":"这是一篇综述，系统梳理了 PbS 胶体量子点成像器从单元器件走向阵列、柔性平台和 CMOS 集成系统的最新进展。文章重点总结了器件层面的优化手段——能带结构设计、缺陷钝化和界面控制，并讨论了 PbS CQD 与柔性衬底、硅平台以及 CMOS 读出集成电路的单片集成工作，指出这条路线可以规避倒装焊、降低传统红外成像器的成本和系统复杂度。文末还涉及 CQD 合成进展及其在光学生物成像、神经形态/突触器件和 AI 识别中的潜在关联。作为综述本身不产生新实验数据，创新性主要体现在对器件优化与集成路线的归纳整合。","method_zh":"综述形式，围绕能带结构设计、缺陷钝化、界面控制等器件级优化方法，以及 PbS CQD 与柔性衬底、硅平台、CMOS 读出电路的单片集成方案展开。","keywords_zh":["PbS 胶体量子点","近红外成像","CMOS 集成","柔性平台","缺陷钝化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:36.189Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s41598-026-62488-1","doi":"10.1038/s41598-026-62488-1","doi_url":"https://doi.org/10.1038/s41598-026-62488-1","title":"Enhancing the efficiency of quantum-dot-based single-photon source designs by suppressing background emission using concentric rings","title_zh":"利用同心环抑制背景发射以提升量子点单光子源设计效率","title_key":"enhancingtheefficiencyofquantumdotbasedsinglephotonsourcedesignsbysuppressingbackgroundemissionusingconcentricrings","authors":["Martin Arentoft Jacobsen","Luca Vannucci","Julien Claudon","et al."],"venue":"Scientific Reports","issn_l":"2045-2322","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-08","oa_status":"gold","pdf_url":"https://www.nature.com/articles/s41598-026-62488-1_reference.pdf","cited_by_count":0,"abstract":"In this paper, we theoretically demonstrate that a few-period circular Bragg reflector consisting of concentric rings placed around an infinite nanowire with an embedded quantum dot of unity quantum efficiency can increase the fraction of radiative emission into the fundamental \\(\\textrm{HE}_{11}\\) mode ( \\(\\beta =\\Gamma _{\\textrm{HE}_{11}}/\\Gamma _\\textrm{Total}\\) ) up to 0.999 due to enhanced suppression of the emission into radiation modes caused by a photonic bandgap effect. We then apply this strategy in the practically relevant case of the finite-sized single-photon source based on tapered nanowires and demonstrate that the collection efficiency can be improved. Additionally, we also show the beneficial effects of placing optimized rings around the micropillar single-photon source.","abstract_hash":"4e94420e60898857a2e6c954407c14243fa9f66f533e06aba3eab50d7e8f5ad0","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display"],"novelty_score":4,"novelty_reason":"把同心环圆形布拉格反射器用于抑制单光子源背景发射并给出 β=0.999 的理论结果，属于明确的新结构策略，但仍是理论工作、未刷新实验纪录。","innovation_zh":"针对量子点单光子源中背景发射（辐射模泄漏）限制收集效率的问题，作者提出在无限纳米线（内嵌量子点，量子效率设为1）周围加一圈少周期同心环构成的圆形布拉格反射器，靠光子带隙效应压制向辐射模的发射，把进入基模 HE11 的辐射发射占比 β 推到 0.999。随后把该策略用到更贴近实际的锥形纳米线有限尺寸单光子源上，证明收集效率可以提升；并进一步说明在微柱单光子源周围加优化环同样有增益。","method_zh":"用理论计算（无实验）对比无限纳米线、锥形纳米线有限尺寸单光子源和微柱单光子源三种结构，在纳米线/微柱外围引入少周期同心环圆形布拉格反射器，通过光子带隙抑制辐射模发射。","keywords_zh":["单光子源","量子点","圆形布拉格反射器","光子带隙","收集效率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:37.366Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/admt.71234","doi":"10.1002/admt.71234","doi_url":"https://doi.org/10.1002/admt.71234","title":"O Radical‐Induced n‐to‐p Transition in PbS Quantum Dots Enabling Enhanced and Stable Photogating in QD/IGZO SWIR Phototransistors","title_zh":"O 自由基诱导 PbS 量子点 n-to-p 转变，实现 QD/IGZO 短波红外光电晶体管增强且稳定的光栅效应","title_key":"oradicalinducedntoptransitioninpbsquantumdotsenablingenhancedandstablephotogatinginqdigzoswirphototransistors","authors":["Md. Redowan Mahmud Arnob","Solbee Lee","Hansol Jeong","et al."],"venue":"Advanced Materials Technologies","issn_l":"2365-709X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-08","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-08","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Colloidal PbS quantum dots (QDs) are promising photosensitizers for short‐wave infrared phototransistors. But their photogating efficiency is limited by unfavorable energy band alignment and interfacial defects. Here, we report an O radical exposure to induce an effective n‐to‐p transition in PbS QDs using atmospheric Ar/O 2 plasma (AAP). This leads to enhanced and stable photogating effect in PbS QD/IGZO phototransistors. Ultraviolet photoelectron spectroscopy (UPS) results show the work‑function increase from 4.10 to 4.47 eV and the shift of E F toward mid‑gap, E C − E F shifts from 0.26 to 0.65 eV by 15 cycles of AAP treatment. The XPS results indicate the increase of M─O from 44.9% to 81.1%, and the decrease in oxygen vacancies (V O ) from 38.8% to 16.1%, and hydroxyl (─OH) concentration from 16.3% to 2.8% at the interface by AAP. These modifications suppress off‐state current (I off ), shift threshold voltage (V TH ) to positive, minimize interface trap density (D it ), and suppress photocurrent decay, thereby stabilizing photogating effect. The AAP‐treated device shows the responsivity 2883 A W − 1 , detectivity 7.43 × 10 1 3 Jones, and EQE 2.75 × 10 5 % at 1300 nm under 1 mW cm −2 . A 5 × 5 pattern recognition array based on PbS QD/IGZO phototransistors shows alphanumeric patterns under SWIR illumination.","abstract_hash":"6416b7ef884befca95754c88b576e2a248b4b0f000269ed89f770d127889c470","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":4,"novelty_reason":"用等离子体 O 自由基处理在 PbS 量子点中实现 n-to-p 转变并据此稳定光栅效应，属明确的新策略且带来显著性能提升，但机制层面仍是界面工程而非全新物理。","innovation_zh":"针对 PbS 量子点作为短波红外光电晶体管敏化剂时光栅效率受能带对齐不利和界面缺陷限制的问题，作者用大气 Ar/O2 等离子体（AAP）处理引入 O 自由基，在 PbS 量子点中诱导出有效的 n-to-p 转变。UPS 显示功函数从 4.10 eV 升至 4.47 eV、费米能级向带隙中央移动（EC−EF 由 0.26 eV 变为 0.65 eV，15 个 AAP 循环），XPS 显示界面 M─O 由 44.9% 增至 81.1%、氧空位由 38.8% 降至 16.1%、羟基由 16.3% 降至 2.8%。这些变化抑制了暗态电流、使阈值电压正移、降低界面陷阱密度并抑制光电流衰减，从而稳定光栅效应；器件在 1300 nm、1 mW cm−2 下响应度达 2883 A W−1、探测率 7.43×10^13 Jones、EQE 2.75×10^5%，并演示了 5×5 阵列的字母数字图案识别。","method_zh":"用大气 Ar/O2 等离子体（AAP）对 PbS 量子点进行 O 自由基暴露处理，构建 PbS QD/IGZO 短波红外光电晶体管，并用 UPS、XPS 表征功函数、费米能级位置及界面化学计量变化。","keywords_zh":["PbS 量子点","光栅效应","短波红外光电晶体管","等离子体处理","IGZO"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:39.063Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/2631-7990/ae8d60","doi":"10.1088/2631-7990/ae8d60","doi_url":"https://doi.org/10.1088/2631-7990/ae8d60","title":"Ultrahigh-resolution quantum dot leds: closing the gap to retinal-level full-color displays","title_zh":"超高分辨率量子点 LED：缩小与视网膜级全彩显示的差距","title_key":"ultrahighresolutionquantumdotledsclosingthegaptoretinallevelfullcolordisplays","authors":["Jinhong Park","Rih-Jia Liu","Jiho Shin"],"venue":"International Journal of Extreme Manufacturing","issn_l":"2631-7990","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-07","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-07","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"无摘要信息，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断关键方法或器件结构。","keywords_zh":["量子点 LED","超高分辨率","全彩显示","视网膜级显示"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:37.045Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.13140/rg.2.2.26988.94082","doi":"10.13140/rg.2.2.26988.94082","doi_url":"https://doi.org/10.13140/rg.2.2.26988.94082","title":"Theoretical Investigation of Quantum Tunneling-Driven Electron Transport in InAs/GaAs Quantum Dot Structures for Solar Cell Applications","title_zh":"面向太阳能电池应用的 InAs/GaAs 量子点结构中量子隧穿驱动电子输运的理论研究","title_key":"theoreticalinvestigationofquantumtunnelingdrivenelectrontransportininasgaasquantumdotstructuresforsolarcellapplications","authors":["Parsa Shahhosseini Fouzi"],"venue":null,"issn_l":null,"source_type":null,"is_preprint":false,"alt_doi":null,"pub_date":"2026-08-07","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-07","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["InAs/GaAs 量子点","量子隧穿","电子输运","太阳能电池"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:38.363Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adfm.77563","doi":"10.1002/adfm.77563","doi_url":"https://doi.org/10.1002/adfm.77563","title":"Breaking the Passivation‐Band‐Alignment Trade‐Off in PbS Colloidal Quantum Dot Photodiodes via Gradient Doping","title_zh":"通过梯度掺杂打破 PbS 胶体量子点光电二极管中钝化与能带对齐的权衡","title_key":"breakingthepassivationbandalignmenttradeoffinpbscolloidalquantumdotphotodiodesviagradientdoping","authors":["Luna Xiao","Shuai Zou","Chengjie Deng","et al."],"venue":"Advanced Functional Materials","issn_l":"1616-301X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-06","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":"ABSTRACT Solution‐processed PbS colloidal quantum dots (CQDs) are promising materials for short‐wave infrared (SWIR) photodetection, yet extending the response to longer wavelengths is commonly accompanied by more severe surface trapping and unfavorable band alignment, which together limit carrier extraction and device sensitivity. Here, we report a post‐deposition gradient doping strategy based on antimony trifluoride (SbF 3 ) to simultaneously address these two bottlenecks in 1650 nm PbS CQD photodiodes. The SbF 3 treatment creates a depth‐dependent n ‐type doping profile in the halide‐passivated CQD film, while F − coordination with undercoordinated Pb 2+ sites suppresses deep surface trap states and nonradiative recombination. Meanwhile, the resulting graded electronic structure reduces the conduction‐band offset at the CQD/electron‐transport‐layer interface and establishes a more favorable quasi‐type‐II junction for electron extraction. As a result, the optimized p‐i‐n photodiodes deliver an external quantum efficiency (EQE) of 56.5% at 1650 nm under zero bias, a low dark current density of 31 nA cm −2 at −0.1 V, and a specific detectivity ( D *) of 5.62 × 10 11 Jones. Furthermore, monolithic integration with a complementary metal‐oxide‐semiconductor (CMOS) readout integrated circuit enables high‐contrast SWIR imaging. This work offers an effective route to simultaneously regulate surface chemistry and junction energetics, providing a practical design strategy for high‐performance long‐wavelength CQD optoelectronics.","abstract_hash":"c79abf472e5ee176359cf839de42ae729ef449e66b914aa43082df3e6db6d0e8","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":4,"novelty_reason":"用一种后处理同时解决表面钝化与能带对齐两个瓶颈，思路明确且给出 1650 nm 下 EQE、暗电流、比探测率的具体指标和 CMOS 成像验证，属于有新策略并带来显著性能提升的工作。","innovation_zh":"针对 1650 nm PbS 胶体量子点光电二极管中长波响应伴随的表面陷阱加剧与能带对齐变差这一对矛盾，作者用三氟化锑（SbF3）做后沉积处理，在卤化物钝化的量子点膜中同时实现深度依赖的 n 型梯度掺杂和 F− 对欠配位 Pb2+ 的配位钝化，从而在不牺牲钝化的前提下改善电子提取。器件在零偏压下 1650 nm 处 EQE 达 56.5%，−0.1 V 下暗电流密度 31 nA cm−2，比探测率 5.62 × 10^11 Jones，并实现了与 CMOS 读出电路的单片集成 SWIR 成像。","method_zh":"在卤化物钝化的 PbS 量子点膜上做 SbF3 后沉积处理，形成深度依赖的 n 型掺杂梯度，同时 F− 配位钝化欠配位 Pb2+ 位点；梯度电子结构降低了量子点/电子传输层界面的导带偏移，形成更有利于电子提取的准 II 型结，最终构建 p-i-n 光电二极管。","keywords_zh":["PbS 胶体量子点","梯度掺杂","短波红外光电探测","SbF3 钝化","比探测率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:40.271Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adma.74535","doi":"10.1002/adma.74535","doi_url":"https://doi.org/10.1002/adma.74535","title":"Hydrogen‐Bond Mediated Synthesis of Conductive Quantum Dots for All‐Ink Optoelectronic Devices","title_zh":"氢键介导合成导电量子点用于全墨水光电器件","title_key":"hydrogenbondmediatedsynthesisofconductivequantumdotsforallinkoptoelectronicdevices","authors":["Chao Wang","Yinglin Wang","Hao Li","et al."],"venue":"Advanced Materials","issn_l":"0935-9648","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-06","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Short‐chain molecular ligands (SMLs) are favored for producing colloidal quantum dot (CQD) inks for solution‐processed optoelectronics, since they enable more efficient charge transport than conventional long‐chain ligands. However, their weak steric or electrostatic stabilization makes CQD inks vulnerable to aggregation or coalescence. To overcome this challenge, here we report a hydrogen‐bond‐mediated strategy for preparing SML‐capped CQD inks with excellent colloidal stability and solution processibility. Through theoretical and experimental evaluation of hydrogen‐bond strengths across polar organic solvents and small thiol molecules, we identify 1‐thioglycerol (TG) in dimethylsulfoxide (DMSO) as an optimal pair. This combination enables one‐step synthesis of CQDs of binary, ternary, and quaternary metal sulfide under ambient conditions, while strong ligand‐solvent hydrogen bonding ensures robust colloidal stability. Optoelectronic devices fabricated by stacking these p‐type PbS CQDs on n‐type PbS CQDs achieve a record power conversion efficiency of 12.2% solar cells in all‐ink‐processed devices and an enhanced detectivity of 9.4 × 10 11 Jones in near‐infrared photodetectors. This hydrogen‐bond‐mediated approach demonstrates a straightforward and cost‐effective route to produce p‐type PbS CQD conductive inks, holding great promise for advancing all‐ink scalable‐manufacturing optoelectronic devices.","abstract_hash":"e46d6ebe6bc71b3bf2fcfdc1fc2323a4cfd067a7759ee728a785bde560d8778f","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials","display"],"novelty_score":4,"novelty_reason":"用配体-溶剂氢键这一明确的新策略解决短链配体墨水稳定性难题，并在全墨水器件上刷新了效率与探测率纪录。","innovation_zh":"针对短链配体（SML）稳定的胶体量子点墨水容易团聚、聚并的问题，作者提出用氢键介导的策略来兼顾短链配体的电荷传输优势和胶体稳定性。通过理论加实验系统比较极性有机溶剂与小分子硫醇之间的氢键强度，筛出 1-硫代甘油（TG）/二甲基亚砜（DMSO）这一最优组合，在环境条件下一步合成二元、三元、四元金属硫化物量子点。用该墨水把 p 型 PbS 量子点叠在 n 型 PbS 量子点上，全墨水加工太阳能电池拿到 12.2% 的纪录效率，近红外探测器探测率达到 9.4 × 10^11 Jones。","method_zh":"以氢键强度为筛选依据，在极性溶剂/小分子硫醇体系中选出 TG-DMSO 配对，一步法在空气中合成短链配体包覆的金属硫化物量子点墨水，并构建 p-PbS/n-PbS 叠层器件。","keywords_zh":["胶体量子点墨水","短链配体","氢键","PbS","全溶液加工"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:40.723Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/jacs.6c09034","doi":"10.1021/jacs.6c09034","doi_url":"https://doi.org/10.1021/jacs.6c09034","title":"Core/Shell HgCdTe/HgCdSe Quantum Dots for Wave Function Engineering with Infrared Band Gaps","title_zh":"用于红外带隙波函数工程的核/壳 HgCdTe/HgCdSe 量子点","title_key":"coreshellhgcdtehgcdsequantumdotsforwavefunctionengineeringwithinfraredbandgaps","authors":["Wonseok Lee","Erick I. Hernandez Alvarez","Madeleine J. Fort","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-06","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Semiconductor quantum dots (QDs) are a class of nanomaterials with tunable electronic structure that enables precise control of light-matter interactions for diverse optoelectronic applications. Mercury cadmium chalcogenides are an emerging QD composition for infrared photonic applications, and their heterostructures are expected to expand functionality. Here, we introduce core/shell HgCdTe/HgCdSe QDs with bandgap energies in the infrared and charge carrier wave functions controlled by domain dimensions and the radial distribution of mercury and cadmium. As prepared via mercury cation exchange of core/shell CdTe/CdSe QDs, mercury can be selectively concentrated in either the core or shell, and can fully deplete cadmium to generate HgTe/HgSe QDs. Different alloying regimes shift band offsets between type-I and type-II alignments, in which the electron and hole are colocalized or separated, respectively. Broad bandgap tunability across the infrared spectra with long-term stability in air addresses problems of the constituent QD homostructures of HgTe and HgCdTe with low chemical stability and HgSe and HgCdSe with n-type doping. The photophysical features and oscillator strengths are reported as figures of merit and compared with quantum mechanical calculations. An optical metrology method based on ultraviolet E1 critical-point features is also introduced for assaying cation distributions, which is otherwise difficult in small core/shell QDs. These small-bandgap QDs with controllable charge carrier wave functions offer new opportunities to investigate photoluminescence, excited-state photophysics, and light-matter interactions at infrared wavelengths.","abstract_hash":"09eb8a59e8c53e3cc75539d7e88ecaae78e24a042214c75c8650635dbd1128d1","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"用汞阳离子交换在核/壳结构中实现 Hg/Cd 径向分布与 type-I/type-II 能带对齐的可控切换，并兼顾红外带隙可调与空气稳定性，属于明确的新结构新策略。","innovation_zh":"作者做出了带隙落在红外、且电子/空穴波函数可由域尺寸和 Hg/Cd 径向分布调控的核/壳 HgCdTe/HgCdSe 量子点。做法是对 CdTe/CdSe 核/壳量子点做汞阳离子交换，汞可以选择性富集在核或壳中，也能把镉完全置换得到 HgTe/HgSe 量子点；不同合金化程度让能带偏移在 type-I（电子空穴共局域）和 type-II（电子空穴分离）之间切换。这解决了 HgTe、HgCdTe 同质结构化学稳定性差以及 HgSe、HgCdSe 呈 n 型掺杂的问题，实现了红外波段宽带隙可调且空气中长期稳定，并给出振子强度等光物理指标与量子力学计算的对比。","method_zh":"以 CdTe/CdSe 核/壳量子点为模板进行汞阳离子交换，通过控制汞在核/壳中的径向分布和合金化程度来调节带隙与能带对齐；同时引入基于紫外 E1 临界点特征的光学计量方法来表征小尺寸核/壳量子点中的阳离子分布。","keywords_zh":["HgCdTe/HgCdSe","核壳量子点","阳离子交换","红外带隙","波函数工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:41.602Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/1361-6463/ae961f","doi":"10.1088/1361-6463/ae961f","doi_url":"https://doi.org/10.1088/1361-6463/ae961f","title":"On-wafer characterisation of 1300 nm InAs quantum dot laser uniformity over 150 mm substrates","title_zh":"150 mm 衬底上 1300 nm InAs 量子点激光器的晶圆级均匀性表征","title_key":"onwafercharacterisationof1300nminasquantumdotlaseruniformityover150mmsubstrates","authors":["Craig P. Allford","A R Smith","Sara-Jayne Gillgrass","et al."],"venue":"Journal of Physics D Applied Physics","issn_l":"0022-3727","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-06","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Abstract We report wafer scale characterisation of O-band 150 mm InAs quantum dot edge-emitting lasers, using on-wafer measurements of etched-facet lasers. Threshold current, lasing wavelength, and spontaneous emission spectra were mapped across the wafer and compared with post-growth photoluminescence (PL) peak emission wavelength and full-width half-maximum (FWHM) to evaluate device performance and uniformity. Strong correlation is observed between the post-growth PL data and the on-wafer laser characteristics. Pearson correlation coefficients of 0.93 were calculated between both PL peak emission wavelength and peak lasing wavelength, and PL peak emission wavelength and peak spontaneous emission wavelength. A coefficient of 0.56 was found between PL FWHM and threshold current. Together, these indicate excellent fabrication uniformity and demonstrate that device performance is strongly correlated with variations in the epitaxial growth. The PL peak emission wavelength and FWHM were 1281.70 nm and 57.90 nm with standard deviations of 1.00 nm and 1.62 nm, respectively. The low fabrication variability enables a lasing yield of 98.2 % (of lasers with thresholds below the maximum current used during characterisation of 1.5 A) for a population of 1152 devices with a 2000 µm cavity length. By combining on-wafer etched-facet measurements with post singulation measurements on both cleaved-facet lasers alongside gain and absorption measurements from the segmented-contact method, the etched-facet reflectivity at 6 mm from the wafers centre was extracted to be 0.074 ± 0.003. Additional investigation indicates that the sub-optimal etched-facet reflectivity is likely due to off-vertical angled facets, measured at 81.8 ∘ relative to the wafer surface, which increases mirror losses, raising the threshold current and reducing yield for shorter cavity devices due to the higher gain requirement. Overall, the spatial uniformity of the facet reflectivity demonstrates that on-wafer etched-facet test structures provide a robust platform for diagnosing epitaxial and fabrication variations without the need for extensive wafer cleaving.","abstract_hash":"81b0050bfbfa5696e1f5248b0fe8c1b4045118410edc564eeda36e93911786ff","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"属于把已有的片上刻蚀面测试方法系统用于 150 mm 量子点激光器晶圆级均匀性诊断，给出了具体的相关性、良率和反射率数据，但方法和器件体系本身没有本质突破。","innovation_zh":"这篇工作把刻蚀解理面（etched-facet）激光器的片上测试做成了一套晶圆级均匀性诊断平台，在 150 mm 衬底上对 O 波段 InAs 量子点边发射激光器的阈值电流、激射波长和自发发射谱做面分布 mapping，并与外延后的 PL 峰位和 FWHM 对照。结果显示 PL 峰位与激射峰位、PL 峰位与自发发射峰位的 Pearson 相关系数都达到 0.93，PL FWHM 与阈值电流的相关系数为 0.56，说明器件性能的起伏主要由外延生长决定。PL 峰位 1281.70 nm、FWHM 57.90 nm，标准差分别只有 1.00 nm 和 1.62 nm；1152 个 2000 µm 腔长器件中，阈值低于 1.5 A 的激射良率达到 98.2%。他们还用片上刻蚀面测试结合解理面器件的后分割测试以及分段接触法测得的增益与吸收，提取出距晶圆中心 6 mm 处刻蚀面反射率为 0.074 ± 0.003，并指出反射率偏低很可能来自偏离垂直方向的端面（相对晶圆表面 81.8°），这会增大镜面损耗，使短腔器件因需要更高增益而阈值升高、良率下降。","method_zh":"在 150 mm 衬底上制备刻蚀解理面的 InAs 量子点边发射激光器，做片上阈值电流、激射波长与自发发射谱的晶圆级 mapping，并与外延后 PL 峰位/FWHM 做相关性分析；同时结合解理面激光器的后分割测试和分段接触法增益/吸收测量来提取刻蚀面反射率。","keywords_zh":["InAs 量子点激光器","晶圆级均匀性","刻蚀解理面","O 波段","端面反射率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:43.037Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.cej.2026.180414","doi":"10.1016/j.cej.2026.180414","doi_url":"https://doi.org/10.1016/j.cej.2026.180414","title":"Transitioning charge transport regimes in ZnMgO via phenylphosphonic acid passivation for highly stable InP quantum dot light-emitting diodes","title_zh":"通过苯基膦酸钝化调控 ZnMgO 中的电荷传输机制以实现高稳定性 InP 量子点发光二极管","title_key":"transitioningchargetransportregimesinznmgoviaphenylphosphonicacidpassivationforhighlystableinpquantumdotlightemittingdiodes","authors":["Beomhee Yoon","Jinsu Park","Wan Ki Bae","et al."],"venue":"Chemical Engineering Journal","issn_l":"1385-8947","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-06","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-06","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确定具体方法与器件结构。","keywords_zh":["InP 量子点","ZnMgO","苯基膦酸钝化","电荷传输","QLED 稳定性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:41.573Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsnanoscienceau.5c00198","doi":"10.1021/acsnanoscienceau.5c00198","doi_url":"https://doi.org/10.1021/acsnanoscienceau.5c00198","title":"Universal Computational Super-Resolution Framework for Imaging of Quantum Dots","title_zh":"面向量子点成像的通用计算超分辨框架","title_key":"universalcomputationalsuperresolutionframeworkforimagingofquantumdots","authors":["Dominik Vašinka","Jae‐Won Lee","Charlie Stalker","et al."],"venue":"ACS Nanoscience Au","issn_l":"2694-2496","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-05","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-05","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Abstract We present a universal deep learning method that reconstructs super-resolved images of quantum emitters from a single camera frame measurement. Trained on physics-based synthetic data spanning diverse point-spread functions, aberrations, and noise, the network generalizes across experimental conditions without system-specific retraining. We validate the approach on low- and high-density In(Ga)As quantum dots and strain-induced dots in 2D monolayer WSe2, resolving overlapping emitters even under low signal-to-noise ratios and inhomogeneous backgrounds. By eliminating calibration and iterative acquisitions, this single-shot strategy enables rapid, robust computational super-resolution for nanoscale characterization and quantum-photonic device fabrication.","abstract_hash":"8f560da48055a486c7928f6f54d1ed7d154631a3e60e5898cac37497ba79aaa7","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","quantuminfo","materials"],"novelty_score":4,"novelty_reason":"提出通用单帧计算超分辨框架，靠物理合成数据训练实现跨系统泛化，省去标定与迭代采集，并在多种量子点体系上验证。","innovation_zh":"作者提出一种通用的深度学习超分辨方法，能从单帧相机图像重建量子发射体的超分辨图像。网络完全在基于物理的合成数据上训练，覆盖多种点扩散函数、像差和噪声条件，因此无需针对具体系统重新训练即可跨实验条件泛化。在低密度和高密度 In(Ga)As 量子点以及 2D 单层 WSe2 中的应变诱导量子点上做了验证，能在低信噪比和非均匀背景下分辨重叠的发射体。相比传统方法省去了标定和迭代采集，实现了单帧、快速、鲁棒的计算超分辨。","method_zh":"用基于物理的合成数据（涵盖不同 PSF、像差与噪声）训练一个深度学习网络，从单帧相机图像直接重建量子发射体的超分辨图像，无需系统特定重训练或迭代采集。","keywords_zh":["计算超分辨","量子点成像","深度学习","单帧重建","In(Ga)As 量子点"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:43.054Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsnano.6c08297","doi":"10.1021/acsnano.6c08297","doi_url":"https://doi.org/10.1021/acsnano.6c08297","title":"Dopant-Directed Surface Energy Modulation for Controlled Growth and Color-Tunable Photoluminescence in Cu+-Doped Two-Dimensional CdSe Nanoplatelets","title_zh":"掺杂剂导向的表面能调控用于控制生长及颜色可调的 Cu+ 掺杂二维 CdSe 纳米片发光","title_key":"dopantdirectedsurfaceenergymodulationforcontrolledgrowthandcolortunablephotoluminescenceincudopedtwodimensionalcdsenanoplatelets","authors":["Vanshika Vanshika","Sara Talebi","Joshua Wright","et al."],"venue":"ACS Nano","issn_l":"1936-0851","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-05","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-05","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Two-dimensional (2D) semiconductor nanoplatelets (NPLs) are promising building blocks for optoelectronic applications due to their strong 1D quantum confinement and large lateral dimensions. While the growth mechanisms of pristine CdSe NPLs have been extensively studied, the influence of transition-metal dopants on 2D NPL growth remains poorly understood. Here, we investigate the growth behavior of Cu+-doped CdSe NPLs synthesized via a nucleation-doping colloidal approach. The introduction of Cu+ induces a dopant-modulated three-stage growth process. At 230 °C, Cu+ dopants initially decelerate NPL growth, stabilizing 2-monolayer (ML) CdSe NPLs in stage I. In stage II, these 2 ML NPLs undergo a dissolution-ripening process, ultimately leading to the formation of 3 ML NPLs in stage III. The resulting Cu-doped CdSe NPLs exhibit color-tunable photoluminescence (PL) arising from both the CdSe host excitonic emission (∼390-465 nm) and a broad, Stokes-shifted Cu+ dopant emission (∼520-640 nm), enabled by thickness-dependent bandgap modulation. This dopant-directed three-stage growth behavior is also observed in thicker Cu:CdSe NPLs (e.g., 4 ML). Theoretical simulations reveal that Cu+ doping increases the relative surface stabilization energy, stabilizing thinner NPLs and delaying the transition to thicker structures. This dopant-driven control over 2D NPL growth offers opportunities for engineering color-tunable and dopant-emissive optoelectronic materials.","abstract_hash":"2f51aa8e47b5d9048ccdb99bc1444a4b7e719e0197352fae727a3115c774a185","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"首次系统揭示过渡金属掺杂剂对二维纳米片生长的三阶段调控机制，并用表面能模拟给出解释，同时实现双通道颜色可调发光。","innovation_zh":"研究了 Cu+ 掺杂对二维 CdSe 纳米片生长行为的影响，发现 Cu+ 引入会诱导出一个三阶段生长过程：230 °C 下 Cu+ 先抑制生长、稳定 2 单层（ML）纳米片，随后 2 ML 纳米片经历溶解-熟化，最终形成 3 ML 纳米片。理论模拟表明 Cu+ 掺杂提高了相对表面稳定能，从而稳定更薄的纳米片并推迟向更厚结构的转变。所得 Cu 掺杂 CdSe 纳米片同时具有 CdSe 主激子发光（约 390–465 nm）和宽、Stokes 位移的 Cu+ 掺杂发光（约 520–640 nm），实现颜色可调发光；该三阶段生长行为在更厚的 4 ML Cu:CdSe 纳米片中也存在。","method_zh":"采用成核掺杂的胶体法合成 Cu+ 掺杂 CdSe 纳米片，通过变温（如 230 °C）生长跟踪与理论模拟分析表面稳定能变化，并结合发光光谱表征其激子与掺杂发光。","keywords_zh":["Cu+ 掺杂","CdSe 纳米片","表面能调控","三阶段生长","颜色可调发光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:44.245Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/smll.74950","doi":"10.1002/smll.74950","doi_url":"https://doi.org/10.1002/smll.74950","title":"Enhancing the Performance of Green Quantum Dot Light‐Emitting Diodes Through an Efficient Förster Resonance Energy Transfer Based Exciton Recycling Strategy","title_zh":"通过高效 Förster 共振能量转移激子回收策略提升绿光量子点发光二极管性能","title_key":"enhancingtheperformanceofgreenquantumdotlightemittingdiodesthroughanefficientforsterresonanceenergytransferbasedexcitonrecyclingstrategy","authors":["Yi Zhang","Changfeng Han","Zhijun Wu","et al."],"venue":"Small","issn_l":"1613-6810","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-05","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-05","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Aiming at the issue of unbalanced carrier injection in conventional quantum dot light‐emitting diodes (QLEDs), this study adopts a solution based on Förster Resonance Energy Transfer (FRET). However, the limited fluorescence lifetime of existing FRET donor materials restricts the efficiency of this strategy in green QLEDs. To address this problem, this study employs the thermally activated delayed fluorescence (TADF) material bis[4‐(9,9‐dimethyl‐9,10‐dihydroacridine)phenyl]methanone (DMAC‐BP) with a long emission lifetime as an exciton sensitization layer, which is embedded as a thin film between the hole transport layer and the quantum dot emission layer. This structural design significantly enhances the FRET efficiency to 77.29%, thus efficiently transferring excitons to the quantum dot emission layer. On this basis, the fabricated green QLEDs achieve a maximum external quantum efficiency (EQE) of 20.21% and a maximum current efficiency (CE) of 90.59 cd/A, representing improvements of approximately 38% compared to reference devices without a sensitizing layer. Meanwhile, the device lifetime (T 80 ) was extended to 5 times that of the standard device. This work not only verifies the advantages of TADF materials in addressing the FRET efficiency problem of green QLEDs, but also pioneers a new practical pathway for the development of high‐performance and long‐lifetime QLEDs.","abstract_hash":"7d2c95d4c826cbec6ad82218b443448475935b9c1b27cd6e219f4670e6db6470","abstract_source":"openalex","abstract_missing":false,"directions":["display"],"novelty_score":4,"novelty_reason":"用 TADF 敏化层解决 FRET 给体寿命限制的思路明确，且 EQE 与寿命同时获得显著提升，但属于已有 FRET 策略在新材料体系上的优化而非全新机制。","innovation_zh":"针对常规 QLED 载流子注入不平衡的问题，作者用长发光寿命的 TADF 材料 DMAC-BP 做激子敏化层，插在空穴传输层和量子点发光层之间，把 FRET 效率提到 77.29%，从而把激子高效转移到量子点层。绿光 QLED 的最大 EQE 达 20.21%、最大电流效率 90.59 cd/A，比无敏化层的参考器件提升约 38%，同时 T80 寿命延长到标准器件的 5 倍。核心新意在于用 TADF 替代传统短寿命 FRET 给体，缓解了 FRET 效率受限于给体荧光寿命的问题。","method_zh":"在空穴传输层与量子点发光层之间嵌入一层 TADF 材料 DMAC-BP 作为激子敏化层，通过 FRET 将激子转移至量子点发光层，并与无敏化层的参考器件对比。","keywords_zh":["量子点发光二极管","Förster 共振能量转移","热活化延迟荧光","激子敏化","绿光 QLED"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:44.361Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1103/b358-1776","doi":"10.1103/b358-1776","doi_url":"https://doi.org/10.1103/b358-1776","title":"Scaling laws of electron and hole spin relaxation in indirect band gap (In,Al)As/AlAs quantum dots","title_zh":"间接带隙 (In,Al)As/AlAs 量子点中电子与空穴自旋弛豫的标度律","title_key":"scalinglawsofelectronandholespinrelaxationinindirectbandgapinalasalasquantumdots","authors":["Т. С. Шамирзаев","Dmitri R. Yakovlev","Dmitry S. Smirnov","et al."],"venue":"Physical review. B./Physical review. B","issn_l":"2469-9950","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-04","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-04","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["quantuminfo","materials"],"novelty_score":1,"novelty_reason":"无摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["量子点","自旋弛豫","间接带隙","InAlAs/AlAs","标度律"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:44.096Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1103/9nj2-4hb1","doi":"10.1103/9nj2-4hb1","doi_url":"https://doi.org/10.1103/9nj2-4hb1","title":"Confinement-dependent exciton and biexciton dynamics in bright band-gap-emitting AgInS 2 quantum dots","title_zh":"AgInS2 量子点中受限依赖的激子与双激子动力学：带隙发光样品","title_key":"confinementdependentexcitonandbiexcitondynamicsinbrightbandgapemittingagins2quantumdots","authors":["Anonymous","Johannes Kunze","Nivedita Pan","et al."],"venue":"Physical review. B./Physical review. B","issn_l":"2469-9950","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-04","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-04","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"I-III-VI quantum dots are potential candidates for light-emitting and light-harvesting applications due to their heavy-metal–free composition and chemical tunability. Despite their potential, the investigation of intrinsic exciton and excitonic many-body dynamics has often been complicated because of their extensive defect energy landscape. Here, we investigate bright band-gap-emitting AgInS 2 quantum dots of sizes ranging from ∼ 4 to 7 nm using femtosecond pump-probe spectroscopy to link quantum confinement to exciton formation and many-body interactions. The exciton formation time is governed by inter-valence-band hole relaxation. This increases by more than a factor of 4 with decreasing quantum dot size, reflecting size-dependent exciton-phonon scattering efficiency. By temporally correlating hole relaxation with induced absorption dynamics, we identify different exciton-to-biexciton transitions originating from different exciton states. Excitation-fluence-dependent measurements reveal a biexciton decay time that scales with the quantum dot volume. Smaller quantum dots show fast decay of \u003c100 ps, primarily governed by exciton-exciton annihilation. In larger quantum dots, the biexciton lifetime exceeds 400 ps, indicating reduced annihilation efficiency. Complementary streak-camera photoluminescence experiments provide direct spectroscopic evidence that these long-lived biexcitons are partially emissive. Collectively, we report an in-depth ultrafast-optical study yielding fundamental insights into the complex landscape of exciton formation and biexciton physics, which advances the understanding of intrinsic optical processes in AgInS 2 quantum dots among I-III-VI materials.","abstract_hash":"dbdaa5f661f2f29aa6dd656bac34274a7fdf17f563d155f6bd7d2ab5b0e67187","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","detection"],"novelty_score":4,"novelty_reason":"在缺陷背景通常淹没本征信号的 I-III-VI 体系中拿到带隙发光样品，并定量关联受限尺寸与激子形成、双激子寿命及湮灭效率，给出了明确的新实验关联。","innovation_zh":"针对 I-III-VI 量子点因缺陷能级复杂而难以研究本征激子动力学的问题，作者用飞秒泵浦-探测光谱研究了尺寸 4–7 nm 的带隙发光 AgInS2 量子点，把量子受限与激子形成、多体相互作用直接关联起来。激子形成时间由价带间空穴弛豫主导，随量子点尺寸减小增加超过 4 倍，反映激子-声子散射效率的尺寸依赖；通过将空穴弛豫与诱导吸收动力学在时间上关联，区分出来自不同激子态的激子-双激子跃迁。双激子寿命随量子点体积标度：小尺寸量子点双激子快速衰减（\u003c100 ps，主要由激子-激子湮灭主导），大尺寸量子点超过 400 ps，湮灭效率降低；条纹相机荧光实验进一步给出这些长寿命双激子部分发光的直接光谱证据。","method_zh":"对 4–7 nm 尺寸系列的带隙发光 AgInS2 量子点做飞秒泵浦-探测光谱，结合激发注量依赖测量与条纹相机荧光光谱，将空穴弛豫动力学与诱导吸收信号在时间上关联。","keywords_zh":["AgInS2 量子点","激子动力学","双激子","激子-激子湮灭","飞秒泵浦-探测"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:46.338Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1117/1.oe.65.8.087101","doi":"10.1117/1.oe.65.8.087101","doi_url":"https://doi.org/10.1117/1.oe.65.8.087101","title":"Synthesis of high-quantum yield RGB quantum dots and their application for patterned film","title_zh":"高量子产率RGB量子点的合成及其图案化薄膜应用","title_key":"synthesisofhighquantumyieldrgbquantumdotsandtheirapplicationforpatternedfilm","authors":["Bozheng Wu","Feng Li","Yuanfan Zhang","et al."],"venue":"Optical Engineering","issn_l":"0091-3286","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-04","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-04","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Quantum dots (QDs) have emerged as promising materials for next-generation display technologies due to their excellent photoluminescent properties, but improving their photoluminescence quantum yield (PL QY) and colloidal stability while realizing precise patterning remains a key challenge. In this work, we propose a core-shell engineering strategy combined with microinjection technology to optimize the performance of alloy QDs. Specifically, ZnSe and ZnSeS shell layers were grown on CdZnSe core QDs, and a ZnS shell layer was deposited on CdZnS core QDs. We successfully synthesized red, green, and blue (RGB) alloyed core-shell QDs with high-PL QYs of 97.6%, 88.7%, and 77.4% for red, green, and blue QDs, respectively. On this basis, using a home-built lithography system, we further fabricated QD-patterned thin films featuring regular structures, uniform arrangements, and 100 μm submicron-scale resolution via a photoresist-free UV photolithography method that directly employs photoinitiators. Moreover, overlay alignment was successfully realized for the RGB patterned films, with reasonable registration accuracy between the stacked patterns. The luminescence properties of QD film before and after photoacid generator (PAG) incorporation and UV radiation were also investigated. We present an accessible photopatterning strategy using a triazine-based PAG to achieve high-quality QD films with preserved PLQY, which can serve as a methodological reference for QD patterning independent of device fabrication capabilities. These achievements thus demonstrate a bright prospect for the application of patterned QD films in next-generation displays.","abstract_hash":"9f22ef87df121243225dd1bc832514ff73cda79bc931d7bd052872fa5fde775f","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"核壳工程与无光刻胶光刻均属已有思路的组合与优化，PL QY数值较高但未见新机制或器件级突破。","innovation_zh":"针对量子点在高PL QY、胶体稳定性与精细图案化之间难以兼顾的问题，作者用核壳工程在CdZnSe核上生长ZnSe/ZnSeS壳、在CdZnS核上沉积ZnS壳，得到红绿蓝合金核壳量子点，PL QY分别达到97.6%、88.7%和77.4%。图案化方面，他们用自建光刻系统，以三嗪类光酸产生剂配合无光刻胶的紫外光刻方法，做出100 μm分辨率、排列规整的QD薄膜，并实现了RGB多层图案的套刻对准。","method_zh":"核壳结构设计（CdZnSe/ZnSe/ZnSeS与CdZnS/ZnS）结合微注射技术合成RGB合金量子点；图案化采用直接使用光引发剂的无光刻胶UV光刻，并考察了PAG引入与UV辐照前后薄膜的发光性质。","keywords_zh":["量子点","核壳结构","光致发光量子产率","光刻图案化","RGB显示"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:46.900Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/lpor.71699","doi":"10.1002/lpor.71699","doi_url":"https://doi.org/10.1002/lpor.71699","title":"Room‐Temperature Cation‐Exchange Synthesis of PbS Colloidal Quantum Dots in Polar‐Solvent for High‐Performance Near Infrared Optoelectronic Devices","title_zh":"极性溶剂中室温阳离子交换合成PbS胶体量子点用于高性能近红外光电器件","title_key":"roomtemperaturecationexchangesynthesisofpbscolloidalquantumdotsinpolarsolventforhighperformancenearinfraredoptoelectronicdevices","authors":["Ke-Lei Zu","Hai-Liang Long","Ji-Xiong Zhao","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-04","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-04","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT PbS colloidal quantum dots (CQDs) have attracted significant attention as light sources and photodetectors in the second near‐infrared (NIR‐II) window for optical communication, bioimaging, and night vision. Recently, a room‐temperature direct synthesis of PbS CQD inks has been developed, enabling low‐cost and large‐scale fabrication of QD optoelectronic devices. However, the synthesis of high‐quality large‐sized CQDs with photoluminescence (PL) peaks beyond 1550 nm remains challenging. In this work, we developed a novel room‐temperature cation‐exchange synthesis strategy in a polar solvent system. Distinct from existing approaches, the strategy employs ZnS nanoseeds as the sulfur precursor, enabling tunable PL peaks in the range of 1050–1650 nm by precisely controlling the reaction kinetics. The in situ passivation by Zn cations and acetate anions effectively reduces surface defects on the nonpolar (100) facets. Based on this strategy, we fabricated near‐infrared II (NIR‐II) light‐emitting diodes (LEDs) exhibiting a maximum radiance of 22.15 W sr −1 m −2 , together with a record‐breaking critical current density for external quantum efficiency (EQE) roll‐off ( J 1/2EQE = 3.4 A cm −2 ). Furthermore, NIR‐II photodetectors demonstrate a high photoresponsivity of 0.68 A W −1 and a specific detectivity of 1.12 × 10 11 Jones at 1490 nm.","abstract_hash":"16006667a2ab32df0cfee96baf2b099464969c1fd3f4380438ed5344042416b6","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"用ZnS纳米晶作硫源的极性溶剂室温阳离子交换路线，把PbS CQD的PL调谐范围推到1650 nm并给出器件级验证，属于明确的新合成策略加显著性能提升，但并非全新物理机制。","innovation_zh":"针对室温直接合成PbS CQD墨水难以获得PL峰超过1550 nm的高质量大尺寸量子点这一问题，作者提出了一种极性溶剂体系下的室温阳离子交换合成策略，用ZnS纳米晶作为硫前驱体，通过控制反应动力学把PL峰在1050–1650 nm范围内调谐。Zn阳离子和乙酸根的原位钝化降低了非极性(100)面的表面缺陷。基于该材料做出的NIR-II LED最大辐亮度22.15 W sr⁻¹ m⁻²，EQE滚降临界电流密度J₁/₂EQE达到3.4 A cm⁻²（摘要称其为record-breaking）；NIR-II探测器在1490 nm下响应度0.68 A W⁻¹，比探测率1.12×10¹¹ Jones。","method_zh":"在极性溶剂中于室温进行阳离子交换反应，以ZnS纳米晶作为硫前驱体，通过反应动力学调控量子点尺寸，并借助Zn²⁺与乙酸根实现(100)面原位钝化；随后以此CQD构建NIR-II LED与光电探测器。","keywords_zh":["PbS胶体量子点","阳离子交换","室温合成","近红外II","原位钝化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:47.089Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/2050-6120/ae9453","doi":"10.1088/2050-6120/ae9453","doi_url":"https://doi.org/10.1088/2050-6120/ae9453","title":"Splitting of luminescence bands of doped quantum dot ensembles in composite with polymers on the silver islands films obtained by chemical deposition method","title_zh":"化学沉积法制备的银岛膜上掺杂量子点集合体与聚合物复合体系中发光谱带的分裂","title_key":"splittingofluminescencebandsofdopedquantumdotensemblesincompositewithpolymersonthesilverislandsfilmsobtainedbychemicaldepositionmethod","authors":["Dmitriy O. Sagdeev","Yu. G. Galyametdinov"],"venue":"Methods and Applications in Fluorescence","issn_l":"2050-6120","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-03","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"The study demonstrates significant splitting of the impurity luminescence peak of cadmium sulfide quantum dots (QDs) doped with copper and manganese ions in polymer composites on substrates with silver nanoparticles obtained by chemical deposition. The influence of polymer concentration and QD type on the splitting is studied. Our results demonstrate that the probability of splitting occurrence and the spectral separation between the peaks are governed not by the optical density of the film or the size of the silver islands, but by the inter-island distance, highlighting the critical role of spatial arrangement in the collective optical response of the system. It is hypothesized that the observed effect can be caused by coupling between the luminescent nanoparticles, which have long luminescence lifetimes, and the silver nanoislands, which act as nanoresonators.","abstract_hash":"6da7fe566f6fc898042cef6d310699377f54199fbe10d9bdc8450d4201775332","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"在掺杂量子点-银岛膜复合体系中观察到发光峰分裂并指出岛间距为主导因素，属新现象报道，但机理解释仍停留在假设层面，缺乏定量证据。","innovation_zh":"作者把掺 Cu、Mn 的 CdS 量子点与聚合物复合，铺在化学沉积得到的银纳米岛膜上，观察到杂质发光峰出现明显分裂，并系统考察了聚合物浓度和量子点类型的影响。关键发现是：分裂是否发生以及双峰间距，不由薄膜光密度或银岛尺寸决定，而由岛间距决定，说明空间排布在集体光学响应中起主导作用。作者据此提出该效应可能源于长发光寿命的量子点与作为纳米谐振器的银岛之间的耦合。","method_zh":"化学沉积法制备银纳米岛膜，其上构筑掺杂 Cu/Mn 的 CdS 量子点-聚合物复合薄膜，通过改变聚合物浓度和量子点类型做发光光谱对比，并关联银岛间距等形貌参数。","keywords_zh":["银纳米岛膜","掺杂量子点","发光峰分裂","等离激元耦合","聚合物复合"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:47.017Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s00542-026-06121-1","doi":"10.1007/s00542-026-06121-1","doi_url":"https://doi.org/10.1007/s00542-026-06121-1","title":"Optical field analysis of CdSe based quantum dot LEDs towards fluorescent biosensing applications","title_zh":"面向荧光生物传感应用的 CdSe 基量子点 LED 光场分析","title_key":"opticalfieldanalysisofcdsebasedquantumdotledstowardsfluorescentbiosensingapplications","authors":["K M Manjuvani","B M Chaya","P. V. Aakansha","et al."],"venue":"Microsystem Technologies","issn_l":"0946-7076","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-03","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display","detection"],"novelty_score":1,"novelty_reason":"无摘要信息，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["CdSe 量子点","量子点 LED","光场分析","荧光生物传感"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:47.501Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpclett.6c01945","doi":"10.1021/acs.jpclett.6c01945","doi_url":"https://doi.org/10.1021/acs.jpclett.6c01945","title":"Charge Carrier Dynamics in 6 nm CsPbBr3–Pb4S3Br2 Heterostructured Quantum Dots","title_zh":"6 nm CsPbBr3–Pb4S3Br2 异质结构量子点中的载流子动力学","title_key":"chargecarrierdynamicsin6nmcspbbr3pb4s3br2heterostructuredquantumdots","authors":["Lin Zhang","Simeng Zhao","Wenxuan Wang","et al."],"venue":"The Journal of Physical Chemistry Letters","issn_l":"1948-7185","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-03","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Epitaxial CsPbBr3-Pb4S3Br2 heteronanocrystals (HNCs) with coherent interfaces are promising for wave function modulation. Herein, we synthesize 6 nm CsPbBr3-Pb4S3Br2 heterostructured quantum dots (HQDs) in a ZnBr2-stabilized Br--rich system and probe their interfacial charge transfer via steady-state absorption, photoluminescence (PL), time-resolved PL (TRPL) and transient absorption spectroscopy (TAS). Relative to pure CsPbBr3 QDs, the 6 nm HQDs show PL quenching and faster ground-state bleaching (GSB) recovery. Reducing size from 15 nm HNCs to 6 nm HQDs induces a prominent blue shift and weakened amplitude of the GSB signal of Pb4S3Br2 domain, verifying efficient charge carrier spatial separation: electrons are distributed in the CsPbBr3 domain while holes accumulate in the Pb4S3Br2 domain. Benefiting from such separation, photoconductive devices based on 6 nm HQDs achieve photocurrent 3 orders of magnitude higher than pure CsPbBr3 QD devices. This study expands the regulation strategies for CsPbBr3-Pb4S3Br2 heterostructures beyond facet and morphology control.","abstract_hash":"c31ee4b8419b1c4e165d123b55fe7ff0f7c3ea6aed306fb871691f76d1274d07","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":4,"novelty_reason":"把 CsPbBr3-Pb4S3Br2 异质结的调控从晶面/形貌拓展到量子点尺寸，并给出载流子空间分离的直接光谱证据和 3 个数量级的光电流提升。","innovation_zh":"在 ZnBr2 稳定的富 Br- 体系中合成出 6 nm 的 CsPbBr3-Pb4S3Br2 异质结构量子点（HQDs），把此前主要在 15 nm 异质纳米晶上做的界面调控推进到量子点尺寸区间。通过稳态吸收、PL、TRPL 和瞬态吸收发现，尺寸从 15 nm 降到 6 nm 时 Pb4S3Br2 域的基态漂白信号明显蓝移且幅度减弱，说明电子主要分布在 CsPbBr3 域、空穴聚集在 Pb4S3Br2 域，实现了有效的载流子空间分离。基于该 6 nm HQDs 的光导器件光电流比纯 CsPbBr3 QD 器件高 3 个数量级。","method_zh":"在 ZnBr2 稳定的富 Br- 体系中合成 6 nm CsPbBr3-Pb4S3Br2 异质结构量子点，并用稳态吸收、光致发光、时间分辨 PL 和瞬态吸收光谱表征界面电荷转移与载流子空间分布。","keywords_zh":["钙钛矿异质结构","量子点","载流子空间分离","瞬态吸收","光电导器件"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:49.575Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1063/5.0335893","doi":"10.1063/5.0335893","doi_url":"https://doi.org/10.1063/5.0335893","title":"Heterocyclic aromatic amine-modified hole transport layer enables energy level regulation for enhanced performance of deep blue QLEDs","title_zh":"杂环芳香胺修饰空穴传输层实现能级调控，提升深蓝 QLED 性能","title_key":"heterocyclicaromaticaminemodifiedholetransportlayerenablesenergylevelregulationforenhancedperformanceofdeepblueqleds","authors":["Yiheng Huang","Zhanpeng Qin","Tianhao Wang","et al."],"venue":"Applied Physics Letters","issn_l":"0003-6951","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-03","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Quantum dots (QDs) exhibit great promise for next-generation displays, yet deep blue quantum dots light-emitting diodes [deep blue QLEDs, CIE (International Commission on illumination) y \u003c 0.06] lag behind red and green counterparts due to energy level mismatches and imbalanced carrier mobility. In this work, 2-aminopyridine was employed at the interface between the hole transport layer and the emitting layer to construct stepwise energy level regulation. The mechanism was elucidated through density functional theory calculations, photophysical characterization, and surface morphology analysis. The modifier deepens the HOMO level of the hole transport layer from −5.75 to −5.97 eV and increases hole mobility from 4.08 × 10−7 to 1.56 × 10−6 cm2 V−1 s−1. The device based on the modified hole transport layer achieved a record external quantum efficiency of 23.16% in deep blue QLED (CIE y = 0.027). Interface modification demonstrates an effective approach to high-efficiency deep blue QLEDs and supports the commercialization of QLEDs.","abstract_hash":"9c0bdafd4baec08e63b69317dcb924148eb462f3062f633b0ce4e94a302863a2","abstract_source":"openalex","abstract_missing":false,"directions":["display"],"novelty_score":4,"novelty_reason":"用简单界面修饰分子同时实现 HOMO 加深与空穴迁移率提升，并在深蓝 QLED 上拿到 23.16% 的 EQE 记录。","innovation_zh":"针对深蓝 QLED（CIE y \u003c 0.06）因能级失配和载流子迁移率不平衡而落后于红绿器件的问题，作者在空穴传输层与发光层界面引入 2-氨基吡啶构建阶梯式能级调控。修饰后空穴传输层 HOMO 由 −5.75 eV 加深至 −5.97 eV，空穴迁移率从 4.08 × 10⁻⁷ 提升到 1.56 × 10⁻⁶ cm² V⁻¹ s⁻¹，器件在 CIE y = 0.027 下取得 23.16% 的外量子效率记录。","method_zh":"在空穴传输层/发光层界面引入 2-氨基吡啶做界面修饰，结合 DFT 计算、光物理表征和表面形貌分析阐明能级调控机制。","keywords_zh":["深蓝 QLED","空穴传输层","界面修饰","能级调控","2-氨基吡啶"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:52.327Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsphotonics.6c00696","doi":"10.1021/acsphotonics.6c00696","doi_url":"https://doi.org/10.1021/acsphotonics.6c00696","title":"Direct and Indirect Cascade Photon Emission of Quantum Dots in the Telecom Band","title_zh":"电信波段量子点的直接与间接级联光子发射","title_key":"directandindirectcascadephotonemissionofquantumdotsinthetelecomband","authors":["Li Liu","Weijie Ji","Shi-Chen Zhang","et al."],"venue":"ACS Photonics","issn_l":"2330-4022","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-03","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Semiconductor quantum dots (QDs) are promising sources of nonclassical light, such as single photons and entangled photon pairs for quantum information science. The performance of QD-based light sources is directly governed by the dynamics of the exciton complexes. Here, we focus on a bull’s-eye cavity-coupled QD system operating in the telecom band. By combining polarization-resolved photoluminescence, time-resolved photon correlation statistics, and rate equation analysis, we systematically investigate the cascaded emission processes of QDs. We clearly identify two distinct cascade photon emission pathways: one is a direct cascade from charged biexcitons to charged excitons, characterized by fast transition dynamics with a time scale of hundreds of picoseconds; the other is an indirect cascade involving charged excitons, charged biexcitons, and neutral excitons, governed by carrier capturing and relaxation processes on the nanosecond time scale. These findings provide a theoretical and technical foundation for designing efficient and stable telecom-band quantum emitters based on QDs, which are crucial for advancing practical photonic quantum technologies.","abstract_hash":"4eadf7bd7615e3745ffd3e0a6e8faa09282b1ac8350af854edb7fcbd27a48431","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display"],"novelty_score":4,"novelty_reason":"在电信波段腔耦合量子点中明确区分并定量刻画了两条级联发射通道及其皮秒/纳秒时间尺度，属于有新意的机制解析而非单纯性能优化。","innovation_zh":"在牛眼腔耦合的电信波段量子点体系中，作者区分出两条不同的级联发射通道：一条是带电双激子到带电激子的直接级联，时间尺度在几百皮秒；另一条是涉及带电激子、带电双激子和中性激子的间接级联，由载流子俘获与弛豫过程主导，时间尺度在纳秒量级。此前对量子点级联发射的研究多集中在可见波段，且往往只关注单一通道，这里把两条通道在同一体系中拆开并给出各自的时间尺度，为电信波段量子发射器的设计提供了依据。","method_zh":"以牛眼腔耦合的量子点为对象，结合偏振分辨光致发光、时间分辨光子关联统计和速率方程分析来解析激子复合物的级联动力学。","keywords_zh":["量子点","电信波段","级联发射","带电双激子","牛眼腔"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:49.761Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1051/epjconf/202638002019/pdf","doi":"10.1051/epjconf/202638002019/pdf","doi_url":"https://doi.org/10.1051/epjconf/202638002019/pdf","title":"Exciton Binding Energy in Finite Spherical GaAs/GaAlAs Quantum Dots under an Intense THz Laser Field","title_zh":"强THz激光场下有限球形GaAs/GaAlAs量子点中的激子束缚能","title_key":"excitonbindingenergyinfinitesphericalgaasgaalasquantumdotsunderanintensethzlaserfield","authors":["A. Ouadgui","H. Setti","L. Setti","et al."],"venue":"Springer Link (Chiba Institute of Technology)","issn_l":null,"source_type":"repository","is_preprint":true,"alt_doi":null,"pub_date":"2026-08-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-03","oa_status":"green","pdf_url":"https://www.epj-conferences.org/10.1051/epjconf/202638002019/pdf","cited_by_count":0,"abstract":"In this work, we study the ground-state binding energy of heavy-hole excitons in finite spherical GaAs/GaAlAs quantum dots at the very high terahertz laser field. The interaction with the radiation is described by a laser-dressed Coulomb potential in which the electron-hole attraction is modified by the field displacement of the charge carriers. We calculate the excitonic states in the single-band effective mass approximation using a variational method. We find that the electron and hole confinement-energy contributions are initially increasing with the laser-dressing parameter and become saturated. For all the dot radii considered, the exciton binding energy decreases and the decrease is more pronounced in larger quantum dots. Small dots tend to bind with stronger binding because we are in geometric confinement, the electron-hole wavefunction overlap is larger. The statement that the laser “attracts the exciton towards the dot center and stabilizes it” should be removed unless your calculations explicitly show this. Your results suggest that the electron-hole separation is increasing and the excitonic state weakens.","abstract_hash":"56d7b425ab385bbfa88f1137417c4c016537763da1d3cd60a6a1265562e80847","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","detection"],"novelty_score":3,"novelty_reason":"在有限深球形量子点体系中系统考察强THz场对激子束缚能的影响并修正了激光稳定激子的常见说法，但方法为已有变分法与缀饰势的常规组合。","innovation_zh":"系统计算了强THz激光场下有限深球形GaAs/GaAlAs量子点中重空穴激子的基态束缚能，发现电子和空穴的限域能贡献随激光缀饰参数先增大后饱和，而激子束缚能随激光场增强而下降，且在大尺寸量子点中下降更明显；小量子点因几何限域使电子-空穴波函数交叠更大而束缚更强。摘要明确指出激光场导致电子-空穴分离增大、激子态减弱，而非将激子拉向中心并稳定化。","method_zh":"采用单带有效质量近似，以激光缀饰库仑势描述辐射与电子-空穴吸引的相互作用，并用变分法求解激子态。","keywords_zh":["量子点","激子束缚能","THz激光场","激光缀饰势","变分法"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:49.958Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1063/5.0346048","doi":"10.1063/5.0346048","doi_url":"https://doi.org/10.1063/5.0346048","title":"Enhancing the efficiency of ZnSeTe-based quantum-dot light-emitting diodes by manipulating charge dynamics","title_zh":"通过调控电荷动力学提升 ZnSeTe 基量子点发光二极管效率","title_key":"enhancingtheefficiencyofznsetebasedquantumdotlightemittingdiodesbymanipulatingchargedynamics","authors":["Xiaoyi Zhang","Bingyan Zhu","Xiaochun Chi","et al."],"venue":"Applied Physics Letters","issn_l":"0003-6951","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-03","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-03","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"In conventional Cd-based quantum-dot light-emitting diodes (QLEDs), a reduced hole-injection barrier at the hole transport layer (HTL)–quantum-dot (QD) interface generally leads to enhanced device efficiency. However, this principle does not extend to the emerging class of environmentally friendly ZnSeTe blue QLEDs. In this work, we systematically examine the charge dynamics in ZnSeTe-based blue QLEDs, with particular focus on trap states, energy level alignment, and charge transport properties. Our findings reveal significant carrier accumulation at the ZnSeTe/ZnO interface, where emission quenching by ZnO substantially degrades device performance. To mitigate this issue, we introduce Mg-doped ZnO combined with an HTL featuring a shallow highest occupied molecular orbital level, thereby optimizing charge distribution across the device. Simulations corroborate that electrons and holes predominantly accumulate at the QD/HTL interface under this design. As a result, the efficiency of the ZnSeTe blue QLED is markedly improved, increasing from 2.1% to 6.3%. This study elucidates the critical influence of hole dynamics in ZnSeTe blue QLEDs and underscores the essential role of tailored charge management for high-performance QLED operation.","abstract_hash":"d74487a3ac98348cb189e8d9de03aba46ecea8efe763d8581015f8db4362abfa","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"指出无镉 ZnSeTe 蓝光 QLED 与 Cd 基体系相反的电荷管理逻辑，并用 Mg 掺杂 ZnO + 浅 HOMO HTL 的组合把效率从 2.1% 提到 6.3%，策略明确且提升显著。","innovation_zh":"针对无镉 ZnSeTe 蓝光 QLED 中传统「降低空穴注入势垒即提升效率」的思路失效的问题，系统分析了其电荷动力学，发现 ZnSeTe/ZnO 界面存在显著载流子积累，ZnO 对发光的淬灭严重拖累器件性能。作者用 Mg 掺杂 ZnO 电子传输层配合浅 HOMO 能级的空穴传输层来重新分配器件内电荷，模拟显示电子与空穴主要积累在 QD/HTL 界面而非 QD/ZnO 界面，从而抑制淬灭。器件效率从 2.1% 提升到 6.3%。","method_zh":"系统表征 ZnSeTe 蓝光 QLED 中的陷阱态、能级排布与电荷传输，并采用 Mg 掺杂 ZnO 作为电子传输层、搭配浅 HOMO 能级的空穴传输层，结合器件模拟验证电荷分布。","keywords_zh":["ZnSeTe 量子点","蓝光 QLED","Mg 掺杂 ZnO","电荷动力学","界面淬灭"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:52.024Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.apsusc.2026.168020","doi":"10.1016/j.apsusc.2026.168020","doi_url":"https://doi.org/10.1016/j.apsusc.2026.168020","title":"PtSe2/GeSn/InP 2D-3D heterojunction based on MBE-grown high-Sn-content GeSn film for high-responsivity broadband infrared detection via negative photoconductivity effect","title_zh":"基于 MBE 生长的高 Sn 含量 GeSn 薄膜的 PtSe2/GeSn/InP 2D-3D 异质结：利用负光电导效应实现高响应度宽带红外探测","title_key":"ptse2gesninp2d3dheterojunctionbasedonmbegrownhighsncontentgesnfilmforhighresponsivitybroadbandinfrareddetectionvianegativephotoconductivityeffect","authors":["Junfeng Yang","Jinrong Zhou","Xiaolong Jiang","et al."],"venue":"Applied Surface Science","issn_l":"0169-4332","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-08-02","pub_year":2026,"date_suspect":false,"sort_date":"2026-08-02","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"数据库未收录摘要，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，建议直接查看原文。","keywords_zh":["GeSn","PtSe2","2D-3D 异质结","红外探测","负光电导"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:53:51.203Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.mtnano.2026.100935","doi":"10.1016/j.mtnano.2026.100935","doi_url":"https://doi.org/10.1016/j.mtnano.2026.100935","title":"Anisotropic π–π stacking in hybrid polymer hole-transport layers for uniform short-wave infrared qu
