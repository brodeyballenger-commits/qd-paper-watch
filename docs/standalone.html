pcs.2026.114153","doi":"10.1016/j.jpcs.2026.114153","doi_url":"https://doi.org/10.1016/j.jpcs.2026.114153","title":"Thermally induced Mn2+ partitioning between borosilicate glass and Sb2-xMnxSe3 nanocrystals reveals the origin of dual emission","title_zh":"热处理诱导 Mn2+ 在硼硅酸盐玻璃与 Sb2-xMnxSe3 纳米晶之间的分配及其双发射起源","title_key":"thermallyinducedmn2partitioningbetweenborosilicateglassandsb2xmnxse3nanocrystalsrevealstheoriginofdualemission","authors":["Éder V. Guimarães","Noélio O. Dantas","Oswaldo Baffa","et al."],"venue":"Journal of Physics and Chemistry of Solids","issn_l":"0022-3697","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-21","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Sb 2-x Mn x Se 3 diluted magnetic semiconductor nanocrystals (NCs) were grown in situ within an SNAB borosilicate glass matrix by the fusion–nucleation method. X-ray diffraction, transmission electron microscopy, and Raman spectroscopy confirmed the formation of Mn-containing NCs with the orthorhombic Sb 2 Se 3 structure, average diameters of approximately 6.3 nm, and no detectable secondary crystalline phases. Increasing Mn concentration induces lattice expansion and Raman-mode blueshifts, consistent with substitutional incorporation of Mn 2+ into distorted pseudo-octahedral sites. Optical absorption reveals continuous bandgap narrowing from 3.02 to 2.26 eV, associated with Mn-induced electronic band restructuring involving a dominant CBM downshift of ≈ 0.65 eV and a smaller VBM upshift of ≈ 0.11 eV. Photoluminescence (PL) reveals two coexisting emission channels. The green band near 540 nm is assigned to the 4 T 1 ( 4 G)→ 6 A 1 ( 6 S) transition of Mn 2+ ions in tetrahedral sites of the glass matrix, whereas the red-to-near-infrared PL def. band, shifting from 1.79 to 1.68 eV, is associated with defect-related recombination in the Sb 2-x Mn x Se 3 NCs. Electron paramagnetic resonance (EPR) distinguishes Mn 2+ in pseudo-octahedral NC sites and tetrahedral glass sites, with hyperfine constants of ≈ 8.16 and ≈ 7.78 mT, respectively. The PL and EPR results demonstrate that thermal treatment promotes incorporation of Mn 2+ into the growing Sb 2 Se 3 NCs, while a residual Mn 2+ population is retained in tetrahedral sites in the glass matrix. This Mn 2+ partitioning between pseudo-octahedral sites in the Sb 2-x Mn x Se 3 NCs and tetrahedral sites in the borosilicate glass matrix reveals the origin of the dual-emission in the Sb 2-x Mn x Se 3 NCs/SNAB composite.","abstract_hash":"f73ff795e67d059b82dfd8eb94b266b43b979d3fcf1103ab0e79cf35a885c2b7","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":3,"novelty_reason":"用 EPR 超精细常数把双发射拆解到两种 Mn2+ 占位，机制解释清晰，但属于已有玻璃-纳米晶复合体系上的占位与发光归属研究，未见新器件或新机制。","innovation_zh":"在 SNAB 硼硅酸盐玻璃基体里用熔融-成核法原位生长 Sb2-xMnxSe3 稀磁半导体纳米晶，把 Mn2+ 的两种占位和双发射通道对应了起来。EPR 区分出纳米晶中的赝八面体 Mn2+（超精细常数约 8.16 mT）与玻璃基体中的四面体 Mn2+（约 7.78 mT），证明热处理把 Mn2+ 推入正在生长的 Sb2Se3 纳米晶，同时玻璃中仍残留一部分四面体位 Mn2+。由此把 540 nm 绿光（玻璃中四面体 Mn2+ 的 4T1(4G)→6A1(6S) 跃迁）和 1.79→1.68 eV 的红-近红外发射（纳米晶中的缺陷复合）分别归因于两个不同的 Mn2+ 库，解释了复合体系双发射的来源。","method_zh":"熔融-成核法在硼硅酸盐玻璃中原位析出平均直径约 6.3 nm 的 orthorhombic Sb2Se3 结构含 Mn 纳米晶，用 XRD、TEM、Raman、吸收、PL 和 EPR 联合表征 Mn 的占位与能带变化。","keywords_zh":["稀磁半导体纳米晶","Mn2+ 占位","双发射","EPR 超精细常数","玻璃原位析晶"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:12.733Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.cej.2026.182104","doi":"10.1016/j.cej.2026.182104","doi_url":"https://doi.org/10.1016/j.cej.2026.182104","title":"Ultrabroad-emitting CuGaS2/ZnS quantum dots for high-color-quality white light-emitting diodes","title_zh":"用于高色质量白光发光二极管的超宽发射 CuGaS2/ZnS 量子点","title_key":"ultrabroademittingcugas2znsquantumdotsforhighcolorqualitywhitelightemittingdiodes","authors":["Wenxin Yang","Changsheng Zhao","Shipeng Li","et al."],"venue":"Chemical Engineering Journal","issn_l":"1385-8947","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-21","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["CuGaS2/ZnS","量子点","白光 LED","超宽发射","色质量"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:12.972Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/jacs.6c12687","doi":"10.1021/jacs.6c12687","doi_url":"https://doi.org/10.1021/jacs.6c12687","title":"Blue-Emitting Colloidal In1– x Ga x P Quantum Dots Synthesized in Molten Salt: Toward Blue QLEDs with Improved Stability","title_zh":"熔盐中合成的蓝光胶体 In1–xGaxP 量子点：面向稳定性提升的蓝光 QLED","title_key":"blueemittingcolloidalin1xgaxpquantumdotssynthesizedinmoltensalttowardblueqledswithimprovedstability","authors":["Aritrajit Gupta","Yi‐Chen Chen","Justin C. Ondry","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-21","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Colloidal quantum dots (QDs) are being actively explored for QD light-emitting diode (QD-LED) displays with high color purity and wide color gamut, high brightness, and low-cost, solution-based manufacturing. Heavy metal-free InP QDs have enabled red- and green-emitting QD LEDs with excellent device characteristics. However, the performance of blue QD-LEDs, required for completing the red, green, and blue (RGB) full color gamut, is lagging behind, which prompts searches for novel blue-emitting QDs. Here, we report the synthesis, computational modeling, and structural and spectroscopic studies of heavy metal-free blue-emitting core-shell QDs featuring 2.1 nm In1-xGaxP cores, colloidally synthesized in a molten inorganic salt, epitaxially coated with ZnS shells, and optimized surface treatments. The computational study suggests that the introduction of a ZnS shell induces mixing between core and shell electronic states, enhancing the direct-gap character of In1-xGaxP/ZnS QDs. The resulting In1-xGaxP/ZnS QDs show blue band-edge photo- and electroluminescence that can be fine-tuned around the technologically important region of 470 nm. This material holds strong promise for filling the blue gap in full-gamut QD-LED displays.","abstract_hash":"91f8b281f9df9db44df6bedfa6ee2c72dc9a60b70479038c44ed43da4aacaa1e","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用熔盐合成路线做出无重金属蓝光 In1–xGaxP/ZnS 核壳量子点，并以计算解释 ZnS 壳带来的核壳态混合增强直接带隙特性，属明确的新材料策略。","innovation_zh":"针对蓝光 QD-LED 性能落后于红绿光、且缺乏无重金属蓝光量子点的问题，作者在熔融无机盐中胶体合成了 2.1 nm 的 In1–xGaxP 核，外延包覆 ZnS 壳并做表面处理，得到无重金属蓝光核壳量子点。计算表明 ZnS 壳引入核-壳电子态混合，增强了 In1–xGaxP/ZnS 的直接带隙特征。该量子点呈现蓝光带边光致与电致发光，发光波长可在 470 nm 这一关键技术区间附近精细调节。","method_zh":"熔融无机盐中胶体合成 2.1 nm In1–xGaxP 核，外延 ZnS 壳，并配合优化表面处理；结合计算建模与结构、光谱表征。","keywords_zh":["InGaP 量子点","蓝光 QLED","熔盐合成","核壳结构","无重金属"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:14.435Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/apxr.70193","doi":"10.1002/apxr.70193","doi_url":"https://doi.org/10.1002/apxr.70193","title":"Strain‐Tunable Photoluminescence From Ge Quantum Dots on Si Nanotips for CMOS‐Compatible Photonics","title_zh":"用于 CMOS 兼容光子学的 Si 纳米针上应变可调 Ge 量子点光致发光","title_key":"straintunablephotoluminescencefromgequantumdotsonsinanotipsforcmoscompatiblephotonics","authors":["Diana Ryzhak","Johannes Aberl","Enrique Prado Navarrete","et al."],"venue":"Advanced Physics Research","issn_l":"2751-1200","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-21","oa_status":"gold","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/apxr.70193","cited_by_count":0,"abstract":"ABSTRACT In this work, a combined experimental and modeling study of strain effects on the radiative emission of Ge quantum dots (QDs) grown on Si nanotips (NTs) is presented. Pure germanium QDs with heights of 30 and 70 nm are deposited on top of Si NTs using solid‐source molecular beam epitaxy. The micro‐photoluminescence measurements show a blueshift of the peak emission from to eV as the QD height increases from 30 to 70 nm, respectively. To understand this effect, strain in Ge QDs and Si NTs is analyzed using X‐ray diffraction. An in‐plane compressive strain of % is observed in the Ge QDs, while the Si NT substrate exhibits an in‐plane tensile strain of about 2.9 %. Furthermore, the electronic band structure calculations employing single‐band method coupled to the computation of the elastic strain tensor using continuum elasticity are performed. The results indicate that the unusual size dependence of Ge QD emission is due to a combination of (i) strain in Ge QDs, (ii) prominence of ‐direct electron–hole transitions for larger Ge QDs over ‐indirect ones more frequent in smaller dots. Finally, transitions involving electrons and heavy‐ and light‐hole states are identified.","abstract_hash":"8d054faa27ff8e11098ea7fa8b3d441e8ab944f53f7f0d72e050d523722c8446","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"把 Si 纳米针上的 Ge QD 应变工程与直接/间接跃迁竞争联系起来解释反常尺寸依赖，属于有新意的结构-机制组合，但摘要未给出效率或器件级指标。","innovation_zh":"在 Si 纳米针（NT）上用固态源分子束外延生长纯 Ge 量子点，发现了一个反常的尺寸依赖：QD 高度从 30 nm 增至 70 nm 时，发光峰发生蓝移（摘要中具体数值被排版吞掉，只给出到 eV 的量级）。结合 XRD 应变分析与单带电子结构计算，把这一反常现象归因于 Ge QD 内应变的贡献，以及大尺寸 QD 中直接（Γ）电子-空穴跃迁相对小尺寸 QD 中占主导的间接跃迁的增强，并识别出涉及重空穴和轻空穴态的跃迁。","method_zh":"固态源 MBE 在 Si 纳米针顶端沉积 30 和 70 nm 高的纯 Ge QD，用微区光致发光测发光峰位、XRD 测 Ge QD 与 Si NT 衬底的面内应变，再用连续弹性理论算弹性应变张量、单带方法算能带结构。","keywords_zh":["Ge 量子点","Si 纳米针","应变工程","光致发光","CMOS 兼容光子学"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:15.221Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.sciaf.2026.e03655","doi":"10.1016/j.sciaf.2026.e03655","doi_url":"https://doi.org/10.1016/j.sciaf.2026.e03655","title":"Hole-mediated topological confinement and tuning of magneto-optical emissions in Ga1−xMgxAs quantum dots nanostructures","title_zh":"Ga1−xMgxAs 量子点纳米结构中空穴介导的拓扑限域与磁光发射调控","title_key":"holemediatedtopologicalconfinementandtuningofmagnetoopticalemissionsinga1xmgxasquantumdotsnanostructures","authors":["Alemu Gurmessa Gindaba","Sampandam Elangovan"],"venue":"Scientific African","issn_l":"2468-2276","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-20","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-20","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"The k . p models are widely used for semiconductor nanostructures; standard formulations often suffer from broken ellipticity criteria and non-magnetic group-II dopants like Mg. This study presents a theoretical investigation into the structural, electronic, optoelectronic, and magneto-optical properties of magnesium (Mg)-doped Gallium Arsenide (GaAs) quantum dots under external electric and magnetic fields. Utilizing an 8-band Kane/Luttinger-Kohn Hamiltonian framework alongside Density Functional Theory (Quantum ESPRESSO) data calculations, in contrast to conventional diluted magnetic semiconductor (DMS) quantum dots that rely on open d-shell transition metals (Mn, Cr), which are inherently susceptible to magnetic clustering and d-state decoherence, this work establishes a new paradigm in zero-dimensional spintronics. This model incorporates strong spin-orbit coupling, valence band mixing, localized Coulombic impurity potentials, and Zener mean-field p − d exchange interactions. Structural confinement induces a quantum compression of the bound-hole wavefunction, pushing the Mg acceptor state deeper into the energy gap. Optical absorption spectra, photoluminescence (PL), magnetic circular dichroism (MCD), and magnetization phase behaviors were evaluated across varying dot radii ( R = 4 − 7 n m ), dopant fractions ( x = 0 % − 15 ), and magnetic fields ( B ≤ 10 T }). The findings demonstrate that Mg-doped GaAs nanostructures achieve optimized room-temperature magnetic coercivity/remanence at x ≈ 6.5 % − 7 % and yield highly polarization-resolved THz/mid-IR optoelectronic emission signatures, positioning this material system as a prime candidate for spintronic injectors and magneto-optic modulators.","abstract_hash":"eb47718c4d8ad3894f4de876208512fdf56deeafcc1194780a00286787cc0e5f","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display","materials","detection"],"novelty_score":4,"novelty_reason":"用非磁性 Mg 受主替代过渡金属掺杂来规避磁团簇与 d 态退相干，属于明确的新材料策略并给出可调磁光响应，但工作为理论计算、缺乏实验验证。","innovation_zh":"针对传统稀磁半导体量子点依赖 Mn、Cr 等开壳层过渡金属、易发生磁团簇和 d 态退相干的问题，本文改用 Mg 这种非磁性 II 族受主掺杂 GaAs 量子点，在 8 带 Kane/Luttinger-Kohn 框架下引入强自旋轨道耦合、价带混合、局域库仑杂质势和 Zener 平均场 p−d 交换，建立了零维自旋电子学的一套新描述。计算表明结构限域会把束缚空穴波函数量子压缩、使 Mg 受主能级更深地推入禁带，并在 x≈6.5%–7% 时获得优化的室温磁矫顽力/剩磁，同时给出高度偏振分辨的 THz/中红外发射特征。","method_zh":"用 8 带 Kane/Luttinger-Kohn 哈密顿量结合 Quantum ESPRESSO 的 DFT 数据，对半径 4–7 nm、Mg 掺杂 0%–15%、磁场 ≤10 T 的 GaAs 量子点计算吸收谱、光致发光、磁圆二色性和磁化相行为。","keywords_zh":["Mg 掺杂 GaAs 量子点","磁光发射","自旋轨道耦合","稀磁半导体","空穴限域"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:15.991Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adma.75051","doi":"10.1002/adma.75051","doi_url":"https://doi.org/10.1002/adma.75051","title":"Single‐Particle FRET Probes Heterogeneity in the Ligand Shell of Colloidal Perovskite Quantum Dots","title_zh":"单颗粒 FRET 探测胶体钙钛矿量子点配体壳层的异质性","title_key":"singleparticlefretprobesheterogeneityintheligandshellofcolloidalperovskitequantumdots","authors":["Leon G. Feld","Oleksandr Kolomiiets","Noah Shahin","et al."],"venue":"Advanced Materials","issn_l":"0935-9648","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-18","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-18","oa_status":"hybrid","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/adma.75051","cited_by_count":0,"abstract":"The functionality of colloidal quantum dots (QDs), whether in fundamental studies, optoelectronics, or emerging quantum technologies, critically depends on their surface chemistry, with organic ligands influencing nearly every aspect of their behavior. Whereas the inorganic core can be comprehensively characterized at atomic resolution, ligands remain difficult to probe owing to their low atomic contrast and soft, disordered structure. Here, we empower single-particle photoluminescence (PL) spectroscopy to characterize the organic ligand shell. Tagging ligand tails with organic dyes enables measuring their distance from the QD via Förster resonance energy transfer (FRET) at sub-nanometer resolution. Single-particle, single-molecule FRET experiments performed on lead halide perovskite QDs reveal nanometer-scale variations in dye-surface distances, both within individual particles (0.81 ± 0.22 nm on average) and between QDs with varied ligand chemistries (from 0.25 to 1.02 nm). Supported by atomistic modelling, our experiments tie diverse local ligand environments to these variations, validating a powerful yet accessible spectroscopic method for interrogating the complex surface chemistry of QDs, highly relevant to QD-based optoelectronics, quantum applications, and photocatalysis.","abstract_hash":"8b697523c2ff663963ad4807564f2efd52b71bae6ab8f161beacb85200bd319a","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","quantuminfo"],"novelty_score":4,"novelty_reason":"把单分子 FRET 测距用于量子点配体壳层表征，给出了亚纳米分辨的配体异质性定量结果，属于新方法加新观测。","innovation_zh":"配体壳层因为原子序数低、结构软而无序，一直很难表征。作者把有机染料标记到配体尾端，用单颗粒、单分子 FRET 在亚纳米分辨率下测染料到量子点表面的距离，从而间接读出配体壳层的空间信息。在铅卤钙钛矿量子点上，他们发现同一颗粒内部染料-表面距离存在纳米尺度涨落（平均 0.81 ± 0.22 nm），不同配体化学的量子点之间距离从 0.25 到 1.02 nm 变化，并结合原子级建模把这些差异归因于不同的局部配体环境。","method_zh":"在配体尾端接有机染料作为 FRET 受体/供体，用单颗粒光致发光光谱做单分子 FRET 测距，测得的染料-表面距离再与原子级模拟对照。","keywords_zh":["钙钛矿量子点","配体壳层","FRET","单颗粒光谱","表面化学"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:15.985Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsphotonics.6c01511","doi":"10.1021/acsphotonics.6c01511","doi_url":"https://doi.org/10.1021/acsphotonics.6c01511","title":"Deterministic Positioning of Circular Bragg Gratings Using Atomic Force Lithography for Quantum Dot Light Sources","title_zh":"利用原子力光刻实现圆形布拉格光栅的确定性定位用于量子点光源","title_key":"deterministicpositioningofcircularbragggratingsusingatomicforcelithographyforquantumdotlightsources","authors":["Sai Abhishikth Dhurjati","Moritz Langer","Yared G. Zena","et al."],"venue":"ACS Photonics","issn_l":"2330-4022","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-18","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-18","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Abstract The scalable realization of high-performance quantum networks requires the deterministic integration of quantum emitters into photonic microcavities with nanometer-scale precision. While semiconductor quantum dots (QDs) are near ideal quantum light sources, their random spatial distribution remains a significant bottleneck for device reproducibility. We report a room-temperature, atomic force microscopy-assisted nano-oxidation lithography technique that enables the deterministic positioning of buried GaAs QDs with a practical accuracy of 51(28) nm. By integrating these positioned emitters into monolithic, free-standing circular Bragg gratings with a vertically asymmetric membrane structure, we achieve a 245-fold photoluminescence intensity gain while maintaining a low fine-structure splitting comparable to bulk QDs. Through a combination of polarization-resolved spectroscopy and finite-difference time-domain simulations, we demonstrate that this positioning precision ensures robust, symmetric emission with a polarization imbalance below 5% (Stokes parameter |S| \u003c 0.05). This monolithic approach bypasses complex membrane transfer processes and cryogenic mapping, offering a high-throughput and industrially accessible route to high-fidelity entangled-photon sources for large-scale quantum information technologies.","abstract_hash":"d5a6fb23851e98be27e6ee29754c3e6145f13bf724942a6ffd1ab1418dfd44f4","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display"],"novelty_score":4,"novelty_reason":"用室温 AFM 纳米氧化光刻实现掩埋量子点的确定性定位并单片集成到圆形布拉格光栅，绕开膜转移与低温 mapping，定位精度和 245 倍增益、|S|\u003c0.05 的对称发射给出了明确的新策略与性能指标。","innovation_zh":"针对自组装 GaAs 量子点空间分布随机、难以确定性集成到光子微腔的问题，作者用室温原子力显微镜辅助的纳米氧化光刻，把掩埋量子点的定位精度做到 51(28) nm。把定位后的量子点集成进垂直非对称膜结构的单片自支撑圆形布拉格光栅，光致发光强度增益达 245 倍，同时精细结构分裂仍与体材料量子点相当。偏振分辨光谱与 FDTD 模拟显示该定位精度带来对称发射，偏振不平衡低于 5%（Stokes 参数 |S| \u003c 0.05）。","method_zh":"室温 AFM 辅助纳米氧化光刻对掩埋 GaAs 量子点做确定性定位，再与单片自支撑、垂直非对称膜的圆形布拉格光栅集成，无需膜转移和低温 mapping。","keywords_zh":["量子点","圆形布拉格光栅","原子力光刻","确定性定位","纠缠光子源"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:16.946Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.nanolett.6c03011","doi":"10.1021/acs.nanolett.6c03011","doi_url":"https://doi.org/10.1021/acs.nanolett.6c03011","title":"Narrow-Line-Width Room-Temperature Single-Photon Emission from Multinary Copper-Based Quantum Dots","title_zh":"多组分铜基量子点的窄线宽室温单光子发射","title_key":"narrowlinewidthroomtemperaturesinglephotonemissionfrommultinarycopperbasedquantumdots","authors":["Lei Hou","Jian Huang","Lu Chen","et al."],"venue":"Nano Letters","issn_l":"1530-6984","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-18","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-18","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Colloidal quantum dots are promising scalable quantum light sources, yet leading systems typically rely on toxic heavy metals and often exhibit spectral instability and photoluminescence intermittency. Here, we demonstrate room-temperature single-photon emission from individual Ga-doped multinary CuInS2/ZnS core–shell quantum dots, a cadmium-free alternative with low toxicity and tunable emission. Hanbury Brown–Twiss measurements show pronounced photon antibunching with a minimum g2(0) of 0.06, corresponding to a single-photon purity of 94%. The emitters also exhibit a remarkably narrow emission line width of 35 meV and strongly suppressed blinking, remaining predominantly in a bright state under low excitation. Combining single-particle spectroscopy with phasor-based lifetime analysis directly resolves emissive-state dynamics without multiexponential fitting, revealing competing radiative and nonradiative pathways involving charged excitons and Auger-assisted recombination. These results establish multinary CuInS2/ZnS quantum dots as environmentally benign colloidal quantum emitters for scalable room-temperature quantum photonic technologies.","abstract_hash":"fd4b2baacb78f0eebf29723da7bf294b9e40718ef3f3ad05590098a8b1384c5e","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","display","materials"],"novelty_score":4,"novelty_reason":"在无镉多组分铜基量子点体系上首次实现室温单光子发射并给出具体性能指标，同时引入相量寿命分析解析发光动力学，属于明确的新策略与显著性能验证。","innovation_zh":"在无镉、低毒的多组分 CuInS2/ZnS 核壳量子点上实现了室温单光子发射，单光子纯度达 94%（g2(0) 最低 0.06），发射线宽窄至 35 meV，且闪烁被强烈抑制，低激发下主要保持亮态。结合单粒子光谱与基于相量的寿命分析，无需多指数拟合即可直接分辨涉及带电激子和俄歇辅助复合的辐射/非辐射竞争通道。","method_zh":"采用 Ga 掺杂的 CuInS2/ZnS 核壳量子点，通过 Hanbury Brown–Twiss 测量验证单光子发射，并用单粒子光谱与相量寿命分析解析发光态动力学。","keywords_zh":["CuInS2/ZnS","单光子发射","无镉量子点","窄线宽","相量寿命分析"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:17.940Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.nanolett.6c03525","doi":"10.1021/acs.nanolett.6c03525","doi_url":"https://doi.org/10.1021/acs.nanolett.6c03525","title":"Intrinsically Conductive Films of Ag2Te Nanocrystals for Broadband Infrared Photodetection beyond 2000 nm","title_zh":"本征导电的 Ag2Te 纳米晶薄膜用于 2000 nm 以上的宽带红外光电探测","title_key":"intrinsicallyconductivefilmsofag2tenanocrystalsforbroadbandinfraredphotodetectionbeyond2000nm","authors":["Yuanfei Huo","Yulia V. Kuznetsova","Anastasiia V. Sokolova","et al."],"venue":"Nano Letters","issn_l":"1530-6984","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-17","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-17","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Abstract We report a rapid, up-scalable synthesis in an aprotic solvent to obtain Ag2Te nanocrystals that are intrinsically capped with a short, conductive thiol ligand, making them suitable for optoelectronic applications. The simultaneous use of labile and stable tellurium precursors controlled the reaction kinetics and enabled growth of nonbranched, highly crystalline Ag2Te nanocrystals, with well pronounced excitonic peaks and an absorption edge extending beyond 2000 nm. We also realized synthesis of either n-type or p-type Ag2Te nanocrystals by simply tuning their stoichiometry. Using Ag2Te nanocrystal inks, we fabricated infrared photodetectors in a phototransistor configuration, with a high responsivity above 2 A/W and a specific detectivity under broadband illumination reaching 1011 Jones at 160 K, and rise and fall times of 50 and 80 μs, fast enough to resolve kilohertz-scale optical modulation. Our study encourages development of heavy-metal-free nanocrystals for infrared optoelectronic devices operating at temperatures accessible to commercial Peltier coolers.","abstract_hash":"5e6547e034b2d001238eccb08635b2170791e270644fb9f3c092bdcace106159","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"本征导电配体封端加上化学计量比调控导电类型的组合策略较新，并在 160 K 下给出可用的红外探测性能指标。","innovation_zh":"用非质子溶剂中的快速可放大合成路线制备 Ag2Te 纳米晶，其表面本征地由短链导电硫醇配体封端，省去了常规的长链绝缘配体交换步骤。通过同时使用不稳定和稳定的碲前驱体调控反应动力学，得到非分支、高结晶度的纳米晶，激子峰明显、吸收边超过 2000 nm；仅通过调节化学计量比就能得到 n 型或 p 型材料。基于该纳米晶墨水做成的光电晶体管在 160 K 下响应度超过 2 A/W，宽带光照下比探测率达到 10^11 Jones，上升/下降时间为 50 和 80 μs，可分辨 kHz 级光调制，且不含重金属。","method_zh":"非质子溶剂中快速合成短链硫醇本征封端的 Ag2Te 纳米晶，用不稳定/稳定碲前驱体组合控制动力学，并以纳米晶墨水构筑光电晶体管型红外探测器。","keywords_zh":["Ag2Te 纳米晶","红外光电探测","本征导电配体","光电晶体管","无重金属"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:18.982Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.cej.2026.181979","doi":"10.1016/j.cej.2026.181979","doi_url":"https://doi.org/10.1016/j.cej.2026.181979","title":"Efficient red quantum-dot light-emitting diodes enabled by a dual-electron transport layer of ZnMgO and pyridyl-triazine molecule","title_zh":"ZnMgO 与吡啶基三嗪分子双电子传输层实现的高效红色量子点发光二极管","title_key":"efficientredquantumdotlightemittingdiodesenabledbyadualelectrontransportlayerofznmgoandpyridyltriazinemolecule","authors":["Mingming Zhou","Boyu Zhou","Yuhan Jiang","et al."],"venue":"Chemical Engineering Journal","issn_l":"1385-8947","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-16","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-16","oa_status":"green","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"数据库未收录摘要，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，建议直接查看原文。","keywords_zh":["量子点发光二极管","电子传输层","ZnMgO","吡啶基三嗪","红色QLED"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:16.964Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s13233-026-00547-2","doi":"10.1007/s13233-026-00547-2","doi_url":"https://doi.org/10.1007/s13233-026-00547-2","title":"Low-temperature photothermally cross-linked hole transport layer enabled by Thiol–Ene click chemistry for high-performance quantum dot light-emitting diodes","title_zh":"基于硫醇-烯点击化学的低温光热交联空穴传输层用于高性能量子点发光二极管","title_key":"lowtemperaturephotothermallycrosslinkedholetransportlayerenabledbythioleneclickchemistryforhighperformancequantumdotlightemittingdiodes","authors":["Youngjun Hwang","Jaehyeon Kim","Minsung Kang","et al."],"venue":"Macromolecular Research","issn_l":"1225-5947","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-16","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-16","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"数据库未收录摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，建议直接查看原文。","keywords_zh":["量子点发光二极管","空穴传输层","硫醇-烯点击化学","光热交联","低温工艺"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:18.118Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adfm.78456","doi":"10.1002/adfm.78456","doi_url":"https://doi.org/10.1002/adfm.78456","title":"High Performance Quantum Dot LEDs Enabled by Small‐Molecule Incorporation Within Emissive Layer","title_zh":"通过在小分子掺入发光层实现高性能量子点LED","title_key":"highperformancequantumdotledsenabledbysmallmoleculeincorporationwithinemissivelayer","authors":["Jialei Chen","Chengyu Luo","Tailiang Guo","et al."],"venue":"Advanced Functional Materials","issn_l":"1616-301X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-16","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-16","oa_status":"bronze","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/adfm.78456","cited_by_count":0,"abstract":"ABSTRACT Quantum‐dot light‐emitting diodes (QLEDs) are commonly limited by imbalanced electron–hole transport and the resulting charge accumulation within the emissive layer. Here, we employ the Langmuir–Blodgett (LB) transfer technique to incorporate the small molecule 1,3‐bis( N ‐carbazolyl)benzene (mCP) into the QD emissive layer, constructing a QD–mCP hybrid emissive layer to synergistically regulate QD structural organization and local carrier transport. At the optimized QD:mCP mass ratio of 10:1, the device achieves an external quantum efficiency of 36.7%, a current efficiency of 58.5 cd A − 1 , and a power efficiency of 89.3 lm W − 1 , while maintaining a pure‐red emission peak at 622 nm with a full width at half maximum of 17.71 nm. The extrapolated T 95 lifetime reaches 35 064.6 h at 1000 cd m − 2 , more than three times that of the control device. These results demonstrate that the synergistic effects of LB‐directed QD structural regulation and mCP‐mediated carrier regulation play an important role in achieving highly efficient and stable QLEDs. This work provides a promising, simple, and low‐cost design strategy for developing high‐performance QLEDs with high efficiency, high color purity, and long operational lifetime.","abstract_hash":"27594812a57ee387972e008d72b65dac9f11e5b97120119b95004a37cb3ce3ad","abstract_source":"openalex","abstract_missing":false,"directions":["display"],"novelty_score":4,"novelty_reason":"用LB技术构建QD-mCP杂化发光层属明确的新结构策略，且效率与寿命提升显著（EQE 36.7%、T95提升三倍以上）。","innovation_zh":"针对QLED中电子-空穴传输不平衡、发光层内电荷积累的问题，作者用Langmuir-Blodgett（LB）转移技术把mCP小分子引入量子点发光层，形成QD-mCP杂化发光层，同时调控量子点的结构排布和局部载流子传输。在QD:mCP质量比10:1时，器件外量子效率达36.7%，电流效率58.5 cd A⁻¹，功率效率89.3 lm W⁻¹，纯红光峰位622 nm、半高宽17.71 nm，1000 cd m⁻²下外推T95寿命达35064.6 h，是对照器件的三倍以上。","method_zh":"用LB转移技术将小分子mCP掺入量子点发光层，构建QD-mCP杂化发光层，通过LB引导的量子点结构调控与mCP介导的载流子调控协同作用优化器件。","keywords_zh":["QLED","Langmuir-Blodgett","mCP","杂化发光层","外量子效率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:19.040Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.optmat.2026.118522","doi":"10.1016/j.optmat.2026.118522","doi_url":"https://doi.org/10.1016/j.optmat.2026.118522","title":"Enhancing solution-processed quantum dot LED performance at telecom wavelengths via nanoscale ensemble engineering","title_zh":"通过纳米尺度集合体工程提升溶液法制备的通信波段量子点 LED 性能","title_key":"enhancingsolutionprocessedquantumdotledperformanceattelecomwavelengthsviananoscaleensembleengineering","authors":["Sarjeet Kumar","Ankush Kumar Patel","Santanu Pradhan"],"venue":"Optical Materials","issn_l":"0925-3467","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-15","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-15","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["量子点 LED","通信波段","溶液法","纳米尺度工程"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:19.315Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.chphi.2026.101165","doi":"10.1016/j.chphi.2026.101165","doi_url":"https://doi.org/10.1016/j.chphi.2026.101165","title":"Mechanistic insights into charge transfer engineering in CdSe-based quantum dot-sensitized solar cells","title_zh":"CdSe 基量子点敏化太阳能电池中电荷转移工程的机理洞察","title_key":"mechanisticinsightsintochargetransferengineeringincdsebasedquantumdotsensitizedsolarcells","authors":["Hamza Farhan Abu Owida","Asokan Vasudevan","Suleiman Mohammad","et al."],"venue":"Chemical Physics Impact","issn_l":"2667-0224","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-15","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-15","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Charge transfer fundamentally determines the photovoltaic efficiency of CdSe-based quantum dot-sensitized solar cells by governing exciton dissociation, carrier transport, interfacial electron injection, and charge recombination. This review develops a mechanism-oriented perspective that correlates the structural, electronic, and interfacial characteristics of CdSe QDs with the charge-transfer processes underlying device operation. The influence of quantum confinement, surface chemistry, defect states, and energy-level alignment is systematically analyzed to establish the intrinsic relationships between material properties and carrier dynamics. Recent advances in interfacial engineering, ligand regulation, heterostructure design, and electronic-state modulation are examined through their mechanistic roles in controlling charge separation, transport kinetics, and recombination pathways rather than solely their impact on photovoltaic performance. Emerging characterization techniques, multiscale theoretical approaches, and data-driven design strategies are further discussed for their potential to enable predictive optimization of charge-transfer behavior. By integrating fundamental charge-transfer physics with rational engineering principles, a unified conceptual framework is presented to guide the rational design of highly efficient, stable, and scalable CdSe-based QD-sensitized solar cells and to identify promising directions for future photovoltaic materials and device development.","abstract_hash":"0922d349f11bb1191df4280e06731ea311b7872515276093396146d6d6e5e925","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":2,"novelty_reason":"属于综述性梳理，以机理视角重新组织已有知识，但没有提出新机制、新结构或新纪录。","innovation_zh":"这是一篇综述，不是原创实验工作。它的切入点是把 CdSe 量子点的结构、电子和界面特性与器件中的电荷转移过程（激子解离、载流子输运、界面电子注入、复合）对应起来，从机理角度而非单纯性能角度梳理界面工程、配体调控、异质结构设计和电子态调制的作用。文中还讨论了新兴表征手段、多尺度理论和数据驱动设计策略在预测性优化电荷转移行为上的潜力，试图给出一个统一的概念框架。摘要没有给出任何具体性能数字或新器件结果。","method_zh":"综述性工作：系统分析量子限域、表面化学、缺陷态和能级对齐对载流子动力学的影响，并按机理角色重新审视界面工程、配体调控、异质结构与电子态调制等策略。","keywords_zh":["CdSe 量子点","量子点敏化太阳能电池","电荷转移","界面工程","载流子动力学"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:20.669Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.microc.2026.119709","doi":"10.1016/j.microc.2026.119709","doi_url":"https://doi.org/10.1016/j.microc.2026.119709","title":"NaCl-regulated cadmium-free Mn-doped core-shell QDs for GSH-assisted highly sensitive/selective Cu2+ detection","title_zh":"NaCl 调控的无镉 Mn 掺杂核壳量子点用于 GSH 辅助的高灵敏/高选择性 Cu2+ 检测","title_key":"naclregulatedcadmiumfreemndopedcoreshellqdsforgshassistedhighlysensitiveselectivecu2detection","authors":["Haijuan Luo","Yingying Xie","Jiefeng Chen","et al."],"venue":"Microchemical Journal","issn_l":"0026-265X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-15","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-15","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"数据库未收录摘要，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，建议直接查看原文。","keywords_zh":["Mn 掺杂量子点","无镉核壳量子点","NaCl 调控","Cu2+ 检测","谷胱甘肽"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:20.086Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1063/5.0336942","doi":"10.1063/5.0336942","doi_url":"https://doi.org/10.1063/5.0336942","title":"Femtosecond laser-patterned microfluidic surfaces with spreading carbon QDs toward dynamic information encryption","title_zh":"飞秒激光图案化微流控表面结合可铺展碳量子点用于动态信息加密","title_key":"femtosecondlaserpatternedmicrofluidicsurfaceswithspreadingcarbonqdstowarddynamicinformationencryption","authors":["Menglu Li","Jianqiang Xiao","Kai Yin","et al."],"venue":"Applied Physics Letters","issn_l":"0003-6951","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-14","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-14","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":"Traditional static optical anti-counterfeiting relies on fixed luminescent patterns or a single optical response, making it susceptible to copying and counterfeiting; moreover, its mode of information presentation is singular, making it difficult to meet the demands of information encryption with high concealment and high security. To address this issue, this paper proposes a dynamic information encryption strategy based on the dual-dimensional synergy of “spatial patterning–temporal afterglow.” Superhydrophilic micropatterned regions were constructed on a stainless-steel surface by femtosecond laser direct writing, and, with the aid of wettability differences and capillary driving, rapid spreading and high-resolution confined deposition of the carbon quantum dot (QD) precursor solution within the predefined regions were achieved. After high-temperature dehydration curing and secondary thermal treatment, carbon QD afterglow patterns with stable performance were obtained, and programmable tuning of the afterglow lifetime within 2.5 s could be achieved by regulating the precursor concentration. Based on the spatially confined patterns and temporal decay differences, a dynamic encryption mode of “instantaneous appearance of misleading information–delayed decoding of real information” was further established. This strategy integrates femtosecond laser microstructuring with programmable afterglow materials, realizing dual protection of information in both spatial and temporal dimensions, and providing a new design concept for dynamic anti-counterfeiting and high-security information encryption.","abstract_hash":"543d9375d3404bde767b5fc1b03d0a4908376fe19389298ac8561a8650d35ce3","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"把飞秒激光微结构化与可编程碳量子点余辉结合，提出空间-时间双维度动态加密的新策略，并给出 2.5 s 内可调的余辉寿命，属于明确的新结构/新策略。","innovation_zh":"针对传统静态光学防伪易被复制、信息呈现维度单一的问题，作者提出「空间图案化–时间余辉」双维度协同的动态加密策略。用飞秒激光在不锈钢表面直写超亲水微图案，借助润湿性差异和毛细驱动让碳量子点前驱液在预定区域快速铺展并高分辨受限沉积，经高温脱水固化和二次热处理得到稳定的碳量子点余辉图案，并通过调节前驱体浓度把余辉寿命在 2.5 s 内可编程调控。基于空间受限图案和时间衰减差异，建立了「先出现误导信息、延迟解码真实信息」的动态加密模式。","method_zh":"飞秒激光直写在不锈钢表面构建超亲水微图案，利用润湿性差异与毛细作用实现碳量子点前驱体溶液的受限铺展沉积，再经高温脱水固化和二次热处理形成余辉图案，通过前驱体浓度调控余辉寿命。","keywords_zh":["碳量子点","余辉","飞秒激光","信息加密","微图案化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:21.905Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s41565-026-02272-4","doi":"10.1038/s41565-026-02272-4","doi_url":"https://doi.org/10.1038/s41565-026-02272-4","title":"High-resolution intrinsically stretchable quantum-dot displays through thermally assisted intaglio transfer printing","title_zh":"通过热辅助凹版转印实现高分辨率本征可拉伸量子点显示","title_key":"highresolutionintrinsicallystretchablequantumdotdisplaysthroughthermallyassistedintagliotransferprinting","authors":["Jisu Yoo","Kyunghoon Lee","Ji Su Kim","et al."],"venue":"Nature Nanotechnology","issn_l":"1748-3387","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-14","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-14","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"摘要缺失，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，仅从标题可知采用热辅助凹版转印（thermally assisted intaglio transfer printing）工艺。","keywords_zh":["量子点显示","可拉伸器件","转印印刷","高分辨率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:20.598Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s41565-026-02278-y","doi":"10.1038/s41565-026-02278-y","doi_url":"https://doi.org/10.1038/s41565-026-02278-y","title":"Stretchable quantum dot displays achieve high definition","title_zh":"可拉伸量子点显示实现高分辨率","title_key":"stretchablequantumdotdisplaysachievehighdefinition","authors":["Feng Wang"],"venue":"Nature Nanotechnology","issn_l":"1748-3387","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-14","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-14","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"数据库未收录摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断关键方法或器件结构。","keywords_zh":["可拉伸显示","量子点","高分辨率","QLED"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:21.064Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpcc.6c03650","doi":"10.1021/acs.jpcc.6c03650","doi_url":"https://doi.org/10.1021/acs.jpcc.6c03650","title":"Determination of the Dark Fraction of Semiconductor Quantum Dots in Solution Based on Their Non-Exponential Luminescence Decays Measured in Different Dielectric Environments","title_zh":"基于不同介电环境中非指数发光衰减测定溶液中半导体量子点的暗态比例","title_key":"determinationofthedarkfractionofsemiconductorquantumdotsinsolutionbasedontheirnonexponentialluminescencedecaysmeasuredindifferentdielectricenvironments","authors":["Grzegorz Zatryb","Maciej Chrzanowski","Zuzanna Domagała","et al."],"venue":"The Journal of Physical Chemistry C","issn_l":"1932-7447","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-14","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-14","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Abstract A significant fraction of colloidal semiconductor quantum dots in solution can be non-emissive, or dark. As a result, the ensemble photoluminescence quantum yield is lower than the intrinsic quantum yield of the emissive, or bright, subpopulation. Here, we introduce a straightforward method for determining the dark fraction of semiconductor quantum dots in solution based on their non-exponential photoluminescence decays measured in dielectric environments with different refractive indices. Applied to gradient-alloyed thick-shell semiconductor quantum dots, the method shows that the intrinsic emission quantum yield of the bright subpopulation ranges from 0.679 to 0.763, depending on the solvent refractive index. Comparison with independently determined ensemble photoluminescence quantum yield gives a bright fraction of 0.607 ± 0.058, which corresponds to a substantial dark fraction of 0.393 ± 0.058. In general, this work provides a simple experimental route for quantifying hidden non-emissive populations in colloidal quantum dot ensembles.","abstract_hash":"24c01f7ceb0afe0183bd7d4c933d14ed81f77d64fd7cdb47fd482a66342c7642","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"方法本身简单巧妙，但属于对已有非指数衰减与介电环境效应思路的重新组合，且仅在一种厚壳量子点体系上验证，未提出新物理机制。","innovation_zh":"胶体量子点溶液中总有一部分是发光的「暗」粒子，导致系综荧光量子产率低于亮子群的本征产率，但暗态比例此前难以直接测量。作者提出一种简单方法：把同一批量子点分散在不同折射率的介电环境中，利用其非指数荧光衰减的差异来反推暗态比例。在梯度合金厚壳量子点上验证，得到亮子群本征发射量子产率为 0.679–0.763（随溶剂折射率变化），结合独立测得的系综荧光量子产率算出亮态比例为 0.607 ± 0.058，即暗态比例高达 0.393 ± 0.058。","method_zh":"将量子点分散于不同折射率的溶剂中，测量其非指数荧光衰减曲线，通过介电环境依赖的衰减行为分离亮/暗子群贡献，再与系综荧光量子产率对比得到亮态比例。","keywords_zh":["暗态比例","非指数荧光衰减","荧光量子产率","介电环境","厚壳量子点"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:23.529Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.nanolett.6c03848","doi":"10.1021/acs.nanolett.6c03848","doi_url":"https://doi.org/10.1021/acs.nanolett.6c03848","title":"Bridging-Carbon Reconstruction of π Conjugation Enables Bright Blue Emission from Crystalline Carbon Nitride Quantum Dots","title_zh":"桥接碳重构π共轭实现结晶氮化碳量子点的高亮蓝光发射","title_key":"bridgingcarbonreconstructionofconjugationenablesbrightblueemissionfromcrystallinecarbonnitridequantumdots","authors":["Lei Feng","Wenxiao Niu","Runhui Wang","et al."],"venue":"Nano Letters","issn_l":"1530-6984","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-14","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-14","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Triclinic crystalline carbon nitride (CCN) quantum dots are promising metal-free blue emitters, but their luminescence is limited by residual alkali ions, framework defects, and surface-mediated nonradiative decay. Here we develop a bridging-carbon reconstruction strategy to produce few-layer CCN quantum dots (C-CCNQDs) through reactive-salt polymerization followed by alkali-assisted solvothermal exfoliation. Bridging-carbon units connect adjacent heptazine motifs and extend π-electron delocalization, while amino and hydroxyl groups formed during exfoliation passivate surface dangling bonds. The combined framework reconstruction and surface passivation redirect excited-state relaxation from defect-dominated pathways toward framework-centered radiative recombination. The resulting C-CCNQDs exhibit sky-blue emission at 470 nm, a photoluminescence quantum yield of 65.4%, and substantially enhanced photostability. As a proof of concept, C-CCNQD light-emitting diodes show spectrally stable electroluminescence at 470 nm with a maximum external quantum efficiency of 1.47%. These findings establish atomic reconstruction of π-conjugated carbon nitride frameworks as a route to bright, metal-free blue-emitting quantum dots.","abstract_hash":"efad7f8b50a33f9adb2bb84290934ffd9d73af1419052bac1fcea9344c8bcb1f","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"提出桥接碳重构π共轭骨架的新策略，同时解决缺陷与表面非辐射复合问题，使无金属蓝光量子点QLED达到1.47%外量子效率。","innovation_zh":"针对三斜晶系结晶氮化碳（CCN）量子点因残余碱离子、骨架缺陷和表面非辐射复合导致发光受限的问题，作者提出桥接碳重构策略：用桥接碳单元连接相邻的七嗪基元以扩展π电子离域，同时利用剥离过程中生成的氨基和羟基钝化表面悬挂键，把激发态弛豫从缺陷主导路径导向骨架中心辐射复合。所得C-CCNQDs在470 nm处实现天蓝光发射，光致发光量子产率65.4%，光稳定性显著提升；概念验证的LED在470 nm处电致发光光谱稳定，最大外量子效率1.47%。","method_zh":"先通过反应性盐聚合，再进行碱辅助溶剂热剥离，制备少层结晶氮化碳量子点（C-CCNQDs），以桥接碳单元重构骨架并同步实现表面钝化。","keywords_zh":["氮化碳量子点","桥接碳重构","蓝光发射","表面钝化","无金属发光二极管"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:26.861Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/nano16181152","doi":"10.3390/nano16181152","doi_url":"https://doi.org/10.3390/nano16181152","title":"Linear and Nonlinear Optical Properties of an AlSb/InAs/AlSb Spherical Quantum Dot in a Magnetic Field","title_zh":"磁场中 AlSb/InAs/AlSb 球形量子点的线性和非线性光学性质","title_key":"linearandnonlinearopticalpropertiesofanalsbinasalsbsphericalquantumdotinamagneticfield","authors":["Sake Wang","Hassen Dakhlaoui","Bryan Matthew Wong"],"venue":"Nanomaterials","issn_l":"2079-4991","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-14","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-14","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"We investigate the optical and electronic properties of a spherical AlSb/InAs/AlSb core/shell/shell quantum dot (QD) under the combined effects of size confinement and an external magnetic field. The system contains a centrally located hydrogenic donor impurity whose attractive Coulomb interaction affects the distribution of electronic energy levels, their corresponding wavefunctions, and their optical responses. The total optical absorption coefficients and refractive index changes are analyzed as functions of incident photon energy by systematically varying the core radius and the applied magnetic field. The results reveal a tunable optical absorption resonance associated with the E1→E2 intersubband transition, whose spectral position and amplitude are strongly modified by the core radius, magnetic-field strength, and presence of the hydrogenic impurity. Increasing the magnetic field intensity from 0 to 30 T redshifts the optical absorption and refractive index peaks by 20-60 meV, reflecting the predominance of magnetic effects in the total confining potential. In contrast, expanding the internal quantum dot radius (core radius) also leads to a redshift, but in a lower-energy range of incident photons (0-20 meV), governed primarily by the quantum-size confinement effect. This net distinction in energy-shift ranges indicates that applying a magnetic field offers a broader tuning mechanism than quantum-size effects in the proposed core/shell/shell QDs. Furthermore, the coexistence of two distinct absorption ranges underscores the potential of AlSb/InAs/AlSb spherical QDs for various technological applications, including multi-band, magnetically tunable infrared and THz-infrared optical photodetectors.","abstract_hash":"e3b4271ff6e027a39f98c36b977a8f97afe3e09c31c02b8223101960ee9922bf","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"在核/壳/壳量子点体系中结合杂质态与磁场做光学调谐分析，属于已有理论框架在新结构上的验证与扩展，未提出新机制或实验验证。","innovation_zh":"本文用有效质量框架下的理论计算，系统研究了 AlSb/InAs/AlSb 核/壳/壳球形量子点在尺寸限域与外磁场共同作用下的光学响应，并引入中心位置的类氢施主杂质。核心结果是 E1→E2 子带间跃迁对应的吸收共振可由核半径、磁场强度和杂质存在与否调控：磁场从 0 加到 30 T 使吸收和折射率峰红移 20–60 meV，而增大核半径只带来 0–20 meV 的红移。作者据此指出磁场比量子尺寸效应提供更宽的调谐范围，且两个能量区间共存，可用于多波段、磁可调的红外与太赫兹红外光电探测。","method_zh":"针对含中心类氢施主杂质的 AlSb/InAs/AlSb 核/壳/壳球形量子点，计算电子能级与波函数，并求解总光吸收系数和折射率变化随入射光子能量的关系，扫描核半径与外加磁场。","keywords_zh":["核壳量子点","子带间跃迁","磁场调谐","光吸收系数","折射率变化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:24.008Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/1361-6528/aea6e2","doi":"10.1088/1361-6528/aea6e2","doi_url":"https://doi.org/10.1088/1361-6528/aea6e2","title":"Hardness of PbS nanocrystal-based photoconductor to x-ray irradiation","title_zh":"PbS 纳米晶光电导器件对 X 射线辐照的耐受性","title_key":"hardnessofpbsnanocrystalbasedphotoconductortoxrayirradiation","authors":["Diogo Almeida","Alexandre Neyret","Clément Gureghian","et al."],"venue":"Nanotechnology","issn_l":"0957-4484","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-14","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-14","oa_status":"hybrid","pdf_url":"https://iopscience.iop.org/article/10.1088/1361-6528/aea6e2/pdf","cited_by_count":0,"abstract":"Colloidal lead sulfide (PbS) nanocrystals (NCs) are emerging as cost-effective and solution-processable materials for infrared (IR) detection. Their use in a space environment is conditioned by their radiation tolerance. This study investigates the intrinsic robustness of PbS NC-based photoconductive devices to high-dose x-ray irradiation (up to 1.6 Grad [PbS]), far above the requirements for deep-space operation. PbS NC films exhibit gradual performance degradation without abrupt thresholds, attributed to their polycrystalline nature, which localizes defects and mitigates long-range lattice disruption. Optoelectronic measurements reveal a drop in both the dark and illuminated response, yet the signal-to-noise ratio improves due to the faster decay of the dark current. Spectroscopic analyses (x-ray photoemission spectroscopy/hard x-ray photoemission spectroscopy) confirm that the conductivity change can be attributed to x-ray-induced oxidation, which affects both Pb and S, forming sulfate and lead hydroxide phases that propagate throughout the NC volume. This oxidation reduces the effective NC size, blue-shifting the excitonic peak. Despite this, PbS NCs exhibit exceptional radiation hardness, comparable to that of radiation-hardened CMOS devices. These findings position PbS NCs as viable candidates for spaceborne IR detection, especially in oxygen-free environments where oxidation is naturally limited.","abstract_hash":"2add128c98aa8b6c585273d0ea96f604768531d80d80520c0716be33fe8c748d","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"首次系统给出 PbS 纳米晶光电导器件在远超深空需求的 X 射线剂量下的退化行为与氧化机制，并指出信噪比反常提升，但器件结构本身无新意。","innovation_zh":"系统考察了胶体 PbS 纳米晶光电导器件在高剂量 X 射线（最高 1.6 Grad [PbS]，远超深空任务需求）下的本征耐受性。器件没有出现突然失效阈值，而是逐渐退化，作者归因于多晶结构把缺陷局域化、抑制了长程晶格破坏；暗电流和光照响应都下降，但暗电流衰减更快，信噪比反而提升。XPS/HAXPES 表明性能变化源于 X 射线诱导的氧化，Pb 和 S 均被氧化生成硫酸盐和氢氧化铅相并在纳米晶体内扩展，导致有效尺寸减小、激子峰蓝移。整体辐射硬度可与抗辐射 CMOS 器件相比。","method_zh":"制备 PbS 纳米晶光电导器件，施加最高 1.6 Grad [PbS] 的 X 射线辐照，结合光电测量与 XPS/HAXPES 光谱分析退化机制。","keywords_zh":["PbS 纳米晶","X 射线辐照","辐射硬度","光电导探测器","氧化退化"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:24.707Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsaelm.6c01644","doi":"10.1021/acsaelm.6c01644","doi_url":"https://doi.org/10.1021/acsaelm.6c01644","title":"Suppressing Noise and Leakage Current in PbS Quantum-Dot Short-Wave Infrared Photodiodes via a PM6 Conjugated Polymer Interlayer","title_zh":"通过PM6共轭聚合物插层抑制PbS量子点短波红外光电二极管的噪声与漏电流","title_key":"suppressingnoiseandleakagecurrentinpbsquantumdotshortwaveinfraredphotodiodesviaapm6conjugatedpolymerinterlayer","authors":["Jiufeng Wu","Fan Fang","Haodong Tang","et al."],"venue":"ACS Applied Electronic Materials","issn_l":"2637-6113","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-12","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-12","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Defect-mediated leakage at charge-selective contacts fundamentally limits the performance of colloidal quantum dot (QD) short-wave infrared (SWIR) photodiodes. Here, we address this challenge by inserting a thin conjugated polymer (PM6) interlayer between the PbS-EDT hole transport layer and the MoOx electrode. This interlayer suppresses interfacial trap-assisted transport, reduces leakage pathways, and stabilizes charge dynamics, thereby achieving a more regulated interfacial transport regime. Consequently, the PM6-modified devices exhibit a markedly reduced dark current density of 70.1 nA/cm2 at −0.5 V, a high external quantum efficiency of 82.56% (zero bias) at 1300 nm, and a significantly suppressed noise spectral density, leading to an enhanced specific detectivity of 2.62 × 1011 Jones. Our findings establish polymer interlayer engineering as a simple and scalable approach to realize low-noise, high-stability SWIR photodetectors.","abstract_hash":"0233551e7eb2f474ac376853da2fb8a7857ff2a9e88ca7531f887ccbad507f7c","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"提出聚合物插层这一简单可扩展的界面工程策略，同时实现低暗电流、高EQE和低噪声，性能指标明确提升。","innovation_zh":"针对PbS量子点短波红外光电二极管中电荷选择接触处缺陷诱导漏电的问题，在PbS-EDT空穴传输层与MoOx电极之间插入一层薄PM6共轭聚合物插层，抑制界面陷阱辅助输运和漏电通道。器件暗电流密度在−0.5 V下降至70.1 nA/cm²，1300 nm零偏外量子效率达82.56%，噪声谱密度显著降低，比探测率达到2.62 × 10¹¹ Jones。","method_zh":"在PbS-EDT空穴传输层与MoOx电极之间引入PM6共轭聚合物薄插层，调控界面电荷输运并抑制陷阱辅助漏电。","keywords_zh":["PbS量子点","短波红外光电二极管","PM6聚合物插层","暗电流抑制","比探测率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:25.708Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/lpor.71903","doi":"10.1002/lpor.71903","doi_url":"https://doi.org/10.1002/lpor.71903","title":"Circularly Polarized Lasing From Amplified Geometric Chirality of Twisted Nanoplatelet Assemblies","title_zh":"扭曲纳米片组装体中几何手性放大实现的圆偏振激光","title_key":"circularlypolarizedlasingfromamplifiedgeometricchiralityoftwistednanoplateletassemblies","authors":["Yuan Wang","Guodan Wei","Huan Liu","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-12","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-12","oa_status":"bronze","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/lpor.71903","cited_by_count":0,"abstract":"ABSTRACT Circularly polarized lasers are essential for quantum information, biomedical science, and advanced 3D display. Directly generating such emission from semiconductor nanomaterials is attractive yet remains challenging, as most chiral nanostructures suffer from low optical gain or rely on external chiral sources. Here, we demonstrate a strategy that unlocks and amplifies latent structural chirality in achiral ligand‐capped CdSe/CdSeS core/crown nanoplatelets (NPLs) through nonequilibrium assembly. Post‐synthetic treatment with oleic acid imparts a weak but deterministic enantiomeric bias to the NPLs in solution, evidenced by a reproducible net negative circular dichroism. Fast evaporative self‐assembly then amplifies this nascent chirality, yielding a luminescence dissymmetry factor | g lum | of 0.61. Integrating the chiral films into a vertical‐cavity surface‐emitting laser (VCSEL) achieves low‐threshold circularly polarized lasing with | g lum | up to 1.57 and a cavity quality factor Q of ∼12 000. This combination of high g lum and Q is achieved without external chiral ligands, molecules, or structurally engineered chiral optical cavities, distinguishing this approach from existing strategies for circularly polarized lasing.","abstract_hash":"4f973a5bb06506291586912f62b0440642cdc00d5fd2262b3fb055f2affa4b5f","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","quantuminfo"],"novelty_score":4,"novelty_reason":"在非手性纳米片中通过组装放大本征手性并实现无外接手性源的高 g_lum、高 Q 圆偏振激光，属明确的新策略且性能指标突出，但未提出全新物理机制。","innovation_zh":"作者在非手性配体包覆的 CdSe/CdSeS 核/冠纳米片（NPL）中，通过后合成油酸处理和快速蒸发自组装，把原本潜伏的结构手性解锁并放大：溶液态先出现可重复的净负圆二色信号，组装成膜后发光不对称因子 |g_lum| 达 0.61。将该手性薄膜集成进垂直腔面发射激光器（VCSEL）后，实现低阈值圆偏振激光，|g_lum| 最高 1.57，腔品质因子 Q 约 12000。关键点在于不依赖外接手性配体、手性分子或专门设计的手性光学腔，就同时拿到高 g_lum 和高 Q。","method_zh":"用油酸对 CdSe/CdSeS 核/冠纳米片做后合成处理引入弱对映体偏置，再通过快速蒸发自组装放大手性形成手性薄膜，并将其作为增益介质集成到 VCSEL 腔中。","keywords_zh":["圆偏振激光","纳米片","手性放大","VCSEL","发光不对称因子"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:26.886Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsphotonics.6c00697","doi":"10.1021/acsphotonics.6c00697","doi_url":"https://doi.org/10.1021/acsphotonics.6c00697","title":"Near-3 Megapixel Mid-Wave Infrared HgTe Colloidal Quantum Dot Focal Plane Array with 5 μm Pixel Pitch","title_zh":"近300万像素、5 μm像元间距的中波红外 HgTe 胶体量子点焦平面阵列","title_key":"near3megapixelmidwaveinfraredhgtecolloidalquantumdotfocalplanearraywith5mpixelpitch","authors":["Wenbin Zuo","Libin Tang","Pin Tian","et al."],"venue":"ACS Photonics","issn_l":"2330-4022","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-11","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-11","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Currently, mid-wave infrared (MWIR) focal plane arrays (FPAs) are advancing toward lower cost, higher operating temperatures, miniaturization, and enhanced resolution. These developments present challenges for MWIR FPAs based on traditional epitaxial infrared materials such as HgCdTe and InAsSb, which are constrained by complex technological processes. HgTe colloidal quantum dots (CQDs), as zero-dimensional semiconductors, have significantly enhanced the design freedom of FPAs and the operating temperature of devices due to their unique quantum confinement effect, phonon bottleneck effect, and the advantages of solution processing. This provides the potential for the manufacture of MWIR FPAs with larger arrays and smaller pixels (approaching the optical diffraction limit). Here, we have fabricated a high-temperature exciton extraction-enhanced barrier-type MWIR HgTe CQD FPA with an advanced 5 μm pixel pitch and 1920×1536 array specification. The cutoff wavelength is about 4 μm and the blackbody peak detectivity (D*) at zero bias and 150 K is 1 × 109 Jones. The dark current density is between 10–7 and 10–6 A/cm2 within the operating temperature range of 120–200 K. We have also demonstrated MWIR thermal imaging results at 120 K for varying temperature objects at different operating temperatures.","abstract_hash":"79aee4a6401f8db0150abfe5c20775b5b05ddb999a723312d3fff6c5d1a8ddd6","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"在 HgTe 量子点焦平面上同时实现 5 μm 小像元和近300万像素大阵列，并给出明确的探测率与暗电流指标，属于新结构加显著性能推进，但未提出全新物理机制。","innovation_zh":"做出了目前像元间距很小（5 μm）、阵列规模很大（1920×1536，约300万像素）的 HgTe 胶体量子点中波红外焦平面阵列，采用高温激子提取增强的势垒型结构。器件截止波长约 4 μm，在零偏压、150 K 下黑体峰值探测率 D* 为 1×10^9 Jones，120–200 K 工作温区内暗电流密度为 10^-7 至 10^-6 A/cm²，并在 120 K 下演示了对不同温度目标的红外热成像。相比依赖 HgCdTe、InAsSb 等外延材料的传统中波红外焦平面，这里用溶液法量子点把像元做到接近衍射极限，同时把工作温度提上去。","method_zh":"用溶液处理的 HgTe 胶体量子点构建势垒型（barrier-type）中波红外光电二极管阵列，通过高温激子提取增强机制提升载流子收集，并集成到 5 μm 像元、1920×1536 规格的焦平面阵列中。","keywords_zh":["HgTe 胶体量子点","中波红外焦平面阵列","势垒型光电探测器","激子提取","小像元"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:27.957Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.physb.2026.419349","doi":"10.1016/j.physb.2026.419349","doi_url":"https://doi.org/10.1016/j.physb.2026.419349","title":"Quantum coherence-assisted quantum dot-photon entanglement via Schmidt decomposition","title_zh":"通过 Schmidt 分解实现量子相干性辅助的量子点-光子纠缠","title_key":"quantumcoherenceassistedquantumdotphotonentanglementviaschmidtdecomposition","authors":["Hadisa Abroo","Azmat Iqbal Bashir"],"venue":"Physica B Condensed Matter","issn_l":"0921-4526","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-11","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-11","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["quantuminfo"],"novelty_score":1,"novelty_reason":"无摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["量子点","光子纠缠","量子相干性","Schmidt 分解"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:26.975Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.rinp.2026.108754","doi":"10.1016/j.rinp.2026.108754","doi_url":"https://doi.org/10.1016/j.rinp.2026.108754","title":"Anisotropic electron minibands and AM1.5G spectral usability windows in tensile-strained Si/relaxed Si1-xGex quantum-dot superlattices","title_zh":"拉伸应变 Si/弛豫 Si1-xGex 量子点超晶格中的各向异性电子微带与 AM1.5G 光谱可用窗口","title_key":"anisotropicelectronminibandsandam15gspectralusabilitywindowsintensilestrainedsirelaxedsi1xgexquantumdotsuperlattices","authors":["Diero Lassina","Djielbeogo Soumaïla","KAM Ollé Michel","et al."],"venue":"Results in Physics","issn_l":"2211-3797","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-11","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-11","oa_status":"gold","pdf_url":"https://www.sciencedirect.com/science/article/pii/S2211379726001804/pdf","cited_by_count":0,"abstract":"Intermediate-band photovoltaics (PV) rely on electronic states that are bound and shielded from thermal effects, yet still allow enough coupling between dots and proper energy separation. We analyse 495 tensile-strained Si/relaxed Si 1-x Ge x quantum-dot superlattices using a 3D BenDaniel–Duke Hamiltonian, incorporating a Δ 2 -valley electron mass tensor of diag(0.19, 0.19, 0.916) m 0 and applying Bloch-periodic boundary conditions. The design variables are the cubic-dot side a = 3.0–8.0 nm, barrier thickness b = 1.0–5.0 nm, and Ge fraction x = 0.20–0.38. The screen retains 171 core geometries and 170 strict geometries. At b ≤ 1.5 nm, all 110 geometries fail the 5 meV isolation threshold; 22 also lose full binding. The retained region shifts towards x = 0.35–0.38. Heavy-hole levels are combined with the electron minibands to define the VB → IB, IB → CB, and direct VB → CB thresholds. The ASTM G173-03 (2020) AM1.5G reference spectrum is partitioned into non-overlapping photon-energy windows at the bottom, centre, and top of each finite-width miniband while enforcing E 1 + E 2 = E g eff . For the 170 strict geometries, the median matched two-step photon fluxes are 2.910, 2.786, and 2.681 × 10 2 ⁰ m −2 s −1 at the respective placements, with 31 geometries showing variations exceeding 20% between them. Given that E 2 \u003c ΔEc ≤ 0.2432 eV, the valence-band-to-intermediate-band transition window is inherently narrow, and the ASTM spectral integration confirms this pathway as the limiting factor for two-step photon absorption across all strict configurations. These values represent upper limits based on incident light, not predictions of device efficiency or carrier escape rates.","abstract_hash":"3dc5922aeed17b8de927d6c61e3a88b094336cb8e0393cecb68bdd608f5b7eda","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":3,"novelty_reason":"在拉伸应变 Si/SiGe 量子点超晶格这一体系上系统扫描几何与组分参数、并把微带位置与 AM1.5G 谱窗口做匹配分析，属于已有中间带思路在新体系上的定量验证与参数筛选，而非新机制或新器件。","innovation_zh":"用 3D BenDaniel–Duke 哈密顿量（含 Δ2 谷电子质量张量 diag(0.19, 0.19, 0.916) m0 与 Bloch 周期边界）系统扫描了 495 个拉伸应变 Si/弛豫 Si1-xGex 量子点超晶格构型，设计变量为立方点边长 a = 3.0–8.0 nm、势垒厚度 b = 1.0–5.0 nm、Ge 组分 x = 0.20–0.38。筛选后保留 171 个 core 构型和 170 个 strict 构型；b ≤ 1.5 nm 时全部 110 个构型都过不了 5 meV 隔离阈值，其中 22 个还完全失去束缚，可用区域向 x = 0.35–0.38 偏移。把重空穴能级与电子微带结合定义 VB→IB、IB→CB 和直接 VB→CB 阈值，并按 E1 + E2 = Eg_eff 把 ASTM G173-03 (2020) AM1.5G 谱切成不重叠的光子能量窗口，对每个有限宽度微带的底、中、顶三种放置方式做积分。170 个 strict 构型下匹配的两步光子通量中位数分别为 2.910、2.786、2.681 × 10^20 m^-2 s^-1，有 31 个构型在三种放置间的差异超过 20%；由于 E2 \u003c ΔEc ≤ 0.2432 eV，VB→IB 窗口本身很窄，AM1.5G 积分确认它是所有 strict 构型中两步光子吸收的限制环节。作者明确说明这些是基于入射光的上限，不是器件效率或载流子逃逸速率的预测。","method_zh":"对 495 个拉伸应变 Si/弛豫 Si1-xGex 量子点超晶格用 3D BenDaniel–Duke 哈密顿量求解电子微带，电子质量取 Δ2 谷张量 diag(0.19, 0.19, 0.916) m0，加 Bloch 周期边界；再结合重空穴能级确定各跃迁阈值，并把 AM1.5G 参考谱按微带底/中/顶位置切成不重叠窗口做光子通量积分。","keywords_zh":["量子点超晶格","中间带光伏","电子微带","Si/SiGe","AM1.5G 光谱"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:30.952Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.ijleo.2026.172897","doi":"10.1016/j.ijleo.2026.172897","doi_url":"https://doi.org/10.1016/j.ijleo.2026.172897","title":"Correlation between field-assisted carrier mobility and electroluminescence in a 1.3 μm InAs/GaAs DWELL quantum-dot laser structure","title_zh":"1.3 μm InAs/GaAs DWELL 量子点激光器结构中场辅助载流子迁移率与电致发光的相关性","title_key":"correlationbetweenfieldassistedcarriermobilityandelectroluminescenceina13minasgaasdwellquantumdotlaserstructure","authors":["Orhan Özdemi̇r","Neslihan Ayarcı Kuruoğlu","Kutsal Bozkurt"],"venue":"Optik","issn_l":"0030-4026","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-11","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-11","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"无摘要信息，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确定具体方法与器件结构。","keywords_zh":["InAs/GaAs 量子点","DWELL 结构","1.3 μm 激光器","载流子迁移率","电致发光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:28.292Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s41605-026-00747-5","doi":"10.1007/s41605-026-00747-5","doi_url":"https://doi.org/10.1007/s41605-026-00747-5","title":"Temperature dependence of dark current in radiation detectors based on p-Si/n-InP heterostructures","title_zh":"基于 p-Si/n-InP 异质结的辐射探测器暗电流的温度依赖性","title_key":"temperaturedependenceofdarkcurrentinradiationdetectorsbasedonpsininpheterostructures","authors":["B. S. Radzhapov","А. С. Саидов","Sali Ashirovich Radzhapov","et al."],"venue":"Radiation Detection Technology and Methods","issn_l":"2509-9930","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-11","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-11","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection"],"novelty_score":1,"novelty_reason":"无摘要信息，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["p-Si/n-InP 异质结","辐射探测器","暗电流","温度依赖性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:28.251Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/jacs.6c15534","doi":"10.1021/jacs.6c15534","doi_url":"https://doi.org/10.1021/jacs.6c15534","title":"Triplet Excimer Regulates Triplet Sensitization Efficiency of Semiconductor Quantum Dots","title_zh":"三重态激基缔合物调控半导体量子点的三重态敏化效率","title_key":"tripletexcimerregulatestripletsensitizationefficiencyofsemiconductorquantumdots","authors":["Hui-Zhen Ren","Shu Wang","Chen Ye","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-10","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-10","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Semiconductor quantum dots (QDs) sensitize molecular triplets via triplet energy transfer (TET) to surface-anchored ligands. QD-ligand energy alignment and distance have been proven to be key factors for TET efficiency. The effect of ligand–ligand interaction, however, is elusive and hard to characterize. In this work, we show that QD triplet sensitization efficiency is greatly affected by ligand triplet excimer, which can be identified by photon upconversion from a three-component upconversion system comprising CdSe QD sensitizer, anthracene ligand, and perylene emitter. Specifically, two anthracene derivatives, anthracen-9-ylphosphonic acid (AnP) and (10-((triisopropylsilyl)ethynyl)anthracen-9-yl)phosphonic acid (TIPS-AnP), with different steric hindrance are bound to CdSe QDs, and the increase of ligand density results in strong ligand–ligand interaction, i.e., triplet excimer formation evidenced by transient absorption spectroscopy. Such triplet excited state–ground state interaction leads to a decrease of upconversion emission due to the low-lying excimer state that is energetically unfavorable for TET to perylene emitter. The observation that the bulkier TIPS-AnP is more prone to triplet excimer formation is attributed to the higher molecular polarity that induces an aggregated distribution on QD surfaces. This work reveals for the first time that the ligand–ligand interaction is crucial for TET from ligand to substrates, which provides a guide to the structural design of ligands on QDs in terms of QD–ligand energy alignment, distance, and ligand–ligand interaction for efficient triplet sensitization.","abstract_hash":"9c6fe657daf3cb5cf2bea54ff80a14f2fe42afbc2d48404901f573c4e9746d94","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"首次把配体-配体相互作用（三重态激基缔合物）确立为 QD 三重态敏化的关键调控因素，并给出反直觉的位阻-极性关系，但属于机理层面的新认识而非新器件纪录。","innovation_zh":"以往研究 TET 效率主要看 QD-配体能级匹配和距离，配体-配体相互作用一直难以表征、影响不明。本文用 CdSe QD 敏化剂 + 蒽类配体 + 苝发光体的三组分上转换体系，首次证明配体三重态激基缔合物会显著压低 QD 的三重态敏化效率：配体密度升高导致配体间强相互作用，瞬态吸收证实激基缔合物形成，其低能激基缔合态不利于向苝的能量转移，上转换发光随之下降。有意思的是位阻更大的 TIPS-AnP 反而更易形成三重态激基缔合物，作者归因于其更高的分子极性导致在 QD 表面聚集分布。","method_zh":"将两种位阻不同的蒽膦酸配体（AnP 和 TIPS-AnP）锚定在 CdSe QD 上，通过改变配体密度调控配体-配体相互作用，用瞬态吸收光谱表征三重态激基缔合物，并以三组分光子上转换体系的发光强度作为 TET 效率的读出。","keywords_zh":["量子点","三重态能量转移","激基缔合物","光子上转换","配体设计"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:30.702Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/2752-5724/aea589","doi":"10.1088/2752-5724/aea589","doi_url":"https://doi.org/10.1088/2752-5724/aea589","title":"Van der Waals integration of 2D single-crystal transporter with quantum dots for scalable SWIR image sensors","title_zh":"二维单晶传输层与量子点的范德华集成用于可扩展短波红外图像传感器","title_key":"vanderwaalsintegrationof2dsinglecrystaltransporterwithquantumdotsforscalableswirimagesensors","authors":["Pin Tian","Xiaokun Yang","Xiaokun Yang","et al."],"venue":"Materials Futures","issn_l":"2752-5724","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-10","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-10","oa_status":"diamond","pdf_url":"https://iopscience.iop.org/article/10.1088/2752-5724/aea589/pdf","cited_by_count":0,"abstract":"Abstract Short-wave infrared imaging holds transformative potential in semiconductor inspection, biomedical diagnostics, and autonomous driving. However, its broad adoption is hindered by the high cost of incumbent technologies such as InGaAs. Colloidal quantum dots (CQDs) offer spectral tunability and low-cost processing, yet they face a fundamental bottleneck when extending to longer wavelengths: increased quantum‐dot size degrades the interface with conventional transport layers (e.g. EDT), leading to surging dark current and deteriorated signal‐to‐noise ratio. Here, we propose a new interfacial‐engineering strategy to overcome this challenge. We design the 2D Bi 2 O 2 Te/PbS CQD heterojunction exhibiting an atomically flat interface and optimized band alignment, reducing the interfacial defect density by an order of magnitude. Based on this architecture, we fabricate high-performance infrared photodetectorsthat, at 1.7 μ m, simultaneously achieve a record‐low dark‐current density (98 nA cm −2 ), high external quantum efficiency (74%), and high specific detectivity (4.6 × 10 12 Jones). Furthermore, we successfully scale the process to produce a fully monolithic focal‐plane array with a 5 μ m pixel pitch and a format of 1920 × 1536, demonstrating exceptional imaging capabilities in complex scenarios such as silicon‐transparent imaging, haze‐penetrating vision, and moisture identification. This work not only provides a viable route to low‐cost, high‐performance SWIR imaging but, more importantly, establishes a general paradigm for precisely tailoring nano-crystal optoelectronic interfaces using 2D single crystals, opening a new pathway for the design of next‐generation on‐chip spectral‐sensing systems.","abstract_hash":"8671b1f4bef86e9aaffc54d87aec214e452190d5ba8a80e5c1ea154d33d73e37","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":5,"novelty_reason":"用二维单晶替代常规传输层解决长波量子点界面瓶颈，同时刷新暗电流、EQE 和探测率指标并实现高分辨率面阵成像。","innovation_zh":"针对 PbS 胶体量子点在长波方向（1.7 μm）因量子点尺寸增大导致与常规传输层（如 EDT）界面恶化、暗电流激增的问题，作者提出用二维 Bi2O2Te 单晶与 PbS 量子点构建范德华异质结，获得原子级平整界面和优化能带排列，界面缺陷密度降低一个数量级。器件在 1.7 μm 处同时实现 98 nA cm⁻² 的低暗电流密度、74% 的外量子效率和 4.6×10¹² Jones 的比探测率，并扩展到 5 μm 像元、1920×1536 面阵的单片焦平面阵列，演示了硅透射成像、透雾视觉和水分识别。","method_zh":"用二维 Bi2O2Te 单晶作为传输层，与 PbS 胶体量子点通过范德华集成构建异质结，替代传统 EDT 处理的界面，并在此基础上制备光电探测器及单片焦平面阵列。","keywords_zh":["短波红外","PbS 量子点","Bi2O2Te","范德华异质结","焦平面阵列"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:30.820Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1088/1674-1056/aea53a","doi":"10.1088/1674-1056/aea53a","doi_url":"https://doi.org/10.1088/1674-1056/aea53a","title":"Room Temperature Lasing in Micro-Rings of Blended Core/Shell Quantum Dots","title_zh":"混合核/壳量子点微环中的室温激射","title_key":"roomtemperaturelasinginmicroringsofblendedcoreshellquantumdots","authors":["Zehua Ren","Xiaoyu Wang","Chen Zelei","et al."],"venue":"Chinese Physics B","issn_l":"1674-1056","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-10","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-10","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Colloidal quantum dots (QDs) are nanoscale semiconductor particles with unique optical and electronic properties, widely used in optoelectronic fields as gain materials. Particularly in micro-lasers, the lasing investigation of blended core/shell QDs plays an important role in improving lasing performance and exciton dynamics. Here, we demonstrate room-temperature photonic lasing in blended QD micro-rings and reveal the mechanism of population inversion. High-quality micro-rings of red and green colloidal core/shell QDs and their blend are fabricated by utilizing the solution self-assembled patterning method. Steady-state and timeresolved spectral characterization illustrate the lasing of blended QD rings arising from the exciton transition of the 2S state, while the lasing of pure red and green QD rings with the 1S exciton transition. In blended QD rings, Förster resonance energy transfer (FRET) from green QDs to red QDs induces exciton redistribution and promotes exciton accumulation in the 2S state of red QDs rather than the 1S state, leading to population inversion and lasing emission. Our study of lasing behaviors and mechanisms for blended colloidal QD micro-rings paves a promising avenue toward further developing on-chip integrated QD lasing sources and optoelectronic devices.","abstract_hash":"0ee6df5ecaf8940be3c9b2587c13299838bea95fec84549311a8db3702d2c1e8","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"提出了混合量子点微环中通过FRET调控激子分布、使2S态而非1S态实现粒子数反转并室温激射的新机制。","innovation_zh":"作者用溶液自组装图案化方法制备了红、绿核/壳胶体量子点及其混合物的高质量微环，并在室温下实现了混合量子点微环的光子激射。关键新意在于揭示了混合体系中激射来自红量子点2S态的激子跃迁，而纯红、纯绿微环的激射来自1S态：绿到红量子点的FRET引起激子重新分布，使激子在红量子点2S态而非1S态积累，从而实现粒子数反转。","method_zh":"采用溶液自组装图案化方法制备红/绿核壳胶体量子点及其混合物的微环结构，并通过稳态与时间分辨光谱表征其激射行为和激子动力学。","keywords_zh":["量子点微环","室温激射","FRET","粒子数反转","核壳量子点"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:30.853Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.82444/warw.33543361","doi":"10.82444/warw.33543361","doi_url":"https://doi.org/10.82444/warw.33543361","title":"Elastic strain and enhanced light emission in dry etched Si/Si1-xGex quantum dots","title_zh":"干法刻蚀 Si/Si1-xGex 量子点中的弹性应变与发光增强","title_key":"elasticstrainandenhancedlightemissionindryetchedsisi1xgexquantumdots","authors":["No author provided"],"venue":"University of Warwick","issn_l":null,"source_type":"repository","is_preprint":true,"alt_doi":null,"pub_date":"2026-09-10","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-10","oa_status":"green","pdf_url":null,"cited_by_count":0,"abstract":"Quantum dots of 50 similar to 60 nm diameter fabricated from both Si/Si1-xGex (x = 0.1 similar to 0.3) strained layer superlattices and a strain symmetried Si-9/Ge-6 superlattice were investigated by a combination of Raman scattering, photoluminescence, and electroluminescence spectroscopy. It was found that, in addition to an enhanced luminescence intensity of the dots by over two orders of magnitude and improved luminescence quenching temperature, all of the
