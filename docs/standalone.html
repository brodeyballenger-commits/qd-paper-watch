with 2D MXene Nanoflakes","title_zh":"通过二维 MXene 纳米片修饰增强 AgBiS2 胶体量子点红外光电探测器","title_key":"enhancedagbis2colloidalquantumdotinfraredphotodetectorbymodifyingwith2dmxenenanoflakes","authors":["Junlin Wang","He Li","Tianyu Luo","et al."],"venue":"ACS Applied Electronic Materials","issn_l":"2637-6113","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-30","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-30","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Colloidal quantum dot (CQD) infrared (IR) photodetectors exhibit great application potential in the fields of optical communication, environmental monitoring, imaging, and wearable sensing. Specifically, AgBiS2 CQD IR photodetectors have garnered extensive attention because of their excellent photoelectric properties, solution-processability, as well as non-toxicity and environmental friendliness. However, the high trap density and relatively low carrier mobility of AgBiS2 CQDs have limited their development in high-performance IR photodetectors. Herein, a representative 2D transition carbide, Ti3C2Tx, is introduced into the AgBiS2 CQD films to develop enhanced IR photodetectors based on MXene/AgBiS2 hybrid films. By finely controlling of the MXene additive concentration, this combination possibly helps reduce trap state density in AgBiS2 films to suppress carrier nonradiative recombination and simultaneously constructs an efficient conductive pathway in AgBiS2 films to enhance the extraction of photo-generated carriers. Consequently, compared to the pristine AgBiS2 CQD devices, the MXene/AgBiS2 CQD-based infrared photodetector exhibits significant promotion in the responsivity, EQE, and estimated normalized detectivity under a broad band from 500 to 900 nm, demonstrating an alternative method for tailoring the performance of AgBiS2 CQD optoelectronic devices.","abstract_hash":"c7565eec2d9fdde099bfe4aca71f0c127756721ba16215f1a738c06a61748a96","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":3,"novelty_reason":"把 MXene 引入 AgBiS2 量子点薄膜属于已有思路在新体系上的验证，摘要只给出性能提升的定性描述、未给具体数值，创新性偏渐进。","innovation_zh":"针对 AgBiS2 胶体量子点陷阱密度高、载流子迁移率低的问题，作者把二维 Ti3C2Tx MXene 纳米片引入 AgBiS2 量子点薄膜，做成 MXene/AgBiS2 混合膜红外探测器。通过调控 MXene 添加浓度，一方面降低薄膜中的陷阱态密度、抑制载流子非辐射复合，另一方面在膜内构建导电通路、增强光生载流子抽取。相比未修饰的 AgBiS2 器件，混合器件在 500–900 nm 波段的响应度、EQE 和估算的归一化探测率都有明显提升。","method_zh":"在 AgBiS2 胶体量子点薄膜中掺入 Ti3C2Tx MXene 纳米片，通过精细控制 MXene 添加浓度制备 MXene/AgBiS2 混合膜红外光电探测器，并与纯 AgBiS2 器件对比光电性能。","keywords_zh":["AgBiS2 量子点","MXene","红外光电探测器","陷阱态钝化","载流子抽取"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:52.374Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acs.nanolett.6c03633","doi":"10.1021/acs.nanolett.6c03633","doi_url":"https://doi.org/10.1021/acs.nanolett.6c03633","title":"Spin-Polarized Anthracene Triplet States Sensitized by Si QDs Revealed by Time-Resolved EPR Spectroscopy","title_zh":"时间分辨 EPR 光谱揭示 Si 量子点敏化的自旋极化蒽三重态","title_key":"spinpolarizedanthracenetripletstatessensitizedbysiqdsrevealedbytimeresolvedeprspectroscopy","authors":["Mandefro Y. Teferi","Sanoop Mambully Somasundaran","Seyedeh Shadi Mirmohammadi","et al."],"venue":"Nano Letters","issn_l":"1530-6984","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-29","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-29","oa_status":"closed","pdf_url":null,"cited_by_count":1,"abstract":"Abstract Photoexcited quantum dot (QD)–chromophore hybrid systems hold great promise for photon upconversion, a process that could significantly boost the efficiency of solar energy technologies and be useful for spintronics and quantum information science. However, the magnetic interactions that govern the generation and transfer of spin polarization in these systems are not well understood. Here, we report the first time-resolved electron paramagnetic resonance (EPR) study of triplet energy transfer (TET) in colloidal Si QDs conjugated with two anthracene-based organic molecules: 9-ethylanthracene and 9-vinylanthracene. Triplet formation and spin dynamics monitored with time-resolved continuous-wave and pulsed EPR spectroscopy reveal Dexter-type TET from Si QDs to the anthracene moiety. Notably, the electron spin polarization of these conjugates displayed unusual fully emissive patterns, a surprising result that cannot be explained by the conventional spin-orbit or radical-pair mechanisms typically seen in purely organic donor–acceptor systems. The mechanism of this novel TET is discussed.","abstract_hash":"c734e49622a914770f910c75d72c59d1ca06ecb56f8781ab8524a27e1e78d9d4","abstract_source":"openalex","abstract_missing":false,"directions":["quantuminfo","materials"],"novelty_score":4,"novelty_reason":"首次在 Si 量子点-蒽体系中做时间分辨 EPR 并观察到无法用常规机制解释的完全发射型自旋极化，属新现象与新机制线索。","innovation_zh":"首次用时间分辨 EPR 研究胶体 Si 量子点与两种蒽基分子（9-乙基蒽、9-乙烯基蒽）共轭体系中的三重态能量转移（TET）。时间分辨连续波与脉冲 EPR 显示 TET 为 Dexter 型，且电子自旋极化呈现不寻常的完全发射型（fully emissive）谱型，无法用纯有机给体-受体体系中常见的自旋轨道或自由基对机制解释，作者对这一天线机制做了讨论。","method_zh":"将 Si 量子点与 9-乙基蒽、9-乙烯基蒽共轭，用时间分辨连续波 EPR 和脉冲 EPR 追踪三重态生成与自旋动力学。","keywords_zh":["Si 量子点","三重态能量转移","时间分辨 EPR","自旋极化","蒽"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:53.169Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/jacs.6c10386","doi":"10.1021/jacs.6c10386","doi_url":"https://doi.org/10.1021/jacs.6c10386","title":"Redox Reactions in Molten Indium Halide Salts Enable the Synthesis and Shape Control of In-Pnictide Nanocrystals","title_zh":"熔融卤化铟盐中的氧化还原反应实现 In-磷族纳米晶的合成与形貌调控","title_key":"redoxreactionsinmoltenindiumhalidesaltsenablethesynthesisandshapecontrolofinpnictidenanocrystals","authors":["Justin C. Ondry","Zirui Zhou","Luca Giordano","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-29","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-29","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Molten indium halide salts enable high-temperature and oxygen-free processing and production of III-V nanocrystals, but their redox chemistry can also induce nanocrystal decomposition. Here we show that redox potential of indium halide melts controls the chemical stability of InP, InAs, and InSb nanocrystals. Raman probes of halide speciation and powder XRD of recovered solids reveal that iodide melts, such as KInI4, can oxidize indium pnictide nanocrystals, coupling salt reduction to oxidative pnictide loss, whereas bromide melts, such as KInBr4, resist reduction and stabilize InP and InAs nanocrystals. This redox-tuned stability enables composition-preserving annealing that smooths (111) facets, converting round or tetrapod-like InP and InAs particles into highly faceted tetrahedra, and promotes atomically aligned self-assembly and preferential substrate orientation. Controlled ripening in KInBr4 yields larger III-V colloids inaccessible by synthesis conducted in conventional organic solvents. Furthermore, combining molten-salt annealing with monolayer ZnS growth by colloidal atomic layer deposition (c-ALD) produces significant photoluminescence enhancement, underscoring the chemical benefits of redox-tuned molten salt solvents for the synthesis of novel III-V nanocrystals. Finally, we demonstrate a strategy to enhance the reactivity of reduced indium halide salts through halide coordination with a strong Lewis acid, enabling direct synthesis of InP and InAs nanocrystals. Reaction environments with highly reactive reduced indium salt engineered in molten salts also reveal that under certain reaction conditions, unprecedented 2D InP nanoplatelets can be synthesized.","abstract_hash":"23211acc5bf8e6bb01a8c2e94d0260cea3d2a75f2bef8acf7b6403f103da2007","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":5,"novelty_reason":"首次把熔盐氧化还原电位与 III-V 纳米晶稳定性、形貌调控和二维 InP 纳米片合成明确关联起来，属于新机制加新结构。","innovation_zh":"这篇工作指出熔融卤化铟盐的氧化还原电位决定了 InP、InAs、InSb 纳米晶的化学稳定性：碘化物熔体（如 KInI4）会把 In-磷族纳米晶氧化、伴随磷族元素的氧化流失，而溴化物熔体（如 KInBr4）抗还原、能稳定 InP 和 InAs。利用这种氧化还原调控的稳定性，作者实现了保成分退火，把圆形或四足状的 InP、InAs 颗粒转成高刻面度的四面体，并促进原子级取向自组装和衬底择优取向；在 KInBr4 中可控熟化还能得到常规有机溶剂合成拿不到的大尺寸 III-V 胶体。进一步把熔盐退火与 c-ALD 单层 ZnS 结合可显著提升光致发光，并通过强 Lewis 酸配位卤素提高还原态铟盐反应活性，直接合成 InP、InAs，还在特定条件下得到此前未有的二维 InP 纳米片。","method_zh":"以熔融卤化铟盐（KInI4、KInBr4 等）作为高温无氧反应介质，用 Raman 表征卤素物种、粉末 XRD 表征回收固体，分析熔体氧化还原电位与纳米晶稳定性的关系；再结合保成分退火、可控熟化、c-ALD 生长 ZnS 以及 Lewis 酸配位调控还原态铟盐活性。","keywords_zh":["熔融盐合成","III-V 纳米晶","氧化还原调控","形貌控制","二维 InP 纳米片"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:55.320Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1117/1.apn.5.6.066010","doi":"10.1117/1.apn.5.6.066010","doi_url":"https://doi.org/10.1117/1.apn.5.6.066010","title":"External cavity locking in self-mode-locked quantum dot lasers","title_zh":"自锁模量子点激光器中的外腔锁定","title_key":"externalcavitylockinginselfmodelockedquantumdotlasers","authors":["Wenlu Wang","Jianing Wang","Bo Yang","et al."],"venue":"Advanced Photonics Nexus","issn_l":"2791-1519","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-29","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-29","oa_status":"diamond","pdf_url":null,"cited_by_count":0,"abstract":"Integrated optical frequency comb (OFC) sources with low radio-frequency (RF) linewidths are increasingly required for achieving stable mode-locking operation and low RF phase noise. This work centers on the demonstration of external cavity locking (ECL) in a self-mode-locked single-section quantum dot (QD) laser. It combines a detailed characterization of the self-mode-locking behavior with frequency stabilization of the generated OFC through ECL. Detailed analysis reveals that the feedback strength plays a dominant role in governing the ECL dynamics. Notably, the inherent chaos-free behavior of QD lasers under strong optical feedback enables straightforward locking, obviating the need for phase control or feedback attenuation, representing a significant advantage over conventional laser systems. Experimental results demonstrate that at a feedback strength of −6.3 dB, the 3-dB linewidth of the fundamental RF tone is reduced from 10.5 MHz to 249 kHz. Overall, by leveraging the self-mode-locking and feedback-resilient characteristics of QD lasers, this work paves the way for compact, integrated pulsed light sources with simplified architectures, offering promising prospects for applications in optical metrology, spectroscopy, and microwave photonics.","abstract_hash":"512905c37e2139b24055a153cad32a69b867ee0f5a759ad95239c6a45b92e0d1","abstract_source":"openalex","abstract_missing":false,"directions":["display","quantuminfo"],"novelty_score":4,"novelty_reason":"利用量子点激光器强反馈下无混沌的特性省去相位控制和反馈衰减，简化了 ECL 架构并把 RF 线宽压低了约 40 倍。","innovation_zh":"在单段自锁模量子点激光器上实现了外腔锁定（ECL），把自锁模产生的光频梳做频率稳定。关键发现是反馈强度主导 ECL 动力学，而量子点激光器在强光反馈下本身无混沌，因此不需要相位控制或反馈衰减就能直接锁定，这是相比传统激光系统的明显优势。实验中在 -6.3 dB 反馈强度下，基频 RF 信号的 3-dB 线宽从 10.5 MHz 压到 249 kHz。","method_zh":"用单段量子点激光器自锁模产生光频梳，再通过外腔光反馈实现锁定，并系统表征自锁模行为与反馈强度对锁定动力学的影响。","keywords_zh":["量子点激光器","自锁模","外腔锁定","光频梳","射频线宽"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:54.583Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T17:06:22.229Z"},{"id":"10.1021/acsami.6c18064","doi":"10.1021/acsami.6c18064","doi_url":"https://doi.org/10.1021/acsami.6c18064","title":"Functional Z-Ligand Passivation for Photostable Barrier-Free Pixelated Quantum Dot Color Conversion Layers","title_zh":"功能性Z型配体钝化用于光稳定的无阻隔层像素化量子点颜色转换层","title_key":"functionalzligandpassivationforphotostablebarrierfreepixelatedquantumdotcolorconversionlayers","authors":["Liuqing Han","Haixin Zhang","Qizhong Lin","et al."],"venue":"ACS Applied Materials & Interfaces","issn_l":"1944-8244","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"The practical application of quantum dot photoresists (QDPRs) for high-resolution displays is critically hindered by the insufficient passivation of surface anionic sites. Here, we report a surface modification strategy that integrates synergistic Z-type ligand zinc bis[2-(methacryloyloxy)ethyl] phosphate (Zn-BMEP) and zinc mono-2-(methacryloyloxy)ethyl succinate (Zn-MMES) to overcome these intrinsic limitations. The Z-type ligands selectively bind to anionic sites via phosphine-mediated surface reaction, forming a Zn-rich surface with hybrid MMES-BMEP groups that endow the QDs with both robust surface passivation and high solubility in photoresists and their solvents. The cured QDPRs achieve a high photoluminescence quantum yield of up to 87% and demonstrate remarkable photostability, with the red and green QDPR layers retaining over 90 and 83% of their initial emission intensity after 500 h of accelerated aging at 85 °C, even without air-barrier encapsulation. Photolithographic patterning of the QDPR yields high-resolution color conversion layers with 2 μm pixel size, excellent uniformity, and superior color performance. This surface engineering strategy resolves the trade-off between surface stability and photoresist compatibility, paving the way for stable, high-performance QDPRs in next-generation displays.","abstract_hash":"af874bc16dcb274b5f9f4751398b5d909bef9f0d12cfcd000b8924c78ebdec6e","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"提出Z型双配体协同钝化策略，在无阻隔层条件下同时实现高PLQY、长时热老化稳定性和2 μm像素光刻，属于明确的新策略并带来显著性能提升。","innovation_zh":"针对量子点光刻胶中表面阴离子位点钝化不足的问题，作者用两种Z型配体——磷酸酯类Zn-BMEP和琥珀酸酯类Zn-MMES——协同修饰量子点表面，通过膦介导的表面反应选择性结合阴离子位点，形成富Zn且带杂化MMES-BMEP基团的表面，同时兼顾钝化与在光刻胶/溶剂中的溶解性。固化后的量子点光刻胶PLQY最高达87%，红、绿像素层在85 °C加速老化500 h后（无空气阻隔封装）仍分别保持90%和83%以上的初始发光强度，并光刻出2 μm像素的高分辨色转换层。核心创新在于用Z型配体同时解决表面稳定性与光刻胶相容性的矛盾。","method_zh":"以Zn-BMEP和Zn-MMES两种Z型配体对量子点进行表面修饰，膦基介导反应选择性钝化阴离子位点，形成富Zn杂化配体壳层，再配制成光刻胶并光刻图案化。","keywords_zh":["量子点光刻胶","Z型配体钝化","光稳定性","像素化色转换层","无阻隔层封装"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:56.405Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/jacs.6c13682","doi":"10.1021/jacs.6c13682","doi_url":"https://doi.org/10.1021/jacs.6c13682","title":"Competitive Interfacial Etching and Growth for Multicolor-Tunable Circularly Polarized Luminescent Quantum Dots","title_zh":"竞争性界面刻蚀与生长实现多色可调圆偏振发光量子点","title_key":"competitiveinterfacialetchingandgrowthformulticolortunablecircularlypolarizedluminescentquantumdots","authors":["Wenhui Yan","Lulu Jia","Wei Zhao","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Circularly polarized luminescence (CPL) provides an additional optical degree of freedom beyond conventional wavelengths and intensities, offering new opportunities for advanced photonic technologies. However, the rational construction of semiconductor nanocrystals with strong CPL remains challenging, largely due to the lack of an understanding of how inorganic chirality is generated and coupled with excitonic emission. Here, we demonstrate that nanocrystal interfaces can serve as dynamic platforms for constructing inorganic chirality through coupled interfacial chemical equilibria. Using InP@ZnS quantum dots (QDs) as a model system, we reveal that pH regulation redistributes the balance between Zn-mediated interfacial etching and ZnS epitaxial growth by simultaneously tuning Zn coordination and sulfur precursor release kinetics, thereby directing the evolution of the inorganic structure and chiroptical properties. This interfacial regulation enables multicolor emission tuning from 524 to 596 nm while maintaining a photoluminescence quantum yield of 56.18% and achieving a high luminescence dissymmetry factor of 0.022. Atomic-scale structural analysis reveals that interfacial reactions introduce symmetry breaking and lattice distortion within InP@ZnS nanocrystals. Further electronic structure analysis shows that the heterovalent interface promotes directional charge redistribution, which strengthens the interaction between the distorted inorganic structure and the excitonic transitions. By integration of tunable emission and polarization-dependent optical responses, these CPL QDs further enable multidimensional optical encryption. This work establishes nanocrystal interfaces as programmable platforms for constructing inorganic chirality and enabling CPL-active semiconductor nanocrystals.","abstract_hash":"c63bc298cb30b83f4a65cf38269da84fe90a92d916cc6fc2d04af08e00752a83","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"提出了用界面化学平衡（刻蚀/生长竞争）编程无机手性的新策略，并在同一体系上同时实现多色可调、较高 PLQY 与可观 g_lum，属于明确的新机制加性能验证。","innovation_zh":"针对半导体纳米晶中无机手性如何产生并与激子发光耦合这一长期不清楚的问题，作者提出把纳米晶界面当作动态平台，通过耦合的界面化学平衡来构建无机手性。以 InP@ZnS 量子点为模型，用 pH 调控 Zn 配位与硫前驱体释放动力学，从而重新分配 Zn 介导的界面刻蚀与 ZnS 外延生长之间的平衡，同时调控无机结构演化与手性光学性质。结果实现了 524–596 nm 的多色发光调节，同时保持 56.18% 的 PLQY 和 0.022 的发光不对称因子，并进一步用于多维光学加密。","method_zh":"以 InP@ZnS 量子点为模型体系，通过 pH 调节同时改变 Zn 配位状态和硫前驱体释放动力学，在界面刻蚀与 ZnS 外延生长之间建立竞争平衡；结合原子尺度结构分析和电子结构分析，关联界面反应引起的对称性破缺、晶格畸变与异价界面电荷重分布。","keywords_zh":["圆偏振发光","InP@ZnS 量子点","界面刻蚀与生长","无机手性","光学加密"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:57.497Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.nanolett.6c03767","doi":"10.1021/acs.nanolett.6c03767","doi_url":"https://doi.org/10.1021/acs.nanolett.6c03767","title":"Overcoming Field-Assisted Leakage and Mobility Deficits in InAs Colloidal Quantum Dot SWIR Photodetectors","title_zh":"克服 InAs 胶体量子点短波红外光电探测器中的场辅助漏电与迁移率不足","title_key":"overcomingfieldassistedleakageandmobilitydeficitsininascolloidalquantumdotswirphotodetectors","authors":["Daekwon Shin","Stefan Zeiske","Jugyoung Kim","et al."],"venue":"Nano Letters","issn_l":"1530-6984","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract InAs colloidal quantum dots (CQDs) synthesized using non-pyrophoric precursors are attractive for short-wave infrared (SWIR) photodetection, yet their device performance remains limited by low external quantum efficiency (EQE) and high dark current. Here, we attribute these limitations to two material-level impediments: poor carrier mobility and broadly distributed sub-bandgap states. To address the former, we adapt a butylamine-assisted InBr3 ligand-exchange process, which increases carrier mobility by ∼80-fold and enhances EQE from 11% to 25% at −1 V. Temperature-dependent electrical and defect analyses reveal that field-assisted leakage current arises from sub-bandgap states associated with agglomerated, irregularly shaped particles within the CQD ensemble. Removing these particles via size-selective precipitation reduces trap density, increases trap activation energy, and suppresses dark current by an order of magnitude. Together, these complementary strategies yield InAs CQD photodetectors with a shot-noise-estimated detectivity of 9.8 × 1010 jones at 1320 nm and a rise time of 32 ns at −0.5 V.","abstract_hash":"2c0cf02d62acb61929cb4cd18740b1f59bd860c8465bbb16a41bbdcc6226428e","abstract_source":"openalex","abstract_missing":false,"directions":["detection","display","materials"],"novelty_score":4,"novelty_reason":"把暗电流来源明确归因到量子点集合中的团聚不规则颗粒并用尺寸选择性沉淀加以解决，配合配体交换同时提升迁移率与 EQE，策略具体且性能提升显著。","innovation_zh":"针对非自燃前驱体合成的 InAs 胶体量子点探测器 EQE 低、暗电流高的问题，作者把原因拆成两个材料层面的因素：载流子迁移率差和宽分布的亚带隙态。用丁胺辅助的 InBr3 配体交换把迁移率提高约 80 倍，−1 V 下 EQE 从 11% 提升到 25%；再通过尺寸选择性沉淀去掉量子点集合中团聚、形状不规则的颗粒，降低陷阱密度、提高陷阱激活能，把暗电流压下一个数量级。最终器件在 1320 nm 处散粒噪声估算的探测率达 9.8 × 10^10 jones，−0.5 V 下上升时间 32 ns。","method_zh":"器件基于非自燃前驱体合成的 InAs 胶体量子点，先做丁胺辅助 InBr3 配体交换提升迁移率，再用尺寸选择性沉淀去除团聚的不规则颗粒以抑制亚带隙陷阱；结合变温电学与缺陷分析定位漏电来源。","keywords_zh":["InAs 胶体量子点","短波红外光电探测","配体交换","暗电流抑制","亚带隙态"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:58.217Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s42250-026-01861-z","doi":"10.1007/s42250-026-01861-z","doi_url":"https://doi.org/10.1007/s42250-026-01861-z","title":"Quantum Dot-Assisted Fluorescence Detection of Metronidazole in Food Matrices Using DOE and Machine Learning Approaches","title_zh":"基于DOE与机器学习方法的量子点辅助荧光检测食品基质中甲硝唑","title_key":"quantumdotassistedfluorescencedetectionofmetronidazoleinfoodmatricesusingdoeandmachinelearningapproaches","authors":["Kimiya Khandestan","A Sabokbar","Bahareh Rahimian Zarif","et al."],"venue":"Chemistry Africa","issn_l":"2522-5758","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection"],"novelty_score":1,"novelty_reason":"摘要缺失，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["量子点","荧光检测","甲硝唑","实验设计","机器学习"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:57.178Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/v18101072","doi":"10.3390/v18101072","doi_url":"https://doi.org/10.3390/v18101072","title":"Single-Particle Tracking via Direct Labeling of the Viral Lipid Envelope with Cholesterol-DNA-Functionalized Quantum Dots","title_zh":"利用胆固醇-DNA功能化量子点直接标记病毒脂质包膜实现单颗粒追踪","title_key":"singleparticletrackingviadirectlabelingofthevirallipidenvelopewithcholesteroldnafunctionalizedquantumdots","authors":["Wen Yin","Xiaoxu Guo","Jie Zhou","et al."],"venue":"Viruses","issn_l":"1999-4915","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-28","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Quantum dots (QDs) provide rapid, continuous, and prolonged imaging of individual molecules and viruses, offering more comprehensive dynamic data than traditional fluorophores. However, their application in visualizing viral infections is limited, mostly due to the absence of a mild, efficient, and applicable labeling technique. This study presents a simple and gentle technique for labeling enveloped viruses with QDs, requiring only a single brief incubation phase. This method relies on the inherent attraction of the viral lipid envelope to cholesterol (chol), which is shown on Cadmium telluride (CdTe) QDs via Chol-DNA functionalization. The QDs were synthesized in a single step by the coordination of Cd2+ ions with phosphorothioate-modified DNA strands, maintaining high fluorescence efficiency and small particle size while enabling DNA modification. This labeling technique attains great efficiency in about one hour while maintaining viral structural integrity and infectivity. Employing this lipid-specific technique, this study established dual-color fluorescent SARS-CoV-2 spike-pseudotyped virions by labeling the envelope with QDs and the nucleic acid with Ru[(phen)2(dppz)]2+, facilitating real-time monitoring and analysis of infection dynamics. The established lipid-specific QD labeling technique provides an efficient and versatile tool for visually monitoring viruses and analyzing their infection paths, thus promoting broader utilization of single-virus identification and improving comprehension of complex infection mechanisms.","abstract_hash":"a99fe351198d2b270e67aa9bd01287df375505ad17b5319612faed2a8d63182a","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"提出了胆固醇-DNA功能化量子点直接标记病毒脂质包膜的新策略，标记温和高效并实现了假病毒的双色实时追踪。","innovation_zh":"针对包膜病毒量子点标记缺乏温和高效手段的问题，作者提出了一种基于胆固醇与病毒脂质包膜天然亲和力的标记策略：将胆固醇通过DNA接到CdTe量子点上，只需一步短时孵育（约1小时）即可完成标记，且保持病毒结构完整性和感染性。基于该脂质特异性标记，作者构建了双色荧光SARS-CoV-2刺突假病毒——包膜用量子点标记、核酸用Ru[(phen)2(dppz)]2+标记，从而可实时监测感染动态。","method_zh":"通过Cd2+与硫代磷酸修饰DNA链配位一步合成CdTe量子点，兼顾高荧光效率、小尺寸和DNA可修饰性；再以胆固醇-DNA功能化使量子点借胆固醇对病毒脂质包膜的亲和力实现标记。","keywords_zh":["量子点","病毒包膜标记","胆固醇-DNA","单颗粒追踪","SARS-CoV-2假病毒"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:51:58.816Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsphotonics.6c01692","doi":"10.1021/acsphotonics.6c01692","doi_url":"https://doi.org/10.1021/acsphotonics.6c01692","title":"Deep-Red to Near-Infrared Vertical Cavity Surface-Emitting Lasers from Bipyramidal Weakly Confined Quantum Dots","title_zh":"基于双锥形弱限域量子点的深红至近红外垂直腔面发射激光器","title_key":"deepredtonearinfraredverticalcavitysurfaceemittinglasersfrombipyramidalweaklyconfinedquantumdots","authors":["Kerong Jiao","Honghui Zou","Jixiang Jiang","et al."],"venue":"ACS Photonics","issn_l":"2330-4022","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Colloidal quantum dots (QDs) are attractive solution-processable gain media for next-generation laser devices. To date, the canonical metal-chalcogenide QDs have demonstrated superior optical gain across blue, green, and red spectral ranges. However, it is still challenging to access the technologically important deep-red to near-infrared region due to the bandgap limitation of existing QDs. Here, we address the gap by demonstrating low-threshold deep-red to near-infrared optical gain from weakly confined CdSe/CdS QDs. By developing a synthetic strategy toward high-quality bipyramidal CdSe cores and controlled shell coating, we tune the stimulated emission from 660 to 720 nm, a wavelength beyond the intrinsic bandgap limit of bulk CdSe. The mechanistic investigation by transient spectroscopy reveals that the gain origin shifts from biexciton recombination in naked CdSe QDs to electron–hole plasma (EHP) emission in core–shell QDs owing to carrier wave function leakage into the shell. Such weak confinement design demonstrates substantial suppression of Auger recombination in the EHP regime, indicating the potential for high-power devices. Building on these findings, we fabricate a vertical cavity surface-emitting laser that achieves low-threshold deep-red to near-infrared lasing over 690–725 nm.","abstract_hash":"a8b53205bfe1b13a28f61aa9cd80e156d9668f45e5070b1fb00a79f8bb269177","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":4,"novelty_reason":"通过双锥形核与弱限域壳层设计把量子点增益拓展到体相带隙之外的深红-近红外区，并据此实现低阈值 VCSEL 激射，属明确的新结构策略加显著性能突破。","innovation_zh":"针对现有金属硫族量子点受带隙限制难以覆盖深红至近红外波段的问题，作者用弱限域的 CdSe/CdS 量子点把受激发射从 660 nm 调到 720 nm，突破了体相 CdSe 的带隙极限。瞬态光谱表明增益机制随壳层包覆从裸 CdSe 的双激子复合转变为电子-空穴等离子体（EHP）发射，原因是载流子波函数向壳层泄漏；这种弱限域设计在 EHP 区显著抑制了俄歇复合。基于此做出垂直腔面发射激光器，在 690–725 nm 实现低阈值激射。","method_zh":"合成高质量双锥形 CdSe 核并控制壳层包覆，得到弱限域 CdSe/CdS 量子点，结合瞬态光谱分析增益机制，再将其作为增益介质构建垂直腔面发射激光器。","keywords_zh":["量子点激光器","弱限域","电子-空穴等离子体","垂直腔面发射激光器","近红外"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:00.296Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1063/5.0352379","doi":"10.1063/5.0352379","doi_url":"https://doi.org/10.1063/5.0352379","title":"Small area quantum-dot stripe lasers with focused-ion-beam-etched mirrors","title_zh":"小面积量子点条形激光器：聚焦离子束刻蚀反射镜","title_key":"smallareaquantumdotstripelaserswithfocusedionbeametchedmirrors","authors":["A. A. Obraztsova","Nikita A. Fominykh","Sergey D. Komarov","et al."],"venue":"Applied Physics Letters","issn_l":"0003-6951","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-28","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-28","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Miniaturization of edge-emitting quantum-dot lasers is hampered by increased mirror losses in ultra-short Fabry–Pérot cavities and limited modal gain of quantum dots (QDs). Here, we demonstrate electrically injected InGaAs/GaAs quantum-dot stripe lasers with an 8-μm stripe width and focused-ion-beam (FIB)-etched mirrors defining cavity lengths from 300 to 77 μm. The laser cavities were fabricated using techniques that allow for group fabrication and integration of lasers with other elements. The stripes were formed by deep reactive ion etching, and the laser mirrors were made using FIB etching technique. Five planes of InGaAs QDs grown in the non-Stranski–Krastanov mode were used as the laser active region. QDs of this type are responsible for high optical gain capable of compensating for losses in short cavities. Lasing is observed down to 77 μm, while the minimum threshold current of 23–26 mA is achieved for cavities 130–250 μm long. Comparison with 50-μm-wide lasers demonstrated previously shows that the threshold current approximately scales with stripe width, indicating a route toward further current reduction in narrower devices. However, the rapid increase in threshold current density in the shortest cavities reveals that further length scaling is limited by carrier accumulation and recombination in the GaAs waveguide. A threshold current model based on dominant waveguide recombination reproduces the nonmonotonic dependence of the threshold current on cavity length. These results identify lateral narrowing as an effective route to low-current short-cavity quantum-dot lasers and waveguide recombination as the key limitation for further miniaturization.","abstract_hash":"392dc849cb3a1de8915724688e502568bf85ca5c9af1321c194cc91b888c4900","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用 FIB 刻蚀镜面把量子点条形激光器腔长缩到 77 μm 并给出阈值随条宽缩放的规律，属明确的新结构策略与显著小型化进展，但机制层面仍是既有增益-损耗框架内的分析。","innovation_zh":"针对边发射量子点激光器小型化时超短腔镜面损耗增大、量子点模式增益有限的问题，作者用聚焦离子束（FIB）刻蚀反射镜，做出条宽 8 μm、腔长 300–77 μm 的 InGaAs/GaAs 量子点条形激光器，最短在 77 μm 腔长下仍实现激射，130–250 μm 腔长的最低阈值电流为 23–26 mA。与之前 50 μm 宽器件对比，阈值电流大致随条宽线性缩放，说明横向收窄是降低电流的有效途径；但最短腔中阈值电流密度快速上升，表明进一步缩短腔长受 GaAs 波导中载流子积累与复合限制。作者还建立了以波导复合为主导的阈值电流模型，复现了阈值电流随腔长的非单调依赖关系。","method_zh":"条形结构由深反应离子刻蚀形成，激光反射镜用 FIB 刻蚀制备，有源区为 5 层非 Stranski–Krastanov 模式生长的 InGaAs 量子点；腔长 300–77 μm，条宽 8 μm，工艺支持批量制造与与其他元件集成。","keywords_zh":["量子点激光器","聚焦离子束刻蚀","短腔激光器","阈值电流","波导复合"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:00.976Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.accounts.6c00456","doi":"10.1021/acs.accounts.6c00456","doi_url":"https://doi.org/10.1021/acs.accounts.6c00456","title":"Best Practices in Nanocrystal Synthesis and Characterization","title_zh":"纳米晶合成与表征的最佳实践","title_key":"bestpracticesinnanocrystalsynthesisandcharacterization","authors":["Raffaella Buonsanti","Brandi Michelle Cossairt","Jonathan De Roo","et al."],"venue":"Accounts of Chemical Research","issn_l":"0001-4842","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-27","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-27","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Conspectus Colloidal nanocrystals exhibit quantum-mechanical phenomena inaccessible in bulk matter, and their properties can be tuned via chemically manipulating their composition, size, shape, and surface chemistry. Decades of development have produced a remarkable synthetic library spanning quantum dots, metal and metal oxide nanocrystals, halide perovskites, and complex multicomponent heterostructures. Yet, the field faces a persistent tension between the sophistication of what can be made and the rigor with which it is reported. Batch-to-batch variability, incomplete characterization, and poorly documented protocols challenge reproducibility and slow the translation of laboratory discoveries into reliable technologies or emerging autonomous workflows. This Tutorial offers guidance across four themes that highlight best practices in colloidal nanochemistry with the aim of fostering rigorous reporting in the field. The first theme concerns synthesis. Every nanocrystal synthesis is, at its most fundamental level, a set of chemical reactions and, therefore, should be communicated with explicit stoichiometries, including by-products where known, and with experimental sections detailed enough for an independent researcher to reproduce the outcome. Attention to hidden variables such as heating rates, reagent purity, atmosphere, and order of addition is essential, and we provide practical guidance on identifying and reporting them. The second theme is surface chemistry, where the influence of ligands on nanocrystal stability, functional properties, and device performance is profound. We discuss ligand coordination across nanocrystal families, from II–VI quantum dots to lead halide perovskites. We also describe how complementary techniques, such as infrared and nuclear magnetic resonance spectroscopy, thermogravimetric analysis, isothermal titration calorimetry, and elemental analysis, can together provide a quantitative picture of the ligand shell. The third theme addresses ex situ characterization, with an emphasis on the minimum suite of measurements needed to unambiguously establish nanocrystal identity. We discuss transmission electron microscopy, powder X-ray diffraction, and X-ray photoelectron spectroscopy as complementary and mutually reinforcing tools while highlighting the statistical and analytical rigor required to extract meaningful information from each. Finally, we discuss in situ and advanced characterization as the bridge between empirical synthesis and mechanistic understanding. Real-time probes, such as synchrotron X-ray scattering and absorption, liquid-cell transmission electron microscopy, and time-resolved optical spectroscopy, are increasingly accessible to the community via user facilities. While not required in every study, these advanced tools have fundamentally reshaped our understanding of nucleation, growth, and stability. Thus, we highlight the importance of chemical understanding developed through in situ characterization for establishing a more rational synthesis design that bypasses the current trial-and-error approach. We close by looking toward the future where synthesis sensitivity maps, artificial intelligence, and automation become partners in accelerating discovery, open data practices, and the scientific rigor that must underpin all of it. Good (nano)science today depends on the same foundation it always has, including rigorous, thoroughly documented experiments with an eye towards the future, where advanced characterization and data science are expected to play an increasingly important role.","abstract_hash":"ed5140a4503eaee728a4bae601eb620b82238ab907775c02a774a23bde1a9b35","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":2,"novelty_reason":"属于领域规范与最佳实践的方法学综述，不涉及新机制或新器件，但对可重复性建设有实际指导意义。","innovation_zh":"这是一篇 Tutorial/Conspectus 性质的文章，不是新器件或新材料的原创研究，而是针对胶体纳米晶（量子点、金属/金属氧化物纳米晶、卤化物钙钛矿、多组分异质结构）领域长期存在的可重复性问题提出规范性建议。作者指出该领域「能做出的东西的精细程度」与「报道的严谨程度」之间存在持续张力，批次间差异、表征不完整、实验方案记录不清都在拖慢成果转化。文章围绕合成、表面化学、非原位表征、原位与先进表征四个主题给出具体操作指南，例如合成需给出明确化学计量比（含已知副产物）、关注升温速率/试剂纯度/气氛/加料顺序等隐藏变量，表面化学需用红外与核磁、热重、等温滴定量热、元素分析等手段定量描述配体壳层。","method_zh":"以教程综述形式，按合成—表面化学—非原位表征—原位/先进表征四条主线组织，推荐透射电镜、粉末 X 射线衍射、X 射线光电子能谱作为互相印证的最小表征组合，并介绍同步辐射 X 射线散射/吸收、液相电镜、时间分辨光谱等原位手段对成核、生长与稳定性机理研究的价值。","keywords_zh":["胶体纳米晶","可重复性","表面配体化学","原位表征","合成规范"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:01.470Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.solmat.2026.114733","doi":"10.1016/j.solmat.2026.114733","doi_url":"https://doi.org/10.1016/j.solmat.2026.114733","title":"All-PbS colloidal quantum dot tandem solar cells with an ITO interlayer: A combined simulation and experimental study","title_zh":"全 PbS 胶体量子点叠层太阳能电池：ITO 中间层——模拟与实验结合研究","title_key":"allpbscolloidalquantumdottandemsolarcellswithanitointerlayeracombinedsimulationandexperimentalstudy","authors":["Yijun Gao","Beining Dong","Mengxiu Chen","et al."],"venue":"Solar Energy Materials and Solar Cells","issn_l":"0927-0248","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-26","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-26","oa_status":"hybrid","pdf_url":"https://www.sciencedirect.com/science/article/pii/S092702482600574X/pdf","cited_by_count":0,"abstract":"Colloidal quantum dot (CQD) solar cells hold great promise for applications in single-junction and tandem solar cells owing to their adaptable bandgaps. However, power conversion efficiencies (PCEs) of their tandem solar cells still lag far behind their single-junction counterparts, primarily due to suboptimal thicknesses of light harvesting layers and underexplored interlayers for efficient charge recombination. In this study, Silvaco TCAD simulation is first conducted to optimize absorbing layer thickness in the front and rear sub-cells, enabling ideal photocurrent matching. Then, indium tin oxide (ITO) is introduced as an interlayer in a PbS CQD tandem solar cell to achieve efficient charge recombination. Guided by these simulation results, a two-terminal solution-processed PbS CQD tandem solar cell with an ITO interlayer is experimentally fabricated and characterized, which therefore achieved a PCE of 7.4% whereas the control device without an ITO interlayer only delivered a PCE of less than 1%. Therefore, this work offers insights into thickness optimizations of active layers and interlayer engineering for high-performance tandem solar cells, providing a theoretical and experimental guideline for optimizing CQD tandem devices.","abstract_hash":"9526c36fec5fcbe87ade92270a60228efe49d799a3f05a8a0f6f107782768cf8","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"把 ITO 中间层工程与厚度模拟优化结合用于全 PbS 量子点叠层电池，使 PCE 从不足 1% 提升到 7.4%，提升幅度显著但并非新机制或纪录级效率。","innovation_zh":"针对 PbS 胶体量子点叠层电池效率远落后于单结器件的问题，作者先用 Silvaco TCAD 模拟优化前后子电池吸收层厚度以实现理想的光电流匹配，再引入 ITO 作为中间层促进电荷复合。实验制备的两端溶液法 PbS CQD 叠层电池在加 ITO 中间层后 PCE 达到 7.4%，而无 ITO 中间层的对照器件 PCE 不足 1%，说明中间层是此前被忽视的关键瓶颈。","method_zh":"用 Silvaco TCAD 模拟确定前后子电池吸收层的最佳厚度，再在两端溶液法制备的 PbS CQD 叠层电池中插入 ITO 作为中间复合层，并与无 ITO 的对照器件对比。","keywords_zh":["PbS 胶体量子点","叠层太阳能电池","ITO 中间层","Silvaco TCAD 模拟","光电流匹配"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:01.470Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s11814-026-00831-y","doi":"10.1007/s11814-026-00831-y","doi_url":"https://doi.org/10.1007/s11814-026-00831-y","title":"Pb-free Colloidal Quantum Dots for Shortwave Infrared Optoelectronics: Materials, Defect Engineering, and Applications","title_zh":"用于短波红外光电子学的无铅胶体量子点：材料、缺陷工程与应用","title_key":"pbfreecolloidalquantumdotsforshortwaveinfraredoptoelectronicsmaterialsdefectengineeringandapplications","authors":["Jae Kook Uhm","Min‐Jae Choi"],"venue":"Korean Journal of Chemical Engineering","issn_l":"0256-1115","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-25","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-25","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"无摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["无铅量子点","短波红外","胶体量子点","缺陷工程","光电子器件"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:01.299Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.physb.2026.419385","doi":"10.1016/j.physb.2026.419385","doi_url":"https://doi.org/10.1016/j.physb.2026.419385","title":"Theoretical investigation of quantum dot size and inter-dot distance effects on photovoltaic performance of PbS/ZnTe and SnSe/ZnTe Intermediate-Band Solar Cells","title_zh":"量子点尺寸与点间距对 PbS/ZnTe 和 SnSe/ZnTe 中间带太阳能电池光伏性能影响的理论研究","title_key":"theoreticalinvestigationofquantumdotsizeandinterdotdistanceeffectsonphotovoltaicperformanceofpbsznteandsnseznteintermediatebandsolarcells","authors":["S.M. Altaweel","N. Abd-ElMohsen","A.M. Selim"],"venue":"Physica B Condensed Matter","issn_l":"0921-4526","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-25","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-25","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["detection","materials"],"novelty_score":1,"novelty_reason":"摘要缺失，无法判断创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法确认具体方法与器件结构。","keywords_zh":["中间带太阳能电池","PbS/ZnTe","SnSe/ZnTe","量子点尺寸","点间距"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:02.439Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/sstr.70613","doi":"10.1002/sstr.70613","doi_url":"https://doi.org/10.1002/sstr.70613","title":"Hybrid Ketone‐Mediated Purification Enables Ligand Preservation for Efficient PbS Colloidal Quantum Dot Optoelectronics","title_zh":"混合酮介导的纯化策略在保持配体完整性的同时实现高效 PbS 胶体量子点光电器件","title_key":"hybridketonemediatedpurificationenablesligandpreservationforefficientpbscolloidalquantumdotoptoelectronics","authors":["Junhyeon Kim","Dong-Eon Kim","Se‐Woong Baek","et al."],"venue":"Small Structures","issn_l":"2688-4062","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-25","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-25","oa_status":"gold","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/sstr.70613","cited_by_count":0,"abstract":"Colloidal quantum dots (CQDs) are promising absorbers for infrared optoelectronics, and their performance and stability are influenced by surface ligand chemistry. Herein, we tailor the antisolvents via a Hansen solubility parameter (HSP) to induce sufficient precipitation while minimizing surface ligand loss during CQD purification process. By redefining the interaction radius ( R o ) as an effective purification boundary, we find that a hybrid ketone antisolvent combination, an acetone/MEK (AMK), is positioned near this boundary in HSP space. As a result, PbS–AMK preserves surface‐bound ligands more effectively than PbS–ethanol counterparts, maintaining CQD monodispersity and improving long‐term stability. Devices fabricated from PbS–AMK exhibit smaller photovoltaic degradation during CQD aging, with only a 7.81% reduction in power conversion efficiency compared to 25.9% for PbS–ethanol. In addition, the PbS–AMK devices achieve 3.4‐fold higher specific detectivity under SWIR photodetection operation.","abstract_hash":"bec9ee949186e9a56e9cbba44acd4d03a3eb6bfa43bf51096362319c68aaaaba","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"用 HSP 相互作用半径界定纯化边界并据此设计混合酮反溶剂，属于明确的新纯化策略，且同时带来稳定性与探测率的显著提升。","innovation_zh":"针对 CQD 纯化过程中表面配体易流失的问题，作者用 Hansen 溶解度参数（HSP）来筛选反溶剂，把相互作用半径 R₀ 重新定义为有效纯化边界，发现丙酮/MEK（AMK）混合酮反溶剂正好落在这个边界附近。相比乙醇反溶剂，PbS–AMK 能更有效地保留表面配体，维持单分散性并改善长期稳定性：器件老化后 PCE 仅下降 7.81%，而乙醇体系下降 25.9%；在 SWIR 光电探测下比探测率提升 3.4 倍。","method_zh":"以 HSP 框架指导反溶剂选择，用丙酮/MEK 混合酮作为纯化反溶剂处理 PbS CQD，并与乙醇纯化样品对比配体保留、单分散性及器件性能。","keywords_zh":["PbS 胶体量子点","Hansen 溶解度参数","配体保留","反溶剂纯化","短波红外光电探测"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:03.764Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1038/s41467-026-77916-z","doi":"10.1038/s41467-026-77916-z","doi_url":"https://doi.org/10.1038/s41467-026-77916-z","title":"Reversible photolithography of quantum dots achieves high-performance electroluminescence","title_zh":"量子点的可逆光刻实现高性能电致发光","title_key":"reversiblephotolithographyofquantumdotsachieveshighperformanceelectroluminescence","authors":["Chang Sheng Gu","Zhixin Zhai","Shuo Ding","et al."],"venue":"Nature Communications","issn_l":"2041-1723","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-24","oa_status":"gold","pdf_url":"https://www.nature.com/articles/s41467-026-77916-z_reference.pdf","cited_by_count":0,"abstract":"Abstract Direct photolithography offers a transformative photoresist-free route for high-precision integration in electronic and optoelectronic platforms. Despite significant advancements in quantum dots (QDs), existing methods often degrade optoelectronic performance due to the inherent surface ligand changes during photolithographic processing. Here, we introduce a reversible photolithography strategy to overcome this bottleneck. This strategy is based on the first wavelength-gated, reversible ligand crosslinking and decrosslinking cycle, enabling the dynamic and reversible control over the photolithographic process. Using this approach, we achieve high-efficient and high-fidelity QD photolithography with restored QD structure and functionality. The reversible process further enables high-performance electroluminescence, with one of the highest luminance values of 125,016 cd m −2 at 5.0 V and a peak external quantum efficiency (EQE) of 24.41%. Moreover, we demonstrate an ultrahigh-resolution nano-pixelated device with a peak EQE of 17.08% at 21,000 PPI. This work presents a photo-reversible crosslinking system that decouples photolithographic patterning from performance degradation, offering a versatile platform for high-end QD-based displays and other advanced optoelectronics.","abstract_hash":"df221cbe3fbede6a8666aba5d59b158a7a2a921171808dd00a6d870b122af105","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":5,"novelty_reason":"首次提出波长门控的可逆配体交联/解交联光刻机制，在恢复量子点功能的同时刷新了高亮度、高 EQE 与 21,000 PPI 高分辨率的综合水平。","innovation_zh":"针对量子点直接光刻中配体变化导致光电性能退化的问题，作者提出了一种可逆光刻策略：利用首个波长门控的可逆配体交联/解交联循环，使光刻过程可以动态可逆地调控，从而在完成图案化后恢复量子点的结构与功能。基于该策略制备的器件在 5.0 V 下亮度达 125,016 cd m^-2，峰值外量子效率（EQE）为 24.41%；同时实现了 21,000 PPI 的超高分辨率纳米像素化器件，峰值 EQE 为 17.08%。核心创新在于把光刻图案化与性能退化解耦，而不是靠后续补偿来修复。","method_zh":"采用波长门控的可逆配体交联与解交联循环实现无光刻胶的直接光刻，图案化后通过解交联恢复量子点表面配体与结构，再构建电致发光器件与纳米像素阵列。","keywords_zh":["量子点","可逆光刻","配体交联","电致发光","超高分辨率像素"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:04.223Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.3390/chemosensors14100216","doi":"10.3390/chemosensors14100216","doi_url":"https://doi.org/10.3390/chemosensors14100216","title":"Simplified Synthesis of Blue Light-Emitting CdSe/ZnS Core–Shell Quantum Dots","title_zh":"蓝光发射 CdSe/ZnS 核壳量子点的简化合成","title_key":"simplifiedsynthesisofbluelightemittingcdseznscoreshellquantumdots","authors":["Yi-Zhi Lin","Sheng-Tong Wu","Zi-Chen Pan","et al."],"venue":"Chemosensors","issn_l":"2227-9040","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-24","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":"Blue-emitting CdSe/ZnS quantum dots require precise control of crystal growth because variations in particle size and surface structure can strongly influence their emission properties. In this study, blue-optical CdSe/ZnS core–shell quantum dots were synthesized using a one-step hot-injection method. Structural and optical characterization confirmed the formation of crystalline QDs with stable fluorescence emission after ZnS shell coating. The synthesized QDs exhibited an average diameter of approximately 3 nm, blue emission at 461 nm, and a photoluminescence quantum yield of 93.31%. The QDs exhibited suitable optical properties for fluorescence-based bioanalytical applications for HCG.","abstract_hash":"9a97838141914fefb2783758f63de73b6ebf327d5c9bd8f8da43087403c995ee","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":3,"novelty_reason":"合成路线简化且量子产率数据亮眼，但属于已有 CdSe/ZnS 体系的工艺改进与应用验证，未见新机制或新结构。","innovation_zh":"用一步热注入法合成了蓝光 CdSe/ZnS 核壳量子点，省去了通常蓝光量子点所需的精细尺寸/表面调控步骤。产物平均直径约 3 nm，发射峰 461 nm，PL 量子产率 93.31%，并验证了可用于 HCG 的荧光生物分析。","method_zh":"一步热注入法合成 CdSe 核，再包覆 ZnS 壳；通过结构与光学表征确认结晶性和壳层包覆后的荧光稳定性。","keywords_zh":["CdSe/ZnS","核壳量子点","蓝光发射","热注入法","量子产率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:03.617Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.jpcc.6c05014","doi":"10.1021/acs.jpcc.6c05014","doi_url":"https://doi.org/10.1021/acs.jpcc.6c05014","title":"Methyl Viologen Groups Bound to Pseudo-Two-Dimensional Cadmium Selenide Nanocrystals as X-Type Ligands Are More Effective Quenchers Than When Bound as L-Type Ligands","title_zh":"结合在准二维硒化镉纳米晶上的甲基紫精基团作为 X 型配体时比作为 L 型配体是更有效的猝灭剂","title_key":"methylviologengroupsboundtopseudotwodimensionalcadmiumselenidenanocrystalsasxtypeligandsaremoreeffectivequenchersthanwhenboundasltypeligands","authors":["Hailey M. Meyer","Jie Chen","Timothy J. Krogmeier","et al."],"venue":"The Journal of Physical Chemistry C","issn_l":"1932-7447","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Oleylamine-ligated wurtzite CdSe quantum platelets (QPs) and quantum belts (QBs) are exchanged with carboxylate-terminated, methyl-viologen-containing MV2+(CH2)nCO2– ligands (where n = 2, 4, or 6), resulting in the progressive quenching of the QP and QB photoluminescence (PL). Spectroscopic and compositional analyses indicate that the initial ligand exchange responsible for PL quenching occurs on the nonpolar, thin, long-edge nanocrystal facets. The X-type MV2+(CH2)nCO2– ligands are shown to be more-effective PL quenchers than the corresponding L-type MV2+(CH2)nNH2 ligands studied previously [ Meyer, H. M.; et al.J. Phys. Chem. C2023, 127, 18506–18517.]. Transient-absorption spectroscopy measurements reveal electron transfer to the ligands occurs for fully quenched QPs, but not for the fully quenched QBs, establishing that electron transfer occurs selectively at the polar, thin, short-edge facets of the nanocrystals. The electron transfer occurs in \u003c50 fs for the X-type ligation and within 100 fs for the L-type ligation. This difference is ascribed to the greater preference for the binding of X-type over L-type ligands on polar facets, and this results in a significant contribution of electron transfer to the overall PL quenching.","abstract_hash":"d8086b97d835dfb5fd5f24dfb545a0f3b49f0ad4468a297940288a36e0f935d3","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials","quantuminfo"],"novelty_score":4,"novelty_reason":"在已有 L 型紫精配体工作基础上，明确对比了 X 型配位在极性晶面上的选择性结合及其对电子转移和 PL 猝灭的增强作用，并给出亚 50 fs 的转移时间。","innovation_zh":"作者把羧酸端基的甲基紫精配体 MV2+(CH2)nCO2-（n = 2、4、6）通过配体交换接到油胺包覆的纤锌矿 CdSe 量子片（QP）和量子带（QB）上，实现了对发光的逐步猝灭。与之前同一课题组报道的 L 型 MV2+(CH2)nNH2 配体相比，X 型配体是更有效的 PL 猝灭剂。瞬态吸收表明，完全猝灭的 QP 中发生了向配体的电子转移，而完全猝灭的 QB 中没有，说明电子转移选择性地发生在极性、薄、短边的晶面上；X 型配位下电子转移时间小于 50 fs，L 型则在 100 fs 以内。作者把这一差异归因于 X 型配体在极性晶面上比 L 型配体更倾向于结合，从而使电子转移对整体 PL 猝灭有显著贡献。","method_zh":"用羧酸端基的甲基紫精配体 MV2+(CH2)nCO2-（n = 2、4、6）对油胺配位的纤锌矿 CdSe 量子片和量子带做配体交换，结合光谱与组分分析、瞬态吸收光谱追踪 PL 猝灭和电子转移过程。","keywords_zh":["CdSe 量子片","甲基紫精配体","配体交换","光致发光猝灭","超快电子转移"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:06.663Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/lpor.71955","doi":"10.1002/lpor.71955","doi_url":"https://doi.org/10.1002/lpor.71955","title":"Low‐Power Direct Photopatterning of Colloidal Quantum Dots","title_zh":"胶体量子点的低功率直接光图案化","title_key":"lowpowerdirectphotopatterningofcolloidalquantumdots","authors":["Zhong Chen","Zhongwei Man","Chengzhao Luo","et al."],"venue":"Laser & Photonics Review","issn_l":"1863-8880","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-24","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-24","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Quantum dot light‐emitting diodes (QLEDs) require high‐resolution photopatterning of quantum dots (QDs) while preserving their optoelectronic properties, yet this remains a major challenge. Here, we systematically investigate the influence of bridge‐group conjugation on photolithographic performance by modulating the π ‐conjugation of azide crosslinkers. A highly π ‐conjugated tetraphenylethylene (TPE)‐based crosslinker exhibits a molar extinction coefficient (ɛ) exceeding 60,000 L mol − 1 cm − 1 , enabling low‐dose, non‐destructive photolithography. High‐fidelity red, green, and blue QD patterns with a resolution of 12,700 PPI are achieved under an ultralow UV exposure dose of only 3 mJ cm − 2 in air. The excellent optical retention originates from the reduced UV exposure requirement together with favorable energy‐level alignment between the crosslinker and QDs. Full‐patterned R/G/B QLEDs exhibit peak external quantum efficiencies of 20.79%, 15.27%, and 3.99%, respectively, with device performance approaching or even surpassing that of pristine devices. This highly π ‐conjugated crosslinker design provides a general strategy for low‐power, non‐destructive QD photolithography and paves the way for scalable fabrication of ultrahigh‐resolution QLED displays.","abstract_hash":"73ae159226bd84e6c599c6305e6ef5c05a307510f9f92b303dcdf89aeb3c8967","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"提出高 π 共轭交联剂设计策略，在超低曝光剂量下实现 12,700 PPI 高分辨图案化并保持器件效率，属于明确的新策略且性能提升显著。","innovation_zh":"针对 QLED 高分辨光刻中 QD 光电性能易被紫外曝光破坏的问题，作者通过调节叠氮交联剂的 π 共轭程度，系统研究了桥基共轭对光刻性能的影响，发现基于四苯乙烯（TPE）的高 π 共轭交联剂摩尔消光系数超过 60,000 L mol⁻¹ cm⁻¹。该交联剂在空气中仅需 3 mJ cm⁻² 的超低紫外曝光剂量即可实现 12,700 PPI 的红绿蓝 QD 图案，且由于曝光剂量低、交联剂与 QD 能级匹配，光学性能保持良好。全图案化 R/G/B QLED 峰值外量子效率分别达 20.79%、15.27% 和 3.99%，接近甚至超过未图案化器件。","method_zh":"通过调制叠氮交联剂的 π 共轭结构（采用 TPE 基高共轭交联剂），在空气中以 3 mJ cm⁻² 紫外剂量对红绿蓝 QD 进行直接光图案化，并制备全图案化 QLED 器件。","keywords_zh":["量子点光刻","交联剂","QLED","高分辨图案化","低剂量曝光"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:06.643Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/jacs.6c08553","doi":"10.1021/jacs.6c08553","doi_url":"https://doi.org/10.1021/jacs.6c08553","title":"Ligand-Mediated Control of Zn x Se y Intermediates for Defect-Free ZnSe Heteroepitaxy on Quantum Dots","title_zh":"配体介导调控 ZnxSey 中间体实现量子点上无缺陷 ZnSe 异质外延","title_key":"ligandmediatedcontrolofznxseyintermediatesfordefectfreeznseheteroepitaxyonquantumdots","authors":["Byong Jae Kim","Uhjin Kim","Jisu Han","et al."],"venue":"Journal of the American Chemical Society","issn_l":"0002-7863","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-23","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-23","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract ZnSe is a cornerstone shell material for enhancing the efficiency and stability of quantum dots (QDs). However, the chemical mechanisms governing detrimental zinc vacancy (VZn) formation remain unclear, limiting the predictive synthesis of high-quality heterostructures. Herein, we demonstrate that rational manipulation of ZnxSey intermediates via free oleic acid (OA) effectively suppresses both VZn and morphological inhomogeneity in CdSe/ZnSe core/shell QDs. Under OA-deficient conditions, sluggish precursor conversion yields a broad distribution of ZnxSey intermediates, including Zn-deficient heavy clusters like Zn2Se3(TOP), that lead to VZn incorporation. Conversely, excess OA shifts the intermediate landscape toward Zn-rich light species and suppresses the shift of intermediates into oxidized forms. This intermediate-level control enables the growth of VZn-free, morphologically uniform ZnSe shells with near-unity photoluminescence quantum yield. Our findings establish intermediate stoichiometry as a deterministic handle for the defect-free heteroepitaxy.","abstract_hash":"8ae840e971a1b51204a7167e57e1713c5a9116c162b8f0125e06c1f0cb4f0bed","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"把 ZnSe 壳层缺陷（VZn）与具体中间体物种和配体条件建立因果联系，提出中间体化学计量作为无缺陷异质外延的调控参量，并实现近 unity 的 PLQY。","innovation_zh":"这篇工作针对 CdSe/ZnSe 核壳量子点中 ZnSe 壳层容易产生锌空位（VZn）的问题，把缺陷来源追溯到前驱体转化过程中的 ZnxSey 中间体。作者发现贫油酸（OA）条件下前驱体转化慢，会生成包括 Zn2Se3(TOP) 这类贫锌重团簇在内的宽分布中间体，进而引入 VZn；而过量 OA 会把中间体分布推向富锌轻物种并抑制其向氧化态转变。通过这种中间体层面的调控，他们长出了无 VZn、形貌均匀的 ZnSe 壳，光致发光量子产率接近 unity。","method_zh":"在 CdSe/ZnSe 核壳量子点的壳层生长中，通过调节自由油酸（OA）的量来控制 ZnxSey 中间体的化学计量与分布，并用其作为缺陷形成的调控手段。","keywords_zh":["ZnSe 壳层","锌空位","中间体调控","油酸配体","核壳量子点"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:06.495Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/nap2.70308","doi":"10.1002/nap2.70308","doi_url":"https://doi.org/10.1002/nap2.70308","title":"Transparent QD‐LEDs","title_zh":"透明量子点发光二极管（Transparent QD-LEDs）","title_key":"transparentqdleds","authors":[],"venue":"Nanophotonics","issn_l":"2192-8606","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-23","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-23","oa_status":"gold","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"仅有标题、无摘要，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["量子点发光二极管","透明显示","QLED","透明器件"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:05.198Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.nanolett.6c02979","doi":"10.1021/acs.nanolett.6c02979","doi_url":"https://doi.org/10.1021/acs.nanolett.6c02979","title":"First-Principles Insights into Surface and Ligand Effects in Stoichiometric HgTe Quantum Dots","title_zh":"化学计量比 HgTe 量子点中表面与配体效应的第一性原理研究","title_key":"firstprinciplesinsightsintosurfaceandligandeffectsinstoichiometrichgtequantumdots","authors":["Raagya Arora","Patrick J. Lohr","Dibyajyoti Ghosh","et al."],"venue":"Nano Letters","issn_l":"1530-6984","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-22","oa_status":"green","pdf_url":"https://arxiv.org/pdf/2606.08399","cited_by_count":0,"abstract":"Abstract HgTe quantum dots are promising colloidal infrared semiconductors for photodetection, imaging, and optoelectronics because their electronic structure can be tuned from the short-wave to mid-infrared. Despite this technological promise, how the electronic structure of ultrasmall HgTe quantum dots emerges from confined semimetallic HgTe and how surface coordination governs frontier-state localization remain unresolved. Here, first-principles calculations on stoichiometric HgTe nanoclusters spanning ∼0.86–1.85 nm reveal a transition from confinement-dominated to surface-controlled electronic structure. Small self-passivated clusters exhibit clean HOMO–LUMO gaps and delocalized frontier states, whereas larger nanoclusters develop localized surface-associated near-edge states driven by coordination and bond-length heterogeneity. At intermediate sizes, the HOMO and LUMO become spatially separated without forming deep-gap states. Neutral ligands suppress localized states by restoring surface coordination while tuning frontier-state energetics through ligand–surface hybridization. These findings establish an atomistic framework for controlling surface-driven electronic structure in infrared quantum dots.","abstract_hash":"53589328582963603d258442a8400d1422f928fbba58c8aade44a896fd1e407f","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"在原子尺度上厘清了 HgTe 量子点从受限主导到表面主导的电子结构转变及配体抑制表面定域态的机制，属于明确的新认识而非单纯表征。","innovation_zh":"针对超小 HgTe 量子点电子结构究竟如何从受限半金属 HgTe 演化、表面配位如何决定前线轨道定域化这两个未解问题，作者对尺寸约 0.86–1.85 nm 的化学计量比 HgTe 纳米团簇做了第一性原理计算，发现随尺寸增大电子结构从受限主导转为表面主导：小尺寸自钝化团簇有干净的 HOMO–LUMO 带隙和离域前线态，大团簇则因配位与键长不均出现定域的近带边表面态；中间尺寸下 HOMO 与 LUMO 空间分离但不形成深能级。中性配体通过恢复表面配位抑制定域态，并借配体–表面杂化调节前线态能级。","method_zh":"用第一性原理计算系统扫描约 0.86–1.85 nm 的化学计量比 HgTe 纳米团簇，对比自钝化与中性配体钝化表面的前线轨道分布与能级。","keywords_zh":["HgTe 量子点","第一性原理","表面配位","配体钝化","红外半导体"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:07.927Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.54254/2755-2721/2026.37158","doi":"10.54254/2755-2721/2026.37158","doi_url":"https://doi.org/10.54254/2755-2721/2026.37158","title":"Influence of Quantum Confinement and Surface Modulation on the Luminescence Properties of Quantum Dots","title_zh":"量子限域与表面调控对量子点发光性能的影响","title_key":"influenceofquantumconfinementandsurfacemodulationontheluminescencepropertiesofquantumdots","authors":["Daqi Huang"],"venue":"Applied and Computational Engineering","issn_l":"2755-2721","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-22","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"The key performance indicators of conventional luminescent materials, such as luminous efficiency, emission full width at half maximum (FWHM), and operational stability, are progressively approaching their theoretical ceilings. And this hinders further performance improvement in application fields like high-efficiency lighting, ultra-high-definition displays, and high-sensitivity biological imaging. To address the requirements of these applications, including narrow emission FWHM, high quantum yield, and tunable emission wavelength, semiconductor luminescent nanocrystal systems like quantum dots, perovskite nanocrystals, and rare-earth-doped nanocrystals have been extensively investigated due to their potential for enhancing emission efficiency, spectral tunability, and optical stability. Accordingly, their luminescence properties can be precisely regulated through size engineering, composition engineering, and defect engineering. This paper examines relevant literature and investigates the luminescence mechanisms of semiconductor nanomaterials as well as their performance optimization. The results reveal that the three material classes differ significantly: quantum dots exhibit broad wavelength tunability; perovskite nanocrystals demonstrate high luminous efficiency but limited environmental stability; and rare-earth-doped nanocrystals provide narrow emission spectra with excellent color purity. In addition, the optimization of synthesis conditions and surface functionalization can further boost luminous efficiency and suppress non-radiative recombination. However, these materials still suffer from limitations including poor stability, poor uniformity during large-scale manufacturing, and heavy metal residues in certain systems.","abstract_hash":"fcadbc10786c748b9df96c364d887da5e9b4b90a3a02144e90a96f74bbca42ee","abstract_source":"openalex","abstract_missing":false,"directions":["display","detection","materials"],"novelty_score":2,"novelty_reason":"属于对已有文献的归纳对比，未提出新机制、新结构或新数据，仅指出各体系的优劣与共性瓶颈。","innovation_zh":"这是一篇综述性工作，对比了量子点、钙钛矿纳米晶和稀土掺杂纳米晶三类半导体发光纳米晶体系：量子点波长可调范围宽，钙钛矿纳米晶发光效率高但环境稳定性差，稀土掺杂纳米晶发射谱窄、色纯度高。文章还讨论了通过尺寸工程、组分工程和缺陷工程调控发光性能，以及优化合成条件和表面功能化来提升发光效率、抑制非辐射复合。但摘要没有给出任何具体数据或新的实验方案，属于对已有文献的归纳梳理，创新性有限。","method_zh":"文献调研与对比分析，围绕量子限域效应和表面调控两条主线，梳理三类半导体发光纳米晶的发光机理与性能优化策略。","keywords_zh":["量子点","量子限域","表面修饰","钙钛矿纳米晶","发光效率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:08.863Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/aelm.70584","doi":"10.1002/aelm.70584","doi_url":"https://doi.org/10.1002/aelm.70584","title":"Ultrahigh Detectivity Colloidal Quantum dot Avalanche Photodetectors Driven by Electron Mobility of the n‐Type Layer","title_zh":"由n型层电子迁移率驱动的超高探测率胶体量子点雪崩光电探测器","title_key":"ultrahighdetectivitycolloidalquantumdotavalanchephotodetectorsdrivenbyelectronmobilityofthentypelayer","authors":["Changjo Kim","Byeongsu Kim"],"venue":"Advanced Electronic Materials","issn_l":"2199-160X","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-22","oa_status":"gold","pdf_url":"https://onlinelibrary.wiley.com/doi/pdfdirect/10.1002/aelm.70584","cited_by_count":0,"abstract":"ABSTRACT Colloidal quantum dots (CQDs) are pragmatic candidates for infrared photodetectors due to their high absorption coefficient in the infrared region and solution processability. In addition, an incorporation of avalanche multiplication within the CQD region offers a route to achieve ultrahigh detectivity ( D * ) in CQD‐based infrared photodetectors. Herein, we clarify how the electron mobility of n‐type layer would affect to the detection performances in the CQD‐based avalanche photodetector (CQD‐APD). The introduction of ZnO nanoparticles (NPs) having high electron mobility as n‐type layer suppresses the electron accumulation at the CQD/n‐type interfaces, thereby mitigating the defect‐mediated trapping‐detrapping processes and reducing the flicker noise current in our CQD‐APD. Moreover, the reduction of accumulated electrons alleviates a formation of potential barrier at CQD/n‐type interfaces, enabling the initiation of avalanche multiplication with lower energy threshold. Our CQD‐APD with optimal n‐type layer demonstrates an outstanding multiplication gain exceeding 400 and a peak detectivity of 1.4 × 10 15 Jones at a wavelength of 940 nm.","abstract_hash":"1277078cf3a707c4ac5a2ad0635b5cde7db460d1c06eeb941c93cac9e2a9d647","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"把n型层电子迁移率与CQD-APD的噪声抑制和雪崩阈值降低明确关联起来，并据此拿到400以上增益和1.4×10^15 Jones的探测率。","innovation_zh":"这篇工作厘清了n型层电子迁移率对CQD雪崩光电探测器（CQD-APD）探测性能的影响机制：用高电子迁移率的ZnO纳米颗粒作n型层，抑制了电子在CQD/n型界面的积累，从而减弱缺陷介导的俘获-去俘获过程、降低闪烁噪声电流；同时界面势垒形成被缓解，使雪崩倍增能在更低的能量阈值下启动。最终器件实现超过400的倍增增益，在940 nm处峰值探测率达1.4 × 10^15 Jones。","method_zh":"在CQD-APD中引入高电子迁移率的ZnO纳米颗粒作为n型层，通过调控界面电子积累来影响噪声与雪崩开启阈值，并对比不同n型层的器件性能。","keywords_zh":["胶体量子点","雪崩光电探测器","探测率","ZnO纳米颗粒","电子迁移率"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:09.215Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.inorgchem.6c03397","doi":"10.1021/acs.inorgchem.6c03397","doi_url":"https://doi.org/10.1021/acs.inorgchem.6c03397","title":"Quantum-Dot-Based Organic Framework Nanostructures: Engineering toward Enhanced Optical Properties","title_zh":"基于量子点的有机框架纳米结构：面向增强光学性质的工程化设计","title_key":"quantumdotbasedorganicframeworknanostructuresengineeringtowardenhancedopticalproperties","authors":["Yating Huang","Yansong Jiang","Tianli Liu","et al."],"venue":"Inorganic Chemistry","issn_l":"0020-1669","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-22","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"Abstract Functional nanostructures are widely designed and investigated for their broad applications in optoelectronic devices, biomedicine, and catalysis, among them, framework nanostructures attracted much attention for their compatibility with ions, functional molecules to wide applications. Herein, 2-methylimidazole conjugated with zinc cations on the surface of colloidal quantum dots (QDs) in a periodic arrangement to form crystalline framework nanostructures. QDs were incorporated into the QD Organic Framework (QDOF), exhibiting exceptional stability, retaining the initial photoluminescence quantum yield after 50 days in air and showing minimal degradation in polar solvents. This strategy has been demonstrated to be widely applicable to binary, ternary, and quaternary QDs with ZnS shells and ultimately yield ordered QDOF nanostructures. Finally, a white-light-emitting QDOF is fabricated with Commission Internationale de l’Éclairage (CIE) coordinates of (0.2918, 0.3076), demonstrating the power of this platform for creating functional composite materials.","abstract_hash":"3f8c3ab8d08b90a4fd1b2ab42db1e58cac79980627f291a8988a65131d756e3b","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"把量子点直接作为节点嵌入金属有机框架并给出 50 天空气稳定性与多元量子点普适性，属于明确的新结构策略，但性能指标以稳定性为主，未见器件级突破。","innovation_zh":"作者用 2-甲基咪唑与锌离子在胶体量子点表面配位，让量子点以周期性排列的方式嵌入晶态框架中，形成 QD Organic Framework（QDOF）。核心卖点是稳定性：在空气中放置 50 天后仍保持初始光致发光量子产率，在极性溶剂中降解也很小。该策略对带 ZnS 壳的二元、三元、四元量子点都适用，最后还用 QDOF 做出了 CIE 坐标为 (0.2918, 0.3076) 的白光发射材料。","method_zh":"在胶体量子点表面用 2-甲基咪唑与锌阳离子配位，使量子点周期性排列并原位形成晶态框架纳米结构；量子点需带 ZnS 壳。","keywords_zh":["量子点有机框架","QDOF","光致发光量子产率","稳定性","白光发射"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:09.255Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1007/s11664-026-13012-8","doi":"10.1007/s11664-026-13012-8","doi_url":"https://doi.org/10.1007/s11664-026-13012-8","title":"Nano-Aluminum-Doped Zinc Oxide Enhancing Inverted Green Quantum-Dot LEDs","title_zh":"纳米铝掺杂氧化锌增强倒置绿光量子点LED","title_key":"nanoaluminumdopedzincoxideenhancinginvertedgreenquantumdotleds","authors":["Mangey Ram Nagar","Mohd Shoeb Khan","Nitin Sharma","et al."],"venue":"Journal of Electronic Materials","issn_l":"0361-5235","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-22","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":null,"abstract_hash":null,"abstract_source":"none","abstract_missing":true,"directions":["display"],"novelty_score":1,"novelty_reason":"摘要缺失，无法评估创新性。","innovation_zh":"数据库未收录摘要，建议直接查看原文。","method_zh":"数据库未收录摘要，无法判断具体方法与器件结构。","keywords_zh":["量子点LED","铝掺杂氧化锌","倒置结构","绿光器件"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:09.143Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acsami.6c14167","doi":"10.1021/acsami.6c14167","doi_url":"https://doi.org/10.1021/acsami.6c14167","title":"Thermodynamic Stabilization of PbS Quantum Dots for High-Performance Short-Wave Infrared Photodetection","title_zh":"PbS 量子点的热力学稳定化用于高性能短波红外光电探测","title_key":"thermodynamicstabilizationofpbsquantumdotsforhighperformanceshortwaveinfraredphotodetection","authors":["Yiqun Li","Jiayin Han","Noor Zaman","et al."],"venue":"ACS Applied Materials & Interfaces","issn_l":"1944-8244","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-22","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-22","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"The development of lead sulfide (PbS) quantum dot (QD) photodetectors for short-wave infrared (SWIR) applications has been fundamentally limited by the thermodynamic instability of large PbS QD facets, which leads to aggregation and epitaxial fusion. In this work, robust thermodynamic stabilization was achieved by introducing methylammonium chloride (MACl) in PbS QD surface passivation, as validated by theoretical modeling and experimental characterization. MACl passivation reconstructed the surface energy landscape, establishing a physical barrier that suppressed PbS QD fusion and ligand re-adsorption, while extensive halide coordination minimized structural disorder and reduced sub-bandgap trap states. As a result, the optimized PbS QD photodiodes exhibited a peak external quantum efficiency of 56% and a specific detectivity of 1.12 × 1012 Jones at 1450 nm, an order-of-magnitude enhancement over control devices. This strategy enabled high-sensitivity SWIR imaging and established thermodynamic surface stabilization as a scalable avenue for advanced infrared optoelectronics.","abstract_hash":"97be3853ee974be2aee55da3d05b7af4d1403568d6af8fb3d7a5556733263d6f","abstract_source":"openalex","abstract_missing":false,"directions":["detection","materials"],"novelty_score":4,"novelty_reason":"用 MACl 钝化从热力学角度抑制量子点融合并显著提升探测性能，属明确的新策略且性能提升一个数量级。","innovation_zh":"针对大尺寸 PbS 量子点晶面热力学不稳定、易团聚和外延融合的问题，作者在表面钝化中引入甲基氯化铵（MACl），从热力学层面稳定量子点表面。MACl 重构了表面能景观，形成物理势垒抑制量子点融合与配体再吸附，同时卤素配位降低了结构无序和亚带隙陷阱态。优化后的 PbS 量子点光电二极管在 1450 nm 处外量子效率达 56%，比探测率为 1.12 × 10^12 Jones，比对照器件提升一个数量级，并实现了高灵敏度短波红外成像。","method_zh":"在 PbS 量子点表面钝化过程中引入 MACl，通过理论建模与实验表征验证其对表面能的调控；器件为 PbS 量子点光电二极管。","keywords_zh":["PbS 量子点","短波红外","光电探测器","表面钝化","MACl"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:11.335Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1002/adom.71824","doi":"10.1002/adom.71824","doi_url":"https://doi.org/10.1002/adom.71824","title":"Surface Ligand‐Mediated Carrier Balance for Stable Inverted Red InP Quantum Dot Light‐Emitting Diodes","title_zh":"表面配体调控载流子平衡实现稳定的倒置红光 InP 量子点发光二极管","title_key":"surfaceligandmediatedcarrierbalanceforstableinvertedredinpquantumdotlightemittingdiodes","authors":["Minhyung Lee","Ganghyun Park","Beomsoo Chun","et al."],"venue":"Advanced Optical Materials","issn_l":"2195-1071","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-21","oa_status":"closed","pdf_url":null,"cited_by_count":0,"abstract":"ABSTRACT Indium phosphide (InP)‐based quantum dots (QDs) are cadmium (Cd)‐free emitters for display applications, but their operational stability is limited by surface defects and imbalanced carrier injection. Here, we introduce a [2‐(9H‐carbazol‐9‐yl)ethyl]phosphonic acid (2PACz)‐mediated surface modification strategy for efficient and stable quantum dot light‐emitting diodes (QLEDs). 2PACz forms a mixed‐ligand surface by partially replacing native oleic acid ligands and binding to under‐coordinated surface sites, thereby reducing trap‐assisted nonradiative recombination. In parallel, 2PACz‐mediated energy‐level modulation facilitates hole injection and suppresses excessive electron injection, improving carrier balance in inverted red InP‐based QLEDs. The resulting devices achieved a peak external quantum efficiency of 23.7% and an extrapolated half‐lifetime of 217.8 h at an initial luminance of 1000 cd m −2 . Transient and chemical analyses reveal that 2PACz treatment stabilizes carrier dynamics and suppresses interfacial degradation under electrical stress. This work shows that surface ligand design can improve operational stability of Cd‐free QLEDs by coupling QD surface passivation with carrier balance control.","abstract_hash":"ec10fead4213e3491575d65e863518dd986fc1a46c8a15d422e2f0c2ab901c15","abstract_source":"openalex","abstract_missing":false,"directions":["display","materials"],"novelty_score":4,"novelty_reason":"用同一分子同时实现量子点表面钝化与载流子注入平衡调控，并在无镉倒置红光 QLED 上给出 23.7% EQE 和 217.8 h 半寿命的明确性能数据。","innovation_zh":"针对无镉 InP 量子点 QLED 工作稳定性受表面缺陷和载流子注入不平衡限制的问题，作者用 2PACz（[2-(9H-咔唑-9-基)乙基]膦酸）对量子点表面做配体修饰：部分替换原有的油酸配体、并与欠配位表面位点结合，形成混合配体表面，减少陷阱辅助的非辐射复合；同时利用 2PACz 调节能级，促进空穴注入并抑制过量的电子注入，从而改善倒置红光 InP QLED 的载流子平衡。器件峰值外量子效率达 23.7%，在初始亮度 1000 cd m⁻² 下外推半寿命为 217.8 h。","method_zh":"在 InP 量子点表面引入 2PACz 做混合配体修饰（部分取代油酸并钝化欠配位位点），兼作能级调控层，构建倒置红光 QLED；用瞬态与化学分析表征电应力下的载流子动力学和界面稳定性。","keywords_zh":["InP 量子点","QLED","2PACz 表面配体","载流子平衡","工作稳定性"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:12.054Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1021/acs.nanolett.6c02939","doi":"10.1021/acs.nanolett.6c02939","doi_url":"https://doi.org/10.1021/acs.nanolett.6c02939","title":"Waveguide-Integrated Photonic Platform for On-Chip Optical Quantum-Dot Excitation via Electrically Pumped WGM Microlasers","title_zh":"面向片上光量子点激发的波导集成光子平台：基于电泵浦回音壁模式微激光器","title_key":"waveguideintegratedphotonicplatformforonchipopticalquantumdotexcitationviaelectricallypumpedwgmmicrolasers","authors":["Léo J. Roche","Peter Gschwandtner","Chirag C. Palekar","et al."],"venue":"Nano Letters","issn_l":"1530-6984","source_type":"journal","is_preprint":false,"alt_doi":null,"pub_date":"2026-09-21","pub_year":2026,"date_suspect":false,"sort_date":"2026-09-21","oa_status":"hybrid","pdf_url":null,"cited_by_count":0,"abstract":"Abstract We report the fabrication and characterization of an integrated quantum photonic device consisting of an electrically driven whispering-gallery-mode micropillar laser evanescently coupled to a ridge waveguide, both incorporating InGaAs quantum dots (QDs). The lasing characteristics of microlasers are systematically investigated as a function of the pillar–waveguide gap distance. Coherent emission from the whispering-gallery-mode microlaser coupled into the waveguide enables on-chip optical excitation of QDs embedded in an electrically contacted micropillar at the end of the waveguide. Under continuous-wave on-chip excitation, we observe single-photon emission with g(2)(0) = (3.49 ± 0.01)% for a QD integrated in the outcoupling micropillar, which can be spectrally tuned by the quantum confined Stark effect. These results constitute an important step toward low-footprint, deterministic, and scalable single-photon sources for QD-based integrated quantum photonic circuits.","abstract_hash":"bca441e7d5b31bf993d83eea205a103a3b1492e95179031b4b677c97f1d52949","abstract_source":"openalex","abstract_missing":false,"directions":["display","quantuminfo"],"novelty_score":4,"novelty_reason":"在同一芯片上实现电泵浦微激光器经波导对量子点的片上光激发并验证单光子发射，属于明确的新集成架构，但单光子纯度并非刷新纪录。","innovation_zh":"把电驱动的回音壁模式微柱激光器和脊型波导做在同一芯片上，两者都含 InGaAs 量子点，通过消逝场耦合把激光相干地送进波导，再用这束片上光去激发波导末端另一个电接触微柱里的量子点。在连续波片上激发下，末端微柱中的量子点给出 g(2)(0) = (3.49 ± 0.01)% 的单光子发射，并可通过量子限制斯塔克效应调谐发光波长。","method_zh":"微柱激光器与脊型波导消逝场耦合，系统研究了微柱-波导间距对激光特性的影响；波导末端集成电接触微柱作为量子点激发与收集端。","keywords_zh":["回音壁模式微激光器","波导集成","单光子源","InGaAs 量子点","量子限制斯塔克效应"],"summary_source":"llm","llm_model":"deepseek-chat","llm_at":"2026-10-13T15:52:11.827Z","pending_summary":false,"first_seen":"2026-10-13T15:36:21.792Z","last_updated":"2026-10-13T15:54:47.592Z"},{"id":"10.1016/j.j
